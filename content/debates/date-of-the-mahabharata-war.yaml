id: debate.date-of-the-mahabharata-war
title: The date of the Mahabharata war
question: Can the war narrated in the Mahabharata be placed in calendar time?
summary: >-
  Late Vedic texts and excavations give the epic a plausible setting among the early Kurus.
  Astronomical reconstructions test whether the epic's descriptions of the sky can date a
  single campaign and arrive at different years. Traditional chronologies link the war
  with the transition to Kali Yuga. The event and the formation of the text pose distinct
  dating questions.
published: false
commonGround:
  - text: >-
      The epic centres on a succession conflict in the Kuru family, and its narrative names
      places including Hastinapura. Excavation at Hastinapura found an early settlement with
      Painted Grey Ware.
    grade: A
    sources:
      - { id: src.lal-1955-excavation-hastinapura, locator: "pp. 5-6; Stratigraphy, Period II" }
      - { id: src.witzel-1997-early-sanskritization-kuru, locator: "Introduction" }
positions:
  - id: early-kuru-setting
    label: A possible conflict in the early Kuru world
    lens: scholarship
    grade: C
    statement: >-
      Some memory of a Kuru conflict may underlie the epic. The later Vedic texts give the
      Kurus a political and geographical setting in Haryana and western Uttar Pradesh.
      Parikshit appears in Vedic material as a Kuru king, and the epic also makes him part of
      its dynastic succession. The early settlement at Hastinapura and related sites makes
      the late second to early first millennium BCE a plausible horizon for the background
      of the story.
    proponents:
      - name: Michael Witzel
        work: { id: src.witzel-1997-early-sanskritization-kuru, locator: "Introduction; discussion of the Kuntapa hymns" }
      - name: B. B. Lal
        work: { id: src.lal-1955-excavation-hastinapura, locator: "pp. 147-151" }
    evidence:
      - text: >-
          Witzel draws on the post-Rigvedic praise of Parikshit's Kuru realm to reconstruct the
          early polity and the setting behind characters also known to the epic.
        grade: C
        sources:
          - { id: src.witzel-1997-early-sanskritization-kuru, locator: "discussion of the Kuntapa hymns, Atharvaveda 20.127" }
      - text: >-
          Lal identified Painted Grey Ware in occupation layers at Hastinapura and in explorations
          at other localities connected with the story. The finds establish occupation in the region.
        grade: A
        sources:
          - { id: src.lal-1955-excavation-hastinapura, locator: "Stratigraphy, Period II; pp. 147-151" }
    objections:
      - >-
        A pottery horizon does not identify the belligerents or a single battle. A historical
        name can survive in a later narrative whose plot developed around it.
  - id: achar-astronomical-reconstruction
    label: Achar's astronomical reconstruction of 3067 BCE
    lens: scholarship
    grade: E
    range: { earliest: "3067 BCE", latest: "3067 BCE", precision: year, circa: true }
    statement: >-
      Sky references in the Udyoga and Bhishma books may preserve observations made around a
      single campaign. Achar uses matching planetary and eclipse references to test the 3067 BCE
      date proposed by K. S. Raghavan. On this reading, the combination of observations has
      more chronological value than any one omen on its own.
    proponents:
      - name: B. N. Narahari Achar
        work: { id: src.achar-2018-date-mahabharata-war-correspondence, locator: "pp. 108-115, correspondence and reply" }
    evidence:
      - text: >-
          Achar reports a match at 3067 BCE for selected astronomical notices in the Udyoga
          and Bhishma books, including eclipse and planetary descriptions.
        grade: E
        sources:
          - { id: src.achar-2018-date-mahabharata-war-correspondence, locator: "pp. 108-115" }
          - { id: src.bhatnagar-2017-date-mahabharata-war, locator: "section 5, Discussion" }
    objections:
      - >-
        Bhatnagar argues that the proposal fails some seasonal and solstitial checks. The larger
        issue is whether the textual notices are observations from one period and were transmitted
        together before the epic took shape.
  - id: bhatnagar-astronomical-reconstruction
    label: Bhatnagar's astronomical reconstruction of 1793 BCE
    lens: scholarship
    grade: E
    range: { earliest: "1793 BCE", latest: "1793 BCE", precision: year, circa: true }
    statement: >-
      Seasonal markers can help distinguish repeated celestial configurations. Bhatnagar uses
      the autumn full moon and the interval to the winter solstice, then tests candidate years
      against a sequence of eclipses and lunar positions. He argues that 1793 BCE best fits
      that combined sequence.
    proponents:
      - name: Ashok K. Bhatnagar
        work: { id: src.bhatnagar-2017-date-mahabharata-war, locator: "sections 5-6" }
    evidence:
      - text: >-
          Bhatnagar uses an inferred position of the autumn equinox to limit the search and a
          proposed eclipse pair in one lunation to narrow the candidates to 1793 BCE.
        grade: E
        sources:
          - { id: src.bhatnagar-2017-date-mahabharata-war, locator: "section 6, Conclusion" }
    objections:
      - >-
        Achar disputes which notices count as observations and how the seasonal and astronomical
        terms should be read. A fit to selected verses needs an independent historical check.
  - id: kali-yuga-reckoning
    label: The Bharata war and the Kali Yuga epoch
    lens: tradition
    grade: D
    statement: >-
      In traditional reckoning the Bharata war marks the close of Dvapara and the approach
      of Kali Yuga. Ravikirti's inscription counts 3,735 elapsed years since the war in
      Śaka 556, relating the war to the epoch conventionally expressed as 3102 BCE.
      Some traditional chronologies put the battle before the epoch by counting forward
      from the war to Krishna's departure and the beginning of Kali.
    proponents:
      - name: Ravikirti's Aihole reckoning
        work: { id: src.balogh-2026-aihole-inscription, locator: "vv. 33-34" }
    evidence:
      - text: >-
          Ravikirti expresses the date in two reckonings, one measured from the Bharata war and
          one in the Śaka era. The parallel preserves a seventh-century use of the traditional count.
        grade: D
        sources:
          - { id: src.balogh-2026-aihole-inscription, locator: "vv. 33-34" }
      - text: >-
          The epic places the destruction of Krishna's clan in the thirty-sixth year after
          the war, a basis for keeping the war and the start of Kali distinct in traditional reckoning.
        grade: D
        sources:
          - { id: src.doniger-2022-after-the-war, locator: "Book 16, ch. 1" }
          - { id: src.bhatnagar-2017-date-mahabharata-war, locator: "section 5, Discussion" }
    objections:
      - >-
        The Aihole inscription directly attests a seventh-century reckoning. Its long elapsed
        count has no independent contemporary record from the time assigned to the war.
whatWouldChangeThis:
  - >-
    An independently dated record naming the rulers and conflict would give the event an anchor
    that pottery and later retellings cannot supply on their own.
  - >-
    An early manuscript with a well-preserved sequence of astronomical notices could test whether
    the competing readings depend on passages added or altered during transmission.
relatedEntities: [event.kurukshetra-war, text.mahabharata, polity.kuru-kingdom, site.hastinapura, event.kali-yuga-epoch]
tags: [mahabharata, kurukshetra, astronomy, chronology]
