id: debate.date-of-kalidasa
title: The date of Kalidasa
question: When did the Sanskrit poet and playwright Kalidasa flourish?
summary: >-
  Kalidasa's surviving works give no calendar date or patron's reign. Two anchors bracket
  his career: his play Malavikagnimitra takes the second-century BCE Shunga ruler Agnimitra
  as its hero, and the 634 CE Aihole inscription already names Kalidasa as a standard of
  poetic fame. Mainstream scholarship places him in the Gupta era (around 350 to 475 CE)
  from literary development and possible echoes in the 473 CE Mandasor inscription, a
  minority hypothesis reads Malavikagnimitra as contemporary with Agnimitra, and Sanskrit
  tradition links him with a first-century BCE Vikramaditya of Ujjain.
published: true
approval: { by: Shreejit Verma, date: "2026-11-22", note: "Drafted by Codex; reviewed for fairness, accuracy and sources by Gemini (a machine review). No human editorial review yet." }
commonGround:
  - text: >-
      The Aihole inscription of Saka 556 (634 CE), composed by Ravikirti for the Chalukya
      king Pulakeshin II, names Kalidasa alongside Bharavi as an established model of poetic
      fame, providing a firm latest date.
    grade: A
    sources:
      - { id: src.balogh-2026-aihole-inscription, locator: "vv. 33-34, 37" }
      - { id: src.kielhorn-1900-aihole-inscription, locator: "pp. 1-12, vv. 33-34, 37" }
  - text: >-
      In Malavikagnimitra, Kalidasa builds a court drama around the second-century BCE Shunga
      ruler Agnimitra and names Bhasa, Saumilla and Kaviputra as earlier playwrights, placing
      him after the Shunga period begins.
    grade: B
    sources:
      - { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, pp. 143-147" }
      - { id: src.lienhard-1984-history-classical-poetry, locator: "p. 116" }
positions:
  - id: gupta-period
    label: "Gupta period: fourth to fifth century CE"
    lens: scholarship
    grade: B
    range: { earliest: "350 CE", latest: "475 CE", best: "400 CE", precision: decade, circa: true }
    statement: >-
      Classical Sanskrit court poetry and drama reached mature form in the fourth and fifth
      centuries CE, and Kalidasa's language, metres and cultural horizon fit that Gupta age.
      His Prakrit usages and verse technique presuppose earlier dramatists and the Buddhist
      poet Ashvaghosha, while the campaigns in Raghuvamsha and the urban world of Meghaduta
      align with imperial Gupta power. Apparent verbal echoes of Kalidasa in Vatsabhatti's 473
      CE Mandasor inscription point to circulation by the late fifth century, and Chandragupta
      II (who took the title Vikramaditya) is a frequent candidate for patronage.
    proponents:
      - name: Arthur Berriedale Keith
        role: Indologist, argued for c. 400 CE under Chandragupta II Vikramaditya
        work: { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, pp. 143-147" }
      - name: Siegfried Lienhard
        role: Sanskritist, historian of classical kavya poetry
        work: { id: src.lienhard-1984-history-classical-poetry, locator: "p. 116" }
      - name: Sheldon Pollock
        role: Sanskritist, examined Gupta-era kavya and the Mandasor parallels
        work: { id: src.pollock-2006-language-of-the-gods, locator: "pp. 125, 240-244" }
    evidence:
      - text: >-
          Keith and Lienhard evaluate Kalidasa's metres, Prakrit dialect forms and dramatic
          conventions after Ashvaghosha alongside Gupta-era political and cultural geography,
          placing him in the fourth to fifth century CE.
        grade: B
        sources:
          - { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, pp. 143-147" }
          - { id: src.lienhard-1984-history-classical-poetry, locator: "p. 116" }
      - text: >-
          Vatsabhatti's Mandasor stone inscription of Kumaragupta and Bandhuvarman (Malava
          year 529, 473 CE) contains passages widely compared with Meghaduta and Ritusamhara,
          suggesting Kalidasa's poetry was already known by then.
        grade: C
        sources:
          - { id: src.fleet-1888-inscriptions-early-gupta-kings, locator: "Inscription No. 18, pp. 79-88" }
          - { id: src.pollock-2006-language-of-the-gods, locator: "pp. 125, 240-244" }
    objections:
      - >-
        No contemporary Gupta inscription names Kalidasa or links him to a specific king, and
        several reigns across the fourth and fifth centuries (including Vakataka connections)
        have been proposed.
      - >-
        Similar phrasing in Vatsabhatti's 473 CE inscription could reflect shared kavya
        conventions rather than direct borrowing, leaving 634 CE at Aihole as the first
        explicit external mention.
  - id: agnimitra-contemporary
    label: "Shunga court hypothesis: second century BCE"
    lens: scholarship
    grade: C
    range: { earliest: "180 BCE", latest: "130 BCE", precision: decade, circa: true }
    statement: >-
      Malavikagnimitra shows detailed familiarity with the court, household and regional
      politics of the Shunga ruler Agnimitra at Vidisha. C. Kunhan Raja reads the drama's
      closing benediction as an address to a living patron: the speaker states that no extra
      blessing is needed while Agnimitra rules. On this reading, a performance before a
      Shunga-period audience explains both the topical immediacy of the final verse and the
      prominent portrayal of Vidisha in Meghaduta.
    proponents:
      - name: C. Kunhan Raja
        role: Sanskrit scholar, argued for a Shunga-era date in Malavikagnimitra
        work: { id: src.raja-1942-historical-background-kalidasa, locator: "pp. 128-136" }
    evidence:
      - text: >-
          Raja interprets the final verse of Malavikagnimitra as speaking of Agnimitra's
          present reign and pairs it with the favourable description of Vidisha in Meghaduta.
        grade: C
        sources:
          - { id: src.raja-1942-historical-background-kalidasa, locator: "pp. 129-132" }
    objections:
      - >-
        A closing dramatic benediction can speak from inside the historical frame of the play's
        characters, and a later poet could draw on older court histories or accounts of Vidisha.
      - >-
        Most Sanskritists argue that Kalidasa's developed kavya metres, Prakrit forms and
        relationship to Ashvaghosha fit centuries after the Shungas, and no inscription or
        text attests Kalidasa before the Gupta era.
  - id: ujjain-vikramaditya-tradition
    label: "Vikramaditya's court in Ujjain: first century BCE tradition"
    lens: tradition
    grade: D
    range: { earliest: "100 BCE", latest: "1 BCE", best: "57 BCE", precision: century, circa: true }
    statement: >-
      Sanskrit literary tradition remembers Kalidasa as one of the Nine Gems (navaratna) at
      the court of King Vikramaditya of Ujjain. Because tradition associates Vikramaditya with
      the founding of the Vikrama era beginning in 57 BCE, this reckoning places Kalidasa in
      the first century BCE. Within the literary tradition, the link expresses Kalidasa's
      status as the quintessential court poet alongside astronomy and learning at Ujjain.
    proponents:
      - name: Ujjain Vikramaditya court tradition
        role: Places Kalidasa among the Nine Gems at Vikramaditya's court
        work: { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, pp. 143-144" }
    evidence:
      - text: >-
          Traditional accounts (including the Jyotirvidabharana verse on the Nine Gems) link
          Kalidasa to a Vikramaditya of Ujjain associated with the 57 BCE era, as surveyed by
          Keith, Raja and Lienhard.
        grade: D
        sources:
          - { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, pp. 143-144" }
          - { id: src.raja-1942-historical-background-kalidasa, locator: "p. 128" }
          - { id: src.lienhard-1984-history-classical-poetry, locator: "p. 116" }
    objections:
      - >-
        The Nine Gems verse is preserved only in works written many centuries later, and no
        first-century BCE epigraph confirms either a Vikramaditya reigning at Ujjain then or
        Kalidasa's presence at his court.
whatWouldChangeThis:
  - >-
    A securely dated pre-seventh-century inscription naming Kalidasa alongside a royal patron
    or quoting an unmistakable line from one of his plays or poems would establish a tighter
    chronological anchor.
  - >-
    A dated early manuscript or an unambiguous linguistic or intertextual proof fixing the
    direction of borrowing between Kalidasa and an independently dated author could narrow the
    fourth-to-fifth-century range.
