id: debate.date-of-kalidasa
title: The date of Kalidasa
question: When did the Sanskrit poet and playwright Kalidasa flourish?
summary: >-
  An inscription of 634 CE shows that Kalidasa's reputation was already established. A Gupta-era
  dating draws on literary parallels and the Mandasor inscription. Earlier proposals connect the
  poet with the Shunga king Agnimitra or, in later tradition, with the Vikramaditya of Ujjain.
published: false
commonGround:
  - text: >-
      The Aihole inscription of Śaka 556, corresponding to 634 CE, names Kalidasa and Bharavi
      as standards of poetic accomplishment. Kalidasa was already known when Ravikirti wrote it.
    grade: A
    sources:
      - { id: src.balogh-2026-aihole-inscription, locator: "vv. 33-34, 37" }
positions:
  - id: gupta-period
    label: A poet of the Gupta period
    lens: scholarship
    grade: B
    statement: >-
      Kalidasa's mature court poetry and drama fit the literary and political world of
      the fourth and fifth centuries CE. The campaigns in the Raghuvamsha evoke a political
      horizon compatible with Gupta power. Apparent echoes of Kalidasa's verse in the
      fifth-century Mandasor inscription fit circulation by then. The Gupta emperor
      Chandragupta II is a plausible context for the connection with Vikramaditya.
    proponents:
      - name: Arthur Berriedale Keith
        work: { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, The Date of Kalidasa" }
    evidence:
      - text: >-
          Keith reads the courtly culture and political geography of Kalidasa's poems in
          light of the Gupta Empire and discusses the case for literary borrowing at Mandasor.
        grade: C
        sources:
          - { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1" }
          - { id: src.fleet-1888-inscriptions-early-gupta-kings, locator: "Mandasor inscription of Kumaragupta and Bandhuvarman" }
    objections:
      - >-
        Similar passages may share literary conventions, and a fifth-century borrower could
        have read a much older poet. No cited inscription directly calls Kalidasa a Gupta court poet.
  - id: agnimitra-contemporary
    label: A contemporary of the Shunga king Agnimitra
    lens: scholarship
    grade: C
    statement: >-
      Malavikagnimitra is full of details about Agnimitra's household and rule. C. Kunhan
      Raja reads the closing verse as an address to the audience about a reigning sovereign.
      The actor says the usual blessing is unnecessary while Agnimitra rules. A performance
      before a Shunga audience would account for that address and the specificity of the
      court setting.
    proponents:
      - name: C. Kunhan Raja
        work: { id: src.raja-1942-historical-background-kalidasa, locator: "pp. 128-136" }
    evidence:
      - text: >-
          Raja reads the final verse of Malavikagnimitra as referring to Agnimitra's
          present rule and takes the favourable portrayal of Vidisha in Meghaduta as supporting context.
        grade: C
        sources:
          - { id: src.raja-1942-historical-background-kalidasa, locator: "pp. 129-132" }
    objections:
      - >-
        A benediction can speak from within a play's historical setting. A later playwright
        could know the court's geography or draw on accounts about the Shungas.
  - id: ujjain-vikramaditya-tradition
    label: Kalidasa at Vikramaditya's court in Ujjain
    lens: tradition
    grade: D
    statement: >-
      Ujjain's Vikramaditya tradition remembers Kalidasa among the jewels of an exemplary royal
      court. The association with the ruler to whom the Vikrama era is attributed places the
      poet in the first century BCE in this reckoning. It expresses the place of poetry
      and learning in the memory of Vikramaditya's rule.
    proponents:
      - name: Ujjain Vikramaditya court tradition
        work: { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1, on Vikramaditya and the traditional epoch" }
    evidence:
      - text: >-
          Keith records the legend connecting Kalidasa with a Vikramaditya of Ujjain and the
          era conventionally reckoned from 57 BCE.
        grade: D
        sources:
          - { id: src.keith-1924-sanskrit-drama, locator: "ch. VI, section 1" }
    objections:
      - >-
        The era's epoch and its later royal association are different kinds of evidence.
        No contemporary record connects the poet to the king of the tradition.
whatWouldChangeThis:
  - >-
    A securely dated inscription naming Kalidasa alongside a patron or citing an unmistakable
    line from a play would establish a stronger chronological anchor.
  - >-
    A securely dated early manuscript or a demonstrable direction of borrowing between Kalidasa
    and an independently dated writer could narrow the interval in which he worked.
relatedEntities: [person.kalidasa, person.chandragupta-ii, polity.gupta-empire, text.natyashastra]
tags: [kalidasa, sanskrit, drama, chronology]
