  after: 599 to 527 BCE is the traditional Svetambara reckoning; scholars place Mahavira in about the fifth century BCE, with exact decades debated
  reason: The traditional date was stated as fact; it is tradition and is in tension with the modern dating of the Buddha's contemporary.
