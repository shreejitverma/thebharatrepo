  target: /art-and-culture/indian-cuisine
  before: "c. 16th Century: Introduction of potato, tomato, and chili by the Portuguese (now staples)."
  after: American crops reached India from the sixteenth century through several channels, including the Portuguese; chilli spread quickly while potato and tomato became staples much later.
  reason: The original compressed a long, multi-channel process into a single event and agent.
  sources:
    - src.achaya-1994-indian-food
    - src.collingham-2006-curry
