  target: /history/vijayanagara-empire
  before: "1565: Battle of Talikota; defeat by the Deccan Sultanates and destruction of Hampi."
  after: An alliance of Deccan sultanates defeated Vijayanagara in January 1565 and plundered the capital; how much of Hampi's ruin came from the sack versus later neglect is uncertain.
  reason: The original attributed all the destruction to the battle.
