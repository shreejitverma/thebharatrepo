  target: /science/ancient-mathematics
  before: "Bhaskara II (1114-1185 CE): Wrote Lilavati; worked on calculus concepts."
  after: Bhaskara II wrote the Lilavati and Bijaganita in the 12th century and set out the chakravala method for indeterminate equations; the 'calculus concepts' claim is dropped.
