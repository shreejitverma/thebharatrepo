  before: "c. 1400 BCE: Vedanga Jyotisha (Lagadha)."
  after: The solstice data in the Vedanga Jyotisha point to the 14th to 12th century BCE if they record observation, but Pingree and Plofker date the surviving redaction to the 5th or 4th century BCE.
