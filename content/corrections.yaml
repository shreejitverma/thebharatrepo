    - src.gonda-1975-vedic-literature
- date: 2026-11-21
  target: /philosophy/the-upanishads
  before: They are the most recent part of the Vedas, the oldest scriptures of Hinduism
  after: The earliest Upanishads close the Vedic sequence (c. 7th to 2nd centuries BCE by scholarly estimate), but texts called Upanishads continued to be composed into the medieval period, and the Vedas are the earliest surviving Hindu-tradition scriptures only with qualification.
  reason: "The Upanishad corpus is not a single closed 'most recent part': it spans more than a thousand years, and an unqualified 'oldest' claim is not supported."
