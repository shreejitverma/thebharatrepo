- date: 2026-11-21
  target: /philosophy/jainism
  before: "Brahmacharya: Celibacy/Chastity (among five principles)"
  after: Five great vows for monastics, with celibacy as the fifth added by Mahavira according to the canon (Parshva taught four); lay vows are modified, chastity within marriage
  reason: The original did not distinguish monastic from lay practice or the four-vow tradition of Parshva.
  sources:
