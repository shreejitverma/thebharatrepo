  sources:
    - src.plofker-2009-mathematics-in-india
- date: 2026-11-21
  target: /science/ancient-mathematics
  before: "Trigonometry: Introduction of sine (jya) and cosine (kojya)."
  after: Indian texts use a half-chord sine (jya) and the sine of the complement, the ancestor of the Arabic and Latin terms; this is described as systematic use, not sole introduction.
  reason: Unqualified 'introduction' overstates; Greek chord tables preceded the Indian half-chord sine.
