    - src.plofker-2009-mathematics-in-india
- date: 2026-11-21
  target: /science/ancient-mathematics
  before: "Srinivasa Ramanujan (1887-1920): Modern genius in number theory."
  after: Removed from this article, which covers ancient and medieval Indian mathematics.
  reason: Ramanujan belongs to modern mathematics, and the entry carried no source.
