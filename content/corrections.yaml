  target: /philosophy/the-vedas
  before: the texts constitute the oldest layer of Sanskrit literature and the oldest scriptures of Hinduism
  after: The Vedas are the earliest surviving Sanskrit literature; calling them the oldest scriptures of Hinduism holds only with the qualification that Vedic sacrificial religion differs substantially from later Hinduism.
  reason: An unqualified 'oldest' claim needs a citation and qualifier, and the equation of Vedic religion with Hinduism overstates continuity.
