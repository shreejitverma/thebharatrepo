  target: /philosophy/six-darshanas
  before: "c. 200 CE: Compilation of Yoga Sutras."
  after: The Yoga Sutras are dated by scholars anywhere from the last centuries BCE to the 5th century CE, and the identification of the author with the grammarian Patanjali is disputed.
  reason: A single date presented as fact overstates the consensus.
