  target: /art-and-culture/martial-arts
  before: "c. 11th Century: Golden age of Kalaripayattu during the Chola-Chera wars."
  after: The medieval wars of the 11th and 12th centuries are the usual context for the rise of Kerala's martial schools, but this is a graded estimate (C), not a documented golden age.
