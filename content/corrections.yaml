    - src.flood-2003-blackwell-companion-hinduism
- date: 2026-11-21
  target: /science/plastic-surgery
  before: The earliest known plastic surgery procedures were performed in ancient India by the physician Sushruta. He is considered the 'father of plastic surgery'.
  after: The Sushruta Samhita contains the earliest known detailed Sanskrit description of nose and ear reconstruction using cheek flaps; the Samhita is a layered compilation, and no performed operation is documented.
  reason: The original asserted performed procedures by a single datable person; the evidence is a text compiled over time. 'Father of' is dropped.
  sources:
