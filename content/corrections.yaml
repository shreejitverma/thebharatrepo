  target: /history/mahajanapadas
  before: "c. 563-483 BCE: Life of Gautama Buddha; c. 544-492 BCE: Bimbisara rules Magadha; c. 540-468 BCE: Life of Mahavira"
  after: These are dates of the long chronology; many historians place the Buddha's death around 400 BCE, with Bimbisara and Ajatashatru shifting accordingly.
