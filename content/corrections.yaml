    - src.bryant-2009-yoga-sutras-patanjali
- date: 2026-11-21
  target: /philosophy/six-darshanas
  before: The six Astika schools accept the authority of the Vedas.
  after: The astika/nastika division and the list of exactly six schools are a later scheme; medieval surveys gave different lists of six, and some of the six, such as classical Samkhya, do not rest on Vedic authority or accept a creator god.
  reason: The original presented a later doxographic classification as a fixed historical fact and Vedic authority as a uniform criterion.
  sources:
