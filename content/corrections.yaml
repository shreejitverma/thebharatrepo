  target: /philosophy/bhakti-movement
  before: "c. 1100 CE: Ramanuja; 1440-1518: Kabir Das; 1498-1547: Mirabai"
  after: Ramanuja is traditionally dated 1017 to 1137; Kabir is dated only to the fifteenth century with traditional years 1440 to 1518; Mirabai's traditional dates are 1498 to 1547 and her attributed songs include later compositions
