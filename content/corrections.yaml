    - src.larson-1979-classical-samkhya
- date: 2026-11-21
  target: /philosophy/six-darshanas
  before: Founded by Gautama / Kanada / Kapila / Patanjali / Jaimini
  after: Each school is traditionally attributed to a founder who is the reputed author of its foundational sutra; the historicity and dating of these figures vary and the ideas are older than the texts.
  reason: Traditional attributions were stated as fact.
