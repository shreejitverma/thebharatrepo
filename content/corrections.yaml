  target: /philosophy/jainism
  before: Mahavira (24th Tirthankara)
  after: The twenty-fourth Tirthankara in Jain tradition; only Mahavira and, to many scholars, Parshva are historical
  reason: Stating tradition as plain fact did not distinguish the mythic earlier Tirthankaras from the historical teachers.
