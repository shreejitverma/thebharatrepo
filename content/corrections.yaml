- date: 2026-11-21
  target: /art-and-culture/indian-cuisine
  before: India was the center of the global spice trade (Pepper, Cardamom, Cinnamon) for millennia.
  after: India was a major source of pepper and cardamom and a hub of Indian Ocean trade; true cinnamon is native to Sri Lanka.
  reason: Cinnamon is not an Indian spice, and 'the center' for 'millennia' is an overstatement.
