  target: /science/ancient-mathematics
  before: Indian mathematicians made pioneering contributions to the field, notably the invention of zero, the decimal system, and early calculus.
  after: "The article states what the texts show: place-value zero is covered in its own article with 'earliest known' wording, and the Kerala school's series are described as series expansions, not a general calculus."
  reason: Unqualified 'invention' claims are not supported; place-value with a placeholder also arose in Babylonia and among the Maya, and the Kerala results lack the general derivative and integral concepts of calculus.
