  before: "Calculus: The Kerala School (Madhava) developed infinite series for sine, cosine, and arctangent centuries before Newton and Leibniz."
  after: Later Kerala sources attribute the series to Madhava; his own works are not known to survive; the series are not a general calculus; transmission to Europe is a hypothesis, not established.
  reason: The attribution rests on later works such as Nilakantha's Tantrasamgraha and the Yuktibhasha, and the 'calculus' label overstates the results.
