  target: /art-and-culture/indian-cinema
  before: Raja Harishchandra (1913) was the first full-length Indian feature film.
  after: Raja Harishchandra (1913) is the first Indian feature film by the conventional reckoning; Shree Pundalik (1912) is a disputed earlier candidate.
  reason: Whether Pundalik, a filmed stage play shown in 1912, counts as the first Indian feature is argued by historians, so the unqualified claim overstated the consensus.
  sources:
    - src.rajadhyaksha-1999-encyclopaedia-indian-cinema
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
  before: "1931: Alam Ara, the first Indian sound film."
  after: Alam Ara (1931) is usually described as the first Hindi-Urdu sound feature; South Indian talkies such as Kalidas appeared the same year.
  reason: The unqualified claim ignores the language-specific industries that adopted sound in 1931.
  sources:
    - src.rajadhyaksha-1999-encyclopaedia-indian-cinema
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
  before: The rise of pan-Indian cinema (Bollywood, Tollywood, Kollywood).
  after: Bollywood is the Hindi industry of Mumbai; Tollywood and Kollywood are regional-industry nicknames, not synonyms for pan-Indian cinema.
  reason: The original conflated regional industries with a single pan-Indian cinema.
  sources:
    - src.ganti-2004-bollywood
    - src.gokulsing-2013-routledge-handbook-indian-cinemas
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
  before: "2023: RRR wins an Oscar for Best Original Song."
  after: The song 'Naatu Naatu' from the Telugu film RRR won the Best Original Song award; the film itself did not win.
  reason: The award was given to the song's composer and lyricist, not to the film.
  sources:
    - src.academy-2023-95th-awards
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
  before: Mother India (1957) became a global icon.
  after: Mother India was nominated for the Academy Award for Best Foreign Language Film but did not win.
  reason: "'Global icon' was unsupported; the documented international recognition is the Oscar nomination."
  sources:
    - src.chatterjee-2002-mother-india
- date: 2026-11-21
  target: /art-and-culture/indian-cuisine
  before: "c. 2600 BCE: Evidence of turmeric, ginger, and garlic in Indus Valley."
  after: Starch grains identified as resembling ginger and turmeric (and aubergine) were found in a cooking pot at the Mature Harappan site of Farmana; garlic is not claimed.
  reason: The cited study supports ginger and turmeric at one site, with probabilistic identification; garlic is not supportable here and the site is Farmana in Haryana, not the whole Indus Valley.
