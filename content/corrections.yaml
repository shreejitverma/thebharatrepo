    - src.king-1999-indian-philosophy
- date: 2026-11-21
  target: /history/indus-valley-civilisation
  before: it was one of three early civilisations of the Near East and South Asia, and of the three, the most widespread
  after: Mesopotamia, Egypt and the Indus are the best-known early urban traditions west of China, but they are not the only early civilisations; the Indus is often described as among the most extensive, with area estimates depending on how its edges are drawn.
  reason: The 'three civilisations' framing is a textbook convention, not a finding, and the 'most widespread' claim is an estimate that depends on boundary definitions.
