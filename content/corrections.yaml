  target: /art-and-culture/textiles-of-india
  before: "c. 2500 BCE: Cotton cultivation in Indus Valley."
  after: The earliest cotton thread from the subcontinent is from Neolithic Mehrgarh, sixth millennium BCE; Harappan cities show developed cotton use in the third millennium BCE.
  reason: Evidence for cotton in the region is much older than the date given, and 'cultivation' is inferred rather than directly shown by the thread.
