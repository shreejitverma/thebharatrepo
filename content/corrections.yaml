  after: The tag is replaced with 'vedic people' and 'indo-aryan'; the origin of Indo-Aryan speakers is presented as a debate between migration and indigenist positions, and 1500 to 500 BCE is graded as a reasoned estimate (grade C).
  reason: "'Aryans' as a people is outdated race-theory vocabulary; the dates are linguistic and archaeological estimates, not attested."
