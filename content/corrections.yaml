- date: 2026-11-21
  target: /art-and-culture/martial-arts
  before: "Mallakhamb (Maharashtra): Traditional aerial yoga/gymnastics performed on a vertical wooden pole."
  after: Mallakhamb is athletic pole gymnastics, associated in tradition with training for wrestlers and an early-19th-century revival; the yoga comparison is dropped.
  reason: "'Aerial yoga' is a modern comparison; the revival account is traditional and not verified in scholarly sources."
  sources: []
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
