  target: /science/ancient-metallurgy
  before: India was a global leader in metallurgy for millennia, exporting high-quality steel and pioneering zinc extraction.
  after: Indian metalworkers made notable advances in copper, iron, crucible steel and zinc, each with its own evidence and dating; no global ranking is claimed.
  reason: A blanket superlative is not supported by any single source; the article now states each technology's evidence separately.
  sources:
    - src.chakrabarti-1992-early-use-iron-india
    - src.craddock-1983-zinc-production-medieval-india
- date: 2026-11-21
  target: /science/ancient-metallurgy
  before: "The Iron Pillar of Delhi: A 7-meter high column from the Gupta period (c. 400 CE) that has resisted rust for over 1,600 years."
  after: The pillar is about 7 m tall, forge-welded wrought iron; it does corrode, extremely slowly, because of a protective iron phosphate film. The c. 400 CE date rests on identifying the inscribed king Chandra as Chandragupta II.
  reason: The pillar is not rust-proof and its durability has a materials-science explanation; the dating rests on an identification, not an absolute date.
  sources:
    - src.balasubramaniam-2000-corrosion-delhi-iron-pillar
    - src.balasubramaniam-2005-story-delhi-iron-pillar
- date: 2026-11-21
  target: /science/ancient-metallurgy
  before: "Zinc Smelting: India was the first to master zinc distillation (Zawar mines, Rajasthan) around the 12th century, centuries before Europe."
  after: Zawar is among the earliest known and best-documented sites of large-scale zinc production by distillation; the mines are older, the industry is medieval, and the 'centuries before Europe' comparison is dropped.
  reason: An unqualified 'first' and a comparative claim were unsupported; the sources describe Zawar's technology and medieval dating but do not establish priority.
  sources:
    - src.craddock-1983-zinc-production-medieval-india
    - src.freestone-1990-zawar-materials-analysis
    - src.willies-1984-lead-zinc-mining-rajasthan
- date: 2026-11-21
  target: /science/ancient-metallurgy
  before: "c. 1200 BCE: Iron Age begins in India."
  after: Iron smelting is securely attested across India by about 1200 to 1000 BCE, with an earlier, debated case from the central Ganga plain (Tewari).
  reason: The origin of Indian ironworking is a live scholarly debate with multiple regional centres, not a single starting date.
  sources:
    - src.chakrabarti-1992-early-use-iron-india
    - src.tewari-2003-origins-iron-working-india
- date: 2026-11-21
  target: /science/ancient-metallurgy
  before: "c. 300 BCE: Production of Wootz steel begins in South India."
  after: The date at which Indian crucible steel began is not securely fixed; the 300 BCE figure is removed.
  reason: No consulted source supports the specific date; the article describes the technology and a documented late production site instead.
  sources:
    - src.rao-2021-mysore-process-crucible-steel
    - src.verhoeven-1996-wootz-damascus-steel-blades
- date: 2026-11-21
  target: /science/ayurveda
  before: Ayurveda is one of the world's oldest medical systems, originating in India over 3,000 years ago.
  after: Vedic healing material (the Atharvaveda) is about 3,000 years old or more, but Ayurveda as a systematic medicine is documented in classical texts built up over the last centuries BCE and the first millennium CE.
  reason: The unqualified 'oldest' and the 3,000-year origin conflate Vedic healing charms with the classical medical system.
  sources:
    - src.wujastyk-2003-roots-of-ayurveda
    - src.wujastyk-2011-indian-medicine-obo
- date: 2026-11-21
  target: /science/ayurveda
  before: "c. 600 BCE: Period of Sushruta (early recension). c. 200 CE: Compilation of Charaka Samhita."
  after: Both works are layered compilations without a single secure date; the received forms belong to the first millennium CE.
  reason: The cited single dates are not supported by textual scholarship, which treats both Samhitas as built up by several hands over centuries.
  sources:
    - src.wujastyk-2003-roots-of-ayurveda
    - src.hoernle-1909-caraka-samhita-bower-manuscript
- date: 2026-11-21
  target: /science/ayurveda
  before: "c. 1500-1000 BCE: Early references to healing in the Atharva Veda."
  after: The Atharvaveda is dated by linguistic criteria to roughly the late second or early first millennium BCE, a graded estimate.
  reason: The earlier range is not the mainstream estimate used elsewhere in the archive.
