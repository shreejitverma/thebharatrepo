  after: A fourfold varna ideal appears in a late Rigvedic hymn (RV 10.90) and is elaborated in later Vedic priestly texts; jati, the actual birth-groups, is a later and distinct reality, and the existence of a developed caste system in this period is not established.
  reason: Varna (a theoretical scheme) and jati (social groups) were conflated, and the claim of crystallisation in this period overstates the evidence.
