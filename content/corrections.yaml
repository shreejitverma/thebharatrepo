    - src.plofker-2009-mathematics-in-india
- date: 2026-11-21
  target: /science/zero-and-the-decimal-system
  before: The decimal system, which is the basis of modern mathematics, was also developed in India.
  after: Decimal place-value notation with zero as a number is documented in Sanskrit texts from the middle of the first millennium CE, and its transmission to the Arabic world and Europe is traced; placeholder zeros also arose independently in Babylonia and among the Maya.
  reason: "'Developed in India' is stated without evidence of when and how, and independent placeholder systems existed elsewhere."
  sources:
    - src.plofker-2009-mathematics-in-india
    - src.joseph-2011-crest-of-the-peacock
- date: 2026-11-21
  target: /science/zero-and-the-decimal-system
  before: The concept of zero as a number and not merely a symbol for the absence of a quantity was a key innovation in the history of mathematics.
  after: The earliest surviving text with rules for zero as a number is Brahmagupta's of 628 CE; the Bakhshali manuscript's date, and whether its zeros are numbers or placeholders, are disputed.
  reason: An undated claim of innovation is replaced by the earliest surviving evidence and the 2017 dispute over the Bakhshali manuscript.
  sources:
    - src.plofker-2009-mathematics-in-india
