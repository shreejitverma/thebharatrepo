  after: Early Harappan c. 3300 to 2600 BCE, Mature c. 2600 to 1900 BCE, Late to c. 1300 BCE, all approximate scholarly estimates with phase boundaries varying by site.
  reason: The original gave round dates as fixed; they are phase estimates from radiocarbon and stratigraphy.
