- date: 2026-11-21
  target: /history/maurya-empire
  before: The first pan-Indian empire ... unified the subcontinent under a centralized administration.
  after: The earliest known state to rule most of the subcontinent; control was uneven and the far south stayed outside it.
  reason: Ashoka's own edicts name independent southern neighbours and are sparse in the far south, and the unqualified superlative needs a qualifier.
  sources:
    - src.hultzsch-1925-inscriptions-of-asoka
    - src.smith-2005-networks-territories-ancient-states
    - src.thapar-2002-early-india
- date: 2026-11-21
  target: /history/maurya-empire
  before: Guided by the Arthashastra, the state controlled key industries, maintained a standing army, and established an elaborate espionage system.
  after: The Arthashastra, in its surviving form, is argued to have been composed and edited over several centuries and cannot be used directly as a description of Mauryan government.
  reason: Olivelle dates the text as we have it to the first centuries CE, so it is not straightforward Mauryan evidence.
  sources:
    - src.olivelle-2013-king-governance-law
- date: 2026-11-21
  target: /history/maurya-empire
  before: "305 BCE: Defeat of Seleucus Nicator; Mauryan territory expands to Afghanistan."
  after: Chandragupta and Seleucus I concluded a negotiated settlement, c. 305 to 303 BCE, including territory west of the Indus and 500 elephants per Greek sources.
  reason: Greek accounts describe a treaty, not a clear Mauryan victory, and the extent of the territory is debated.
  sources:
    - src.thapar-2002-early-india
    - src.singh-2008-ancient-early-medieval-india
- date: 2026-11-21
  target: /history/maurya-empire
  before: Ashoka ... embracing Buddhism, spreading 'Dhamma' (moral law) across Asia.
  after: Ashoka declared himself a lay Buddhist and promoted a broad ethical dhamma in his edicts; the spread of Buddhism across Asia was not his work alone.
  reason: The edicts present dhamma as a public ethic, and later chronicles, not the edicts, describe the missions abroad.
  sources:
    - src.hultzsch-1925-inscriptions-of-asoka
    - src.thapar-2012-asoka-decline-mauryas
    - src.lahiri-2015-ashoka-ancient-india
- date: 2026-11-21
  target: /history/maurya-empire
  before: Trade flourished via the Grand Trunk Road.
  after: Greek writers describe a royal road from the northwest to Pataliputra; it should not be identified with the later Grand Trunk Road.
  reason: The attribution of the modern road to the Mauryas is not supported by the sources.
  sources:
    - src.thapar-2002-early-india
- date: 2026-11-21
  target: /history/gupta-empire
  before: At its zenith, from approximately 319 to 467 CE, it covered much of the Indian subcontinent.
  after: The Gupta era begins in 319 or 320 CE; the kingdom grew under Samudragupta and Chandragupta II and was strained after about 467 CE. It did not cover most of the subcontinent directly.
  reason: 319/320 is the start of the era, not an imperial peak, and the Gupta heartland was the north, with looser overlordship elsewhere.
  sources:
    - src.fleet-1888-inscriptions-early-gupta-kings
    - src.agrawal-1989-rise-and-fall-imperial-guptas
    - src.thapar-2002-early-india
- date: 2026-11-21
  target: /history/gupta-empire
  before: This period is considered as the Golden Age of India by some historians.
  after: The 'Golden Age' label is a modern judgment that many historians now question.
  reason: Comparable cultural achievements occur in other regions and periods, and Gupta power was regional.
  sources:
    - src.thapar-2002-early-india
    - src.williams-1982-art-of-gupta-india
- date: 2026-11-21
  target: /history/chola-empire
  before: The Chola Dynasty (c. 850-1279 CE) was one of the longest-ruling dynasties in world history.
  after: The medieval Cholas ruled for more than four centuries; the superlative is dropped.
  reason: No systematic comparison supports the claim.
  sources:
    - src.subbarayalu-2012-south-india-under-cholas
- date: 2026-11-21
  target: /history/chola-empire
  before: The Chola navy dominated the Indian Ocean, conquering Sri Lanka, the Maldives, and expanding influence to Southeast Asia (Srivijaya).
  after: The Cholas conquered much of Sri Lanka and mounted a naval raid on Srivijaya c. 1025 CE; the Maldives claim is a court claim of uncertain extent, and no lasting Southeast Asian territory resulted.
  reason: Inscriptions and scholarship support a notable expedition but not lasting naval dominance.
  sources:
    - src.kulke-2009-nagapattinam-to-suvarnadwipa
    - src.spencer-1976-politics-of-plunder-cholas-ceylon
    - src.sastri-1955-the-colas
- date: 2026-11-21
  target: /history/chola-empire
  before: "850 CE: Vijayalaya Chola captures Thanjavur."
  after: Vijayalaya took Thanjavur from the Muttaraiyar chiefs around the middle of the 9th century (c. 850 CE).
  reason: The date is approximate and the dynasty's earlier history, including Ashoka's mention of the Cholas, is distinct.
  sources:
    - src.sastri-1955-the-colas
    - src.hultzsch-1925-inscriptions-of-asoka
- date: 2026-11-21
  target: /history/maratha-empire
  before: ended Mughal dominance and became the paramount power in India in the 18th century
  after: The Marathas survived a long Mughal war and gained large revenue claims in the 18th century; 'paramount power' is a contested judgement, since Hyderabad, Mysore and the East India Company were also strong.
  reason: The original overstated Maratha supremacy and attributed the end of Mughal power to one actor; the Mughal decline had several causes.
  sources:
    - src.gordon-1993-marathas-1600-1818
- date: 2026-11-21
  target: /history/maratha-empire
  before: Founded by Chhatrapati Shivaji Maharaj in 1674
  after: Shivaji built a fortified kingdom from the 1640s; 1674 is the date of his formal coronation as chhatrapati, which was itself a contested claim to status.
  reason: 1674 marks a coronation, not the founding of the state, and the ritual was disputed.
  sources:
    - src.gordon-1993-marathas-1600-1818
    - src.laine-2003-shivaji
- date: 2026-11-21
  target: /history/maratha-empire
  before: Under the Peshwas the empire expanded from Attock to Thanjavur
  after: The Peshwa-led system was a confederacy in which Sindhia, Holkar, Gaekwad and Bhonsle leaders held large, partly autonomous territories; it was not a centrally governed empire.
  reason: The original implied a single expanding empire under the Peshwas, which the structure of Maratha power does not support.
  sources:
    - src.gordon-1993-marathas-1600-1818
    - src.wink-1986-land-and-sovereignty
- date: 2026-11-21
  target: /history/maratha-empire
  before: They were masters of guerrilla warfare (Ganimi Kava)
  after: Maratha armies used mobile cavalry and raiding but also fought pitched battles and sieges, and adapted Deccan methods of war.
  reason: "'Guerrilla warfare' alone is an oversimplification of the Maratha military record."
  sources:
    - src.gordon-1993-marathas-1600-1818
- date: 2026-11-21
  target: /history/british-raj
  before: "1857: The First War of Independence (Sepoy Mutiny)"
  after: The uprising of 1857 began as a revolt of Company sepoys; scholars now often call it a rebellion or uprising, and the 'war of independence' label dates from Savarkar in 1909.
  reason: Both 'Mutiny' and 'First War of Independence' are partisan labels; the article names the debate.
  sources:
    - src.metcalf-2012-concise-history-modern-india
- date: 2026-11-21
  target: /history/british-raj
  before: "Economic: De-industrialization of Indian textiles; introduction of railways and telegraph."
  after: The extent of de-industrialisation is contested; railways and telegraph were built, but who benefited is debated; famine policy is a separate and serious part of the record.
  reason: The original stated a contested economic thesis as fact and omitted the debate.
  sources:
    - src.parthasarathi-2011-why-europe-grew-rich
    - src.metcalf-2012-concise-history-modern-india
    - src.davis-2001-late-victorian-holocausts
    - src.sen-1981-poverty-and-famines
- date: 2026-11-21
  target: /history/british-raj
  before: "Social: English education (Macaulay), social reforms (Sati abolition)."
  after: The 1829 sati regulation followed a debate involving Indian reformers and was argued over scriptural authority, with women's voices largely absent; Macaulay's 1835 Minute favoured English higher education.
  reason: The original presented reform as a British act without the Indian participation and the debate.
  sources:
    - src.mani-1998-contentious-traditions
    - src.metcalf-2012-concise-history-modern-india
- date: 2026-11-21
  target: /history/british-raj
  before: British Raj (framing as British rule from Plassey)
  after: "'Raj' strictly means Crown rule from 1858; the period 1757 to 1858 was rule by the East India Company."
  reason: The original merged two different forms of government.
  sources:
    - src.metcalf-2012-concise-history-modern-india
- date: 2026-11-21
  target: /history/indian-independence-movement
  before: non-violent resistance (Satyagraha) led by Mahatma Gandhi and armed revolution by figures like Bhagat Singh and Subhas Chandra Bose
  after: The movement had many currents, including constitutional politics, mass campaigns, revolutionary groups and the Indian National Army; their relative weight is debated.
  reason: A two-sided summary hid the range of currents and the historiographic debate.
  sources:
    - src.chandra-1989-indias-struggle-for-independence
    - src.metcalf-2012-concise-history-modern-india
- date: 2026-11-21
  target: /history/indian-independence-movement
  before: "1942: Launch of Quit India Movement; INA formation"
  after: The INA was first formed in 1942 from prisoners of war in Southeast Asia and was reorganised under Bose in 1943.
  reason: The INA existed in two phases; the original dated its formation without this.
  sources:
    - src.bose-2011-his-majestys-opponent
- date: 2026-11-21
  target: /history/indian-independence-movement
  before: "1947: Independence and Partition (August 15)"
  after: Pakistan became a dominion on 14 August 1947 and India on 15 August; Partition killed an uncertain number of people, with estimates from about 200,000 to 2 million.
  reason: The original omitted the date for Pakistan and the scale and uncertainty of Partition violence.
  sources:
    - src.khan-2007-the-great-partition
- date: 2026-11-21
  target: /history/modern-india
  before: "Constitution: Adopted in 1950"
  after: The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950.
  reason: The original gave the date it entered into force as the date of adoption.
  sources:
    - src.guha-2007-india-after-gandhi
- date: 2026-11-21
  target: /history/modern-india
  before: "Green Revolution: Achieved food self-sufficiency in the 1960s-70s."
  after: High-yielding varieties raised grain output from the mid-1960s and ended large-scale imports, but gains were regional and unequal, and undernutrition persisted.
  reason: "'Self-sufficiency' overstated a partial and uneven change."
  sources:
    - src.guha-2007-india-after-gandhi
- date: 2026-11-21
  target: /history/modern-india
  before: Becoming a nuclear power (1974, 1998)
  after: India conducted a test in 1974 that it called a peaceful nuclear explosion, and tests in 1998 after which it declared itself a nuclear-weapon state.
  reason: The two events had different official characterisations.
  sources:
    - src.perkovich-1999-indias-nuclear-bomb
- date: 2026-11-21
  target: /history/modern-india
  before: "2023: Chandrayaan-3 lands on the lunar south pole"
  after: Chandrayaan-3 landed in the south polar region at about 69 degrees south latitude, not at the pole itself.
  reason: The lunar south pole is at 90 degrees south; the landing site was about 21 degrees of latitude away.
  sources: []
- date: 2026-11-21
  target: /history/modern-india
  before: "1971: Indo-Pak War; liberation of Bangladesh"
  after: The 1971 war followed the crisis in East Pakistan and led to the creation of Bangladesh; its outcome also depended on Cold War diplomacy.
  reason: "'Liberation' is one framing; the article describes events and the scholarly argument about causes."
  sources:
    - src.raghavan-2013-1971
- date: 2026-11-21
  target: /music/01-origin-and-evolution
  before: The Sama Veda ... This is considered the earliest form of organized music in India.
  after: Vedic chant is the earliest musical tradition we can examine in detail because it was fixed in a text and transmitted orally; earlier and parallel non-Vedic music certainly existed but is not documented.
  reason: An unqualified 'earliest' claim cannot be supported; the evidence only shows that chant is the earliest well-documented tradition.
  sources:
    - src.howard-1977-samavedic-chant
    - src.rowell-1992-music-musical-thought-early-india
- date: 2026-11-21
  target: /music/01-origin-and-evolution
  before: Vedic Period (c. 1500-500 BCE) ... The origins of Indian music can be traced back to the Vedic period.
  after: The Samaveda is dated by linguistic and textual reasoning to roughly the later second millennium BCE, an estimate with wide margins; it does not date the origin of music.
  reason: Dating the Samaveda is an estimate, and it marks the earliest documented chant, not the origin of music.
  sources:
    - src.witzel-1997-early-sanskritization-kuru
    - src.singh-2008-ancient-early-medieval-india
- date: 2026-11-21
  target: /music/01-origin-and-evolution
  before: "[The Natya Shastra] introduced the concepts of swara (musical note), raga (melodic framework), and tala (rhythmic cycle)."
  after: The Natyashastra organises seven named pitches into grama scales, murchana and jati; the jati system is a precursor of raga, and raga as a defined concept is first treated systematically in the Brhaddesi attributed to Matanga.
  reason: Swara predates the Natyashastra, and raga as a technical concept is not found there in its later sense.
  sources:
    - src.rowell-1992-music-musical-thought-early-india
    - src.sharma-1992-brhaddesi-matanga
    - src.widdess-1995-ragas-early-indian-music
- date: 2026-11-21
  target: /music/01-origin-and-evolution
  before: Hindustani music ... was influenced by Persian music and developed new forms like Khayal, Ghazal, and Qawwali; Carnatic ... remained closer to the ancient Hindu traditions.
  after: Hindustani music reflects a long, two-way exchange between Hindu and Muslim musicians; both Hindustani and Carnatic traditions have changed continuously and claim the same earlier treatises; ghazal and qawwali are separate genres, not branches of classical music.
  reason: The original oversimplified Persian influence, implied a static southern tradition, and listed non-classical genres as classical developments.
  sources:
    - src.sanyal-widdess-2004-dhrupad
    - src.neuman-1990-life-of-music
    - src.tenijenhuis-1974-indian-music
    - src.wade-1984-khyal
- date: 2026-11-21
  target: /music/02-core-concepts
  before: Shruti is the smallest interval of pitch that the human ear can detect.
  after: In the treatises the octave is analysed into 22 shrutis, a theoretical unit used to define the sizes of the scale intervals; it is not a claim about the limit of hearing.
  reason: The original definition is not what the texts say.
  sources:
    - src.rangacharya-1996-natyasastra
    - src.rowell-1992-music-musical-thought-early-india
- date: 2026-11-21
  target: /music/02-core-concepts
  before: Indian music uses a system of just intonation.
  after: Measured intonation in North Indian performance lies close to just-intonation ratios but varies by raga and performer.
  reason: Empirical measurement shows approximation and variation, not a fixed just scale.
  sources:
    - src.jairazbhoy-1963-intonation-north-indian
- date: 2026-11-21
  target: /music/02-core-concepts
  before: A dominant note (vadi) and a sub-dominant note (samvadi).
  after: Vadi is the leading note and samvadi a consonant partner; 'sub-dominant' is a Western analogy that does not fit.
  reason: The Western terms mislead about the function of these notes.
  sources:
    - src.jairazbhoy-1971-rags-north-indian-music
- date: 2026-11-21
  target: /music/02-core-concepts
  before: Out of these seven, Sa and Pa are fixed, while the other five can be shuddha or vikrit, giving a total of 12 notes.
  after: Sa and Pa are fixed; Re, Ga, Dha and Ni can be komal and Ma can be tivra, giving twelve pitches.
  reason: Ma is raised, not lowered; the five variable notes alter in different directions, which the original blurred.
  sources:
    - src.jairazbhoy-1971-rags-north-indian-music
- date: 2026-11-21
  target: /music/03-hindustani-music
  before: It is a tradition that originated in Vedic ritual chants and has been evolving since the 12th century CE ... Persian tradition of Musiqi-e assil.
  after: Its theory has ancient roots, but the forms and gharana system described are documented mainly from the 15th to the 19th century, and a direct line from Vedic chant cannot be demonstrated.
  reason: The original asserted origin and a precise start date without evidence, and the Persian tradition named was not supported by a scholarly source.
  sources:
    - src.neuman-1990-life-of-music
    - src.widdess-1995-ragas-early-indian-music
    - src.sanyal-widdess-2004-dhrupad
- date: 2026-11-21
  target: /music/03-hindustani-music
  before: "Dhrupad: This is the oldest and most majestic form of Hindustani classical music."
  after: Dhrupad is among the oldest living forms of North Indian classical song, documented from the 15th and 16th centuries.
  reason: An unqualified 'oldest' needs a qualifier and a source.
  sources:
    - src.sanyal-widdess-2004-dhrupad
- date: 2026-11-21
  target: /music/03-hindustani-music
  before: "Ghazal: ... has become a very popular form of light classical music in India; Khayal ... more romantic than Dhrupad."
  after: Ghazal is a Persian-derived verse form that belongs to the light-classical and popular world; khyal rose to prominence in the 18th century and its origins are debated.
  reason: Placing ghazal among classical forms and giving khyal no history misstates the record.
  sources:
    - src.manuel-1989-thumri
    - src.wade-1984-khyal
- date: 2026-11-21
  target: /art-and-culture/bharatanatyam
  before: Bharatanatyam is a major genre of Indian classical dance that originated in the Hindu temples of Tamil Nadu in South India.
  after: The dance draws on older court and temple traditions (sadir, dasiattam) of hereditary performers, but the name Bharatanatyam and the modern concert form date from the 1930s revival in Madras.
  reason: Saying the dance simply originated in temples compresses a documented history in which court musicians, hereditary performers and 1930s revivalists reshaped the art; the name and present form are twentieth-century.
  sources:
    - src.allen-1997-rewriting-script-south-indian-dance
    - src.soneji-2012-unfinished-gestures
- date: 2026-11-21
  target: /art-and-culture/classical-dances-of-india
  before: "Bharatanatyam (Tamil Nadu): Oldest form"
  after: The oldest-form claim is withdrawn; its roots are older than its name, but the name and modern form date from the 1930s and no form can be shown to be the oldest.
  reason: "'Oldest' is an unqualified superlative with no supporting evidence; scholarship dates the modern form to the 1930s."
  sources:
    - src.allen-1997-rewriting-script-south-indian-dance
    - src.soneji-2012-unfinished-gestures
- date: 2026-11-21
  target: /art-and-culture/classical-dances-of-india
  before: all rooted in the Natya Shastra
  after: The forms share vocabulary and theory drawn from the Natyashastra, but were not derived directly from it; the link was strengthened in the twentieth century.
  reason: The treatise is a general work on theatre composed centuries before any of the forms took their present shape, so 'rooted in' overstates a direct descent.
  sources:
    - src.ghosh-1951-natyasastra
    - src.soneji-2012-unfinished-gestures
- date: 2026-11-21
  target: /art-and-culture/classical-dances-of-india
  before: Kathak ... Influenced by Persian culture.
  after: Kathak developed in both Hindu devotional storytelling and Muslim and Rajput court settings; a single Persian influence is too simple.
  reason: Historical work on Kathak presents a mixed and contested set of influences.
  sources:
    - src.walker-2014-kathak-historical-perspective
    - src.chakravorty-2008-bells-of-change
- date: 2026-11-21
  target: /art-and-culture/classical-dances-of-india
  before: "Kuchipudi (Andhra Pradesh): Combines dance and acting."
  after: Kuchipudi is a dance-drama named for the village of Kuchipudi, traditionally performed by Brahmin men and later also a solo form.
  reason: The original description was generic; scholarship documents a specific male Brahmin troupe tradition.
  sources:
    - src.kamath-2019-impersonations
    - src.soneji-2012-unfinished-gestures
- date: 2026-11-21
  target: /art-and-culture/classical-dances-of-india
  before: "c. 200 BCE: Compilation of Natya Shastra by Bharata Muni. 15th-17th Century: Evolution of regional styles (Kathak, Kuchipudi)."
  after: The Natyashastra is dated to roughly 200 BCE to 200 CE with debate; the single-author attribution and a 15th-17th century origin for Kathak and Kuchipudi are not asserted.
  reason: The date is an estimate with a range, and the other dates were unsourced.
  sources:
    - src.ghosh-1951-natyasastra
- date: 2026-11-21
  target: /art-and-culture/martial-arts
  before: "Kalaripayattu (Kerala): Often called the 'Mother of all Martial Arts.'"
  after: The 'Mother of all Martial Arts' claim is withdrawn as an unsupported slogan.
  reason: No scholarly source demonstrates that Kalaripayattu gave rise to other martial arts; the documented history is regional.
  sources:
    - src.zarrilli-1998-when-the-body-becomes-all-eyes
- date: 2026-11-21
  target: /art-and-culture/martial-arts
  before: "c. 3rd Century BCE: Early references to martial practices in Sangam literature."
  after: Sangam poems are usually dated to the early centuries CE, and kalari there means a battlefield rather than a martial school.
  reason: The 3rd century BCE date is earlier than the usual dating of the poems, and the references do not describe the later art.
  sources:
    - src.thapar-2002-early-india
    - src.zarrilli-1998-when-the-body-becomes-all-eyes
- date: 2026-11-21
  target: /art-and-culture/martial-arts
  before: "c. 11th Century: Golden age of Kalaripayattu during the Chola-Chera wars."
  after: The medieval wars of the 11th and 12th centuries are the usual context for the rise of Kerala's martial schools, but this is a graded estimate (C), not a documented golden age.
  reason: A 'golden age' is an interpretation; direct evidence is thin.
  sources:
    - src.zarrilli-1998-when-the-body-becomes-all-eyes
- date: 2026-11-21
  target: /art-and-culture/martial-arts
  before: "Mallakhamb (Maharashtra): Traditional aerial yoga/gymnastics performed on a vertical wooden pole."
  after: Mallakhamb is athletic pole gymnastics, associated in tradition with training for wrestlers and an early-19th-century revival; the yoga comparison is dropped.
  reason: "'Aerial yoga' is a modern comparison; the revival account is traditional and not verified in scholarly sources."
  sources: []
- date: 2026-11-21
  target: /art-and-culture/indian-cinema
  before: Indian Cinema is one of the oldest and largest film industries in the world
  after: India is usually counted among the most prolific film-producing countries; the unqualified superlative 'oldest' is dropped.
  reason: No source supports a ranking of India as the oldest film industry; film production began in several countries in the 1890s and 1900s. Volume of production is the supportable claim.
