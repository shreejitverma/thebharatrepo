  after: regarded by many as the finest classical Sanskrit poet and dramatist; his date is bracketed between the 2nd century BCE and 634 CE, with a 4th to 5th century CE placement favoured by many scholars.
  reason: An unqualified superlative needs a qualifier, and the article now states the evidence for his date.
