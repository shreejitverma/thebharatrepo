  target: /science/ancient-mathematics
  before: "Brahmagupta (598-668 CE): Defined rules for zero and negative numbers."
  after: Brahmagupta's 628 CE text is the earliest surviving text that gives rules for arithmetic with zero and negative quantities; some of his rules, including division by zero, are incorrect by modern standards.
  reason: "'Earliest surviving' is the evidence-based qualifier, and the original omitted that part of the treatment is faulty."
