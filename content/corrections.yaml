  after: Akbar's policy of sulh-i kull and the abolition of the jizya are documented; the Din-i Ilahi is better described as a small circle of disciples than as a new state religion.
  reason: The original equated the Din-i Ilahi with Akbar's tolerance and implied it was a religion.
