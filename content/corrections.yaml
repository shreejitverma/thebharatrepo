- date: 2026-11-21
  target: /philosophy/jainism
  before: "c. 300 BCE: First Jain Council at Pataliputra; c. 5th Century CE: Second Jain Council at Valabhi; final redaction of scriptures"
  after: These are Svetambara traditions, not independently attested; the Digambara hold that the old canon was lost
