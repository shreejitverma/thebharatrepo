  target: /history/delhi-sultanate
  before: The Delhi Sultanate ... marked the integration of Islamic culture with existing Indian traditions, leading to the Indo-Islamic synthesis.
  after: Cultural exchange, accommodation and conflict all occurred; the evidence is mixed, and 'synthesis' is presented as one contested framing rather than a settled outcome.
  reason: A single smooth 'synthesis' narrative overstates what the sources show; modern scholarship documents both cooperation and violence.
