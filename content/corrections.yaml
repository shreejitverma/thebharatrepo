    - src.cohen-2018-upanishads-complete-guide
- date: 2026-11-21
  target: /philosophy/six-darshanas
  before: "c. 600-200 BCE: Formation of the Sutras for each school."
  after: The surviving foundational sutras are mostly dated between roughly the 2nd century BCE and the 5th century CE, with the Samkhya Karika at the later end; the schools' ideas are older than their texts.
  reason: The earlier range is not supported for the sutras as transmitted; dates are estimates with wide margins and disagreement on individual texts.
