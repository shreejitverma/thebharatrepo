  after: Shakuntala draws on the Mahabharata, Raghuvamsha on the Ramayana, and Vikramorvashiya on the Pururavas-Urvashi tale of the Rigveda and Shatapatha Brahmana; Malavikagnimitra is built on a historical Shunga king and has no epic source.
