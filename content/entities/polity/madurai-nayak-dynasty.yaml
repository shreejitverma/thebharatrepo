claims:
  - text: Viswanatha Nayaka and his minister Ariyanatha Mudaliar organized southern Tamil Nadu into seventy-two palaiyams (military-tributary chieftaincies) whose palayakkarars later resisted British expansion.
    grade: B
    sources:
      - src.aiyar-1924-history-nayaks-of-madura
      - src.karashima-2014-concise-history-south-india
  - text: Tirumala Nayaka (r. 1623-1659 CE) rebuilt Madurai's palace complex blending Vijayanagara and Deccani-Sultanate arched vaulting, expanded the Meenakshi-Sundareshvara temple corridors, and moved the court's primary seat between Madurai and Tiruchirappalli.
    grade: B
    sources:
      - src.michell-1995-architecture-art-southern-india
      - src.narayanarao-1992-symbols-of-substance
  - text: Women played decisive political roles in the later Madurai state, notably Regent Queen Mangammal (r. 1689-1706 CE) and the last ruler Queen Minakshi (r. 1732-1736 CE).
    grade: B
    sources:
