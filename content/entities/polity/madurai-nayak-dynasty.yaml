id: polity.madurai-nayak-dynasty
type: polity
kind: polity
names:
  en: Madurai Nayak Kingdom
  iast: Maturai Nāyakkar
  native: மதுரை நாயக்கர்கள்
summary: >-
  The Madurai Nayaks were a Telugu-origin warrior dynasty that governed southern Tamil Nadu from Madurai and Tiruchirappalli between c. 1529 and 1736 CE. Originating as Vijayanagara provincial governors (amara-nayakas) under Nagama and Viswanatha Nayaka, they evolved into autonomous rulers after 1565 CE, instituted the palayakkarar (poligar) defensive-fiscal system, patronised Sanskrit, Telugu, and Tamil scholarship, and built the towering gopurams and mandapas of the Meenakshi-Sundareshvara temple and Thirumalai Nayakkar Mahal.
summaries:
  kids: >-
    The Madurai Nayaks ruled southern Tamil Nadu from Madurai for two centuries, building the soaring painted towers of the Meenakshi temple and grand palaces like Thirumalai Nayakkar Mahal.
  teen: >-
    Founded as Vijayanagara governors under Viswanatha Nayaka, the Madurai Nayaks became independent after Talikota, created the palayakkarar (poligar) military estate network, and reached their cultural peak under Tirumala Nayaka and Queen Mangammal.
region: Southern Tamil Nadu (Madurai, Tiruchirappalli, Tirunelveli, and Dindigul)
location: { name: "Madurai, Tamil Nadu", lat: 9.92, lon: 78.12 }
