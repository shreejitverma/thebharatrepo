id: polity.early-cholas
type: polity
kind: polity
names:
  en: Early Chola Dynasty
  iast: Cōḻa
  native: முற்காலச் சோழர்கள்
summary: >-
  The Early Cholas were the Sangam-era ruling lineage of the fertile Kaveri delta, centered on their inland seat at Uraiyur (near Tiruchirappalli) and the coastal emporium of Puhar (Kaveripattinam). Attested as Choda in Ashoka's Major Rock Edicts II and XIII and celebrated in Sangam poems such as Pattinappalai and Porunararruppatai, their foremost recorded ruler was Karikala, after whom Chola power receded during the Kalabhra interregnum until Vijayalaya's 9th-century revival.
summaries:
  kids: >-
    Long before the great medieval Chola Empire, the Early Cholas ruled the Kaveri river valley and traded across the sea from their bustling port city of Poompuhar.
  teen: >-
    Known from Ashokan edicts and Sangam poems like Pattinappalai, the Early Cholas governed the Kaveri delta from Uraiyur and Puhar, with legends and later charters recalling King Karikala's embankments and victories.
region: Kaveri delta (Tiruchirappalli, Thanjavur, and Nagapattinam districts), Tamil Nadu
location: { name: "Uraiyur (Tiruchirappalli), Tamil Nadu", lat: 10.82, lon: 78.67 }
datings:
  - method: foreign-synchronism
    range: { earliest: "300 BCE", latest: "300 CE", precision: century, circa: true }
    grade: B
    label: Ashokan edicts through the late Sangam horizon
    sources:
      - src.hultzsch-1925-inscriptions-of-asoka
      - src.sastri-1955-the-colas
