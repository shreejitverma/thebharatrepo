    note: Named as Choda in Ashoka's edicts (3rd century BCE) and as a distinct polity in Sangam poetry and Greco-Roman notices through roughly the 3rd century CE.
  - method: textual-internal
    range: { earliest: "100 CE", latest: "250 CE", precision: century, circa: true }
    grade: C
    label: Estimated period of Karikala Chola
    sources:
      - src.sastri-1955-the-colas
      - src.zvelebil-1973-smile-of-murugan
    note: Karikala is celebrated in Pattinappalai and Porunararruppatai and remembered in later Chola and Telugu Choda grants, though his exact regnal dates remain unattested in contemporary inscriptions.
claims:
  - text: Ashoka's Major Rock Edicts II and XIII mention the Chodas among the independent southern kingdoms outside Mauryan rule.
    grade: A
    sources:
      - src.hultzsch-1925-inscriptions-of-asoka
      - src.sastri-1955-the-colas
  - text: Sangam poems describe Uraiyur as the inland Chola capital famous for fine cotton textiles and Kaveripattinam (Puhar) as their coastal port receiving overseas merchandise.
    grade: B
    sources:
      - src.champakalakshmi-1996-trade-ideology-urbanization
      - src.sastri-1955-the-colas
  - text: After the Sangam period, the Early Cholas disappear from major political dominance for nearly five centuries before Vijayalaya founded the Imperial Chola line at Thanjavur in the mid-9th century CE.
    grade: B
    sources:
      - src.sastri-1955-the-colas
      - src.singh-2008-ancient-early-medieval-india
