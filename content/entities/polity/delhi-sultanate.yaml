id: polity.delhi-sultanate
type: polity
kind: polity
names:
  en: Delhi Sultanate
summary: The Delhi Sultanate developed from the Ghurid conquests and was ruled by successive
  military and dynastic houses. Its territorial extent changed substantially over three centuries,
  ending with Babur's defeat of Ibrahim Lodi at Panipat.
summaries:
  kids: For more than three centuries, sultans ruled from Delhi and other nearby capitals. Their
    kingdoms grew and shrank under different ruling families.
  teen: Aybak based his early authority at Lahore, and Iltutmish consolidated Delhi. Later dynasties
    controlled widely varying territories before the Mughal conquest of 1526.
region: Indo-Gangetic plain, with changing domains across the subcontinent
