summary: >-
  Travancore grew out of the southern Kerala principality of Venad under Marthanda Varma (r. 1729-1758),
  who centralised royal power, annexed neighbouring principalities and defeated the Dutch at Colachel in
  1741. Later rulers resisted Tipu Sultan, entered a subsidiary alliance with the East India Company in 1795
  and issued the Temple Entry Proclamation of 1936, and the state merged with Cochin in 1949.
summaries:
  kids: >-
    Marthanda Varma brought smaller territories together to build Travancore. Its later capital was
    Thiruvananthapuram, and in 1936 its temples were opened to people of all castes.
  teen: >-
    Travancore became more centralised under Marthanda Varma. Its relationship to the British was
    formalised through treaties, and its royal government continued until the merger with Cochin in 1949.
