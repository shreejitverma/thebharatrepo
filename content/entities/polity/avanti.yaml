      - src.singh-2008-ancient-early-medieval-india
    note: The interval places Avanti in the period of early historic kingdoms. The date of the Magadhan
      takeover is approximate.
claims:
  - text: Ujjayini in Malwa was one of the principal centres of the kingdom.
    grade: B
    sources:
