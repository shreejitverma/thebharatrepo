id: polity.avanti
type: polity
kind: polity
names:
  en: Avanti
  iast: Avantī
  native: अवन्ती
summary: Avanti was a major kingdom of Malwa with a political centre at Ujjayini. Historical
  accounts place its absorption by Magadha in the period of that kingdom's westward expansion.
summaries:
  kids: Avanti was a kingdom whose main city was Ujjain. It was one of the large realms that grew up
    before the Maurya Empire.
  teen: Ujjayini anchored Avanti in Malwa. Early historical traditions describe Avanti as one of the
    strongest kingdoms before Magadha consolidated its control.
region: Malwa and the Narmada corridor
location:
  name: Ujjain (Ujjayini)
  lat: 23.18
  lon: 75.78
datings:
  - method: scholarly-consensus
    range:
