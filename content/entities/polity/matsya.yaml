summary: Matsya was a realm in what is now eastern Rajasthan, west of the middle Ganga kingdoms. Its
  centre Virata is conventionally identified with Bairat.
summaries:
  kids: Matsya was an ancient realm in today's Rajasthan. Scholars commonly link its main town with
    modern Bairat.
  teen: Matsya appears as Maccha in Pali. Bairat is the conventional location of its centre Virata,
    but the chronology of the realm itself is loosely known.
