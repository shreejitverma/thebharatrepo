names:
  en: Kosala
  iast: Kosala
  native: कोसल
summary: Kosala was a kingdom north of the middle Ganga whose major centres included Shravasti and
  Saketa. Early Buddhist discourses portray its king Pasenadi in conversation with the Buddha.
summaries:
  kids: Kosala was a kingdom with a great city called Shravasti. Buddhist stories tell of its king
    visiting the Buddha.
  teen: Shravasti and Saketa were important Kosalan centres. Early Buddhist texts give Kosala a
    prominent role, though the reign of Pasenadi has no securely fixed absolute dates.
region: Awadh and the middle Ganga plain
location:
  name: Shravasti (Sahet-Mahet)
  lat: 27.5
  lon: 82.05
datings:
  - method: scholarly-consensus
    range:
