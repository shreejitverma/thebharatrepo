names:
  en: Maratha Peshwa Government
  iast: Peśvā
  native: पेशवा
summary: The Peshwa was a chief minister of the Maratha king. From Balaji Vishwanath onward, his
  family made the office hereditary in practice and developed Pune as the centre of a government
  that became dominant within the wider Maratha confederacy.
summaries:
  kids: A Peshwa was a chief minister. One family held the job for generations and made Pune an
    important centre of Maratha power.
  teen: The Peshwas exercised growing authority while the Maratha kings retained a dynastic role.
    Their dealings with regional houses make the government at Pune part of a wider confederacy.
region: Western Deccan and Maratha network across India
