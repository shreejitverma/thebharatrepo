summary: Kamboja appears in the Buddhist list of sixteen realms on the northwestern frontier.
  Ashoka's inscriptions attest the people by name, while the location of the capital called Rajapura
  in the Mahabharata remains uncertain.
summaries:
  kids: Ancient books and stone inscriptions name the Kambojas. Their capital is named in a story, but
    its site is still unknown.
