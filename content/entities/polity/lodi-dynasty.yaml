id: polity.lodi-dynasty
type: polity
kind: polity
names:
  en: Lodi Dynasty
summary: The Lodis were an Afghan ruling house of the Delhi Sultanate, founded by Bahlul Lodi.
  Sikandar made Agra a centre of government, and Ibrahim's defeat at Panipat ended the dynasty's
  rule.
summaries:
  kids: The Lodis ruled from Delhi and Agra. Babur defeated their last sultan, Ibrahim Lodi, at
    Panipat in 1526.
  teen: Bahlul built authority through Afghan political networks and the conquest of Jaunpur. The
    house lost the sultanate when Ibrahim faced Babur at Panipat.
region: Delhi, Punjab and the Indo-Gangetic plain
location:
  name: Agra (later Lodi seat)
  lat: 27.18
  lon: 78.02
