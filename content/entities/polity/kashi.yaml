summary: Kashi was an early kingdom of the middle Ganga valley centred on Varanasi. Buddhist
  accounts preserve memories of its rivalry with the neighbouring kingdom of Kosala.
summaries:
  kids: Kashi was a kingdom on the Ganga. Its main city was Varanasi, which is still a city today.
  teen: Kashi's position on the middle Ganga put it among the competing kingdoms of the early historic
    period. Buddhist texts remember a struggle between Kashi and Kosala.
