  - text: Three successive early medieval dynasties - the Varmans (c. 350-650), Salastambhas (c. 655-900) and Kamarupa Palas (c. 900-1100) - traced mythical descent from Naraka and Bhagadatta in their Sanskrit copper plates while adapting lineage rhetoric over time.
    grade: B
