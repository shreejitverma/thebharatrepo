  iast: Kāmarūpa
  native: কামৰূপ ৰাজ্য
summary: "Kamarupa (also known as Pragjyotisha in epigraphs and Puranic texts) was the earliest known historical state in the Brahmaputra valley of Assam and adjacent parts of northern Bengal and Bangladesh, attested from the fourth to twelfth centuries CE. Ruled sequentially by the Varman, Mlechchha (Salastambha) and Pala dynasties of Kamarupa, it left a major corpus of Sanskrit copper-plate grants and rock inscriptions."
summaries:
  kids: >-
    From the 4th to 12th centuries CE, Kamarupa was the major ancient kingdom of Assam, named on an
    emperor's pillar inscription in Allahabad and known for copper-plate grants and Hindu and
    Shakta temples.
  teen: >-
    First attested in Samudragupta's Allahabad pillar inscription (mid-4th century CE), Kamarupa
    united the Brahmaputra valley under three successive dynasties - the Varmans, Salastambhas and
    Kamarupa Palas - down to the twelfth century.
region: Brahmaputra Valley (Assam) and northern Bengal / Sylhet frontier
