id: polity.karkota-dynasty
type: polity
kind: polity
names:
  en: Karkota Dynasty of Kashmir
  iast: Kārkoṭa
summary: The Karkotas ruled Kashmir from the seventh to ninth centuries. Kalhana's chronicle names
  Durlabhavardhana as the first ruler and attributes the Martand Sun Temple to Lalitaditya. The
  dynasty's starting date is disputed.
summaries:
  kids: The Karkotas ruled Kashmir many centuries ago. A later historian says one of their kings,
    Lalitaditya, built the Sun Temple at Martand.
  teen: Scholars compare the reign lengths in the Rajatarangini with foreign records and archaeology.
    They agree on the broad Karkota period but differ on the date at which it began.
region: Kashmir Valley
location:
  name: Srinagar (urban area of Pravarapura)
  lat: 34.09
  lon: 74.8
datings:
