        locator: Part V
    note: Historians conventionally date the autonomous state from Asaf Jah's consolidation in 1724.
      Hyderabad was incorporated into India in 1948.
claims:
  - text: Asaf Jah preserved Mughal titles while developing substantial autonomy in the Deccan.
