id: polity.hyderabad-state
type: polity
kind: polity
names:
  en: Hyderabad State (Asaf Jahi Dynasty)
summary: Asaf Jah I established an effectively autonomous Deccan state within the late Mughal
  political order. The Nizams later ruled from Hyderabad, and the state joined the Indian Union in
  1948.
summaries:
  kids: The Nizams made a new state in the Deccan. Their court later moved to Hyderabad, the city from
    which the state takes its name.
  teen: Hyderabad developed through Mughal provincial offices and local political networks. Its
    relationship to the Company and then the British Crown changed over time.
region: Deccan
location:
  name: Hyderabad (later capital)
  lat: 17.39
  lon: 78.47
