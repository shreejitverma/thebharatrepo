names:
  en: Kingdom of Marwar (Jodhpur)
  iast: Mārvāṛa
  native: मारवाड़
summary: Rathor rule in Marwar developed at Mandore before Rao Jodha founded the fortified seat of
  Jodhpur in the fifteenth century. The house played a major role in Mughal politics and later ruled
  a princely state.
summaries:
  kids: Marwar's rulers moved their capital from Mandore to Jodhpur. They built Mehrangarh Fort on the
    hill overlooking the new city.
  teen: Jodhpur's Rathors remained regional rulers while prominent members of the house served at the
    Mughal court. The state's archives and material collections record the relationships that
    sustained their rule.
region: Western Rajasthan
