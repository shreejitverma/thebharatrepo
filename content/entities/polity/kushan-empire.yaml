id: polity.kushan-empire
type: polity
kind: polity
names:
  en: Kushan Empire
  iast: Kuṣāṇa Sāmrājya
  native: कुषाण साम्राज्य
summary: >-
  The Kushan Empire (c. 30-375 CE) was a major Eurasian realm founded in Bactria by Kujula Kadphises of the Kushan (Guishuang) branch of the Yuezhi confederacy and expanded across northern India under Vima Taktu, Vima Kadphises and Kanishka I. Ruling from summer and winter capitals including Purushapura (Peshawar), Kapisa and Mathura, the Kushans linked Silk Road trade with Indian Ocean ports, minted a standardized gold dinara coinage, and patronised both the Gandhara and Mathura sculptural schools.
summaries:
  kids: >-
    The Kushan Empire stretched from Central Asia across northern India to Mathura and the Gangetic plain, connecting the Silk Road with India and supporting grand art and monasteries.
  teen: >-
    Founded by Kujula Kadphises in the first century CE and reaching its zenith under Kanishka I (accession 127 CE), the Kushan Empire integrated Bactria, Gandhara and northern India into a trans-Asian commercial and religious network.
region: Bactria, Gandhara and Northern India (Peshawar, Taxila, Mathura and the Gangetic plain)
location: { name: "Mathura, Uttar Pradesh", lat: 27.492, lon: 77.673 }
