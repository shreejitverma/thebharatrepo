names:
  en: Awadh State
  native: अवध
summary: Awadh emerged as a hereditary successor state under Mughal governor Saadat Khan and his
  successors. Its court moved from Faizabad to Lucknow, and the East India Company annexed the state
  in 1856.
summaries:
  kids: The nawabs of Awadh made Lucknow their capital. The East India Company took over the state in
    1856.
  teen: Awadh's governors built hereditary power while retaining links to the Mughals. Company
    treaties and territorial transfers progressively limited its autonomy before annexation.
region: Middle Gangetic plain
