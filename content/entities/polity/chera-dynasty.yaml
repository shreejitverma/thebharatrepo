id: polity.chera-dynasty
type: polity
kind: polity
names:
  en: Chera Perumals of Makotai
  iast: Cēra
  native: சேரர்
summary: >-
  The Chera Perumals were a medieval dynasty that ruled much of present-day Kerala from Makotai
  (Mahodayapuram) in the Kodungallur region from about the ninth to the early twelfth century. They are
  known from inscriptions and charters distinct from the evidence for the early, Sangam-age Chera lineages,
  which are treated as a separate polity.
summaries:
  kids: >-
    The Chera Perumals were kings who ruled much of Kerala from a city near Kodungallur more than a thousand
    years ago. Stone and copper records tell us about them.
  teen: >-
    The medieval Perumals at Makotai are known from inscriptions and charters. They shared the Chera name
    with much earlier rulers of the Sangam age, but the two belong to different periods of political
    history.
region: Kerala
