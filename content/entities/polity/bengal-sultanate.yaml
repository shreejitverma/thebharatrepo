id: polity.bengal-sultanate
type: polity
kind: polity
names:
  en: Bengal Sultanate
  native: বাংলা সালতানাত
summary: >-
  The Bengal Sultanate coalesced in 1342, when Shamsuddin Ilyas Shah broke with Delhi. Ruled from Pandua and
  later Gaur by the Ilyas Shahi, Raja Ganesha's, Habshi and Husain Shahi houses, it issued an extensive
  silver coinage, developed a regional mosque architecture and patronised Persian and Bengali letters.
  After Sher Shah's conquest in 1538, Afghan rulers held Bengal until the Mughal victory of 1576.
summaries:
  kids: >-
    The sultans of Bengal ruled from cities including Pandua and Gaur. Their coins and mosques help
    historians learn about their kingdom.
  teen: >-
    Independent of Delhi from 1342, the Bengal Sultanate minted silver coins in its sultans' names,
    developed a distinctive mosque architecture and supported Bengali literature alongside Persian court
    culture. Later Afghan rulers held Bengal until Mughal armies defeated them in 1576.
region: Bengal delta and adjoining territories
location:
  name: Pandua (early capital)
  lat: 25.13
  lon: 88.15
datings:
  - method: documentary
    range:
      earliest: "1342"
      latest: "1576"
      precision: decade
      circa: true
    grade: B
    label: Period of rule
    sources:
      - src.eaton-1996-rise-of-islam-bengal-frontier
      - src.hussain-2003-bengal-sultanate
      - src.richards-1993-mughal-empire
    note: The first date marks Ilyas Shah's break with Delhi. The final date includes the Afghan Karrani
      phase and its defeat by the Mughals at Rajmahal in 1576.
  - method: documentary
    range:
      earliest: "1342"
      latest: "1538"
      precision: year
      circa: false
    grade: B
    label: Independent Bengal Sultanate before the Afghan age in Richard Eaton's periodisation
