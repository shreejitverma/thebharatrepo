claims:
  - text: Ilyas Shah established an independent court at Pandua in the mid-fourteenth century.
    grade: B
    sources:
      - src.eaton-1996-rise-of-islam-bengal-frontier
      - src.asher-talbot-2006-india-before-europe
  - text: Dated silver coins struck in the sultans' own names at mints across the delta document sovereign
      rule from the 1340s through the Husain Shahi period.
    grade: A
    sources:
      - src.hussain-2003-bengal-sultanate
      - src.eaton-1996-rise-of-islam-bengal-frontier
  - text: Sultans and nobles built mosques in a regional idiom, in brick and in stone facing, with curved
      cornices, as seen at the Adina, Eklakhi, Shat Gumbad and Choto Sona mosques.
    grade: B
    sources:
      - src.hasan-2007-sultans-and-mosques
      - src.asher-talbot-2006-india-before-europe
