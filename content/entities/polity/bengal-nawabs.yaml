id: polity.bengal-nawabs
type: polity
kind: polity
names:
  en: Nawabs of Bengal
summary: Bengal's nawabs developed hereditary power from Mughal provincial offices, with their court
  at Murshidabad. Company intervention after Plassey and the grant of revenue rights in 1765 ended
  the nawabs' effective fiscal autonomy.
summaries:
  kids: Bengal's nawabs ruled from Murshidabad. After the Battle of Plassey, the East India Company
    gained power over the region.
  teen: Murshid Quli Khan reorganised Bengal's administration and helped create a regional ruling
    group. The nawab's title survived after the Company secured the diwani in 1765.
region: Bengal, Bihar and Odisha
location:
  name: Murshidabad
  lat: 24.18
  lon: 88.27
