names:
  en: Mamluk Dynasties of Delhi
summary: The first phase of the Delhi Sultanate is often called Mamluk rule, after the military
  slave backgrounds of figures including Aybak and Iltutmish. The period included several ruling
  families and ended with the accession of Jalaluddin Khalji.
summaries:
  kids: The first sultans came from military households, including men who had once been enslaved. A
    later ruler, Iltutmish, made Delhi his centre of power.
  teen: The term Mamluk covers successive households, including those of Iltutmish and Balban. Their
    political authority grew from the institutions and military networks left by the Ghurids.
region: Delhi, Lahore and the northern subcontinent
