id: polity.sena-dynasty
type: polity
kind: polity
names:
  en: Sena Dynasty of Bengal
  iast: Sena
  native: সেন রাজবংশ
summary: >-
  The Sena dynasty ruled Bengal from the late eleventh to the early thirteenth century, displacing the Palas
  across most of the region. Its inscriptions describe the family as Brahma-Kshatriyas connected with
  Karnata, and Vijayasena, Ballalasena and Lakshmanasena patronised Brahmanical scholarship and Sanskrit
  poetry. After Bakhtiyar Khalji took Nadia around 1204, Sena kings continued to rule in eastern Bengal for
  some decades.
summaries:
  kids: >-
    After the Palas, the Sena kings ruled Bengal. Sanskrit poets and scholars worked at their court, and
    the family kept ruling eastern Bengal after losing Nadia.
  teen: >-
    The Deopara inscription supplies Vijayasena's genealogy. After the Turkic raid on Nadia around 1204,
    later charters show Sena kings still ruling in eastern Bengal.
region: Bengal and adjacent areas
location:
  name: Nadia (Navadvip, a late court centre)
  lat: 23.41
  lon: 88.37
datings:
