id: polity.utpala-dynasty
type: polity
kind: polity
names:
  en: Utpala Dynasty of Kashmir
  iast: Utpala
summary: The Utpalas succeeded the Karkotas in Kashmir with Avantivarman's accession in the
  mid-ninth century. Kalhana credits his reign with new temples and works on the Jhelum connected
  with the engineer Suyya.
summaries:
  kids: Avantivarman began a new ruling family in Kashmir. A later chronicle tells how Suyya helped
    control floods and improve farmland.
  teen: Kalhana associates Avantivarman's reign with temple building and changes to the Jhelum's water
    flow. His account remains a major source for the Utpala succession.
region: Kashmir Valley
location:
  name: Srinagar (capital region)
  lat: 34.09
  lon: 74.8
datings:
