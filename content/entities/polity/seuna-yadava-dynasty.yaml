    target: polity.chalukya-dynasty-of-kalyani
    note: The Seunas had been Kalyani Chalukya feudatories before independence.
  - kind: contemporary-of
    target: polity.hoysala-dynasty
    note: Rivals for the southern frontier of the Seuna kingdom.
  - kind: preceded
    target: polity.delhi-sultanate
    note: The Delhi Sultanate absorbed the Devagiri kingdom.
  - kind: related-to
    target: person.jnaneshwar
    note: The Jnaneshwari was completed under Seuna rule in 1290.
  - kind: related-to
    target: person.alauddin-khalji
    note: Alauddin's raid on Devagiri in 1296.
debate: Henige distinguishes the disputed sequence of early names from the better-attested Devagiri
  kingdom. Murthy and Verma also reconstruct Bhillama V's rise differently.
