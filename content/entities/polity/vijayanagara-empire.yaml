names:
  en: Vijayanagara Empire
  iast: Vijayanagara
  native: ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯ
summary: >-
  Vijayanagara emerged around the Tungabhadra under the Sangama brothers Harihara I and Bukka I. The
  conventional founding year is 1336, though the exact date is debated. Four successive dynasties, the
  Sangama, Saluva, Tuluva and Aravidu, ruled much of the peninsula, and after the defeat at Talikota in
  1565 the Aravidu court continued from Penukonda and Chandragiri until about the 1640s.
summaries:
  kids: >-
    Harihara and Bukka helped build a new kingdom by the Tungabhadra River. Its old capital is now the
    archaeological site of Hampi.
  teen: >-
    The conventional foundation year is 1336, though the fortified city may date from around 1340.
    Krishnadevaraya was its best-known ruler, and after the 1565 defeat at Talikota the court moved to
    other capitals while Nayaka governors grew autonomous.
region: Southern Deccan and peninsular India
location:
  name: Hampi (Vijayanagara, principal imperial capital)
  lat: 15.34
  lon: 76.46
datings:
  - method: scholarly-consensus
    range:
