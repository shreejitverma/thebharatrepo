claims:
  - text: Harihara and Bukka of the Sangama family were central to the foundation of Vijayanagara.
    grade: B
    sources:
      - src.stein-1989-vijayanagara
      - src.asher-talbot-2006-india-before-europe
  - text: Four dynasties, the Sangama, Saluva, Tuluva and Aravidu, ruled the empire in succession, and the
      Tuluva king Krishnadevaraya (r. 1509-1529) campaigned in the Raichur Doab and against the Gajapatis.
    grade: B
    sources:
      - src.stein-1989-vijayanagara
      - src.karashima-2014-concise-history-south-india
  - text: Military and provincial command relied on nayaka assignments, and the nayakas of Madurai, Thanjavur
      and Gingee became autonomous states after 1565.
    grade: B
    sources:
      - src.stein-1989-vijayanagara
      - src.narayanarao-1992-symbols-of-substance
  - text: In January 1565 a coalition of Deccan sultanates defeated Rama Raya at Talikota, after which the
      capital was abandoned and sacked, while the empire continued under rulers who held court elsewhere.
    grade: B
    sources:
      - src.stein-1989-vijayanagara
      - src.eaton-2005-social-history-deccan
  - text: "Burton Stein treats the foundation as a process: he places the beginning of the fortified capital around 1340, with royal power and the city developing over several years, about 1336 to 1346."
    grade: "C"
    sources:
      - "src.stein-1989-vijayanagara"
      - "src.asher-talbot-2006-india-before-europe"
