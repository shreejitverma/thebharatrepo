id: polity.kalachuri-dynasty-tripuri
type: polity
kind: polity
names:
  en: Kalachuris of Tripuri
  iast: Kalacuri
summary: The Kalachuris of Tripuri ruled parts of central India from a seat near modern Jabalpur.
  Their inscriptions, many dated in the Kalachuri-Chedi era, document the rise of rulers such as
  Gangeyadeva and Lakshmikarna.
summaries:
  kids: The Kalachuris ruled from Tripuri near the Narmada. Their stone and copper records often used
    a calendar era named after their house.
  teen: Tripuri's Kalachuris used dated grants and eulogies to record gifts and political claims.
    Their relationship to other Kalachuri houses requires separate evidence.
region: Dahala and the Narmada valley
location:
  name: Tewar (Tripuri)
  lat: 23.13
  lon: 79.79
