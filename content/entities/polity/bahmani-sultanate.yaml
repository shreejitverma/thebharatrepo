claims:
  - text: Alauddin Hasan Bahman Shah was proclaimed sultan in 1347 after the revolt of Deccan nobles against
      Muhammad bin Tughluq.
    grade: B
    sources:
      - src.sherwani-1953-bahmanis-of-deccan
      - src.eaton-2005-social-history-deccan
  - text: The Bahmani seat moved from Gulbarga to Bidar under Ahmad Shah I in the 1420s.
    grade: B
    sources:
      - src.eaton-2005-social-history-deccan
      - src.michell-1995-architecture-art-southern-india
  - text: Tension between long-settled Deccani nobles and newly arrived immigrants from Iran and Central Asia
      shaped Bahmani court politics and culminated in the execution of the minister Mahmud Gawan in 1481.
    grade: B
    sources:
      - src.eaton-2005-social-history-deccan
      - src.sherwani-1942-mahmud-gawan
  - text: Between about 1490 and 1527 the Bahmani state dissolved into the sultanates of Ahmadnagar, Berar,
      Bidar, Bijapur and Golconda.
    grade: B
