id: polity.bahmani-sultanate
type: polity
kind: polity
names:
  en: Bahmani Sultanate
  native: بهمنی
summary: >-
  The Bahmani Sultanate was founded in 1347, when Alauddin Hasan Bahman Shah, leading a revolt of Deccan
  nobles against Muhammad bin Tughluq, was proclaimed sultan at Daulatabad. Its court moved from Gulbarga
  to Bidar in the fifteenth century. After the execution of the minister Mahmud Gawan in 1481, provincial
  governors founded successor sultanates, while nominal sultans remained at Bidar until 1527.
summaries:
  kids: >-
    The Bahmani sultans ruled much of the Deccan, first from Gulbarga and then from Bidar. Later, their
    governors set up separate kingdoms of their own.
  teen: >-
    Created by a revolt against Delhi in 1347, the Bahmani state ruled parts of present-day Karnataka,
    Telangana and Maharashtra and fought Vijayanagara over the Raichur Doab. Rivalry among its nobles
    weakened it before it split into successor sultanates.
region: Northern and central Deccan
location:
  name: Gulbarga (first Bahmani capital)
  lat: 17.33
  lon: 76.83
datings:
  - method: documentary
    range:
      earliest: "1347"
      latest: "1527"
      precision: year
      circa: true
    grade: B
    label: Proclamation of Hasan Bahman Shah to the end of the nominal Bidar line
    sources:
      - src.sherwani-1953-bahmanis-of-deccan
