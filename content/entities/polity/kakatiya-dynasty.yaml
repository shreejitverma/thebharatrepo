    target: site.ramappa-temple
  - kind: succeeded
    target: polity.chalukya-dynasty-of-kalyani
    note: The Kakatiya chiefs had been Kalyani Chalukya feudatories before independence.
  - kind: preceded
    target: polity.tughlaq-dynasty
    note: Tughluq occupation replaced the Kakatiya court at Warangal.
