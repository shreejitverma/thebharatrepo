  native: अश्मक
summary: Assaka was a realm of the Godavari valley and the southern entry in the Buddhist list of
  sixteen great realms. Its literary capital, Potana, is conventionally identified with Bodhan, an
  identification that remains provisional.
summaries:
  kids: Assaka lay near the Godavari River. Its old capital, Potana, may have been where Bodhan stands
    today.
  teen: Assaka links the Buddhist political geography of the sixteen realms with the Deccan. The
    ancient name Potana can be placed on a map only provisionally.
region: Godavari valley, Deccan
