names:
  en: Sur Empire
summary: Sher Shah Suri founded an Afghan empire after defeating the Mughal ruler Humayun. Its
  administration is known for coinage and road infrastructure, and the main imperial line lost Delhi
  when Humayun returned in 1555.
summaries:
  kids: Sher Shah ruled northern India for several years. His government issued silver coins, and
    roads linked the places he ruled.
  teen: The Sur state interrupted Mughal rule in northern India. Persian histories and dated coins
    make it possible to compare its administrative legacy with later Mughal practice.
