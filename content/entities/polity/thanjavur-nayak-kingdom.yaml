id: polity.thanjavur-nayak-kingdom
type: polity
kind: polity
names:
  en: Thanjavur Nayak Kingdom
  iast: Tañcāvūr Nāyakkar
  native: தஞ்சாவூர் நாயக்கர்கள்
summary: >-
  The Thanjavur Nayak kingdom ruled the fertile Kaveri delta from c. 1532 to 1673 CE under Sevappa, Achutappa, Raghunatha, and Vijayaraghava Nayaka. Originally installed by Vijayanagara emperor Achyuta Deva Raya, the Thanjavur Nayaks stayed loyal to the Aravidu kings longer than Madurai, fostered an extraordinary multilingual renaissance of Telugu yakshagana, Tamil, and Sanskrit literature (with scholar-minister Govinda Dikshita and Venkatamakhin's Carnatic music theory), and founded the Sarasvati Mahal library before Ekoji established Maratha rule in 1676 CE.
summaries:
  kids: >-
    The Thanjavur Nayaks ruled the rich Kaveri delta in Tamil Nadu for 140 years, turning their court into a lively centre of Carnatic music, dance dramas, and the great Sarasvati Mahal library.
  teen: >-
    Appointed by Vijayanagara in 1532 CE, the Thanjavur Nayaks combined delta agrarian wealth and European coastal trade with brilliant patronage of Telugu, Tamil, and Sanskrit arts, culminating in Raghunatha Nayaka's court and Venkatamakhin's 72-melakarta music system.
region: Kaveri delta (Thanjavur and Nagapattinam districts), Tamil Nadu
location: { name: "Thanjavur, Tamil Nadu", lat: 10.78, lon: 79.13 }
