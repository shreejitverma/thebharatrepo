    note: Dated from Telugu chronicles, Nayaka inscriptions, and European factory records at Nagapattinam and Tranquebar; after Madurai troops killed Vijayaraghava in 1673 CE, Maratha general Ekoji (Venkoji) took Thanjavur in 1676 CE.
claims:
  - text: Under Raghunatha Nayaka (r. 1600-1634 CE) and his minister Govinda Dikshita, the Thanjavur court nurtured Telugu yakshagana drama, Sanskrit poetics, female scholar-poets such as Ramabhadramba and Madhuravani, and early Carnatic music theory codified by Venkatamakhin.
    grade: B
    sources:
      - src.vriddhagirisan-1942-nayaks-of-tanjore
      - src.narayanarao-1992-symbols-of-substance
  - text: The Thanjavur Nayaks assembled the core Sanskrit and regional manuscript collection that evolved into the Thanjavur Maharaja Serfoji's Sarasvati Mahal Library, and granted coastal trading privileges to the Portuguese, Danes (at Tranquebar, 1620), and Dutch.
    grade: B
    sources:
      - src.vriddhagirisan-1942-nayaks-of-tanjore
      - src.michell-1995-architecture-art-southern-india
