    note: Ahom buranjis document Kachari resistance from the 15th century and the sack of Dimapur in 1536; coins and inscriptions run through Maibang and Khaspur until British annexation of southern Cachar (1832) and northern Cachar (1854).
claims:
  - text: After Ahom forces sacked Dimapur in 1536 CE, the Dimasa rulers relocated their capital to Maibang in the North Cachar hills, where they issued silver coins and rock-cut inscriptions claiming Ghatotkacha descent.
    grade: B
    sources:
      - src.gait-1906-history-of-assam
      - src.shin-2019-descending-from-demons
  - text: The monumental carved sandstone V-pillars and cylindrical monoliths at Dimapur reflect indigenous Dimasa memorial-pillar traditions integrated with brick citadel architecture.
    grade: B
    sources:
      - src.sinha-1987-tribal-polities-northeast
      - src.choudhury-1985-archaeology-brahmaputra-valley
