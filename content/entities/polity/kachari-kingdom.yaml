id: polity.kachari-kingdom
type: polity
kind: polity
names:
  en: Kachari Kingdom
  native: ডিমাছা-কছাৰী ৰাজ্য
summary: >-
  The Kachari (Dimasa-Kachari) kingdom was a major medieval and early modern state of Assam and
  Nagaland, ruled successively from Dimapur on the Dhansiri River, Maibang in the North Cachar Hills,
  and Khaspur in the Barak (Cachar) plains. Known for the carved sandstone mushroom-pillars of Dimapur
  and Maibang's rock-cut temples, the kingdom endured until British annexations in 1832 and 1854 CE.
summaries:
  kids: >-
    The Kachari (Dimasa) kings built a remarkable stone capital at Dimapur with giant carved pillars,
    then moved into the hills at Maibang and later to Khaspur in Cachar before British annexation in
    the 1800s.
  teen: >-
    Rising in the Dhansiri valley before Ahom attacks forced moves to Maibang (1536) and later Khaspur
    (mid-18th century), the Dimasa-Kachari kingdom combined megalithic-style royal monuments with
    Sanskritic court traditions and coins.
region: Dhansiri valley (Dimapur), Dima Hasao (Maibang) and Cachar plains (Khaspur)
location: { name: "Dimapur / Maibang, Northeast India", lat: 25.912, lon: 93.726 }
datings:
  - method: documentary
    range: { earliest: 1200, latest: 1854, precision: decade, circa: true }
    grade: C
    label: Medieval emergence at Dimapur through Maibang and Khaspur to 1832/1854 annexation
    sources:
      - src.gait-1906-history-of-assam
      - src.shin-2019-descending-from-demons
