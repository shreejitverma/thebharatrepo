kind: polity
names:
  en: Jaintia Kingdom
  native: জয়ন্তীয়া ৰাজ্য
summary: >-
  The Jaintia kingdom was a matrilineal Khasi-Pnar and plains polity straddling the Jaintia Hills
  (Meghalaya) and the Surma valley plains around Jaintiapur (Sylhet, Bangladesh) from around 1500 to
  1835 CE. Ruled by the Syiem Sutnga lineage with a winter capital at Jaintiapur and a summer seat at
  Nartiang, it minted coins, patronised Shakta worship and stone megaliths, and was annexed by the
  British East India Company in 1835.
summaries:
  kids: >-
    Stretching between the cool Jaintia Hills in Meghalaya and the warm plains of Sylhet, the Jaintia
    Kingdom had a summer seat at Nartiang (famous for giant standing stones) and a winter capital at
    Jaintiapur until 1835.
  teen: >-
    Combining Pnar hill chieftainships with rice-producing plains in Sylhet, the Jaintia kings of the
    Sutnga clan followed matrilineal succession, maintained diplomacy with the Ahoms and Koch, and
    governed until British annexation in 1835.
region: Jaintia Hills (Meghalaya) and Jaintiapur (Sylhet, Bangladesh)
