id: polity.zamorins-of-calicut
type: polity
kind: polity
names:
  en: Zamorins of Calicut
  iast: Sāmūtiri
  native: കോഴിക്കോട് സാമൂതിരി
summary: >-
  The Zamorins (Samoothiri or Nediyiruppu Swaroopam) were the hereditary rulers of Kozhikode (Calicut) on Kerala's Malabar Coast from the post-Chera fragmentation of the 12th century until British annexation in 1792 CE. Transforming Calicut into one of the Indian Ocean's wealthiest pepper and spice emporia through maritime partnerships with Arab, Mappila, Chinese, and Gujarati merchants, the Zamorins presided over the Mamankam festival, resisted Portuguese naval supremacy throughout the 16th century with the Kunjali Marakkar admirals, and later fought Mysorean invasions.
summaries:
  kids: >-
    The Zamorins were the kings of Calicut in Kerala, who grew wealthy from sea trade in black pepper and spices and fought long sea battles against the Portuguese in the 1500s.
  teen: >-
    Emerging after the Chera Perumal kingdom broke up in the 12th century, the Zamorins made Calicut a cosmopolitan Indian Ocean spice hub and spearheaded century-long maritime resistance to Portuguese fleets alongside the Kunjali Marakkars.
region: Northern Kerala (Malabar Coast, centered on Kozhikode / Calicut)
location: { name: "Kozhikode (Calicut), Kerala", lat: 11.25, lon: 75.78 }
datings:
  - method: documentary
    range: { earliest: "1150 CE", latest: "1792 CE", precision: decade, circa: true }
    grade: C
    label: Post-Perumal rise in Malabar to East India Company pensioning (1792 CE)
    sources:
