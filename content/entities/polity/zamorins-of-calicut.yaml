    note: The Zamorins emerged from Eranad chiefs in the wake of Chera Perumal dissolution in the 12th century, hosted Ibn Battuta (1340s) and Vasco da Gama (1498), fell to Mysorean conquest in 1766 CE, and surrendered sovereignty to the British after 1792 CE.
claims:
  - text: Calicut under the Zamorins functioned as an open Indian Ocean free port frequented by Arab, Mappila, Jewish, Gujarati, and Chinese Ming fleets (including Zheng He's expeditions), famous for fair customs administration.
    grade: B
    sources:
      - src.krishnaayyar-1938-zamorins-of-calicut
      - src.subrahmanyam-1997-career-legend-vasco-da-gama
  - text: After Vasco da Gama's 1498 arrival and subsequent Portuguese attempts to monopolise the spice trade, the Zamorins and their hereditary Muslim naval commanders (the Kunjali Marakkars) waged prolonged warfare against the Estado da India.
    grade: A
    sources:
      - src.subrahmanyam-1997-career-legend-vasco-da-gama
      - src.menon-2007-survey-of-kerala-history
  - text: The Zamorin court patronised Sanskrit and Malayalam learning, including the Revathi Pattathanam scholarly assembly at Tali temple and the royal Krishna devotional drama Krishnanattam.
    grade: B
    sources:
      - src.krishnaayyar-1938-zamorins-of-calicut
      - src.menon-2007-survey-of-kerala-history
