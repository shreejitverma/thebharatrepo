names:
  en: Chaulukya Dynasty of Gujarat (Solanki)
  iast: Caulukya
summary: The Chaulukyas, or Solankis, ruled Gujarat from Anahilapataka, modern Patan. The line
  begins with Mularaja in historical reconstructions, and its later rulers included Jayasimha
  Siddharaja and Kumarapala.
summaries:
  kids: The Solankis made Patan their capital. Inscriptions and Jain books preserve stories and
    records about their rulers.
  teen: The Chaulukyas of Gujarat built their power around Anahilapataka. Royal inscriptions and Jain
    writings help reconstruct their court, including the association of Hemachandra with Kumarapala.
region: Gujarat and adjacent western India
location:
  name: Patan (Anahilapataka)
  lat: 23.85
  lon: 72.12
