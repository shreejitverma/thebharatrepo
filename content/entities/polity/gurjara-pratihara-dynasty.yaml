      - src.thapar-2002-early-india
    note: The range covers the imperial line from the early Nagabhata to the decline of its Kannauj
      court.
claims:
  - text: The eulogy of Mihira Bhoja at Gwalior gives a genealogy of the Pratihara ruling line and
      records claims about its early kings.
    grade: A
    sources:
