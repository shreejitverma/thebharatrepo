names:
  en: Gurjara-Pratihara Dynasty
  iast: Gurjara-Pratīhāra
summary: The Gurjara-Pratiharas rose in western India and made Kannauj a seat of power under
  Nagabhata II. Their inscriptions and those of rival dynasties trace a long struggle for influence
  across northern India.
summaries:
  kids: The Pratiharas began in western India and later ruled from Kannauj. Stone and copper records
    tell us about their rulers and their rivals.
  teen: The Pratiharas, Palas and Rashtrakutas competed for influence around Kannauj. Reading records
    from all three houses helps historians compare their claims.
region: Western and northern India
location:
  name: Kannauj (imperial seat)
  lat: 27.05
  lon: 79.92
datings:
  - method: scholarly-consensus
    range:
      earliest: "725"
      latest: "1030"
