id: polity.mughal-empire
type: polity
kind: polity
names:
  en: Mughal Empire
  iast: Gūrkāniyān
  native: گورکانیان
summary: The Mughal Empire was a Persianate imperial polity founded by Babur in
  1526. The British captured its last emperor, Bahadur Shah II, during the 1857
  revolt and tried and exiled him in 1858, formally ending the dynasty.
summaries:
  kids: The Mughal Empire ruled large parts of South Asia for several centuries,
    but its borders and strength changed over time.
  teen: Mughal rule began under Babur and expanded under later emperors. Regional
    powers and changing imperial authority shaped its long history.
datings:
  - method: scholarly-consensus
    range:
      earliest: "1526"
      latest: "1858"
      precision: year
      circa: false
    grade: B
    label: Historical scholarship
    sources: &a1
      - src.richards-1993-mughal-empire
      - src.asher-talbot-2006-india-before-europe
      - src.metcalf-2012-concise-history-modern-india
claims:
  - text: Babur founded the Mughal Empire in 1526. Mughal rule formally ended in
      1858 after the trial of the last emperor, Bahadur Shah II, who was sent into
      exile in Rangoon.
    grade: B
    sources: *a1
