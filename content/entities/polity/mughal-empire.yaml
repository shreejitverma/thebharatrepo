names:
  en: Mughal Empire
summary: The Mughal Empire was a Persianate imperial polity founded by Babur in
  1526. British forces captured Delhi in 1857, and the dynasty ended with Bahadur Shah II’s trial and exile in 1858. Its extent and governing
  structures changed considerably over time.
summaries:
  kids: The Mughal Empire ruled large parts of South Asia for several centuries,
    but its borders and strength changed over time.
  teen: Mughal rule began under Babur and expanded under later emperors. Regional
    powers and changing imperial authority shaped its long history.
