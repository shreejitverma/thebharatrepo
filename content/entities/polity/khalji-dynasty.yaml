id: polity.khalji-dynasty
type: polity
kind: polity
names:
  en: Khalji Dynasty
summary: The Khalji line began with Jalaluddin in 1290 and expanded under Alauddin. The dynasty's
  rulers defended northern India against Mongol incursions and extended Delhi's power toward
  Gujarat, Rajasthan and the Deccan.
summaries:
  kids: The Khaljis ruled from Delhi. Under Alauddin their armies reached lands far to the south, and
    they fought against Mongol incursions.
  teen: Khalji campaigns extended Delhi's reach in several directions. The direct annexation of some
    regions differed from arrangements for tribute in parts of the Deccan.
region: Delhi, north India and tributary territories in the Deccan
location:
  name: Delhi (including Siri under Alauddin)
  lat: 28.55
  lon: 77.21
datings:
  - method: documentary
    range:
      earliest: "1290"
      latest: "1320"
      precision: year
      circa: false
    grade: B
