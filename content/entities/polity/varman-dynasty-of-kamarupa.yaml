id: polity.varman-dynasty-of-kamarupa
type: polity
kind: polity
names:
  en: Varman Dynasty of Kamarupa
  iast: Varman
  native: বৰ্মণ বংশ
aliases:
  - polity.varman-dynasty-kamarupa
summary: >-
  The Varmans were the earliest known historical ruling house of Kamarupa in the Brahmaputra valley, from
  about the mid-fourth to the mid-seventh century. Their copper-plate charters trace a line from Pushyavarman
  to Bhaskaravarman, the ally of Harsha whom Xuanzang met, and Samudragupta's Allahabad inscription names
  Kamarupa as a frontier realm in this period.
summaries:
  kids: >-
    The Varman kings ruled in the Brahmaputra valley of Assam. Records on copper and a Chinese traveller's
    account tell us about their last great king, Bhaskaravarman.
  teen: >-
    Samudragupta's inscription names Kamarupa as a frontier realm. Seventh-century Varman copper plates give
    a royal genealogy of about twelve generations and record grants of land to Brahmins.
region: Brahmaputra valley (Assam) and neighbouring areas
location:
  name: Guwahati (area of Pragjyotishapura)
  lat: 26.18
  lon: 91.74
datings:
  - method: epigraphic
    range:
      earliest: "340"
      latest: "655"
      precision: decade
      circa: true
    grade: B
    label: Varman genealogy anchored by Gupta and seventh-century synchronisms
    sources:
      - src.konow-1913-epigraphia-indica-vol12
      - src.shin-2022-bhauma-to-varaha-kamarupa
      - src.singh-2008-ancient-early-medieval-india
    note: The start is reconstructed from the later genealogy and the Gupta-period attestation of Kamarupa.
