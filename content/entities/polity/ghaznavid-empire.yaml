id: polity.ghaznavid-empire
type: polity
kind: polity
names:
  en: Ghaznavid Empire
summary: The Ghaznavid dynasty gained power at Ghazni under Sabuktigin and expanded under Mahmud.
  Its later rulers made Lahore a principal seat after losing much of their western territory. The
  Ghurids took Lahore in 1186.
summaries:
  kids: The Ghaznavids first ruled from Ghazni and later from Lahore. The Ghurids captured Lahore in
    1186.
  teen: Sabuktigin established the durable ruling line. Coinage and Persian histories track its
    expansion under Mahmud and its later shift toward the Punjab.
region: Afghanistan, eastern Iran and northwestern South Asia
