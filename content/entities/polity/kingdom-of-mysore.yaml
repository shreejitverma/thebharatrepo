names:
  en: Kingdom of Mysore
  iast: Maisūru
  native: ಮೈಸೂರು ಸಂಸ್ಥಾನ
aliases:
  - polity.mysore-kingdom
summary: >-
  Mysore grew from a Vijayanagara feudatory into southern Karnataka's leading state under the Wodeyars,
  whose court tradition dates the dynasty to 1399. Raja Wodeyar took Srirangapatna in 1610, and Chikka
  Devaraja Wodeyar centralised its administration. Haidar Ali and Tipu Sultan held power from 1761 to 1799
  and fought four wars with the East India Company, after which the Wodeyars were restored over a reduced
  princely state that acceded to India in 1947.
summaries:
  kids: >-
    The Wodeyar family ruled Mysore for centuries, except for about forty years when Haidar Ali and Tipu
    Sultan held power. The kingdom later became a princely state and then part of India.
  teen: >-
    Mysore expanded under the Wodeyars and changed under Haidar and Tipu, who fought the Company in four
    wars. Its defeat in 1799 led to a smaller princely state under British paramountcy, which acceded to
    India in 1947.
region: Southern Karnataka and parts of the southern Deccan
