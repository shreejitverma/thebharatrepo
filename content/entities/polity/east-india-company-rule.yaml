id: polity.east-india-company-rule
type: polity
kind: polity
names:
  en: East India Company Rule in India
summary: >-
  The English East India Company grew from a chartered trading corporation into a territorial government
  through war, grants and treaties. Plassey in 1757 and the diwani of Bengal, Bihar and Orissa in 1765
  marked decisive stages, and after the revolt of 1857 the Government of India Act 1858 transferred its
  governing powers to the British Crown.
summaries:
  kids: >-
    The East India Company began by trading. Over time it took control of large areas and collected taxes
    there. In 1858 the British Crown took over its governing powers.
  teen: >-
    The Company already exercised powers in several settlements before Plassey. Its reach expanded after
    1757 and the grant of revenue rights in 1765, while Parliament increased its oversight before Crown
    rule replaced it in 1858.
region: Bengal and expanding territories across the Indian subcontinent
location:
  name: Kolkata (Fort William, seat of the governor-general)
  lat: 22.56
  lon: 88.34
