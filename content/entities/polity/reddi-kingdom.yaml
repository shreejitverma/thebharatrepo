id: polity.reddi-kingdom
type: polity
kind: polity
names:
  en: Reddi Kingdom of Kondavidu and Rajahmundry
  iast: Reḍḍi
  native: రెడ్డి రాజ్యము
summary: >-
  The Reddi kingdom ruled coastal Andhra Pradesh from Addanki, Kondavidu, and later Rajahmundry from roughly 1325 to 1448 CE. Founded by Prolaya Vema Reddi - a former Kakatiya commander and ally of the Musunuri Nayakas - the dynasty secured coastal maritime trade through Motupalli, built hill forts, and sponsored a major efflorescence of Telugu and Sanskrit literature led by court poets Errapragada and Srinatha before succumbing to Vijayanagara and Gajapati expansion.
summaries:
  kids: >-
    The Reddi kings ruled coastal Andhra Pradesh from hill forts like Kondavidu in the 1300s and 1400s, protecting sea ports and rewarding celebrated Telugu poets like Srinatha.
  teen: >-
    Founded by Prolaya Vema Reddi after the Kakatiya collapse, the Reddi kingdoms of Kondavidu and Rajahmundry rebuilt coastal Andhra trade and fostered a golden age of Telugu poetry under Errapragada and Srinatha.
region: Coastal Andhra (Guntur, Prakasam, Krishna, and East Godavari districts), Andhra Pradesh
location: { name: "Kondavidu, Andhra Pradesh", lat: 16.26, lon: 80.26 }
datings:
