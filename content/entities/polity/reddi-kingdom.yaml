    note: Inscriptions track Prolaya Vema Reddi's rise in the 1320s, Kumaragiri's split with the Rajahmundry branch around 1395-1402 CE, Kondavidu's fall to Vijayanagara and Recherla chiefs around 1420-1424 CE, and the fall of Rajahmundry to Kapilendra Gajapati by 1448 CE.
claims:
  - text: Prolaya Vema Reddi renewed Kakatiya-era commercial guarantees at the port of Motupalli and built rock steps to shrines at Srisailam and Ahobilam.
    grade: B
