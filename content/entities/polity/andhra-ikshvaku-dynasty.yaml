names:
  en: Andhra Ikshvaku Dynasty
  iast: Ikṣvāku
summary: The Andhra Ikshvakus ruled at Vijayapuri after the decline of Satavahana authority in the
  lower Krishna valley. Inscriptions from Nagarjunakonda record royal sacrifices and Buddhist gifts
  made by members of the court and other donors.
summaries:
  kids: At Vijayapuri, the Ikshvakus left records on stone. Some honour kings, and others describe
    gifts to Buddhist shrines.
  teen: Dated by regnal years, the Vijayapuri inscriptions help reconstruct the Ikshvaku succession.
    Records of donors show how the court was connected to Buddhist institutions.
region: Lower Krishna valley, Andhra Pradesh
location:
  name: Nagarjunakonda (ancient Vijayapuri area)
  lat: 16.52
  lon: 79.24
datings:
