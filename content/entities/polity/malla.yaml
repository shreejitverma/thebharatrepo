names:
  en: Malla
  iast: Malla
  native: मल्ल
summary: Malla was a clan-based polity associated with Kushinara and Pava. The Mahaparinibbana Sutta
  treats the Mallas of those two centres as distinct groups in its account of the division of the
  Buddha's relics.
summaries:
  kids: People called the Mallas lived in towns including Kushinara. An old Buddhist book tells how
    they cared for the Buddha's remains.
  teen: Kushinara and Pava appear as separate Malla centres in the Buddhist account of the Buddha's
    final journey and the distribution of his relics.
region: Eastern Uttar Pradesh and the Himalayan foothill plain
