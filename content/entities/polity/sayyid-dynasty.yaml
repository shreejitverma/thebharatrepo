names:
  en: Sayyid Dynasty of Delhi
summary: The Sayyids ruled Delhi from Khizr Khan's seizure of the city in 1414 to the accession of
  Bahlul Lodi in 1451. Their authority was more regional than that of the Tughlaqs at their height.
summaries:
  kids: Khizr Khan and his successors ruled Delhi after the Tughlaqs. They competed with other rulers
    in nearby regions.
  teen: The Sayyids held Delhi in a period of strong regional powers. The Tarikh-i Mubarak Shahi is an
    important contemporary source for the early decades of their rule.
