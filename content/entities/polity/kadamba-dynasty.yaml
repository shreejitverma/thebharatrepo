summary: >-
  The early Kadambas ruled from Banavasi (Vaijayanti) in western Karnataka from about the mid-fourth to the
  mid-sixth century, when the Badami Chalukyas absorbed the region; later Kadamba branches ruled at Hangal
  and Goa. Founded according to their own inscriptions by Mayurasharma after a break with the Pallavas, the
  dynasty formed marriage ties with other royal houses, including the Guptas, and the Halmidi inscription, generally
  regarded as the earliest known Kannada inscription, is attributed to their period.
summaries:
  kids: >-
    The Kadambas ruled from Banavasi in Karnataka. Pillars carved with writing tell us about their family,
    and one stone from their time is thought to be the oldest known record in Kannada.
  teen: >-
    The Talagunda pillar tells the dynasty's story about Mayurasharma. Kakusthavarman's inscription records
    marriage ties with other royal houses, and the Gudnapur inscription records temple building and the land that supported
    it.
