    note: The Shatapatha Brahmana (1.4.1) portrays Videha east of the Sadanira (Gandak) as newly Sanskritised, while the Brihadaranyaka Upanishad centres on Janaka of Videha prior to the sixth-century BCE rise of the Vajji confederacy.
claims:
  - text: The Shatapatha Brahmana narrates the eastward movement of sacrificial fire under Videgha Mathava across the Sadanira River (identified with the Gandak) into Videha.
    grade: A
    sources:
      - src.witzel-1997-early-sanskritization-kuru
      - src.eggeling-1882-satapatha-brahmana-part-1
  - text: Early Buddhist texts indicate that the Videhan monarchy had dissolved by the sixth century BCE, when the Videhas functioned as a constituent clan of the Vajji confederacy.
    grade: B
