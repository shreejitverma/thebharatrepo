id: polity.videha
type: polity
kind: polity
names:
  en: Videha
  iast: Videha
  native: विदेह
summary: >-
  Videha (centred on Mithila in northern Bihar and adjacent southern Nepal, east of the Gandak or
  Sadanira River) was a major late Vedic kingdom and philosophical centre featured in the Shatapatha
  Brahmana and Brihadaranyaka Upanishad. Remembered for King Janaka and the sage Yajnavalkya, the
  Videha monarchy later gave way to a republican clan within the Vajji confederacy.
summaries:
  kids: >-
    East of the Gandak River in northern Bihar lay Videha, the kingdom of Mithila. Ancient Sanskrit
    texts tell of debates on wisdom held at the court of King Janaka and the sage Yajnavalkya.
  teen: >-
    Located in Mithila in north Bihar beyond Magadha, Videha represents the eastern frontier of late
    Vedic Brahmanical culture in the Shatapatha Brahmana and Upanishads before becoming part of the
    Vajji republic.
region: North Bihar (Mithila) and southeastern Nepal Terai
location: { name: "Mithila (Darbhanga-Janakpur zone), North Bihar", lat: 26.154, lon: 85.892 }
datings:
  - method: textual-internal
    range: { earliest: "900 BCE", latest: "550 BCE", precision: century, circa: true }
    grade: C
    label: Late Vedic Brahmana and early Upanishadic horizon
    sources:
      - src.witzel-1997-early-sanskritization-kuru
