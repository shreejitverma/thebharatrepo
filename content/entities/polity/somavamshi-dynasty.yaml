id: polity.somavamshi-dynasty
type: polity
kind: polity
names:
  en: Somavamshi Dynasty
  iast: Somavaṃśī
  native: ସୋମବଂଶୀ ରାଜବଂଶ
summary: >-
  The Somavamshi (Somavamsi) dynasty ruled Dakshina Kosala (western Odisha and Chhattisgarh) before
  expanding eastward across coastal Utkala in the tenth and eleventh centuries CE, uniting much of
  Odisha. Great patrons of Shaivism and Sanskrit copper-plate administration, rulers such as Yayati II
  and Uddyotakeshari oversaw major phases of temple architecture at Bhubaneswar, including the
  Brahmeshvara and Lingaraja temples.
summaries:
  kids: >-
    The Somavamshi kings united western and coastal Odisha over 900 years ago and helped build many
    of Bhubaneswar's great stone Shiva temples, including the famous Lingaraja Temple.
  teen: >-
    Originating in Dakshina Kosala, the Somavamshi kings absorbed Bhaumakara territory in coastal
    Odisha and patronised mature Kalinga-style temples in Bhubaneswar before yielding to the Eastern
    Gangas around 1112 CE.
region: Dakshina Kosala and Utkala (Odisha)
location: { name: "Bhubaneswar, Odisha", lat: 20.238, lon: 85.834 }
