    note: Early charters are dated in the Ganga era, whose epoch is placed around 496 to 498. The imperial
      phase ran from Chodaganga's accession in 1078 until Kapilendra Deva took power in 1434 to 1435. The
      continuity between the early and imperial lines rests on their own genealogies.
claims:
  - text: Anantavarman Chodaganga (r. 1078-1147) annexed central Odisha from the Somavamshis and began the
      Jagannath temple at Puri.
    grade: B
    sources:
      - src.rao-1991-kalinga-eastern-gangas
      - src.eschmann-2014-cult-of-jagannatha
  - text: Around 1230, Anangabhima III declared himself the deputy (rauta) of Purushottama-Jagannath,
      presenting the deity as the kingdom's sovereign.
    grade: B
    sources:
