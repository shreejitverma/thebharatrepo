      - src.eschmann-2014-cult-of-jagannatha
  - text: The thirteenth-century Konark Sun Temple is associated with the Eastern Ganga ruler Narasimhadeva
      I (r. 1238-1264), who also campaigned against the Muslim governors of Bengal.
    grade: B
    sources:
