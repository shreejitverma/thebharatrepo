id: polity.eastern-ganga-dynasty
type: polity
kind: polity
names:
  en: Eastern Ganga Dynasty
  iast: Gaṅga
  native: ପୂର୍ବ ଗଙ୍ଗ ବଂଶ
summary: >-
  The Eastern Gangas ruled Kalinga from around the sixth century, dating their charters in their own Ganga
  era, and rose to power over all of Odisha after Anantavarman Chodaganga (r. 1078-1147) overcame the
  Somavamshis. Later kings, including Anangabhima III and Narasimhadeva I, tied their kingship to the cult
  of Jagannath at Puri and built the Sun Temple at Konark, until Kapilendra Deva founded the Gajapati line
  in 1434 to 1435.
summaries:
  kids: >-
    The Eastern Ganga kings ruled Odisha for centuries. Their dynasty built the Jagannath Temple at Puri
    and the Sun Temple at Konark, which is shaped like a giant chariot.
  teen: >-
    Early Eastern Ganga kings ruled Kalinga and counted years in their own Ganga era. Anantavarman
    Chodaganga unified Odisha, and his successors presented Jagannath as the kingdom's true sovereign.
region: Kalinga and coastal Odisha
location:
  name: Cuttack (later royal seat)
  lat: 20.48
  lon: 85.88
datings:
  - method: epigraphic
    range:
      earliest: "498"
      latest: "1435"
      precision: decade
      circa: true
    grade: B
    label: Ganga-era charters to the accession of Kapilendra Deva
    sources:
      - src.rajaguru-1958-inscriptions-of-orissa
      - src.kulke-1993-kings-and-cults
