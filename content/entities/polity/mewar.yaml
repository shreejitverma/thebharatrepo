names:
  en: Kingdom of Mewar
  iast: Mevāṛa
  native: मेवाड़
summary: Mewar developed from the Guhila polity, with its Sisodia line rising to power at Chittor
  under Hammir. The Mewar court later ruled from Udaipur and continued as a princely state until
  integration into Rajasthan in 1948.
summaries:
  kids: Mewar's rulers held the fort of Chittor and later made Udaipur their capital. Forts and
    palaces still show where they governed.
  teen: Mewar took shape over centuries under the Guhilas and Sisodias. Udaipur continued as the
    court's capital through changing relationships with the Mughals and the British.
region: Southern Rajasthan
