summary: Anga lay east of Magadha in the middle Ganga valley, with its principal city at Champa near
  present-day Bhagalpur. Historical reconstructions place its annexation under the Magadhan king
  Bimbisara.
summaries:
  kids: Anga was a kingdom near the Ganga. Its main city, Champa, stood near today's Bhagalpur.
  teen: Anga was one of Magadha's eastern neighbours. Buddhist accounts connect its loss of
    independence with Bimbisara's expansion, whose dates remain approximate.
