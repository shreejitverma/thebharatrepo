names:
  en: Second Battle of Panipat
summary: In 1556, forces serving the young Mughal emperor Akbar defeated Hemu at Panipat. The
  victory reversed Hemu's recent capture of Delhi and secured the Mughal recovery of the city.
summaries:
  kids: Hemu had taken Delhi. Akbar's army defeated him at Panipat, and the Mughals took back the
    city.
  teen: After Humayun's death, Hemu seized Delhi and challenged the position of the teenage Akbar.
    The Mughal victory under Bairam Khan restored their hold on Delhi.
region: Panipat, present-day Haryana
