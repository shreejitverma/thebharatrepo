id: event.matsya-flood-narrative
type: event
kind: dharma
names:
  en: Matsya Flood Narrative (Manu and the Great Deluge)
  iast: Matsya-kathā
  native: मत्स्यकथा
summary: >-
  The story of Manu and the fish that saves him from a great flood is first known from the Vedic prose of
  the Shatapatha Brahmana (1.8.1.1-10). The Mahabharata (3.185) retells it with the fish revealed as
  Brahma Prajapati, and the Puranas make the fish Matsya, the first avatar of Vishnu. Its Puranic placement
  at the start of the present manvantara is traditional cosmology.
summaries:
  kids: >-
    In one of India's oldest stories, Manu looks after a tiny fish that grows huge, warns him of a great
    flood, and pulls his boat to safety on a northern mountain. Later stories say the fish was Vishnu.
  teen: >-
    The Shatapatha Brahmana, a Vedic prose text of roughly the 8th to 6th centuries BCE, gives the earliest
    known Indian flood story. The Mahabharata and Puranas retell it, and in the Puranas the fish becomes
    Matsya, Vishnu's first avatar, saving Manu, the Seven Sages and the seeds of life.
datings:
  - method: traditional-puranic
    range:
      earliest: "120531102 BCE"
      latest: "120531102 BCE"
      precision: cosmological
      circa: false
    grade: D
    label: Puranic placement at the opening of the Vaivasvata manvantara
    sources:
      - src.dimmitt-vanbuitenen-1978-classical-hindu-mythology
      - src.rocher-1986-puranas
    note: >-
      Puranic retellings set the deluge at the junction before the present (Vaivasvata) manvantara, from
      which Manu emerges as its progenitor; counted back from the Kali epoch this is 120,528,000 years before
      3102 BCE. Some retellings instead tie it to the dissolution at the end of the previous kalpa.
claims:
  - text: >-
      Shatapatha Brahmana 1.8.1.1-10 tells how Manu rears a small fish that warns him of a flood; Manu builds
      a ship, which the grown fish draws to the northern mountain, and after the waters recede he
      regenerates his line through sacrifice and his daughter Ida.
    grade: A
    sources:
      - src.eggeling-1882-satapatha-brahmana-part-1
  - text: >-
      In the Mahabharata (3.185) the rescuing fish reveals itself as Brahma Prajapati, whereas in the Matsya,
      Agni and Bhagavata Puranas it is Matsya, the first avatar of Vishnu.
    grade: B
    sources:
      - src.brockington-1998-sanskrit-epics
      - src.dimmitt-vanbuitenen-1978-classical-hindu-mythology
      - src.rocher-1986-puranas
  - text: >-
      The late Brahmana prose of the Shatapatha Brahmana, which contains the flood episode, is usually placed
      in roughly the 8th to 6th centuries BCE; this dates the earliest known telling, not any flood.
    grade: C
    sources:
      - src.eggeling-1882-satapatha-brahmana-part-1
      - src.flood-2003-blackwell-companion-hinduism
