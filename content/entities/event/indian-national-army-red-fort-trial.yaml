names:
  en: Indian National Army trial at the Red Fort
summary: The British Indian Army brought three Indian National Army officers before a court
  martial at Delhi's Red Fort in November 1945. The trial drew wide public support for the
  defendants and intensified debate over military loyalty and colonial authority.
summaries:
  kids: Three officers who had fought for the Indian National Army were put on trial. Many people
    protested and supported them.
  teen: The defence argued that the officers had served a government entitled to fight for Indian
    independence. Public attention turned a military prosecution into a broader dispute over the
    legitimacy of British rule.
