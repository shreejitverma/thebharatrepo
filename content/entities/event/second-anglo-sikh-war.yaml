names:
  en: Second Anglo-Sikh War
summary: An uprising at Multan in 1848 grew into a wider war between the East India Company and
  Sikh forces. The Company annexed the Punjab after its victory in 1849, ending the Lahore
  kingdom.
summaries:
  kids: Fighting at Multan spread across the Punjab. After winning the war, the Company took
    control of the Sikh kingdom.
  teen: The Multan uprising broadened into a conflict that included Chillianwala and Gujrat. After
    the Sikh forces surrendered, the Company deposed the young maharaja Duleep Singh and annexed
    Punjab.
region: Punjab, including Multan and Gujrat in present-day Pakistan
