    range: { earliest: "1970", latest: "1996", precision: year, circa: false }
    grade: A
    label: "Three programme phases"
    sources: ["src.nddb-operation-flood"]
    note: "The National Dairy Development Board records the launch in 1970 and the closing year of phase III as 1996."
claims:
  - text: "The programme developed a national milk grid to connect producing regions with consumers in towns and cities."
    grade: A
    sources: ["src.nddb-operation-flood"]
  - text: "Phase I was financed through the sale of donated skimmed milk powder and butter oil supplied through the World Food Programme."
    grade: A
