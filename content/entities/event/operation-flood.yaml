names:
  en: "Operation Flood"
summary: "The National Dairy Development Board launched Operation Flood in 1970. The programme linked village dairy cooperatives to urban markets and expanded milk collection, processing and distribution through three phases ending in 1996."
summaries:
  kids: "Operation Flood helped dairy farmers form cooperatives, or groups that worked together, to collect and sell milk to people in cities."
  teen: "Operation Flood built a network between village dairy cooperatives and urban markets. Its first phase used proceeds from donated milk powder and butter oil to support development of the dairy system."
region: "India"
