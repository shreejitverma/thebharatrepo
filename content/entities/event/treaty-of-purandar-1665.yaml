names:
  en: Treaty of Purandar (1665)
summary: Shivaji negotiated with the Mughal commander Mirza Raja Jai Singh during the siege of
  Purandar. The 1665 agreement ceded forts to the Mughals and allowed Shivaji to retain others.
summaries:
  kids: When a Mughal army surrounded Purandar, Shivaji made an agreement. He gave up some forts
    and kept others.
  teen: Jai Singh negotiated from a position of military strength. The terms reduced Shivaji's
    control of forts and brought his son Sambhaji into Mughal service.
region: Purandar, present-day Maharashtra
