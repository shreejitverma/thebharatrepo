id: event.gandhi-irwin-pact
type: event
kind: event
names:
  en: Gandhi-Irwin Pact
summary: In March 1931 Gandhi and Viceroy Lord Irwin reached an agreement under which Congress
  suspended civil disobedience and agreed to attend the next Round Table Conference. The
  government agreed to release prisoners convicted of offences unconnected with violence.
summaries:
  kids: Gandhi and the viceroy agreed to pause the protests and hold talks. The government agreed
    to free many people who had been jailed.
  teen: The agreement offered limited concessions, including release of qualifying prisoners and
    some local salt-making. In return, Congress suspended civil disobedience and took part in
    renewed constitutional talks.
