names:
  en: Khilafat movement in India
summary: Indian Khilafat organisers mobilised after the First World War to protect the standing
  of the Ottoman caliph. They joined forces with Gandhi's Non-Cooperation Movement, and the
  campaign lost its object when Turkey abolished the caliphate in 1924.
summaries:
  kids: Indian Muslims organised to defend the position of the Ottoman caliph, an important
    religious leader. For a time they joined Gandhi's campaign against British rule.
  teen: The Khilafat campaign joined a dispute about the postwar settlement of the Ottoman Empire
    with Indian anti-colonial politics. Its alliance with Congress helped broaden
    Non-Cooperation.
region: British India and the former Ottoman Empire
