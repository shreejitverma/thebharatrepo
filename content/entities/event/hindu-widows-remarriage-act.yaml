id: event.hindu-widows-remarriage-act
type: event
kind: event
names:
  en: Hindu Widows' Remarriage Act, 1856
  native: হিন্দু বিধবা পুনর্বিবাহ আইন, ১৮৫৬
summary: >-
  Act XV of 1856 (the Hindu Widows' Remarriage Act), enacted on 26 July 1856 by the Legislative
  Council of India, legalised the remarriage of Hindu widows across East India Company territories.
  The legislation was the culmination of an intensive Bengali petition and Sanskritic textual
  campaign led by Sanskrit College principal Ishwar Chandra Vidyasagar in 1855.
summaries:
  kids: >-
    Passed in 1856 after a tireless campaign by Bengali scholar Ishwar Chandra Vidyasagar, this law
    made it legal for Hindu widows to marry again if they wished.
  teen: >-
    Enacted on 26 July 1856, Act XV legalised Hindu widow remarriage following Ishwar Chandra
    Vidyasagar's 1855 Sanskritic treatises citing Parashara Smriti and petitions signed by over a
    thousand supporters alongside vigorous counter-petitions.
region: Calcutta and Bengal Presidency (applicable across Company India)
location: { name: "Kolkata, West Bengal", lat: 22.573, lon: 88.364 }
