claims:
  - text: Ishwar Chandra Vidyasagar's 1855 tracts argued from Parashara Smriti that widow remarriage was permissible under Hindu dharma-shastra in the Kali Yuga, prompting counter-petitions signed by tens of thousands of orthodox opponents.
    grade: A
    sources:
      - src.vidyasagar-2011-hindu-widow-marriage
      - src.jones-1989-socio-religious-reform-movements
  - text: Act XV of 1856 declared marriages of Hindu widows legal and their children legitimate, while terminating a remarrying widow's inheritance rights in her deceased husband's property unless expressly provided.
    grade: A
