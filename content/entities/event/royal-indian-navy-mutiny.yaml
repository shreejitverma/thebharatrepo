names:
  en: Royal Indian Navy strike and mutiny
summary: Royal Indian Navy ratings at HMIS Talwar in Bombay refused duty on 18 February 1946.
  The strike spread to ships and shore establishments, drawing on complaints about conditions
  and treatment and taking on wider political demands.
summaries:
  kids: Sailors in Bombay stopped work to protest poor treatment and conditions. Sailors elsewhere
    joined them, and the protest also called attention to British rule.
  teen: The ratings combined demands over food, pay and discriminatory treatment with political
    slogans. The strike attracted civilian support in Bombay and ended within days.
region: Bombay and other naval stations in British India
