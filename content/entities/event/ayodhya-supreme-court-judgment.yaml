names:
  en: Supreme Court judgment in the Ayodhya title dispute
summary: On 9 November 2019, a five-judge Constitution Bench decided the Ayodhya
  title appeals. It directed that the disputed site be handed to a trust for a
  temple and that an alternative five-acre plot be allotted for a mosque.
summaries:
  kids: In 2019 the Supreme Court decided the Ayodhya land dispute. It ordered a
    temple trust for the disputed land and five acres elsewhere for a mosque.
  teen: The Court’s unanimous judgment of 9 November 2019 awarded the disputed
    site for a temple trust and directed allotment of five acres to the Sunni
    Waqf Board for a mosque. It also condemned the 1992 mosque demolition and
    the 1949 placement of idols as unlawful.
