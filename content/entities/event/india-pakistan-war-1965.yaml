names:
  en: "India-Pakistan War of 1965"
summary: "The second India-Pakistan war escalated from fighting over Kashmir in August 1965 to combat across the international border in September. A UN-backed ceasefire ended the fighting, and Soviet mediation led to talks in Tashkent."
summaries:
  kids: "India and Pakistan fought again in 1965. The United Nations called for both countries to stop fighting, and the leaders later met in Tashkent."
  teen: "Fighting intensified in Kashmir in August 1965 and spread across the international border. UN Security Council Resolution 211 called for a ceasefire. The two governments subsequently negotiated in Soviet-mediated talks at Tashkent."
region: "Jammu and Kashmir and the India-Pakistan border"
