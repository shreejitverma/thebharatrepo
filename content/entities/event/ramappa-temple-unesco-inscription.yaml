id: event.ramappa-temple-unesco-inscription
type: event
kind: site
names:
  en: Ramappa Temple inscribed on the World Heritage List
summary: >-
  The World Heritage Committee inscribed the Ramappa Temple at Palampet, Telangana, on 25 July 2021.
  The decision recognised the Kakatiya temple's architecture and engineering and called for an updated conservation and management plan.
summaries:
  kids: >-
    Ramappa Temple in Telangana joined the World Heritage List in 2021.
    The committee drew attention to its carvings and the lightweight bricks used to build the tower.
  teen: >-
    The 2021 decision recognised the artistic and engineering achievements of the Kakatiya temple at Palampet.
    The committee also asked India to complete a conservation and management plan for the property.
region: Palampet, Telangana
