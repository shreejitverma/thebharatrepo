id: event.poona-pact
type: event
kind: event
names:
  en: Poona Pact
summary: On 24 September 1932, B. R. Ambedkar and other representatives reached a pact on
  political representation for the Depressed Classes. It replaced separate electorates under the
  Communal Award with reserved seats elected through joint electorates, after Gandhi began a
  fast opposing separate electorates.
summaries:
  kids: Ambedkar and other leaders agreed to set aside seats for people oppressed by caste. The
    agreement also changed how voters would choose the people for those seats.
  teen: The pact reserved 148 provincial seats and gave eligible Dalit voters a primary to choose
    candidates. The joint electorate made the final choice.
region: Poona (Pune), Bombay Presidency
