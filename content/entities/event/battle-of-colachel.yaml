names:
  en: Battle of Colachel (1741)
  native: കുളച്ചൽ യുദ്ധം (1741)
summary: "The Battle of Colachel, fought on 10 August 1741 CE at the coastal port of Colachel in present-day Kanyakumari district, was a decisive victory by King Marthanda Varma's Travancore forces over a Dutch East India Company (VOC) expeditionary force. Alarmed by Travancore's conquest of pepper-producing Desinganadu and Kayamkulam, the Dutch attempted to force Travancore into spice-trade submission, but their garrison surrendered after siege and loss of supplies, effectively ending Dutch territorial ambitions in Kerala."
summaries:
  kids: >-
    At Colachel in 1741 CE, King Marthanda Varma's Travancore army surrounded and defeated Dutch soldiers, stopping the Dutch from controlling southern Kerala's pepper trade.
  teen: >-
    In August 1741 CE, Travancore forces cut off and captured the Dutch East India Company landing force at Colachel, breaking Dutch political hegemony in Malabar and leading to the 1753 Treaty of Mavelikkara.
