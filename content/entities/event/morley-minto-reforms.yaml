id: event.morley-minto-reforms
type: event
kind: event
names:
  en: Morley-Minto reforms
summary: The Indian Councils Act of 1909 enlarged legislative councils and authorised elected
  membership under regulations. The regulations introduced separate Muslim electorates in parts
  of the council system.
summaries:
  kids: The British changed the rules for choosing members of lawmaking councils. Some seats were
    set aside for Muslim voters to choose representatives.
  teen: The Act authorised election alongside nomination. Its implementing rules institutionalised
    separate Muslim electorates, while voting remained limited to people who met eligibility
    rules.
region: British India and Westminster
