names:
  en: Rowlatt Act and satyagraha
summary: The Rowlatt Act of 1919 extended emergency procedures for dealing with political
  offences after the First World War. Gandhi called for satyagraha against the measure,
  including a nationwide stoppage in April.
summaries:
  kids: A new law gave British rulers special powers over people they suspected of political
    offences. Gandhi asked people to protest by closing shops and stopping work.
  teen: Wartime emergency powers informed the Rowlatt legislation. Opposition drew Gandhi into a
    national campaign whose local course varied sharply, especially in Punjab.
