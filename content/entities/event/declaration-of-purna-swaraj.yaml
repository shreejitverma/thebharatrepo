id: event.declaration-of-purna-swaraj
type: event
kind: event
names:
  en: Declaration of Purna Swaraj
summary: In December 1929 at Lahore, the Indian National Congress committed itself to Purna
  Swaraj, or complete independence. It called for a public declaration and observances on 26
  January 1930.
summaries:
  kids: Congress called for India to be fully independent. On 26 January 1930, people gathered to
    affirm that goal.
  teen: Under Jawaharlal Nehru's presidency, Congress moved from demands for dominion status to an
    explicit demand for complete independence. The declaration explained how colonial rule had
    harmed Indians economically and politically.
region: Lahore and public meetings across British India
