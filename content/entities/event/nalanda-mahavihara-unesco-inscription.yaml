id: event.nalanda-mahavihara-unesco-inscription
type: event
kind: site
names:
  en: Nalanda Mahavihara inscribed on the World Heritage List
summary: >-
  The World Heritage Committee inscribed the archaeological site of Nalanda Mahavihara in Bihar in 2016.
  It recognised the planned layout of the Buddhist monastic and teaching complex and requested a conservation plan for the excavated remains.
summaries:
  kids: >-
    The ruins of Nalanda in Bihar joined the World Heritage List in 2016.
    The people who made the decision also asked for a plan to protect the remains.
  teen: >-
    In 2016 the World Heritage Committee recognised Nalanda Mahavihara for its planned architecture and its role in Buddhist learning.
    The decision asked India to prepare a conservation plan and improve how visitors experience the site.
region: Nalanda, Bihar
