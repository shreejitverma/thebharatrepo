names:
  en: Second Anglo-Mysore War
summary: The East India Company fought Mysore again from 1780. Tipu Sultan succeeded Haidar Ali
  during the war, which ended with the Treaty of Mangalore in 1784.
summaries:
  kids: Haidar Ali led Mysore at the start of the war. After he died, his son Tipu Sultan carried
    on fighting and later made peace.
  teen: Fighting spread across several fronts in southern India. The Treaty of Mangalore ended the
    war in 1784 and provided for the restoration of conquests and return of prisoners.
region: Mysore, Carnatic and Malabar Coast
