id: event.non-cooperation-movement
type: event
kind: event
names:
  en: Non-Cooperation Movement
summary: The Indian National Congress and Khilafat leaders mobilised against colonial rule
  through boycotts and other forms of non-cooperation from 1920. The Congress leadership
  suspended its planned mass civil disobedience in February 1922 after the violence at Chauri
  Chaura.
summaries:
  kids: Many Indians stopped buying some British goods or stopped using colonial schools and
    courts to protest British rule. Congress changed course after violence at Chauri Chaura.
  teen: The campaign linked Congress and Khilafat mobilisation. Programmes included boycotts of
    government schools and courts, renunciation of titles and encouragement of hand-spun cloth.
region: British India
