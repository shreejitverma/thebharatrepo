id: event.all-india-muslim-league-founded
type: event
kind: event
names:
  en: Founding of the All-India Muslim League
summary: Muslim political leaders founded the All-India Muslim League at Dhaka in December 1906.
  Its initial programme sought to protect and advance Muslim political interests within British
  India.
summaries:
  kids: Leaders meeting in Dhaka started a new political group. They wanted Muslims in British
    India to have a stronger voice in government.
  teen: The League emerged from discussions among Muslim elites about how they would be
    represented under colonial constitutional reforms. Its aims and social base changed over
    subsequent decades.
region: Dhaka (then Dacca), Eastern Bengal and Assam
