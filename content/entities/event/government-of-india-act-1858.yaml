id: event.government-of-india-act-1858
type: event
kind: event
names:
  en: Government of India Act 1858
summary: The United Kingdom Parliament transferred the East India Company's governing powers to
  the Crown in 1858. The Act established a secretary of state for India assisted by a council in
  London.
summaries:
  kids: The British Parliament took away the Company's power to govern India and put the British
    Crown in charge.
  teen: Parliament ended Company government after the uprising of 1857. The new secretary of state
    and Council of India supervised the Crown's Indian administration from London.
