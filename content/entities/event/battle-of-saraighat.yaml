id: event.battle-of-saraighat
type: event
kind: event
names:
  en: Battle of Saraighat
  native: শৰাইঘাটৰ যুদ্ধ
summary: >-
  The Battle of Saraighat, fought in 1671 CE on the Brahmaputra River near Guwahati, was a decisive
  naval victory by the Ahom kingdom under Lachit Borphukan over a larger Mughal expedition commanded
  by Raja Ram Singh I of Amber. Exploiting the narrow river gorge, fortified banks and fast war-boats,
  the Ahoms thwarted imperial Mughal conquest of the Brahmaputra valley.
summaries:
  kids: >-
    In 1671, on a narrow stretch of the Brahmaputra River near Guwahati, Ahom commander Lachit
    Borphukan led fast war-boats to defeat a much larger Mughal army and navy at Saraighat.
  teen: >-
    Fought in March 1671 on the Brahmaputra at Saraighat, the riverine clash ended Raja Ram Singh's
    Mughal campaign to retake Guwahati, securing Ahom autonomy in lower Assam until the 19th century.
region: Kamrup (Guwahati), Brahmaputra River, Assam
location: { name: "Saraighat, Guwahati, Assam", lat: 26.178, lon: 91.674 }
datings:
