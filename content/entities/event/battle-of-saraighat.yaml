claims:
  - text: Following the 1663 Treaty of Ghilajharighat and the 1667 Ahom recovery of Guwahati, Aurangzeb dispatched Raja Ram Singh I with Mughal and Rajput forces, which the Ahoms checked in riverine warfare culminating at Saraighat in 1671.
    grade: A
    sources:
      - src.bhuyan-1947-lachit-barphukan
      - src.gait-1906-history-of-assam
  - text: Despite illness, Lachit Borphukan rallied the Ahom fleet into a concentrated riverine counterattack in the narrow Brahmaputra channel between Kamakhya and Ashwakranta hills, forcing the Mughal withdrawal to Rangamati.
    grade: B
    sources:
      - src.bhuyan-1947-lachit-barphukan
      - src.saikia-2019-unquiet-river
