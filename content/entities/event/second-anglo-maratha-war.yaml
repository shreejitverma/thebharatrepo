id: event.second-anglo-maratha-war
type: event
kind: event
names:
  en: Second Anglo-Maratha War
summary: After Peshwa Baji Rao II accepted British protection in the Treaty of Bassein, the East
  India Company fought opposing Maratha powers. Campaigns against the Sindia and Bhonsle houses
  in 1803 were followed by war with Holkar.
summaries:
  kids: One Maratha leader signed a treaty with the Company. Other Maratha leaders resisted, and
    the Company fought them across several regions.
  teen: Bassein gave the Company a client's claim to defend, while other Maratha leaders rejected
    the new balance of power. The war expanded Company influence in northern and central India.
region: Deccan, central India and northern India
