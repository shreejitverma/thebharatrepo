id: event.chauri-chaura-incident
type: event
kind: event
names:
  en: Chauri Chaura incident
summary: In February 1922, a confrontation between police and protesters at Chauri Chaura ended
  with a crowd burning the police station and killing officers inside. The attack prompted
  Gandhi to seek the suspension of mass civil disobedience. Sources differ on the exact day.
summaries:
  kids: A protest in Chauri Chaura turned deadly when a crowd set fire to a police station. Gandhi
    then called for a halt to the planned mass protests.
  teen: The confrontation followed local organising during Non-Cooperation. Its aftermath included
    criminal trials and a national debate over Gandhi's decision to suspend mass civil
    disobedience.
region: Chauri Chaura, Gorakhpur district, present-day Uttar Pradesh
