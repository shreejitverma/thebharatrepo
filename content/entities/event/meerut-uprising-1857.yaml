names:
  en: Meerut uprising of 1857
summary: On 10 May 1857 Indian soldiers at Meerut rose against East India Company officers and
  released imprisoned cavalrymen. Rebels then marched to Delhi, where the uprising widened.
summaries:
  kids: Indian soldiers at Meerut rebelled and freed fellow soldiers from jail. Some marched to
    Delhi, where more people joined the uprising.
  teen: The uprising followed the public punishment of cavalrymen who had refused to handle the
    new cartridges. By the following day, the revolt had spread from Meerut to Delhi.
