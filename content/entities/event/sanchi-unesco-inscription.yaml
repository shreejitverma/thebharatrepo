    sources: ["src.unesco-1989-sanchi-inscription-decision"]
    note: "The Committee adopted Decision 13 COM XV.A in 1989."
claims:
  - text: "The Committee inscribed the Buddhist Monuments at Sanchi in 1989 under criteria (i), (ii), (iii), (iv) and (vi)."
    grade: A
    sources: ["src.unesco-1989-sanchi-inscription-decision"]
  - text: "UNESCO describes the designated property as a complex containing Buddhist stupas, pillars, temples and monasteries."
