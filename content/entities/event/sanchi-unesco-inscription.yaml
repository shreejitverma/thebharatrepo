names:
  en: "Buddhist Monuments at Sanchi inscribed on the World Heritage List"
summary: "The World Heritage Committee inscribed the Buddhist Monuments at Sanchi in 1989. The designation covers an ensemble of Buddhist structures, including stupas, temples and monasteries."
summaries:
  kids: "In 1989 Sanchi's Buddhist monuments joined the World Heritage List. The site includes stupas, temples and the remains of monasteries."
  teen: "Sanchi was inscribed in 1989 as a group of Buddhist monuments. The property includes the Great Stupa and other structures that document a long history of Buddhist religious architecture."
region: "Sanchi, Madhya Pradesh"
