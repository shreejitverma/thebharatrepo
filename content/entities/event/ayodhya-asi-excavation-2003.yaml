      - src.ayodhya-judgment-2019
debate: The ASI report interpreted archaeological remains as indicating a
  substantial pre-existing structure. The Supreme Court accepted the presence of
  a non-Islamic structure beneath the mosque but expressly said the evidence did
  not establish that it was demolished for the mosque’s construction.
  Archaeological observations and historical attribution should be kept
  distinct.
