names:
  en: ASI excavation at the Ayodhya disputed site
summary: At the Allahabad High Court’s direction, the Archaeological Survey of
  India excavated the disputed Ayodhya site from March to August 2003. The
  report interpreted some remains as evidence of a pre-existing structure; its
  interpretation has been debated.
summaries:
  kids: In 2003 the ASI excavated the disputed site in Ayodhya for a court case.
    Archaeologists and historians have debated how to interpret the remains.
  teen: The ASI excavated the disputed Ayodhya site in 2003 under court direction.
    The Supreme Court later summarized the report’s evidence while cautioning
    that it did not establish that a temple was demolished to build the mosque.
region: Ayodhya, Uttar Pradesh
