id: event.government-of-india-act-1935
type: event
kind: event
names:
  en: Government of India Act 1935
summary: The Government of India Act 1935 provided for greater provincial autonomy and proposed
  a federation of British Indian provinces and princely states. Provincial provisions took
  effect, while the proposed federation was never inaugurated.
summaries:
  kids: A new law gave elected ministries in India's provinces more work to do. Its plan to unite
    the provinces and princely states in a federation never took effect.
  teen: The Act replaced provincial dyarchy with a system of provincial ministries while retaining
    important powers for colonial governors. The 1937 elections took place under its provisions.
