  en: Founding of the Tata Institute of Fundamental Research
summary: The Tata Institute of Fundamental Research began work in June 1945 under Homi Bhabha, with support
  from the Sir Dorabji Tata Trust. It started within a cosmic-ray unit in Bangalore and moved to Bombay later
  that year.
