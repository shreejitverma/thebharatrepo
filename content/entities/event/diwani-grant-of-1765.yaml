id: event.diwani-grant-of-1765
type: event
kind: event
names:
  en: Diwani grant of 1765
summary: In 1765 the Mughal emperor Shah Alam II granted the East India Company the diwani, or
  right to receive imperial revenue, in Bengal, Bihar and Orissa. The nawab of Bengal retained a
  formal governing role under the new arrangement.
summaries:
  kids: The Mughal emperor gave the East India Company the right to collect taxes in a large part
    of eastern India. That gave the Company much more power.
  teen: The diwani made the Company the recipient of imperial revenues. It left the nawab with
    formal duties while the Company gained a powerful means of financing its rule.
region: Allahabad (Prayagraj), Bengal, Bihar and Orissa
