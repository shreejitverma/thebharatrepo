claims:
  - text: Hindu College was funded and co-governed initially by wealthy Hindu citizens of Calcutta with the support of David Hare and Chief Justice Sir Edward Hyde East, though Ram Mohan Roy stepped back from the managing committee to avoid conservative boycott.
