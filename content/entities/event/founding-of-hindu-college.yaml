names:
  en: Founding of Hindu College, Calcutta
  native: হিন্দু কলেজ প্রতিষ্ঠা (১৮১৭)
summary: >-
  Hindu College opened in Calcutta on 20 January 1817 through an initiative of prominent Bengali
  gentry (including Radhakanta Deb and members linked with Raja Ram Mohan Roy's circle) alongside
  David Hare and Chief Justice Edward Hyde East. Offering English, European science and Western
  humanities alongside Indian learning, it became the crucible of the early Bengal Renaissance and
  the Young Bengal movement before becoming Presidency College in 1855.
summaries:
  kids: >-
    In 1817, leaders in Calcutta founded Hindu College so students could study modern science,
    history and literature alongside Indian subjects, sparking a wave of new ideas in Bengal.
  teen: >-
    Established in Calcutta in January 1817 by Indian patrons and British educationists, Hindu College
    trained the Young Bengal generation under Henry Louis Vivian Derozio and became Presidency
    College in 1855.
