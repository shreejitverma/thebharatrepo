names:
  en: "Simla Agreement"
summary: "India and Pakistan signed the Simla Agreement on 2 July 1972 after the 1971 war. It set out principles for resolving disputes peacefully and committed both governments to respect the Line of Control in Jammu and Kashmir."
summaries:
  kids: "After the 1971 war, India and Pakistan signed an agreement in Shimla. They agreed to settle disagreements peacefully and to respect the Line of Control."
  teen: "Indira Gandhi and Zulfikar Ali Bhutto signed the agreement at Simla, now Shimla. The text allows bilateral negotiations or other mutually agreed peaceful means and commits both sides to respect the Line of Control while preserving their stated positions."
