id: event.permanent-settlement-1793
type: event
kind: event
names:
  en: Permanent Settlement of 1793
summary: The East India Company fixed the land revenue owed by Bengal Presidency zamindars in
  perpetuity in 1793. The settlement strengthened their legal position as landholders and made
  estates liable to sale for arrears.
summaries:
  kids: The Company set the amount certain landholders owed it each year. Farmers on those lands
    still had to pay rent to the landholders.
  teen: The settlement fixed the Company's demand on zamindars while rents owed by cultivators
    remained a separate matter. Failure to pay the assessed revenue could lead to an estate
    being sold.
region: Bengal Presidency
