id: event.battle-of-haldighati
type: event
kind: event
names:
  en: Battle of Haldighati
summary: A Mughal army led by Man Singh of Amber defeated Maharana Pratap of Mewar at Haldighati
  in 1576. Pratap escaped and continued to resist Mughal rule.
summaries:
  kids: Two armies fought at a pass in Mewar. Maharana Pratap lost the battle, escaped and carried
    on resisting the Mughal empire.
  teen: Man Singh's army won the field for Akbar, but it failed to capture Pratap. The outcome of
    the battle and the longer struggle for control of Mewar were different questions.
region: Haldighati, Mewar, present-day Rajasthan
