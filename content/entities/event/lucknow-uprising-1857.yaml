names:
  en: Lucknow uprising and siege, 1857-1858
summary: Rebel forces besieged the British Residency in Lucknow in 1857 while Begum Hazrat Mahal
  championed the rule of her son Birjis Qadr in Awadh. British-led troops evacuated the
  Residency in November and recaptured Lucknow in March 1858.
summaries:
  kids: Rebels surrounded the British Residency in Lucknow. Begum Hazrat Mahal supported her son's
    claim to rule Awadh while fighting continued.
  teen: The siege took place within a wider revolt over Company rule in Awadh. The evacuation of
    the Residency in November 1857 and the British-led recapture of the city in March 1858 were
    separate events.
