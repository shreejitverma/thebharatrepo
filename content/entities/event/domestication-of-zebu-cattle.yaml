id: event.domestication-of-zebu-cattle
type: event
kind: prehistory
names:
  en: Domestication of Zebu Cattle (Bos indicus)
summary: >-
  The independent South Asian domestication of humped zebu cattle (Bos indicus) from native wild Indian aurochs
  (Bos primigenius namadicus), attested both by progressive body-size diminution and demographic profiles in
  Neolithic Period I at Mehrgarh (c. 7000-5500 BCE) and by deep mitochondrial and nuclear divergence from Near
  Eastern taurine cattle.
summaries:
  kids: >-
    Around 8,000 to 9,000 years ago in South Asia, early Neolithic farmers tamed wild native aurochs to raise
    humped zebu cattle, which are adapted to hot summers and monsoon climates.
  teen: >-
    Both zooarchaeological bones from Neolithic Mehrgarh and DNA comparisons with taurine cattle prove that
    South Asian humped zebu cattle (Bos indicus) were domesticated independently in the Greater Indus region
    from local wild Indian aurochs (Bos primigenius namadicus).
region: Northwestern South Asia (Greater Indus and Balochistan margin, with secondary centres in India)
location:
  name: Mehrgarh (Kachi Plain)
  lat: 29.39
  lon: 67.62
datings:
  - method: archaeological-radiocarbon
    range:
      earliest: -7000
      latest: -5000
      best: -6000
      precision: millennium
      circa: true
    grade: A
    label: Zooarchaeological domestication trajectory at Neolithic Mehrgarh and phylogeographic synthesis
    sources:
      - src.loftus-1994-independent-domestications-cattle
      - src.chen-2010-zebu-cattle-south-asia-neolithic
      - src.fuller-2006-agricultural-origins-south-asia
    note: >-
      Osteometric size reduction and shifting slaughter profiles at Mehrgarh trace local Bos indicus domestication
      across Period I (c. 7000-5500 BCE), corroborated by mitochondrial I1 and I2 haplogroup phylogeography.
claims:
  - text: >-
      Mitochondrial DNA sequencing demonstrates a deep divergence of several hundred thousand years between
      humped zebu (Bos indicus) and humpless taurine (Bos taurus) lineages, proving two independent domestications
      of cattle from distinct wild aurochs populations.
    grade: A
    sources:
      - src.loftus-1994-independent-domestications-cattle
  - text: >-
      Phylogeographic analysis of zebu mitochondrial haplogroups I1 and I2 across Asia shows that all modern
      domestic zebu cattle descend exclusively from South Asian Neolithic domestication of Bos primigenius namadicus.
    grade: A
    sources:
      - src.chen-2010-zebu-cattle-south-asia-neolithic
