names:
  en: First Anglo-Mysore War
summary: Haidar Ali fought the East India Company and its changing allies from 1767 to 1769. The
  war ended with the Treaty of Madras, which provided for mutual restoration of conquests and
  defensive assistance.
summaries:
  kids: Haidar Ali's Mysore army fought the East India Company. The two sides made peace in 1769
    and agreed to help each other if attacked.
  teen: Shifting alliances shaped the first war between Mysore and the Company. Haidar Ali's
    advance near Madras helped bring the Company to terms.
