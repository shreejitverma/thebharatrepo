id: event.earliest-cotton-mehrgarh
type: event
kind: prehistory
names:
  en: Earliest Known Cotton Fibres at Mehrgarh
summary: >-
  The earliest known archaeological evidence of cotton textile thread in the Old World, identified from
  mineralized Gossypium fibres preserved by copper corrosion products inside a copper bead from a Period I burial at Neolithic Mehrgarh in Balochistan. The calendar date of the burial is debated.
summaries:
  kids: >-
    Inside a tiny copper bead from a Neolithic grave at Mehrgarh, scientists using strong microscopes
    discovered preserved threads of cotton - the earliest known cotton string in the world.
  teen: >-
    In 2002, archaeobotanists and metallurgists analyzing a copper bead from Period I at Mehrgarh identified
    mineralized cotton thread. The first study placed the burial in the sixth millennium BCE. New radiocarbon dating suggests a later date for the cemetery.
region: Kachi Plain (Bolan River valley), Balochistan
location:
  name: Mehrgarh
  lat: 29.39
  lon: 67.62
datings:
  - method: archaeological-stratigraphic
    range: { earliest: "5250 BCE", latest: "4650 BCE", precision: century, circa: true }
    grade: C
    label: Contextual estimate from the revised Period I cemetery chronology
    sources:
      - src.moulherat-2002-mehrgarh-cotton
      - src.mutin-2025-mehrgarh-radiocarbon
    note: Mutin and colleagues place the Period I cemetery in this range using radiocarbon dates from human tooth enamel. This gives a contextual estimate for the bead.
  - method: archaeological-stratigraphic
    range:
      earliest: "6000 BCE"
      latest: "5500 BCE"
      precision: century
      circa: true
    grade: C
    label: Original estimate for the Period I burial (Moulherat et al. 2002)
    sources:
      - src.moulherat-2002-mehrgarh-cotton
    note: Moulherat and colleagues report that the bead came from grave MR.84.03.158 and assign it to the first half of the sixth millennium BCE.
claims:
  - text: >-
      Scanning electron microscopy and reflected-light microscopy of mineralized threads inside a copper bead
      from a Period I grave at Mehrgarh identified ribbon-like convoluted cellulose fibres diagnostic of cotton (Gossypium sp.).
    grade: A
    sources:
      - src.moulherat-2002-mehrgarh-cotton
  - text: >-
      Charred Gossypium seeds recovered alongside the mineralized fibres at Mehrgarh point to the early exploitation
      and domestication of tree cotton (Gossypium arboreum) in the Greater Indus region prior to the Mature Harappan textile industry.
    grade: B
    sources:
      - src.moulherat-2002-mehrgarh-cotton
      - src.fuller-2006-agricultural-origins-south-asia
relations:
  - kind: located-at
    target: site.mehrgarh
tags:
  - neolithic
  - cotton
  - textiles
  - mehrgarh
  - archaeobotany
review:
  status: draft
  author: gemini-4-argon
