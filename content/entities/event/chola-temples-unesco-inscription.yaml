names:
  en: "World Heritage inscription and extension of the Great Living Chola Temples"
summary: "The World Heritage Committee inscribed the Brihadisvara Temple at Thanjavur in 1987. In 2004 it extended the property to include the Brihadisvara Temple at Gangaikondacholapuram and the Airavatesvara Temple at Darasuram."
summaries:
  kids: "A Chola temple at Thanjavur joined the World Heritage List in 1987. In 2004 two more Chola temples joined the same listing."
  teen: "The property began with the Brihadisvara Temple at Thanjavur in 1987. Its 2004 extension grouped three temples from the Chola period under the name Great Living Chola Temples."
region: "Thanjavur, Gangaikondacholapuram and Darasuram, Tamil Nadu"
