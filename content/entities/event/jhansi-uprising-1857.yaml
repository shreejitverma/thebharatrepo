names:
  en: Jhansi uprising and siege, 1857-1858
summary: After the June 1857 uprising at Jhansi, Rani Lakshmibai governed the city. She defended
  it against Hugh Rose's forces in 1858 and escaped when they captured it in April.
summaries:
  kids: Rani Lakshmibai led the defence of Jhansi. After the Company captured the city, she
    escaped and continued to resist.
  teen: The Company had annexed Jhansi before the uprising. Lakshmibai took charge after the 1857
    rebellion and defended the city against a renewed Company advance the following spring.
