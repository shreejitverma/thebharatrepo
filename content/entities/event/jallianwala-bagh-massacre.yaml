summary: On 13 April 1919, troops under Brigadier-General Reginald Dyer fired on a crowd at
  Jallianwala Bagh in Amritsar, killing hundreds. The attack took place on Vaisakhi during
  unrest over colonial repression in Punjab. The exact death toll remains disputed.
summaries:
  kids: British Indian Army soldiers fired on people gathered in a public space in Amritsar.
    Hundreds were killed.
  teen: The crowd included people attending a meeting and visitors in Amritsar for Vaisakhi. Dyer
    ordered troops to fire without warning, and estimates of the death toll differ.
