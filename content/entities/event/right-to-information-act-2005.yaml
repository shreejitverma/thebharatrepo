    range: { earliest: "2005", latest: "2005", precision: year, circa: false }
    grade: A
    label: "Enactment and phased commencement"
    sources: ["src.india-2005-right-to-information-act"]
    note: "The Act is dated 15 June 2005. Some provisions began immediately and others commenced on the 120th day after enactment."
claims:
  - text: "Sections 3 to 8 cover the right, the obligations of public authorities, the request process and exemptions from disclosure."
    grade: A
    sources: ["src.india-2005-right-to-information-act"]
  - text: "The Act provides for the Central Information Commission and State Information Commissions and establishes a route for appeals."
    grade: A
