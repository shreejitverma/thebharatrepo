id: event.right-to-information-act-2005
type: event
kind: polity
names:
  en: "Right to Information Act, 2005"
summary: "The Right to Information Act gave citizens a statutory route to request information from public authorities. The 2005 law also provided for central and state information commissions and set out grounds for withholding certain information."
summaries:
  kids: "India passed a law in 2005 that lets citizens ask public offices for information. It also gives people a way to appeal if their request is refused."
  teen: "The 2005 Act gives citizens a right to request information held by public authorities, subject to exemptions. It requires public information officers and creates a system of appeals and information commissions."
region: "India"
datings:
