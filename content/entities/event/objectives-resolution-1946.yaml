names:
  en: Constituent Assembly Objectives Resolution
summary: Jawaharlal Nehru moved the Objectives Resolution in the Constituent Assembly in
  December 1946. The Assembly adopted it on 22 January 1947, setting out commitments including
  popular sovereignty, equality and safeguards for minorities.
summaries:
  kids: Nehru proposed goals for India's new constitution. The goals included equality and the
    idea that the government's authority comes from the people.
  teen: The resolution set out principles for a sovereign republic, social and political justice,
    and safeguards for minorities and other groups. It guided the Assembly's work and
    anticipated principles in the Constitution's preamble.
