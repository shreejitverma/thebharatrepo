names:
  en: Portuguese conquest of Goa
summary: Afonso de Albuquerque's forces took Goa from the Adil Shahi sultanate of Bijapur in
  1510. Goa developed into the administrative centre of Portugal's Asian empire and a major
  centre of Indo-Portuguese religious architecture.
summaries:
  kids: A Portuguese fleet took Goa in 1510. Old Goa later became a city where builders used both
    European designs and local materials.
  teen: Portuguese control of Goa anchored an empire connected by sea. Old Goa's churches show how
    European building styles were adapted to local materials and craft traditions.
