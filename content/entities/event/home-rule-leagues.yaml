names:
  en: Indian Home Rule Leagues
summary: In 1916 Bal Gangadhar Tilak and Annie Besant launched separate Home Rule Leagues. They
  used public meetings, pamphlets and local branches to build support for Indian self-government
  within the empire.
summaries:
  kids: Tilak and Annie Besant started groups that called for Indians to govern themselves. They
    spread their message through local meetings and printed leaflets.
  teen: The two leagues gave sustained organisational form to a demand for self-government. Their
    work linked constitutional campaigning to a broader network of local political activity.
