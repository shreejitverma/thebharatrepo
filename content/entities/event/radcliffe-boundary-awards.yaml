names:
  en: Publication of the Radcliffe boundary awards
summary: The boundary awards for Punjab and Bengal were made public on 17 August 1947, after the
  independence ceremonies in Pakistan and India. They determined which parts of the two
  provinces would belong to each new dominion.
summaries:
  kids: A few days after the independence celebrations, people learned where the new border ran
    through Punjab and Bengal.
  teen: Two boundary commissions chaired by Cyril Radcliffe drew borders through Punjab and
    Bengal. Delayed publication meant that residents of some areas did not know which country
    they were in at the time of the independence ceremonies.
