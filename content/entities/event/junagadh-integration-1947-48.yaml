names:
  en: "Junagadh accession crisis and referendum"
summary: "Junagadh's nawab opted for Pakistan in 1947. India took over the administration in November, then held a referendum in February 1948 that officially returned a large majority for joining India."
summaries:
  kids: "Junagadh's ruler chose to join Pakistan. India took control, then organised a vote in which the official count showed most voters chose India."
  teen: "Junagadh's accession to Pakistan set off a dispute involving India and smaller neighbouring states. India took over the administration in November 1947. Its referendum in February 1948 recorded an overwhelming vote for accession to India."
region: "Junagadh and Kathiawar, Gujarat"
