id: "event.arab-conquest-of-sindh"
type: "event"
kind: "event"
names:
  en: "Arab conquest of Sindh"
summary: "An Umayyad expedition under Muhammad ibn Qasim defeated Dahir in 712 CE and established
  control over major centres in Sindh. The campaigns unfolded over several years, and the surviving
  accounts were written later."
summaries:
  kids: "In 712 an army led by Muhammad ibn Qasim defeated the ruler Dahir. The army then took control
    of other places along the Indus."
  teen: "Arabic and Persian narratives describe the conquest from different periods. The defeat of
    Dahir in 712 is the conventional turning point in a campaign that began on the coast and
    extended north towards Multan."
region: "Lower Indus Valley and Multan"
