names:
  en: First Anglo-Sikh War
summary: The East India Company and the Sikh Empire fought across the Sutlej frontier in 1845
  and 1846. After Sobraon, the Treaty of Lahore required territorial and financial concessions
  from the Lahore state.
summaries:
  kids: The Company and the Sikh kingdom fought near the Sutlej River. After losing the war, the
    kingdom had to give up land and accept new limits on its power.
  teen: Several engagements culminated in the Sikh defeat at Sobraon. The peace reduced Lahore's
    territory and military freedom while the young Duleep Singh remained maharaja.
region: Punjab and the Sutlej frontier
