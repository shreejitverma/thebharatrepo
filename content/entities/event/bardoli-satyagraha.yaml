names:
  en: Bardoli Satyagraha
summary: Cultivators in Bardoli refused to pay an increased land revenue assessment in 1928
  under the leadership of Vallabhbhai Patel. The campaign secured an inquiry and a reduction in
  the increase.
summaries:
  kids: Farmers in Bardoli refused to pay a higher land tax. They stuck together and won a review
    of how much they owed.
  teen: The Bardoli campaign challenged the official valuation of agricultural land. A coordinated
    refusal to pay, backed by village organising, pushed the Bombay government toward an inquiry
    and a revised assessment.
