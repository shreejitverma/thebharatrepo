    note: "Fighting began in 1947. The range includes the ceasefire at the turn of 1948 to 1949."
claims:
  - text: "The United Nations established a commission in January 1948 to investigate and mediate the dispute between India and Pakistan."
    grade: A
    sources: ["src.united-nations-1965-unipom-background"]
  - text: "The Karachi Agreement of July 1949 established a ceasefire line to be supervised by United Nations military observers."
