names:
  en: "First India-Pakistan War"
summary: "Fighting over the former princely state of Jammu and Kashmir began in 1947 following Partition. A UN-mediated ceasefire ended the fighting, and military representatives of India and Pakistan agreed on a ceasefire line in July 1949."
summaries:
  kids: "Soon after Partition, India and Pakistan fought over Jammu and Kashmir. A United Nations effort helped stop the fighting."
  teen: "The first India-Pakistan war began in 1947 amid a dispute over Jammu and Kashmir's accession. The ceasefire and the later agreement on the ceasefire line were separate steps in the UN-mediated process."
region: "Jammu and Kashmir"
