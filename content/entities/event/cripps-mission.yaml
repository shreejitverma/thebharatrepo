id: event.cripps-mission
type: event
kind: event
names:
  en: Cripps Mission
summary: In 1942 the British government sent Stafford Cripps to offer a new constitutional
  process after the war. The negotiations failed amid disagreements over wartime authority and
  the future position of the provinces.
summaries:
  kids: Stafford Cripps came from Britain with proposals for how India might be governed after the
    war. The talks ended without an agreement.
  teen: The draft offered dominion status after the war and allowed provinces to stay outside the
    proposed new union. The talks also foundered over who would control government and defence
    during the war.
region: New Delhi and Westminster
