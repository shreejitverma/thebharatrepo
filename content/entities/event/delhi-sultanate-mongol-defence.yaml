names:
  en: Delhi Sultanate defence against Mongol incursions
summary: >-
  Mongol forces made several incursions into the northwestern frontier of the Delhi Sultanate during
  Alauddin Khalji's reign. Sultanate armies repelled major incursions, including campaigns in 1299 and
  1303; the details and scale of individual expeditions vary among the chronicles.
summaries:
  kids: >-
    During Alauddin Khalji's rule, Mongol armies tried several times to enter the Delhi Sultanate.
    Sultanate forces fought them back in major campaigns.
  teen: >-
    The Delhi Sultanate faced repeated Mongol incursions while Alauddin Khalji ruled. The campaigns of
    1299 and 1303 are among the best-known, though chroniclers differ in their details.
