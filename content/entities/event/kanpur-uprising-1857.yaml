names:
  en: Kanpur uprising of 1857
summary: Nana Sahib led rebel forces at Kanpur after the local garrison rose in June 1857.
  Killings of British soldiers and civilians were followed by Company reprisals, and control of
  Kanpur was contested again late that year.
summaries:
  kids: Rebels led by Nana Sahib fought the Company at Kanpur. Many soldiers and civilians were
    killed in the fighting and in acts of revenge.
  teen: The siege of the Company garrison and the killing of captives made Kanpur a focus of
    British reprisals. Fighting for the city continued later in 1857.
