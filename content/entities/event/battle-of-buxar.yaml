names:
  en: Battle of Buxar
summary: In October 1764 the East India Company defeated forces associated with Mir Qasim, Shuja
  ud-Daula of Awadh and the Mughal emperor Shah Alam II. The victory helped the Company secure
  the Bengal revenue grant the following year.
summaries:
  kids: Three rulers joined forces against the East India Company. The Company won at Buxar and
    gained a stronger position in eastern India.
  teen: Buxar followed Mir Qasim's conflict with the Company in Bengal. The victory gave the
    Company leverage over Awadh and Shah Alam II in the settlements of 1765.
region: Buxar, present-day Bihar
