names:
  en: "Bhakra-Nangal project and Bhakra Dam"
summary: "The Bhakra-Nangal project developed the Satluj for irrigation and hydroelectric power. Bhakra Dam, the major storage structure of the project, was completed by 1963."
summaries:
  kids: "India built the Bhakra Dam and other works on the Satluj River to send water to farms and make electricity."
  teen: "Bhakra and Nangal formed parts of a multipurpose river project on the Satluj. Canal works supplied irrigation, while the project used river water to generate electricity. The Bhakra Dam feeds the downstream Nangal Dam and the Nangal Hydel Channel."
