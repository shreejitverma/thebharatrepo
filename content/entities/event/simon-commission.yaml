id: event.simon-commission
type: event
kind: event
names:
  en: Simon Commission
summary: The British government appointed the Indian Statutory Commission in 1927 to review
  constitutional arrangements. It included no Indian members, prompting boycotts and
  demonstrations when it arrived in India in 1928.
summaries:
  kids: The British sent a group to study how India was governed. Many people protested because no
    Indians had been appointed to the group.
  teen: John Simon's commission reviewed the constitutional system established in 1919. Its
    exclusion of Indian members drew organised opposition, and its 1930 report fed into later
    constitutional discussions.
