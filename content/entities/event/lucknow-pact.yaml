id: event.lucknow-pact
type: event
kind: event
names:
  en: Lucknow Pact
summary: The Indian National Congress and the All-India Muslim League agreed on a common scheme
  of constitutional reforms at Lucknow in 1916. Congress accepted separate Muslim electorates as
  part of the agreement.
summaries:
  kids: Two large political organisations agreed on changes they wanted the British to make. The
    agreement also set out how Muslim voters would elect representatives to some seats.
  teen: The pact brought Congress and League leaders together around constitutional demands. It
    retained separate Muslim electorates and agreed on shares of legislative seats in different
    provinces.
region: Lucknow, United Provinces
