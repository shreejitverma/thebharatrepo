id: event.brahmi-decipherment-prinsep
type: event
kind: event
names:
  en: Decipherment of Brahmi Script by James Prinsep
summary: >-
  In May and June 1837, James Prinsep, assay master of the Calcutta Mint and secretary of the Asiatic Society of Bengal, completed the decipherment of the ancient Brahmi script by identifying the recurring Prakrit votive formula danam ("gift of") on short railing inscriptions from Sanchi. This breakthrough allowed him to read the pillar and rock edicts of Devanampiya Piyadasi (Ashoka) and unlocked early Indian epigraphy.
summaries:
  kids: >-
    In 1837, scholar James Prinsep figured out how to read the forgotten ancient Brahmi alphabet by studying short gift inscriptions from Sanchi Stupa, allowing historians to read Emperor Ashoka's stone edicts again.
  teen: >-
    Building on earlier work by Christian Lassen and Alexander Cunningham, James Prinsep cracked the Brahmi script in 1837 by recognizing the Prakrit word danam ("gift") on Sanchi votive railings, transforming the study of ancient Indian history.
region: Kolkata (Calcutta), Bengal
location: { name: "Asiatic Society, Kolkata", lat: 22.556, lon: 88.352 }
datings:
