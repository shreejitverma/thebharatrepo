    note: Directly documented in James Prinsep's papers in Volume 6 of the Journal of the Asiatic Society of Bengal in 1837.
claims:
  - text: Prinsep identified the final two characters appearing at the end of numerous short votive inscriptions on the Sanchi stupa railings as da-nam ("gift"), preceded by the genitive suffix -sa, supplying the phonetic values needed to read the Ashokan pillar edicts.
    grade: A
    sources:
      - src.salomon-1998-indian-epigraphy
  - text: In 1837 George Turnour connected the title Piyadasi in the newly deciphered Brahmi edicts with the Mauryan emperor Ashoka of the Sri Lankan Pali chronicles, and in 1838 Prinsep identified the names of the Hellenistic kings in Major Rock Edict XIII.
    grade: A
    sources:
      - src.salomon-1998-indian-epigraphy
      - src.lahiri-2015-ashoka-ancient-india
