names:
  en: Lahore Resolution of 1940
summary: The All-India Muslim League adopted the Lahore Resolution in March 1940. It called for
  Muslim-majority areas in the northwest and east to be grouped into independent states, while
  leaving the form of those states open to interpretation.
summaries:
  kids: At a meeting in Lahore, the Muslim League called for regions with Muslim majorities to
    form their own states.
  teen: The resolution called for Muslim-majority regions in the northwest and east to form
    independent states. Its wording left room for different readings of the relationship between
    their constituent units.
