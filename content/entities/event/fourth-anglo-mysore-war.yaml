id: event.fourth-anglo-mysore-war
type: event
kind: event
names:
  en: Fourth Anglo-Mysore War
summary: East India Company forces and their allies took Srirangapatna in May 1799. Tipu Sultan
  died in the fighting, and a Wodeyar ruler was installed in a much-reduced Mysore under Company
  influence.
summaries:
  kids: Tipu Sultan died when his capital was captured. A family that had ruled Mysore before
    returned to the throne, ruling a smaller state.
  teen: The capture of Srirangapatna brought Tipu's rule to an end. The Company and its allies
    divided some Mysore territory and returned the remaining kingdom to the Wodeyar dynasty
    under a subsidiary alliance.
region: Srirangapatna and Mysore, present-day Karnataka
datings:
