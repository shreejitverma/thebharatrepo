id: "event.chittor-sieges"
type: "event"
kind: "event"
names:
  en: "Sieges of Chittor"
summary: "Chittor fell to Alauddin Khalji in 1303, Bahadur Shah of Gujarat in 1535, and Akbar in
  1568. Accounts of the sieges include records close to the events and later literary traditions
  about the people who defended the fort."
summaries:
  kids: "Three different armies captured Chittor over more than two hundred years. Old records tell us
    when they took the fort, and later poems tell how people remembered those defeats."
  teen: "The three captures belong to different political contexts. A sixteenth-century poem shaped
    the memory of the 1303 siege, while Mughal sources describe Akbar's sixteenth-century campaign
    from the conqueror's viewpoint."
region: "Mewar, Rajasthan"
