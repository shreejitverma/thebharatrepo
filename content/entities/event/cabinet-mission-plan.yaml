id: event.cabinet-mission-plan
type: event
kind: event
names:
  en: Cabinet Mission and its plan for India
summary: The British Cabinet Mission and the viceroy published a constitutional plan on 16 May
  1946. It proposed an Indian union with limited central powers, grouped provinces and a
  Constituent Assembly, but the parties failed to agree on how the plan should work.
summaries:
  kids: British ministers proposed that India stay together, with many decisions left to its
    provinces. Indian leaders disagreed over how this arrangement would work.
  teen: The plan gave the union subjects such as defence and foreign affairs, with other powers
    largely left to the provinces and princely states. Disputes over provincial grouping helped
    defeat the wider political settlement.
region: British India and Westminster
