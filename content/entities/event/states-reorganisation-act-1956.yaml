names:
  en: "States Reorganisation Act, 1956"
summary: "The States Reorganisation Act redrew state boundaries on 1 November 1956. Among its changes, it created Kerala and joined the Telangana region of Hyderabad State to Andhra State to form Andhra Pradesh."
summaries:
  kids: "In 1956, India changed many state borders. Kerala became a state, and Telangana joined Andhra State to form Andhra Pradesh."
  teen: "From 1 November 1956, Parliament's reorganisation law transferred territories between states and created new ones. The reorganisation produced Andhra Pradesh and Kerala through different territorial mergers."
