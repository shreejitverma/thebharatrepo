summary: "The Archaeological Survey of India began excavating Dholavira in the 1989-90 field season under R. S. Bisht. The excavations revealed a Harappan city with extensive fortifications and reservoirs."
summaries:
  kids: "Archaeologists began digging at Dholavira in Gujarat around 1990. They uncovered parts of an ancient city, including walls and places that stored water."
