names:
  en: Delhi uprising and siege of 1857
summary: Rebel soldiers entered Delhi in May 1857 and rallied around the Mughal emperor Bahadur
  Shah II. British-led forces retook the city in September after a siege, and Bahadur Shah was
  subsequently tried and exiled.
summaries:
  kids: Rebels took Delhi and turned to the Mughal emperor for leadership. British-led troops
    captured the city after months of fighting.
  teen: Delhi gave the rebellion a political centre under Bahadur Shah II. Its recapture in
    September reversed that gain, and the emperor's trial and exile ended Mughal rule.
