id: event.government-of-india-act-1919
type: event
kind: event
names:
  en: Government of India Act 1919
summary: The Government of India Act 1919 restructured the central legislature and introduced
  divided responsibility, known as dyarchy, in the provinces. Provincial ministers could
  administer some subjects while governors retained others.
summaries:
  kids: The British changed the way India was governed. Indian ministers could make decisions
    about some subjects, while colonial officials kept control of others.
  teen: Dyarchy divided provincial subjects into transferred and reserved categories. Ministers
    could administer certain areas, while governors and their executive councils kept fields
    such as police and finance.
