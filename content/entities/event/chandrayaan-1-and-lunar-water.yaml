names:
  en: Chandrayaan-1 and evidence of lunar surface water
summary: Chandrayaan-1 launched in 2008. Analyses published in 2009 using data
  from its Moon Mineralogy Mapper reported spectral evidence for hydroxyl and
  water molecules on the lunar surface.
summaries:
  kids: Chandrayaan-1 went to the Moon in 2008. Its instruments found signs of
    water-related molecules on the Moon’s surface.
  teen: Launched in 2008, Chandrayaan-1 carried instruments whose 2009 results
    reported OH/H₂O signatures on the lunar surface. The findings indicate
    hydroxyl and water molecules, not accessible pools of liquid water.
