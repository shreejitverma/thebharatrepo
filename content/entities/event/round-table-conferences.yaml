names:
  en: Indian Round Table Conferences
summary: The British government convened three Round Table Conferences between 1930 and 1932 to
  discuss India's constitutional future. Gandhi represented the Indian National Congress at the
  second conference, and B. R. Ambedkar participated in the conferences as a representative of
  the Depressed Classes.
summaries:
  kids: People with different views met in London to discuss how India might be governed. Gandhi
    joined one meeting, and Ambedkar argued for political rights for people oppressed by caste.
  teen: Delegates discussed federation, princely states and how communities should be represented.
    Congress attended the second round after the Gandhi-Irwin Pact, and the proceedings informed
    the 1935 legislation.
