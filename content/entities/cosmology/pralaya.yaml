names:
  en: Pralaya (Cosmic Dissolution)
  iast: Pralaya
  native: प्रलय
summary: >-
  In traditional Hindu cosmology, pralaya denotes the periodic dissolution and reabsorption of the cosmos,
  classified in the Puranas into four kinds: continual daily dissolution (nitya), occasional dissolution at
  the end of a kalpa during Brahma's night (naimittika), elemental dissolution at the end of Brahma's
  100-year life (prakritika), and individual liberation (atyantika).
summaries:
  kids: >-
    In traditional Hindu cosmology, pralaya is the resting period when the universe dissolves back into its
    source during Brahma's 4.32-billion-year night before a new cosmic day begins.
  teen: >-
    Puranic cosmology distinguishes naimittika pralaya, when the three worlds dissolve for a 4.32-billion-year
    night of Brahma at the close of each kalpa, from prakritika mahapralaya, when all cosmic elements
    reabsorb into prakriti after Brahma's 100-year lifespan.
datings:
  - method: traditional-puranic
    range:
      earliest: -1972947101
