    note: >-
      In Puranic chronology, the preceding 4.32-billion-year night of Brahma (naimittika pralaya) ended at
      the opening of the present Shveta-Varaha Kalpa 1,972,944,000 years before the 3102 BCE Kali epoch.
claims:
  - text: >-
      Vishnu Purana 1.7 and 6.1-5 classify cosmic dissolution into four types: nitya (constant),
      naimittika (at the close of a kalpa, lasting 4.32 billion years), prakritika (at the close of
      Brahma's 100-year life), and atyantika (final liberation from rebirth).
    grade: D
    sources:
      - src.wilson-1840-vishnu-purana
      - src.rocher-1986-puranas
      - src.flood-2003-blackwell-companion-hinduism
  - text: >-
      In addition to the end-of-kalpa dissolution, smaller flood-like transitions (manvantara-sandhya) of
      1,728,000 years occur between each of the fourteen manvantaras inside a kalpa.
    grade: D
    sources:
      - src.burgess-1860-surya-siddhanta
      - src.dimmitt-vanbuitenen-1978-classical-hindu-mythology
