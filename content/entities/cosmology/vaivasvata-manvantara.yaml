id: cosmology.vaivasvata-manvantara
type: cosmology
kind: cosmology
names:
  en: Vaivasvata Manvantara
  iast: Vaivasvatamanvantara
  native: वैवस्वतमन्वन्तर
summary: >-
  In traditional Hindu cosmology, the Vaivasvata Manvantara is the seventh and current manvantara of the
  present Shveta-Varaha Kalpa, presided over by Vaivasvata Manu (son of Vivasvat, the Sun), of whose 71
  mahayugas twenty-seven have completely elapsed and the twenty-eighth is currently under way.
summaries:
  kids: >-
    In traditional Hindu cosmology, we live in the seventh of the fourteen ages of Manu, called the
    Vaivasvata Manvantara after Vaivasvata Manu, who survived the great flood with the help of the fish
    avatar Matsya.
  teen: >-
    Traditional Puranic and Siddhantic chronology places the present world in the 28th mahayuga of the
    seventh (Vaivasvata) manvantara, meaning 27 full mahayugas plus the first three yugas of the 28th
    mahayuga (120,528,000 years) had elapsed before the Kali Yuga epoch of 3102 BCE.
datings:
  - method: traditional-puranic
    range:
      earliest: -120531101
      latest: -3101
      precision: cosmological
      circa: false
    grade: D
    label: Elapsed span of the seventh (Vaivasvata) manvantara to the Kali epoch
    sources:
      - src.wilson-1840-vishnu-purana
      - src.burgess-1860-surya-siddhanta
      - src.plofker-2009-mathematics-in-india
    note: >-
      In Surya Siddhanta 1.22-23 and Vishnu Purana 1.3, 27 mahayugas (116,640,000 years) plus the Satya,
      Treta and Dvapara yugas of the 28th mahayuga (3,888,000 years) - a total of 120,528,000 solar years
      - had elapsed in the Vaivasvata Manvantara by 18 February 3102 BCE (-3101).
claims:
  - text: >-
      According to Vishnu Purana 3.1-2, the seventh manvantara is governed by Vaivasvata Manu, with
      Purandara as Indra and Kashyapa, Atri, Vasishtha, Vishvamitra, Gautama, Jamadagni and Bharadvaja as
      the Seven Sages (Saptarishis).
    grade: D
    sources:
      - src.wilson-1840-vishnu-purana
      - src.dimmitt-vanbuitenen-1978-classical-hindu-mythology
  - text: >-
      Twenty-seven complete mahayugas (116,640,000 human years) of the Vaivasvata Manvantara are reckoned
      to have elapsed prior to the current 28th mahayuga.
    grade: D
    sources:
      - src.burgess-1860-surya-siddhanta
      - src.plofker-2009-mathematics-in-india
