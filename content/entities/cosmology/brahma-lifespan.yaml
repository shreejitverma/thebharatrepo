id: cosmology.brahma-lifespan
type: cosmology
kind: cosmology
names:
  en: Lifespan of Brahma (Mahakalpa)
  iast: Brahmāyu
  native: ब्रह्मायु
summary: >-
  In traditional Hindu cosmology, the full lifespan of the creator deity Brahma (a mahakalpa or para) spans
  100 divine years of 360 days and 360 nights each, where every daytime and every night is a kalpa of
  4.32 billion human years, yielding a total duration of 311.04 trillion solar years.
summaries:
  kids: >-
    In traditional Hindu cosmology, Brahma lives for 100 cosmic years, and because every single day and
    night is 4.32 billion human years long, his whole life spans 311.04 trillion human years.
  teen: >-
    Traditional Puranic and Siddhantic cosmology calculates Brahma's 100-year life (para) as 36,000 day-kalpas
    and 36,000 night-kalpas, or 311,040,000,000,000 human years, placing the present universe on the first
    day of his 51st year (the second parardha).
datings:
  - method: traditional-puranic
    range:
      earliest: "155521972947102 BCE"
      latest: "3102 BCE"
      precision: cosmological
      circa: false
    grade: D
    label: Elapsed first parardha and opening of the 51st year of Brahma
    sources:
      - src.wilson-1840-vishnu-purana
      - src.burgess-1860-surya-siddhanta
      - src.rocher-1986-puranas
    note: >-
      Vishnu Purana 1.3 describes Brahma's 100-year life and its two halves (parardhas); Surya Siddhanta
      1.21-23 states that half of that life (155.52 trillion human years) has passed and lists the
      manvantaras and yugas elapsed in the present kalpa, which sum to 1,972,944,000 years at the Kali Yuga
      epoch (-3101).
claims:
  - text: >-
      One hundred years of Brahma (a para) consist of 36,000 days and 36,000 nights of 4.32 billion human
      years each, totalling 311,040,000,000,000 human solar years.
    grade: D
    sources:
      - src.wilson-1840-vishnu-purana
      - src.burgess-1860-surya-siddhanta
      - src.flood-2003-blackwell-companion-hinduism
  - text: >-
      Each 50-year half of Brahma's life is termed a parardha, and traditional texts place the current
      cosmic era at the very first day (Shveta-Varaha Kalpa) of the second parardha.
    grade: D
    sources:
      - src.wilson-1840-vishnu-purana
      - src.burgess-1860-surya-siddhanta
