debate: >-
  Because four coins in the name of Azes were discovered inside the same steatite container as the gold
  casket, Joe Cribb places the casket in the early-to-mid 1st century CE (making it arguably the oldest
  securely dated anthropomorphic Buddha image), whereas Kurt Behrendt and Susan Huntington favour a later
  Kushan date.
