id: artifact.ramanujan-notebooks
type: artifact
kind: science
names:
  en: Ramanujan’s Notebooks
summary: Ramanujan’s three earlier notebooks preserve handwritten mathematical results, many without proofs.
  The Tata Institute of Fundamental Research issued a facsimile in 1957. Bruce Berndt later published editions
  and proofs.
summaries:
  kids: Ramanujan filled notebooks with math discoveries. Later mathematicians studied his notes and worked out
    proofs for many of them.
  teen: The three notebooks document years of work, much of it before Ramanujan went to Cambridge in 1914. The
    second notebook revises and enlarges much of the first.
