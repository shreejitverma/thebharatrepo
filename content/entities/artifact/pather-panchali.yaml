summary: "Pather Panchali ('Song of the Little Road', 1955) is the landmark Bengali debut feature directed by Satyajit Ray from Bibhutibhushan Bandyopadhyay's 1929 novel. Shot largely on location in rural Boral with non-professional actors, Subrata Mitra's natural-light cinematography and Ravi Shankar's score, it won the Best Human Document award at Cannes in 1956 and is widely credited with launching Indian parallel cinema."
summaries:
  kids: Pather Panchali (1955) is Satyajit Ray's famous first film about a young village boy named Apu and his sister
    Durga growing up in rural Bengal.
  teen: Filmed on real locations in Bengal on a shoestring budget with music by Ravi Shankar, Satyajit Ray's 1955 debut
    Pather Panchali won Best Human Document at Cannes and reshaped Indian realist cinema.
