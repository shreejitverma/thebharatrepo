debate: >-
  Scholars remain divided on two fronts: first, whether the early Brahmi script can pre-date Ashoka (against
  the 3rd-2nd century BCE epigraphic consensus); second, whether J. F. Fleet (1907) was right to read the
  Prakrit syntax as "relics of the Shakya kinsmen of the Buddha" rather than "relics of the Buddha, Lord of
  the Shakyas," though modern consensus largely prefers a Mauryan/post-Mauryan shrine honouring Buddha relics.
