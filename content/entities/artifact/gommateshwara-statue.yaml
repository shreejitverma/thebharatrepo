    note: "Inscriptions carved beside the feet in Old Kannada, Nagari (Marathi) and Grantha/Tamil credit Chavundaraya (minister to Western Ganga Rachamalla IV) with creating the image but carry no date; the consecration is usually placed in 981 CE, with proposals ranging from 978 to 993 CE."
claims:
  - text: Pedestal inscriptions record that Chavundaraya caused the image of Gommateshwara to be carved, while a 12th-century Hoysala record attributes the protective enclosure (suttalaya) around it to Gangaraja, general of Vishnuvardhana.
    grade: A
    sources:
      - src.rice-1889-inscriptions-sravana-belgola
      - src.harle-1994-art-architecture-indian-subcontinent
  - text: The monolith stands roughly 17.7 metres tall, carved in the kayotsarga standing meditation posture with climbing madhavi vines depicted twining up Bahubali's arms and legs.
    grade: A
