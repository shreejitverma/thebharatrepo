  iast: Gommaṭeśvara
  native: ಗೊಮ್ಮಟೇಶ್ವರ
summary: >-
  Carved from a single outcrop of fine-grained grey granite atop Vindhyagiri hill at Shravanabelagola, the 17.7-metre (58-foot) freestanding monolith of the Jain figure Bahubali (Gommateshwara) was commissioned around 981 CE by Chavundaraya, general and minister of the Western Ganga king Rachamalla IV. Multilingual inscriptions at its base in Kannada, Tamil, and Marathi record Chavundaraya's patronage and later Ganga and Hoysala maintenance, and every twelve years it hosts the Mahamastakabhisheka anointing ceremony.
summaries:
  kids: >-
    Standing 17.7 metres tall at Shravanabelagola in Karnataka, the Gommateshwara statue was carved from one giant granite boulder over a thousand years ago to show Bahubali standing still in deep meditation.
  teen: >-
    Commissioned c. 981 CE by the Western Ganga minister Chavundaraya, the 58-foot monolithic Bahubali statue at Shravanabelagola is inscribed at its feet in Kannada, Tamil, and Marathi and remains a major Jain pilgrimage monument.
