id: artifact.tiruvalangadu-shiva-nataraja
type: artifact
kind: art
names:
  en: Tiruvalangadu Shiva Nataraja
  iast: Tiruvālaṅkāṭu Śiva Naṭarāja
summary: "A celebrated Chola solid lost-wax bronze statue of Shiva Nataraja performing the Anandatandava cosmic dance (Government Museum, Chennai; height c. 114.5 cm), from the Vataranyesvara temple at Tiruvalangadu in Tiruvallur district, Tamil Nadu. Dating to the early-to-mid 11th century CE, it lacks its original flame-ring prabhamandala, revealing the poised silhouette of Shiva's extended arms and flying locks."
summaries:
  kids: "From a temple at Tiruvalangadu in Tamil Nadu, this graceful 11th-century Chola bronze shows Shiva dancing on a tiny demon, with its missing outer ring of flames making his outstretched arms stand out clearly."
  teen: >-
    One of the world's most reproduced Chola sculptures, the Tiruvalangadu Shiva Nataraja (c. 114.5 cm,
    Government Museum, Chennai) was unearthed alongside Rajendra Chola I's copper plates; the absence of its
    framing ring of flames spotlights the rhythm of its cast bronze silhouette.
region: Tiruvalangadu, Tiruvallur District, Tamil Nadu (housed in Government Museum, Chennai)
location:
  name: Vataranyesvara Temple hoard site, Tiruvalangadu
  lat: 13.13
  lon: 79.775
