claims:
  - text: "Cast in solid bronze by the lost-wax (madhucchistavidhana) method and measuring roughly 114.5 cm high, the figure comes from the Vataranyesvara temple at Tiruvalangadu and is now in the Government Museum, Chennai."
    grade: A
    sources:
      - src.dehejia-2002-sensuous-and-the-sacred
      - src.dehejia-1990-art-of-the-imperial-cholas
  - text: >-
      In standard Anandatandava iconography, four-armed Shiva balances on his bent right leg atop Apasmara
      Purusha while raising his left leg across his body, holding a damaru drum and flame in his upper hands,
      showing abhaya mudra, and sweeping his lower left arm across his chest in gajahasta.
    grade: A
    sources:
      - src.dehejia-1990-art-of-the-imperial-cholas
