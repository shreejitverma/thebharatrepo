names:
  en: Jambai Tamil-Brahmi Inscription of Atiyaman
  iast: Jampai Tamiḻ-Brāhmī Kalveṭṭu
summary: >-
  A single-line 1st-century CE Tamil-Brahmi inscription discovered in 1981 on a boulder cavern near Jambai in
  Villupuram (now Kallakurichi) district, Tamil Nadu. Reading "Satiyaputo Atiyan Neduman Anci itta pali", it
  solved a long historical puzzle by directly identifying the "Satiyaputa" kingdom named in Ashoka's Second
  Rock Edict with the Sangam chieftain dynasty of Atiyaman.
summaries:
  kids: >-
    Discovered in Tamil Nadu in 1981, this one-line rock carving uses the ancient clan title "Satiyaputo" for
    the chieftain Atiyaman Neduman Anci, matching a name Ashoka had carved on rocks centuries earlier.
  teen: >-
    Though only one sentence long, the Jambai cavern inscription (c. 1st century CE) revolutionized early
    South Indian history: by styling the Sangam hero Atiyaman Neduman Anci as "Satiyaputo," it definitively
    identified the "Satiyaputra" realm named alongside the Cholas, Pandyas, and Cheras in Ashoka's Rock Edict
    II.
region: Jambai near Tirukkoyilur, Kallakurichi/Villupuram District, Tamil Nadu, India
