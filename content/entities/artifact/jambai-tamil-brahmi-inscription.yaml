claims:
  - text: >-
      Discovered by the Tamil Nadu State Department of Archaeology in 1981 and numbered No. 59 in Mahadevan's
      corpus, the inscription reads: "Satiyaputo Atiyan Netuman Anci itta pali" ("The hermitage given by
      Atiyan Neduman Anci, the Satiyaputra").
    grade: A
    sources:
      - src.mahadevan-2003-early-tamil-epigraphy
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      It established that the "Satiyaputa" ("Satyaputra") listed among Ashoka's southern neighbours in Rock
      Edict II refers to the Adigaiman/Atiyaman ruling clan centred around Tagadur (Dharmapuri) and praised in
      Purananuru Sangam poetry.
    grade: B
    sources:
      - src.mahadevan-2003-early-tamil-epigraphy
      - src.thapar-2002-early-india
