id: artifact.bakhshali-manuscript
type: artifact
kind: science
names:
  en: Bakhshali Manuscript
  iast: Bakhśālī Hastalipi
  native: बख्शाली हस्तलिपि
summary: >-
  The Bakhshali manuscript is a fragmentary mathematical treatise on seventy birch-bark folios written in northwestern Sanskrit using the Sharada script, discovered in 1881 near Bakhshali (Mardan district, Pakistan) and housed in the Bodleian Library, Oxford. Famous for using a solid dot (bindu) as a placeholder zero in decimal positional notation alongside fractions and algebraic rules, its dating is contested between a 2017 Bodleian radiocarbon study yielding three dates across centuries and paleographic analysis placing the manuscript in the eighth to twelfth centuries CE.
summaries:
  kids: >-
    Found buried in a field in 1881 and written on seventy leaves of birch bark, the Bakhshali manuscript is an ancient Indian math workbook famous for using a solid dot to represent the number zero.
  teen: >-
    Preserved in Oxford's Bodleian Library, the birch-bark Bakhshali manuscript uses a dot (bindu) as a decimal placeholder zero and solves complex algebraic and mercantile problems; its age is debated between a 2017 radiocarbon test yielding three separate dates (3rd-4th, 7th-8th and 9th-10th centuries CE) and paleographic evidence pointing to a single 8th-12th century CE manuscript copy of an earlier treatise.
region: Gandhara (discovered at Bakhshali near Mardan, Pakistan; housed at the Bodleian Library, Oxford)
