names:
  en: Mysore War Rockets
  native: ಮೈಸೂರು ರಾಕೆಟ್
summary: >-
  Mysore war rockets were iron-cased black-powder artillery rockets developed and mass-deployed by Hyder Ali and Tipu Sultan during the Anglo-Mysore Wars (1767 to 1799 CE). Unlike European pasteboard fireworks rockets, Mysorean designs used hammered soft-iron cylindrical combustion tubes lashed to bamboo poles or sword blades, allowing higher chamber pressures and ranges of one to two kilometres. After capturing hundreds of examples at Srirangapatna in 1799 CE, British ordnance officer William Congreve reverse-engineered them into the Congreve rocket.
summaries:
  kids: "Engineers in Tipu Sultan's Mysore built iron-cased war rockets, launching fiery missiles up to two kilometres and inspiring European rocketry after 1799 CE."
  teen: >-
    Using hammered soft-iron cylinders instead of paper tubes to hold compacted black powder, Mysorean rocket brigades stunned British forces at Pollilur (1780) and Srirangapatna (1799), directly prompting William Congreve's British rocket programme.
region: Kingdom of Mysore (Karnataka and Tamil Nadu)
location: { name: "Srirangapatna, Karnataka", lat: 12.42, lon: 76.69 }
datings:
