id: artifact.pashupati-seal
type: artifact
kind: art
names:
  en: Pashupati Seal (Mohenjo-daro Seal 420)
  iast: Paśupati Mudrā
  native: पशुपति मुद्रा
summary: >-
  A Mature Harappan carved steatite stamp seal (DK 5175 / Mackay Seal 420) excavated by Ernest Mackay in 1928-1929
  in the DK-G Area of Mohenjo-daro, depicting a horned figure seated in a cross-legged yogic posture on a low
  dais surrounded by an elephant, a tiger, a rhinoceros, a water buffalo, and two antelopes beneath a seven-sign
  Indus inscription; focus of an enduring debate over John Marshall's 1931 identification of the figure as a
  "Proto-Shiva" (Pashupati, Lord of Animals).
summaries:
  kids: >-
    The Pashupati Seal is a small carved stone seal from Mohenjo-daro showing a horned figure sitting with crossed
    legs, surrounded by an elephant, a tiger, a rhino, a buffalo, and two deer.
  teen: >-
    Excavated at Mohenjo-daro in 1928-1929, Seal 420 shows a horned figure in a yogic pose surrounded by wild animals;
    John Marshall identified the figure in 1931 as an early form of Shiva Pashupati, an interpretation that remains
    actively debated among historians of Indian religion.
region: Mohenjo-daro, Sindh (housed in the National Museum, New Delhi)
location:
  name: Mohenjo-daro (DK-G Area, Block 1)
  lat: 27.3264
  lon: 68.1383
datings:
  - method: archaeological-stratigraphic
    range:
      earliest: "2500 BCE"
      latest: "1900 BCE"
      precision: century
      circa: true
    grade: A
    label: Mature Harappan Context at Mohenjo-daro (DK-G Area)
    sources:
