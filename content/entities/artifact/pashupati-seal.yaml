    note: >-
      Excavated by E. J. H. Mackay during the 1928-1929 season in Block 1 of the southern DK-G Area at Mohenjo-daro.
claims:
  - text: >-
      In 1931, Sir John Marshall identified the central figure on Seal 420 as a three-faced, ithyphallic, yogic
      "Proto-Shiva" in his aspect as Pashupati (Lord of Beasts), pointing to the water-buffalo horn headdress,
      cross-legged heel-to-heel posture (mulabandhasana), and surrounding wild animals as precursors to classical
      Shaiva iconography.
    grade: B
    sources:
      - src.marshall-1931-mohenjo-daro
      - src.parpola-2015-roots-of-hinduism
      - src.possehl-2002-indus-civilization
  - text: >-
      Doris Meth Srinivasan (1984) and other art historians challenged the direct identification with historical
      Shiva, arguing that the figure's facial profile resembles a bovine or buffalo-man hybrid rather than a
      three-headed anthropomorphic deity, that the vertical waistband ornament need not be ithyphallic, and that
      comparative Near Eastern "Master of Animals" and Elamite bull-man motifs offer structural parallels.
    grade: B
    sources:
      - src.srinivasan-1984-unhinging-siva
      - src.possehl-2002-indus-civilization
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      Other scholars including Alf Hiltebeitel and Asko Parpola situate the seal within a broader Harappan ritual
      complex centered on a water-buffalo deity, yogic asceticism, and royal-sacrificial symbolism that later
      contributed substratum elements to Vedic and Hindu traditions.
    grade: C
    sources:
      - src.parpola-1994-deciphering-indus-script
      - src.parpola-2015-roots-of-hinduism
      - src.kenoyer-1998-ancient-cities-indus
