debate: >-
  John Marshall (1931), followed with modifications by Asko Parpola (1994, 2015), interpreted the horned yogic
  figure on Seal 420 as a "Proto-Shiva" / Pashupati linking Harappan religion to later Shaivism, whereas Doris
  Meth Srinivasan (1984), Herbert Sullivan, and Gregory Possehl argued that the figure represents a composite
  divine buffalo-man or Master of Animals within an autonomous Bronze Age iconographic system.
