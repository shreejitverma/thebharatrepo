id: artifact.banawali-terracotta-plough
type: artifact
kind: science
names:
  en: Banawali Terracotta Plough Model
summary: >-
  A complete Mature Harappan terracotta model of an ard-plough (7 by 19.7 cm) excavated by R. S. Bisht at Banawali,
  Fatehabad District, Haryana (Period II, c. 2600-1900 BCE), providing direct physical confirmation of the wooden
  beam-and-share plough construction used across the Indus and Ghaggar-Hakra agricultural plains.
summaries:
  kids: >-
    A small clay plough found at Banawali in Haryana gives archaeologists a clue to how Harappan farmers
    may have made their wooden ploughs.
  teen: >-
    This terracotta model from Mature Harappan Banawali shows a curved beam and a pointed ploughshare.
    It gives archaeologists a clue to the design of wooden ploughs.
region: Banawali, Fatehabad District, Haryana, India
location:
  name: Banawali
  lat: 29.5978
  lon: 75.3931
datings:
  - method: archaeological-stratigraphic
    range:
      earliest: "2600 BCE"
      latest: "1900 BCE"
      precision: century
      circa: true
    grade: A
    label: Banawali Period II (Mature Harappan Context)
    sources:
      - src.possehl-2002-indus-civilization
      - src.singh-2008-ancient-early-medieval-india
      - src.wright-2010-ancient-indus
    note: >-
      Recovered from Mature Harappan Period II deposits at Banawali; fragmentary terracotta plough models were also
      reported from Mohenjo-daro, Harappa, and Cholistan.
claims:
  - text: >-
      Measuring 7 cm by 19.7 cm, the Banawali terracotta plough model combines a narrow pointed share and sole
      with a curved upward beam pierced near the tip for attaching a yoke harness.
    grade: A
    sources:
      - src.possehl-2002-indus-civilization
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      Together with the ploughed field at Kalibangan and cattle pathologies showing draft traction stress, the
      Banawali plough model confirms that bullock-drawn ard-ploughing was fundamental to Harappan cereal and pulse
      surplus production.
    grade: A
    sources:
      - src.wright-2010-ancient-indus
      - src.singh-2008-ancient-early-medieval-india
relations:
