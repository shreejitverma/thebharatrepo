debate: >-
  There is no inscription on the Didarganj Yakshi. While P. L. Gupta and many Indian scholars assign her to
  the 3rd century BCE Mauryan court on the strength of Chunar sandstone and lustrous polish, several art
  historians point to Mathura Kushan parallels for her coiffure, hip-sash, and organic volume to argue for a
  1st-2nd century CE date.
