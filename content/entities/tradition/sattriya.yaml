    note: In November 2000, the Sangeet Natak Akademi officially recognised Sattriya as a classical dance form.
claims:
  - text: Sattriya combines devotional narrative drama (Ankiya Nat / Bhaona) with Borgeet musical compositions and the khol
      drum and bhortal cymbals.
    grade: A
    sources:
      - src.neog-1973-sattriya-dances
      - src.sarma-1966-neo-vaisnavite-movement
  - text: Following Maheswar Neog's documentation of sattra rhythmic and movement lineages, the Sangeet Natak Akademi
      recognised Sattriya in 2000.
