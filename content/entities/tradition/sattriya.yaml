names:
  en: Sattriya
  iast: Sattrīyā
  native: সত্ৰীয়া নৃত্য
summary: "Sattriya is the neo-Vaishnava dance and dance-drama tradition nurtured since the sixteenth century inside the sattras (monasteries) of Assam. Originating in the Ankiya Nat plays and Borgeet devotional songs of Srimanta Sankardev and Madhavdev, it was transmitted by monastic performers (bhakats) before receiving Sangeet Natak Akademi recognition as a classical dance in 2000."
summaries:
  kids: "Sattriya is a classical dance from Assam that began in Vaishnava monasteries about five hundred years ago to enact devotional plays created by the saint Sankardev."
  teen: Rooted in the Ekasarana Vaishnava monasteries (sattras) of Assam and the fifteenth-sixteenth-century Ankiya Nat
    plays of Sankardev, Sattriya entered the national classical canon in 2000.
region: Assam (Majuli and Brahmaputra valley sattras)
location:
  name: Majuli, Assam
  lat: 26.95
  lon: 94.167
datings:
  - method: traditional-sampradaya
    range:
      earliest: 1449
      latest: 1568
