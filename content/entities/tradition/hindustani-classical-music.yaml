    note: Northern and southern musical practices diverged gradually after the 13th century, with dhrupad (15th-16th c.),
      khayal (18th c.) and named gharanas and Bhatkhande's 10-thaat system (19th-20th c.) shaping the modern concert
      tradition.
claims:
  - text: Hindustani music shares early Sanskrit theoretical roots (Natyashastra, Brihaddeshi, Sangita Ratnakara) with
      Carnatic music while incorporating Indo-Persian court genres, instruments and Brajbhasha lyric repertoires.
    grade: B
    sources:
      - src.grove-2001-hindustani-music
      - src.widdess-1995-ragas-early-indian-music
  - text: In the early twentieth century, V. N. Bhatkhande and V. D. Paluskar codified notation, the ten-thaat scale
      classification and public music schools that reshaped Hindustani classicism.
    grade: A
