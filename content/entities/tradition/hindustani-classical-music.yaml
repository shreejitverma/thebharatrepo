names:
  en: Hindustani Classical Music
  iast: Hindustānī Śāstrīya Saṅgīta
  native: हिन्दुस्तानी शास्त्रीय संगीत
summary: Hindustani classical music is the art music tradition of northern India, built on improvisatory and composed
  exploration of raga (melodic framework) and tala (rhythmic cycle). Emerging gradually over the second millennium CE
  through the interaction of Sanskrit musicological theory, devotional Braj and Hindi song, and Delhi Sultanate and
  Mughal court patronage, its main modern vocal genres are dhrupad and khayal.
summaries:
  kids: Hindustani music is the classical music of North India, played on instruments like sitar, sarod and tabla or sung
    in slow and fast ragas.
  teen: Sharing foundational raga and tala concepts with South Indian Carnatic music, Hindustani music evolved across
    North Indian courts and hereditary gharana lineages into vocal forms like dhrupad, khayal and thumri.
region: Northern, central, eastern and western Indian subcontinent
