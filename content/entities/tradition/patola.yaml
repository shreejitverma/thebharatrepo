    note: Textiles and trade inventories from the sixteenth to nineteenth centuries document Patola exports to Indonesia and
      Malaysia alongside domestic ceremonial use in Gujarat and Kerala.
claims:
  - text: In Patan double ikat, warp and weft bundles are resist-tied with cotton thread and dyed sequentially before
      weaving, producing identical crisp geometric, floral (navaratna, pan bhat) or animal motifs on both cloth faces.
    grade: A
    sources:
      - src.buhler-fischer-1979-patola-gujarat
      - src.crill-1998-indian-ikat-textiles
  - text: Ruth Barnes and John Guy trace how exported Patan patolas became high-status ritual heirlooms (cindai / patola)
      across Indonesia, shaping local double-ikat geringsing and motif traditions.
    grade: B
    sources:
      - src.barnes-1989-origins-patola
      - src.guy-1998-woven-cargoes
