summary: Patola is the rare double-ikat silk weaving tradition of Patan in northern Gujarat, practised primarily by the
  Salvi community. In true double ikat, both the warp and weft silk threads are separately tied and dyed prior to
  weaving so that every intersecting square aligns cleanly on the loom; Patan patolas were historically prized across
  India and exported as sacred heirloom cloths throughout maritime Southeast Asia.
summaries:
  kids: Patola is a special silk cloth from Patan in Gujarat where artisans tie and dye both sets of threads before
    weaving so crisp patterns appear cleanly on both sides.
  teen: Woven in Patan by Salvi master weavers, Patola is a double-ikat silk where pre-dyed warp and weft threads
    interlock exactly on the loom, historically treasured across Gujarat and Southeast Asia.
