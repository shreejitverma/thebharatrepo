names:
  en: Kalamkari
  iast: Kalamakārī
  native: కలంకారీ
summary: "Kalamkari ('pen-work') denotes the mordant- and resist-dyed cotton textile painting traditions of coastal and southern Andhra Pradesh: hand-drawn narrative temple hangings of Srikalahasti using a bamboo kalam pen, and woodblock-printed, wax-resist textiles of Machilipatnam (Masulipatam). Rooted in early-modern Coromandel dye chemistry, Coromandel painted chintz was a major commodity of early modern global textile trade."
summaries:
  kids: Kalamkari is cloth art from Andhra Pradesh made with a bamboo pen and natural dyes like myrobalan, madder root and
    indigo to paint temple stories and floral vines.
  teen: Encompassing Srikalahasti's hand-drawn temple cloths and Machilipatnam's block-printed chintz, Kalamkari relies on
    multistep mordant and resist dyeing with natural botanical extracts.
region: Andhra Pradesh (Srikalahasti and Machilipatnam)
