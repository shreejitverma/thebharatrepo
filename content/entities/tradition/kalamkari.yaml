claims:
  - text: Kalamkari relies on tannin pre-treatment (myrobalan and buffalo milk), iron-acetate black, alum mordant dipped in
      madder root (Rubia/Oldenlandia) for fast reds, and beeswax resist with indigo vats for blues.
    grade: A
    sources:
      - src.varadarajan-1982-kalamkari
      - src.rosenfield-2020-madder-kalamkari
  - text: "The two main Andhra centres diverge in technique and patronage: Srikalahasti uses freehand bamboo pens (kalam)
      for Hindu temple narratives, whereas Machilipatnam combines carved wooden blocks and pens for export and court
      hangings."
    grade: A
    sources:
      - src.divakala-2017-kalamkari-srikalahasti
      - src.varadarajan-1982-kalamkari
