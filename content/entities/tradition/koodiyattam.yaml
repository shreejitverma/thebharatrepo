claims:
  - text: UNESCO proclaimed Koodiyattam (Kutiyattam, Sanskrit theatre) a Masterpiece in 2001 and inscribed it on the
      Representative List of Intangible Cultural Heritage in 2008.
    grade: A
    sources:
      - src.unesco-2008-kutiyattam
  - text: Performances stretch a single act of a Sanskrit play (such as works attributed to Bhasa or Shaktibhadra) over many
      nights using codified eye acting (netrabhinaya), hand mudras and stage manuals (attaprakaram).
    grade: A
