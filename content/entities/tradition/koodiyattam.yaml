names:
  en: Koodiyattam
  iast: Kūṭiyāṭṭam
  native: കൂടിയാട്ടം
summary: Koodiyattam ('combined acting') is the traditional Sanskrit temple theatre of Kerala, performed by Chakyar
  actors and Nangiar actresses with Nambiar drummers on the copper mizhavu pot-drum inside temple playhouses
  (koothambalams). Attested in Kerala from at least the Kulasekhara period around the ninth to eleventh centuries CE, it
  was proclaimed a UNESCO Masterpiece in 2001 and inscribed on the Representative List in 2008.
summaries:
  kids: Koodiyattam is a very old Sanskrit theatre tradition from Kerala performed in temple halls with giant copper
    drums, expressive eye movements and detailed hand gestures.
  teen: India's oldest surviving Sanskrit theatre tradition, Koodiyattam pairs classical plays by Bhasa, Harsha and
    Kulasekhara Varman with elaborate Malayalam commentary and mizhavu drumming; UNESCO inscribed it in 2008.
