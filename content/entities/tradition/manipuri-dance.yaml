summary: Manipuri dance (Jagoi) is the classical devotional dance tradition of Manipur in northeastern India, noted for
  gentle, continuous circular motion, restrained facial expression and elaborate cylindrical kumil/potloi skirts.
  Closely bound to Meitei Vaishnavism, its celebrated Ras Lila cycles were systematised in the eighteenth century under
  King Bhagyachandra alongside older Lai Haraoba ritual dances.
summaries:
  kids: Manipuri is a gentle, flowing classical dance from Manipur where dancers wear bell-shaped skirts and glide
    gracefully to the rhythm of the pung drum.
  teen: Combining older Meitei ritual traditions such as Lai Haraoba with eighteenth-century Gaudiya Vaishnava Ras Lila
    choreography under King Bhagyachandra, Manipuri is marked by fluid movement and devotional restraint.
