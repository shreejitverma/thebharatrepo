claims:
  - text: During the annual Anasara period when the wooden Jagannath icons are withdrawn for renewal, chitrakara painters
      supply painted cloth substitute icons (anasara patti) for worship at Puri and across Odisha.
    grade: A
    sources:
      - src.fischer-pathy-2012-absence-jagannatha
  - text: Traditional pigments include conch-shell white (sankha), lampblack, cinnabar/vermilion (hingula), yellow orpiment
      (haritala) and lac-resin red, sealed with wood-apple gum and lacquered.
    grade: A
    sources:
      - src.fischer-pathy-2012-absence-jagannatha
      - src.williams-1996-two-headed-deer
