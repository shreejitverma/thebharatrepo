names:
  en: Pattachitra
  iast: Paṭṭacitra
  native: ପଟ୍ଟଚିତ୍ର
summary: Pattachitra ('cloth-picture') is the traditional narrative scroll and icon painting craft of Odisha, centred at
  Puri and the artisan village of Raghurajpur (with related traditions in West Bengal). Chitrakara painters prepare
  tamarind-seed and chalk-stiffened cotton cloth (pata) and use mineral and stone pigments to depict Jagannath icons,
  Dashavatara, Krishna Lila and the ritual Anasara panels.
summaries:
  kids: Pattachitra artists in Odisha paint colourful stories on stiffened cotton cloth using natural colours from stones,
    shells and soot, especially showing Lord Jagannath of Puri.
  teen: Practised by chitrakara families in Puri and Raghurajpur, Odishan Pattachitra combines cloth-based mineral
    painting and palm-leaf etching (talapatra) closely tied to the Jagannath temple calendar.
region: Odisha (Puri and Raghurajpur) and eastern India
