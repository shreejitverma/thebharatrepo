id: tradition.mughal-miniature-painting
type: tradition
kind: art
names:
  en: Mughal Miniature Painting
  iast: Mughal Laghucitra
  native: मुग़ल लघुचित्र
summary: The Mughal miniature school developed from the mid-sixteenth century in the imperial ateliers (tasvirkhana) of
  Humayun, Akbar, Jahangir and Shah Jahan. Uniting Safavid Persian manuscript craft with Indian indigenous painters
  (such as Basawan and Daswanth) and European naturalism, Mughal workshops produced illustrated histories (Hamzanama,
  Akbarnama), naturalistic flora and fauna studies, and formal court portraits.
summaries:
  kids: Mughal miniature paintings are tiny, jewel-like pictures painted for Mughal emperors showing battles, royal
    courts, birds, flowers and stories with astonishing detail.
  teen: Beginning under Humayun and Akbar in the 1550s, the Mughal imperial workshop blended Persian technique, Indian
    painters and European perspective into narrative histories and meticulous portraits under Jahangir and Shah Jahan.
region: Northern India (Delhi, Agra, Fatehpur Sikri, Lahore)
location:
  name: Agra, Uttar Pradesh
  lat: 27.179
  lon: 78.021
datings:
  - method: documentary
    range:
      earliest: 1550
      latest: 1857
      precision: decade
      circa: true
    grade: A
    label: Imperial atelier founding under Humayun and Akbar through late Mughal Delhi
    sources:
