      - src.ehnbom-losty-2003-indian-painting-grove
    note: Humayun recruited Safavid masters Mir Sayyid Ali and Abd al-Samad in the 1550s; imperial production peaked under
      Akbar, Jahangir and Shah Jahan and continued in provincial and late Mughal workshops until 1857.
claims:
  - text: Akbar's imperial atelier employed both Persian masters and numerous Indian artists such as Daswanth, Basawan, Kesu
      Das and Lal on collaborative projects like the 1,400-folio Hamzanama and Akbarnama.
    grade: A
    sources:
      - src.beach-1992-mughal-rajput-painting
      - src.abulfazl-1873-ain-i-akbari
  - text: Under Jahangir (r. 1605-1627), individual connoisseurship fostered solo masterworks by artists such as Mansur,
      Abu'l Hasan and Bichitr, known for natural history studies and allegorical royal portraits.
    grade: A
    sources:
