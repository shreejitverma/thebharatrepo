id: tradition.deccani-painting
type: tradition
kind: art
names:
  en: Deccani Painting
  iast: Dakkanī Citrakalā
  native: दक्खिनी चित्रकला
summary: Deccani painting flourished between the sixteenth and early eighteenth centuries at the Deccan sultanates of
  Ahmadnagar, Bijapur and Golconda, and later at Hyderabad. Combining Persian, Ottoman, European and South Indian
  Vijayanagara visual traditions, it is celebrated for dreamlike lavender-and-gold colour harmonies, lyrical portraiture
  (notably under Ibrahim Adil Shah II) and lush fantasy landscapes.
summaries:
  kids: Deccani painting grew in royal workshops at Bijapur, Golconda and Ahmadnagar, creating dreamy, fantastical
    pictures full of rich purple, gold and glowing gardens.
  teen: Distinct from Mughal naturalism, the courts of Bijapur, Ahmadnagar and Golconda forged Deccani miniature art with
    Persianate ornament, Vijayanagara heritage and poetic, atmospheric colour.
region: Deccan plateau (Bijapur, Golconda, Ahmadnagar, Hyderabad)
location:
  name: Bijapur (Vijayapura), Karnataka
  lat: 16.83
  lon: 75.71
datings:
  - method: art-historical
    range:
      earliest: 1560
      latest: 1750
      precision: decade
      circa: true
    grade: B
    label: Dated manuscripts such as Tarif-i Husain Shahi and Nujum al-Ulum through Hyderabad works
    sources:
      - src.zebrowski-1983-deccani-painting
      - src.haidar-sardar-2015-sultans-deccan
