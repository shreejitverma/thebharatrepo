    note: Anchored by the Ahmadnagar Tarif-i Husain Shahi (c. 1565), Bijapur's 1570 Nujum al-Ulum, royal works under Ibrahim
      Adil Shah II (r. 1580-1627), and 17th-century Golconda ateliers.
claims:
  - text: At Bijapur, Sultan Ibrahim Adil Shah II (author of the Kitab-i Nauras) patronised masters such as the Bodleian and
      St. Petersburg painters, producing poetic images of rulers, ascetics and ragamalas.
    grade: B
    sources:
      - src.zebrowski-1983-deccani-painting
      - src.haidar-sardar-2015-sultans-deccan
  - text: Golconda workshops blended Persianate, Indian and Dutch-inspired botanical elements in works like the Kulliyat of
      Muhammad Quli Qutb Shah and marbled or fantastical flora paintings.
    grade: B
    sources:
      - src.haidar-sardar-2015-sultans-deccan
      - src.dallapiccola-2003-deccani-south-grove
