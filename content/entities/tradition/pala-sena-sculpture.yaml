    note: Susan L. Huntington anchored the stylistic sequence using dozens of stone and bronze images bearing regnal-year inscriptions of Pala, Chandra, Varman and Sena monarchs.
claims:
  - text: Dated image inscriptions from Bihar and Bengal allow art historians to trace a continuous stylistic evolution from eighth-century Gupta-derived volumes to crisp, intricately framed twelfth-century Sena steles.
    grade: B
    sources:
      - src.huntington-1984-pala-sena-sculpture
  - text: Pala-period bronze hoards from Nalanda and Kurkihar demonstrate advanced lost-wax casting and served as portable models that influenced Tibetan and Southeast Asian Buddhist iconography.
    grade: B
    sources:
      - src.huntington-1984-pala-sena-sculpture
