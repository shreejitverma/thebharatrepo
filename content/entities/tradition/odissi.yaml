names:
  en: Odissi
  iast: Oḍiśī
  native: ଓଡ଼ିଶୀ
summary: Odissi is the classical dance tradition of Odisha, characterised by the basic square stance (chauk), the
  three-bend posture (tribhanga) and lyric abhinaya often set to Jayadeva's Gita Govinda. Drawing on the hereditary
  mahari ritual tradition of the Jagannath temple at Puri, boy performers (gotipuas) and sculpted temple reliefs, its
  modern stage grammar was codified in the 1950s.
summaries:
  kids: Odissi is a graceful classical dance from Odisha whose curved three-bend poses resemble ancient stone sculptures
    on Odisha's temples.
  teen: Reconstructed in the mid-twentieth century from Odisha's temple mahari and gotipua traditions, temple sculpture
    and Sanskrit treatises, Odissi pairs sculptural geometry with lyrical poetry such as the Gita Govinda.
region: Odisha (Puri, Bhubaneswar, Cuttack)
location:
  name: Puri, Odisha
  lat: 19.813
  lon: 85.831
