names:
  en: Carnatic Music
  iast: Karṇāṭaka Saṅgīta
  native: கர்நாடக இசை / కర్ణాటక సంగీతం
summary: Carnatic (Karnatak) music is the classical art music tradition of southern India, balancing a vast composed
  repertoire (kritis and varnams) with structured improvisation (manodharma) within raga and tala. Anchored in the
  72-melakarta parent-scale framework, Purandara Dasa's pedagogy and the late-eighteenth-century Thanjavur Trinity, its
  modern concert format (kutcheri) consolidated in early twentieth-century Madras.
summaries:
  kids: Carnatic music is the classical music of South India, known for devotional songs called kritis, fast improvised
    note patterns and percussion rhythms on the mridangam.
  teen: Built on raga melody, tala rhythm, composed kritis and improvised manodharma sections, South Indian Carnatic music
    draws on Purandara Dasa, Venkatamakhin's 72-melakarta scheme and the Thanjavur Trinity.
region: South India (Tamil Nadu, Karnataka, Andhra Pradesh, Telangana, Kerala)
