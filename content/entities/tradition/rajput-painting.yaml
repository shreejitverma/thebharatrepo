claims:
  - text: Early Mewar milestones include the 1605 Chawand Ragamala and Sahibdin's vibrant mid-seventeenth-century Bhagavata
      Purana and Ramayana series, while Bundi and Kota became famed for lush monsoon and hunting paintings.
    grade: A
