summary: Rajput painting encompasses the courtly miniature schools of Rajasthan and central India - notably Mewar,
  Bundi, Kota, Amber-Jaipur, Bikaner, Marwar and Kishangarh - flourishing from the late sixteenth to the nineteenth
  centuries. Drawing on pre-Mughal Chaurapanchasika and Western Indian manuscript idioms as well as Mughal techniques,
  Rajput ateliers excelled in devotional Krishna cycles, Ragamala series and court scenes.
summaries:
  kids: Rajput painting includes bright, vivid miniature art made for royal courts in Rajasthan such as Mewar, Bundi and
    Kishangarh, depicting Krishna stories, music modes and royal hunts.
  teen: Centred at Rajasthan courts including Mewar, Bundi-Kota and Kishangarh from the late sixteenth to nineteenth
    centuries, Rajput ateliers fused indigenous bold colour with Mughal portraiture into Bhakti and Ragamala art.
region: Rajasthan and central India (Mewar, Bundi, Kota, Kishangarh, Bikaner, Jaipur)
