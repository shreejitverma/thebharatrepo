id: tradition.kashmir-shaivism
type: tradition
kind: dharma
names:
  en: Kashmir Shaivism
  native: कश्मीर शैव दर्शन
summary: >-
  Kashmir Shaivism is the modern name for the non-dual Shaiva traditions of Kashmir that flourished
  from about the 9th to the 12th century CE: the Spanda teaching linked to Vasugupta's Shiva Sutras, the
  Pratyabhijna ("recognition") philosophy of Somananda and Utpaladeva, and the Trika and Krama
  tantric systems synthesised by Abhinavagupta.
summaries:
  kids: >-
    Kashmir Shaivism is a way of thinking about Shiva that grew up in Kashmir. It teaches that
    everything is part of Shiva, and that we only need to recognise this.
  teen: >-
    Its philosophers taught that reality is one divine consciousness, Shiva, which freely appears as
    the world. Liberation is "recognition" (pratyabhijna) that one's own awareness is that
    consciousness.
region: Kashmir
location: { name: Srinagar, lat: 34.08, lon: 74.80 }
