  iast: Pahāṛī Citrakalā
  native: पहाड़ी चित्रकला
summary: "Pahari painting ('painting of the hills') refers to miniature schools nurtured in the Himalayan foothill states of Himachal Pradesh and Jammu (such as Basohli, Guler, Kangra, Chamba, Nurpur and Mandi) from the seventeenth to nineteenth centuries. Its styles range from the jewel-like primary colours of early Basohli Rasamanjari series to the lyrical naturalism of Guler and Kangra under Sansar Chand."
summaries:
  kids: Pahari painting comes from small mountain kingdoms in the Himalayan foothills like Basohli and Kangra, famous for
    glowing colours and tender scenes of Krishna and nature.
  teen: Flourishing across Himalayan hill courts from the 1660s to the 1840s, Pahari painting evolved from the bold reds
    and beetle-wing highlights of Basohli to the lyrical naturalism of Nainsukh, Guler and Kangra.
region: Western Himalayan foothills (Himachal Pradesh, Jammu and Punjab Hills)
