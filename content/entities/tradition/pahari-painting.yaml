claims:
  - text: Early Basohli workshops under Raja Kirpal Pal produced saturated-yellow and red miniatures accented with
      iridescent green beetle-wing cases, notably the 1694-1695 Rasamanjari and 1730 Gita Govinda.
    grade: A
    sources:
      - src.archer-1973-pahari-painting
      - src.glynn-goswamy-2003-pahari-eastern-grove
  - text: From the mid-eighteenth century, Pandit Seu's sons Manaku and Nainsukh pioneered naturalistic space, delicate line
      and atmospheric landscape that culminated in the Kangra Gita Govinda and Bhagavata Purana series.
    grade: B
    sources:
