id: tradition.ekasarana-dharma
type: tradition
kind: dharma
names:
  en: Ekasarana Dharma
  iast: Ekaśaraṇa Nāma Dharma
  native: একশৰণ নাম ধৰ্ম
summary: >-
  Ekasarana Dharma ("shelter in the One", also called Mahapurushia Dharma) is the Assamese
  Neo-Vaishnavite bhakti tradition propagated by Srimanta Sankardeva and his chief disciple Madhavdeva
  in the late fifteenth and sixteenth centuries CE. Emphasising communal congregational singing
  (nama-kirtana) of Krishna rather than blood sacrifice or image-ritualism, it reshaped Assamese
  literature, Sattriya dance-drama and village namghar and satra institutions.
summaries:
  kids: >-
    Started by Srimanta Sankardeva in Assam around 500 years ago, Ekasarana Dharma teaches devotion
    to one God through community singing, prayer halls called namghars, plays and dance.
  teen: >-
    Founded by Sankardeva and systematised by Madhavdeva, Ekasarana Dharma rejected animal sacrifice
    and rigid ritual hierarchies in favour of congregational singing, vernacular scripture (Kirtan
    Ghosha) and monastic-community satras.
region: Assam and Cooch Behar
location: { name: "Bordowa / Majuli, Assam", lat: 26.404, lon: 92.607 }
