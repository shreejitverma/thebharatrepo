claims:
  - text: Ekasarana theology focuses on dasya-bhava (servitude) toward a single supreme deity (Vishnu-Krishna) through listening (shravana) and chanting (kirtana), eschewing caste exclusions in congregation and Shakta animal sacrifice.
    grade: B
    sources:
      - src.neog-1965-sankaradeva-and-his-times
      - src.sarma-1966-neo-vaisnavite-movement
  - text: Sankardeva and Madhavdeva authored foundational Assamese devotional works including the Kirtan Ghosha, Namghosha, Borgeet lyrics and Ankiya Nat plays performed at namghars and satras.
    grade: A
