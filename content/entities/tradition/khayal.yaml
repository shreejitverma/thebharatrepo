claims:
  - text: A full khayal presentation typically pairs a slow-tempo bada khayal with a faster chhota khayal, accompanied by
      tabla and sarangi or harmonium.
    grade: A
    sources:
      - src.wade-1984-khyal
      - src.grove-2001-hindustani-music
  - text: Eighteenth-century court composers Niyamat Khan (Sadarang) and Firoz Khan (Adarang) under Mughal emperor Muhammad
      Shah are documented as key architects of classical khayal.
    grade: B
    sources:
      - src.wade-1984-khyal
      - src.schofield-2021-emotions-indian-music
debate: Hereditary gharanas frequently trace khayal's invention either to Amir Khusrau around 1300 CE or to Sultan
  Husain Shah Sharqi of Jaunpur in the fifteenth century. Musicologists such as Bonnie Wade and Jonathan Katz find no
  contemporary fourteenth-century evidence for Amir Khusrau's authorship of khayal, placing the form's transformation
  into high classical art in the late seventeenth and eighteenth centuries.
