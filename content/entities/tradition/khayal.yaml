names:
  en: Khayal
  iast: Khyāl
  native: ख़याल / ख्याल
summary: Khayal (from Persian-Arabic khayal, 'imagination' or 'thought') is the dominant vocal genre of modern
  Hindustani classical music. Performed with tabla and melodic accompaniment, it pairs a short poetic composition
  (bandish) with extensive melodic improvisation (alap, bol-bant, sargam and rapid taans). Documented clearly from
  early-eighteenth-century Delhi under Sadarang and Adarang, its earlier origins are debated.
summaries:
  kids: Khayal is the main vocal style of North Indian classical music today, where singers take a short song and weave
    imaginative slow melodies and fast musical runs around it.
  teen: Meaning 'imagination', khayal rose to dominance in eighteenth-century Mughal Delhi under Sadarang and Adarang and
    became the central form of the nineteenth- and twentieth-century Hindustani gharanas.
