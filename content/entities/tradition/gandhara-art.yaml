names:
  en: Gandhara Art
  iast: Gandhāra Kalā
  native: गन्धार कला
summary: >-
  Gandhara art was a major sculptural and architectural tradition that flourished in the Peshawar basin, Swat valley, Taxila and eastern Afghanistan from the first century BCE to the fifth century CE, reaching its height under Kushan rule. Carving primarily in grey-blue phyllite schist and later modelling in stucco and clay, Gandharan workshops synthesized Indian Buddhist iconography with Hellenistic and Roman naturalistic drapery and Iranian royal motifs to create some of the earliest anthropomorphic images of the Buddha and narrative reliefs of his life.
summaries:
  kids: >-
    Gandhara art developed in northwestern India, Pakistan and Afghanistan, where sculptors combined Indian Buddhist stories with Greek- and Roman-style wavy hair and folded robes.
  teen: >-
    Flourishing under Indo-Scythian, Indo-Parthian and especially Kushan patronage (first to fifth centuries CE), the Gandhara school used grey schist and stucco to produce narrative reliefs and anthropomorphic Buddha and Bodhisattva sculptures.
region: Gandhara, Swat (Uddiyana), Taxila and eastern Afghanistan
location: { name: "Taxila, Punjab", lat: 33.746, lon: 72.787 }
datings:
  - method: art-historical
    range: { earliest: "50 BCE", latest: 500, precision: century, circa: true }
    grade: B
