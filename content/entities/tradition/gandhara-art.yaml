    note: Kurt Behrendt's architectural and sculptural phasing places narrative schist reliefs and early iconic Buddha images from the first century CE (Kushan period) through the monumental stucco and clay phases of the third to fifth centuries CE.
claims:
  - text: Gandharan sculptors depicted the Buddha in realistic, heavy-folded monastic robes resembling the Greco-Roman himation or toga, wavy hair gathered in an ushnisha topknot, and Apollo-like facial modelling.
    grade: A
    sources:
      - src.behrendt-2004-buddhist-architecture-gandhara
      - src.stoneman-2019-greek-experience-of-india
  - text: Along with the contemporary school of Mathura, Gandhara produced some of the earliest surviving anthropomorphic statues of the Buddha and princely Bodhisattvas such as Maitreya and Avalokiteshvara during the first and second centuries CE.
    grade: B
    sources:
      - src.behrendt-2004-buddhist-architecture-gandhara
      - src.quintanilla-2007-sculpture-at-mathura
