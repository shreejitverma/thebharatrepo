claims:
  - text: Gangesha Upadhyaya's Tattvachintamani in Mithila restructured classical Nyaya around the four sources of knowledge (pramana) - perception, inference, analogy and testimony.
    grade: A
    sources:
      - src.potter-2015-nyaya-vaisesika-up-to-gangesa
      - src.phillips-2012-epistemology-classical-india
  - text: Raghunatha Shiromani brought Navya-Nyaya to prominence in Navadvipa, Bengal, initiating a technical analytical style whose terminology spread across Sanskrit philosophy, grammar and dharma-shastra.
    grade: B
