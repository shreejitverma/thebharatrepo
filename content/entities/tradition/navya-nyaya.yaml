names:
  en: Navya-Nyaya
  iast: Navya-Nyāya
  native: नव्यन्याय
summary: "Navya-Nyaya (\"New Logic\") was a formal school of Indian epistemology, philosophical semantics and logic initiated in Mithila (northern Bihar) by Gangesha Upadhyaya around the early fourteenth century CE in his Tattvachintamani, building on Udayana. From the late fifteenth century onward, Raghunatha Shiromani and his successors established Navadvipa in Bengal as its leading centre, shaping scholarly debate across early modern India."
summaries:
  kids: >-
    Starting in northern Bihar and later thriving at Navadvipa in Bengal, Navya-Nyaya developed a
    super-precise system of Sanskrit logic to analyse how we know what is true.
  teen: >-
    Founded by Gangesha Upadhyaya in Mithila and expanded by Raghunatha Shiromani in Navadvipa,
    Navya-Nyaya created a technical relational vocabulary for epistemology, inference and language
    that dominated Indian scholarship through the early modern era.
region: Mithila (north Bihar) and Navadvipa (Nadia district, West Bengal)
location: { name: "Navadvipa, Nadia, West Bengal", lat: 23.404, lon: 88.366 }
