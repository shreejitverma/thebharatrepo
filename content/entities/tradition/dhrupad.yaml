names:
  en: Dhrupad
  iast: Dhrupada
  native: ध्रुपद
summary: "Dhrupad is generally regarded as the oldest surviving classical vocal genre of Hindustani music, distinguished by an extended unmetered alap using non-lexical syllables (nom-tom) followed by a four-part composition (bandish) in Braj or Sanskrit accompanied by the pakhawaj barrel drum. Flourishing from the late fifteenth century at Gwalior under Raja Man Singh Tomar and later at the Mughal court under Akbar, it continues through lineages such as the Dagar bani."
summaries:
  kids: Dhrupad is an ancient, meditative style of North Indian classical singing accompanied by the two-headed pakhawaj
    drum and deep sustained notes.
  teen: Patronised by Raja Man Singh Tomar of Gwalior and Emperor Akbar's court musician Tansen, dhrupad opens with a long
    unmetered alap before moving into rhythmic compositions accompanied by the pakhawaj.
region: Northern and central India (Gwalior, Agra, Delhi, Rajasthan)
