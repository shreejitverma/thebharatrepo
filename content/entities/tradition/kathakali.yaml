claims:
  - text: Kathakali draws martial body training (kalarippayattu) and Sanskrit gesture conventions from Koodiyattam into a
      silent actor's theatre accompanied by chenda, maddalam and vocalists.
    grade: B
    sources:
      - src.zarrilli-2000-kathakali-dance-drama
      - src.zarrilli-1998-when-the-body-becomes-all-eyes
  - text: Its makeup (vesham) classifies characters visually using colour codes such as pacha (green) for noble heroes and
      kathi (knife) for anti-heroes.
    grade: A
    sources:
      - src.zarrilli-2000-kathakali-dance-drama
      - src.madhavan-2025-slowness-kathakali
