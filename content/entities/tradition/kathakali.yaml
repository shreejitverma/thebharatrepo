names:
  en: Kathakali
  iast: Kathakaḷi
  native: കഥകളി
summary: Kathakali ('story-play') is a classical dance-drama of Kerala in which actor-dancers communicate epic and
  Puranic narratives entirely through codified hand gestures (mudras), facial muscles and eye movements while vocalists
  sing the Malayalam-Sanskrit attakkatha libretto. Crystallising in the seventeenth and eighteenth centuries from
  Krishnanattam and Ramanattam, it was reorganised at Kerala Kalamandalam in 1930.
summaries:
  kids: Kathakali is a dramatic story-dance from Kerala where actors wear colourful painted faces and towering crowns,
    acting out epic tales without speaking a single word.
  teen: Developed in Kerala between the seventeenth and eighteenth centuries out of temple traditions like Krishnanattam
    and Koodiyattam, Kathakali combines vigorous martial training, colour-coded makeup and elaborate sign-language
    storytelling.
