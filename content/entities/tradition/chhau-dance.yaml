names:
  en: Chhau Dance
  iast: Chhau
  native: छऊ / ছৌ / ଛଉ
summary: "Chhau is a martial and dramatic dance tradition of eastern India performed during regional spring festivals
  such as Chaitra Parva across three primary styles: Seraikella (Jharkhand) and Purulia (West Bengal), which use
  expressive masks, and Mayurbhanj (Odisha), performed unmasked. Blending mock-combat movements with epic narratives, it
  was inscribed on the UNESCO Representative List in 2010."
summaries:
  kids: Chhau is an energetic dance from Jharkhand, West Bengal and Odisha that mixes martial-arts leaps with epic
    stories; dancers in Seraikella and Purulia wear colourful masks.
  teen: Practised in three distinct regional idioms (Seraikella, Purulia and Mayurbhanj), Chhau fuses indigenous martial
    exercise (pharikhanda) with epic and folk themes and earned UNESCO heritage status in 2010.
region: Eastern India (Jharkhand, West Bengal, Odisha)
