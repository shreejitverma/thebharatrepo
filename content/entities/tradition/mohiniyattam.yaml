  native: മോഹിനിയാട്ടം
summary: Mohiniyattam ('dance of the enchantress') is a classical solo women's dance tradition of Kerala characterised
  by gentle swaying torso movements (andolika) and the lasya (graceful) aesthetic, performed in a cream-and-gold kasavu
  costume. Documented at Travancore under Maharaja Swati Tirunal in the nineteenth century, it was revived at Kerala
  Kalamandalam in the 1930s and expanded in the late twentieth century.
summaries:
  kids: Mohiniyattam is a graceful solo dance from Kerala in which dancers wear white-and-gold saris and move with gentle
    swaying steps like palm trees in a breeze.
  teen: Patronised at the nineteenth-century Travancore court of Swati Tirunal and revitalised at Kerala Kalamandalam in
    the twentieth century, Mohiniyattam embodies the gentle lasya dance tradition of Kerala.
