  native: कथक
summary: Kathak is the major classical dance tradition of northern India, distinguished by intricate rhythmic footwork
  (tatkar), rapid pirouettes (chakkars) and expressive storytelling (abhinaya). Named after the kathakas (hereditary
  storytellers), its modern gharanas at Lucknow, Jaipur and Banaras took shape across Bhakti devotional, Rajput and
  Indo-Persian courtly settings before twentieth-century classicisation.
summaries:
  kids: Kathak is a classical dance from North India famous for fast spinning turns, rhythmic footwork with rows of ankle
    bells and expressive stories.
  teen: Taking its name from the kathakas (storytellers) of North India, Kathak developed across Rajput, Mughal and Awadhi
    courts into major lineages (Lucknow, Jaipur, Banaras) before being staged as a modern classical form.
region: Northern India (Lucknow, Jaipur, Banaras, Delhi)
