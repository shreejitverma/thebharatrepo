id: tradition.vedic-chanting
type: tradition
kind: dharma
names:
  en: Vedic Chanting
  iast: Vedagāna
  native: वेदमन्त्रगान
summary: >-
  Vedic chanting is the liturgical and pedagogical recitation of Vedic mantras according to strict
  phonetic rules of pitch accent (svara), syllable duration (matra), and articulation codified in
  the Pratishakhyas and Shiksha texts. It encompasses the three-tone recitation of the Rigveda and
  Yajurveda as well as the multi-note musical chant (samagana) of the Samaveda. UNESCO proclaimed
  it a Masterpiece in 2003 and inscribed it on the Representative List in 2008.
summaries:
  kids: >-
    In Vedic chanting, students learn when to raise or lower their voices and how long to hold each
    syllable. These rules help pass the hymns from one generation to the next.
  teen: >-
    The Pratishakhya and Shiksha texts describe rules for pitch, syllable length and pronunciation.
    The Rigveda and Yajurveda use three pitch accents, while Samaveda chanting uses more elaborate
    melodies.
region: Pan-Indian
datings:
  - method: scholarly-consensus
    range: { earliest: "1500 BCE", latest: 2003, precision: century, circa: true }
    grade: B
    label: Continuous liturgical practice from the Vedic period to UNESCO recognition
    sources:
      - src.unesco-2003-tradition-vedic-chanting
      - src.gonda-1975-vedic-literature
      - src.staal-1983-agni-fire-altar
    note: >-
      Rooted in the composition of the Vedic Samhitas (c. 1500 to 1000 BCE) and still practiced by
      surviving Vedic shakhas across India, recognized by UNESCO in 2003.
  - method: documentary
    range: { earliest: "2003", latest: "2003", precision: year, circa: false }
    grade: A
    label: UNESCO Masterpiece proclamation
    sources: [src.unesco-2003-tradition-vedic-chanting]
  - method: documentary
    range: { earliest: "2008", latest: "2008", precision: year, circa: false }
    grade: A
    label: UNESCO Representative List inscription
    sources: [src.unesco-2003-tradition-vedic-chanting]
claims:
  - text: >-
      Vedic recitation distinguishes three primary pitch accents - udatta (raised tone), anudatta
      (unraised or low tone), and svarita (falling or circumflex tone) - along with precise
      syllabic quantities (hrasva, dirgha, and pluta).
    grade: A
    sources:
      - src.katre-1987-astadhyayi-panini
      - src.gonda-1975-vedic-literature
      - src.unesco-2003-tradition-vedic-chanting
  - text: >-
      While the Rigveda and Yajurveda are chanted around three tonal levels, Samavedic chanting
      (samagana) expands the melodies to up to seven musical notes (svaras) and uses finger and
      hand gestures (mudras) to mark tonal intervals.
    grade: A
    sources:
      - src.gonda-1975-vedic-literature
      - src.staal-1983-agni-fire-altar
      - src.unesco-2003-tradition-vedic-chanting
  - text: >-
      UNESCO proclaimed the tradition of Vedic chanting a Masterpiece of the Oral and Intangible
      Heritage of Humanity in 2003 and inscribed it on the Representative List in 2008.
    grade: A
    sources:
      - src.unesco-2003-tradition-vedic-chanting
