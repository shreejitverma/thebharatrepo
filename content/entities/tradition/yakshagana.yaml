claims:
  - text: The Bhagavata serves as narrator-conductor singing prasanga verses to cymbals (tala) while chande and maddale
      drums drive the actors' improvised dialogues and dances.
    grade: A
    sources:
      - src.ashton-1977-yakshagana
      - src.karanth-1997-yakshagana
  - text: Yakshagana divides into major stylistic schools such as Tenkutittu (southern) and Badagutittu (northern), enacting
      episodes chiefly from the Mahabharata, Ramayana and Bhagavata Purana.
    grade: A
