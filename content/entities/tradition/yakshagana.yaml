names:
  en: Yakshagana
  iast: Yakṣagāna
  native: ಯಕ್ಷಗಾನ
summary: Yakshagana is a nocturnal dance-theatre tradition of coastal and Malnad Karnataka and northern Kasaragod,
  combining sung prasanga verse, vigorous footwork, extemporaneous Kannada and Tulu prose dialogue and ornate
  wooden-and-gilt headdresses (kiritas). Documented in palm-leaf scripts from the sixteenth century, it maintains
  distinct northern (Badagutittu) and southern (Tenkutittu) regional styles.
summaries:
  kids: Yakshagana is an all-night musical theatre tradition from coastal Karnataka where performers wear huge decorated
    crowns, bright face paint and act out epic stories with lively drumming.
  teen: Blending sung epic poetry (prasangas), improvised dialogue and high-energy drumming on the chande and maddale,
    Karnataka's Yakshagana is documented in written texts from at least the sixteenth century.
region: Coastal and Malnad Karnataka, and Kasaragod (Kerala)
