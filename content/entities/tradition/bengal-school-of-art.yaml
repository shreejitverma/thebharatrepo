summary: The Bengal School of Art was an early twentieth-century nationalist and pan-Asian art movement centred in
  Calcutta and Santiniketan, spearheaded by Abanindranath Tagore, E. B. Havell and disciples including Nandalal Bose,
  Asit Kumar Haldar and Abdur Rahman Chughtai. Opposing colonial Victorian naturalism, it championed delicate
  watercolour washes and Ajanta, Mughal and folk-inspired Indian aesthetics.
summaries:
  kids: The Bengal School of Art was a group of early 1900s Indian painters led by Abanindranath Tagore and Nandalal Bose
    who turned to India's own murals and miniatures instead of European oil styles.
  teen: Emerging alongside the 1905 Swadeshi movement in Calcutta and continuing at Kala Bhavana in Santiniketan, the
    Bengal School forged an anti-colonial nationalist art rooted in Ajanta, miniatures and Asian wash.
region: Kolkata and Santiniketan (West Bengal), spreading across Indian art schools
