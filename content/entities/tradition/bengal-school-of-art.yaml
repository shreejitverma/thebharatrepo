  - text: Historians Tapati Guha-Thakurta and Partha Mitter show how the Bengal School joined the Swadeshi cultural
      movement, deploying Ajanta copies, Mughal lines and East Asian ink wash to build an indigenous aesthetic.
    grade: B
    sources:
