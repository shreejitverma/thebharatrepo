    note: The Thanjavur Quartet brothers (Chinnayya, Ponnayya, Sivanandam and Vadivelu) are credited with structuring the
      sadir repertoire at the Maratha court of Thanjavur.
  - method: documentary
    range:
      earliest: 1930
      latest: 1947
      precision: decade
      circa: true
    grade: A
    label: 1930s naming and institutionalisation as Bharatanatyam
    sources:
      - src.allen-1997-rewriting-script-south-indian-dance
      - src.soneji-2012-unfinished-gestures
    note: In the 1930s E. Krishna Iyer, the Music Academy in Madras and Rukmini Devi Arundale (who founded Kalakshetra in
      1936) renamed sadir as Bharatanatyam; the Madras Devadasis Act of 1947 abolished temple dedication.
claims:
  - text: Before the 1930s, the dance repertoire was known as sadir, dasiattam or chinna melam and was sustained by
      hereditary women performers (devadasis) and male nattuvanar teachers.
    grade: A
    sources:
      - src.soneji-2012-unfinished-gestures
      - src.allen-1997-rewriting-script-south-indian-dance
  - text: Historians Matthew Harp Allen and Davesh Soneji show that the 1930s revival reframed sadir around Sanskrit textual
      authority while displacing many hereditary performers.
    grade: B
    sources:
      - src.allen-1997-rewriting-script-south-indian-dance
      - src.soneji-2012-unfinished-gestures
debate: While revivalists presented Bharatanatyam as the direct restoration of an ancient temple art described in the
  Natyashastra, dance historians note that the modern name, concert format and institutional pedagogy were consciously
  reconstructed in the 1930s out of early-modern Thanjavur court and temple practice.
