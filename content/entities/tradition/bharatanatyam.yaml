names:
  en: Bharatanatyam
  iast: Bharatanāṭyam
  native: பரதநாட்டியம்
summary: Bharatanatyam is a classical solo dance tradition of South India combining rhythmic footwork (nritta) and
  expressive mimetic storytelling (abhinaya). Rooted in the hereditary repertoire of devadasi temple and court
  performers known as sadir (or dasiattam) and the Thanjavur Quartet's nineteenth-century concert sequence, it was
  renamed and reshaped in the 1930s for modern proscenium stages.
summaries:
  kids: Bharatanatyam is a classical dance from Tamil Nadu in which dancers use crisp footwork, geometric stances, hand
    gestures and facial expressions to tell stories to Carnatic music.
  teen: Emerging from the hereditary sadir tradition of Tamil Nadu temples and courts, Bharatanatyam received its modern
    name and stage repertoire in the 1930s, drawing vocabulary from Sanskrit treatises such as the Natyashastra and
    Abhinaya Darpana.
region: Tamil Nadu and southern India
