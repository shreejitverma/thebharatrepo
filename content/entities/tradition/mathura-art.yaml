names:
  en: Mathura Art
  iast: Mathurā Kalā
  native: मथुरा कला
  nativeLang: hi
summary: >-
  The Mathura school of sculpture was an indigenous Indian artistic tradition centred at Mathura on the Yamuna River in Uttar Pradesh, carved in distinctive buff-spotted Sikri red sandstone from roughly the second century BCE through the Kushan and Gupta periods. Evolving from colossal yaksha and naga figures, Mathura workshops simultaneously created iconic images for Jainism (Tirthankaras and ayagapatas), Buddhism (kapardin-type Buddhas and Bodhisattvas) and Brahmanical Hinduism (Vasudeva-Krishna, Shiva, Surya and Durga), as well as royal Kushan portraits at Mat.
summaries:
  kids: >-
    Carved from spotted red sandstone along the Yamuna River, the Mathura school of art created early statues of the Buddha, Jain Tirthankaras and Hindu deities.
  teen: >-
    Working in distinctive Sikri spotted red sandstone from c. 150 BCE through the Kushan and Gupta eras, Mathura sculptors developed an indigenous Indian idiom for Jain, Buddhist and Hindu icons that directly shaped classical Gupta sculpture.
region: Braj region along the Yamuna River (Mathura, Uttar Pradesh)
