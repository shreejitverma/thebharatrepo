claims:
  - text: Prior to the Kushan period (c. 150 BCE-50 CE), Mathura workshops at Kankali Tila and nearby sites already produced inscribed Jain ayagapatas (homage tablets), Tirthankara figures and Brahmanical icons derived from earlier yaksha prototypes.
    grade: A
    sources:
      - src.quintanilla-2007-sculpture-at-mathura
  - text: During the early reign of Kanishka I, the monk Bala commissioned colossal red-sandstone standing images at Mathura that were exported to Sarnath and Shravasti, establishing the kapardin ("shell-curled topknot") Mathura Buddha type across the Gangetic basin.
    grade: A
    sources:
      - src.quintanilla-2007-sculpture-at-mathura
