claims:
  - text: Artists build raised architectural arches and ornaments using a lime-and-gum paste (gesso) over cotton cloth
      pasted onto wooden boards, gilding the relief with gold leaf and setting cut glass or Jaipur stones.
    grade: A
    sources:
      - src.appasamy-1980-tanjavur-painting
      - src.dallapiccola-2003-deccani-south-grove
  - text: The tradition shares workshops and visual conventions with Mysore gesso painting and nineteenth-century South
      Indian reverse glass painting.
    grade: B
    sources:
