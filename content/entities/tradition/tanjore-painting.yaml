  iast: Tañjāvūr Citrakalā
  native: தஞ்சாவூர் ஓவியம்
summary: Tanjore (Thanjavur) painting is a South Indian panel-painting tradition that matured under the Maratha court of
  Thanjavur from the late seventeenth through nineteenth centuries. Executed on cloth-backed jackfruit or teak wood
  planks with gesso relief (sukku/mavu), gold leaf and inset semi-precious stones or coloured glass, its iconic
  devotional panels depict Bala Krishna, Rama and temple deities.
summaries:
  kids: Tanjore paintings from Tamil Nadu are sparkling pictures of gods painted on wood panels and decorated with real
    gold foil and bright gemstones or coloured glass.
  teen: Developed in Maratha-era Thanjavur (late 17th-19th centuries), Tanjore panel art combines raised gesso borders,
    22-karat gold leaf and inlaid stones around richly modelled Hindu deities.
region: Thanjavur and Kaveri delta, Tamil Nadu
