summary: Kalighat painting arose in nineteenth-century Calcutta around the Kalighat Kali temple as rural patua scroll
  painters adapted their craft for urban pilgrims on cheap machine-made paper. Marked by bold, sweeping brush contours,
  volumetric shading and witty social satire alongside Hindu deities, it declined around 1930 under competition from
  printed chromolithographs while inspiring modernists like Jamini Roy.
summaries:
  kids: In nineteenth-century Kolkata, folk painters near the Kalighat temple created bold, fast watercolours on paper
    showing both gods and funny scenes of city life.
  teen: Transitioning from rural Bengal cloth scrolls to single-sheet watercolours for urban pilgrims around 1830-1930,
    Kalighat pat painting blended folk rhythm, European paper shading and sharp social satire.
