claims:
  - text: Moving from long narrative cloth scrolls (patas) to single-sheet paper watercolours sold to pilgrims for a few
      pice, Kalighat artists pioneered rapid assembly-line brushwork and bold cylindrical shading.
    grade: B
    sources:
      - src.jain-1999-kalighat-painting
  - text: Kalighat sheets juxtaposed Hindu iconography (Kali, Shiva, Rama) with topical scandals such as the 1873
      Tarakeshwar murder trial and satires of anglicised Kolkata 'babus'.
    grade: A
    sources:
