claims:
  - text: The 1936 paper defines a generalized measure of separation for multivariate comparisons.
    grade: A
    sources:
      - src.mahalanobis-2018-generalised-distance
  - text: The measure uses information about both variance and correlation across the variables.
    grade: A
    sources:
      - src.mahalanobis-2018-generalised-distance
