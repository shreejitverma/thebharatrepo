id: concept.raman-effect
type: concept
kind: science
names:
  en: Raman Effect
summary: The Raman effect is the change in frequency that can occur when light scatters from matter and
  exchanges energy with it. Raman and K. S. Krishnan reported the effect in 1928. Grigory Landsberg and Leonid
  Mandelstam also observed shifted lines in crystals that year.
summaries:
  kids: Most scattered light keeps its colour. In some cases its colour changes slightly, giving clues about the
    material it hit.
  teen: When a scattered photon gains or loses energy, its frequency changes. The shifts can reveal molecular
    vibrations. The 1928 reports came from experiments with liquids in India and crystals in the Soviet Union.
region: Kolkata and Moscow
