id: concept.saha-ionisation-equation
type: concept
kind: science
names:
  en: Saha Ionisation Equation
summary: The Saha equation relates the balance of successive ionisation states in a gas to its temperature and
  electron density under equilibrium assumptions. Saha applied the underlying theory in 1920 to explain
  features of the solar spectrum.
summaries:
  kids: Heat can make atoms lose electrons. Saha found a way to work out how many atoms in a hot gas would do that.
  teen: The equation helps explain why spectral lines of the same element change with conditions in a star. It
    relates the abundance of successive ionisation stages to temperature and electron density in equilibrium.
