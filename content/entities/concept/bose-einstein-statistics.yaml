id: concept.bose-einstein-statistics
type: concept
kind: science
names:
  en: Bose-Einstein Statistics
summary: Bose-Einstein statistics describe how indistinguishable bosons occupy quantum states. Bose introduced
  the counting method for light quanta in 1924, and Einstein extended it to a gas of massive particles in
  papers published in 1924 and 1925.
summaries:
  kids: Many particles of the same kind can share the same quantum state. Bose and Einstein helped work out how
    to count the possibilities.
  teen: Bose’s radiation calculation counts the occupations of quantum states. Einstein carried that approach
    over to material particles, developing the quantum ideal gas and predicting condensation.
