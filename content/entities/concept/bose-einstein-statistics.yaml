claims:
  - text: Bose used a new counting procedure for light quanta to derive Planck’s radiation law.
    grade: A
    sources:
      - src.bose-1924-plancks-gesetz
  - text: Einstein extended the approach to a monatomic ideal gas and found a regime in which many particles
      occupy the lowest energy state.
    grade: A
