debate: >-
  The position of Sarasvati between the Yamuna and Sutlej in Rigveda 10.75.5 supports the
  Ghaggar-Hakra identification for that hymn. Lal and Danino read the earlier description
  of the river running from the mountains to the sea (7.95.2) as evidence of a Harappan-era river.
  Other readings allow for floods in a monsoon-fed system or a name shared with the Helmand
  region in Afghanistan (Avestan Haraxvaiti), a connection discussed by Asko Parpola.
  The hymns and the sediment record address different questions, and neither establishes the
  precise river or flow regime behind every mention of Sarasvati.
