debate: >-
  River deposits provide evidence for when the main Himalayan rivers shifted course. Researchers continue
  to debate how much water subsequently reached particular stretches of the Ghaggar-Hakra. The river list
  in Rigveda 10.75 supports the Ghaggar-Hakra identification. For earlier hymns, proposed readings include
  a Harappan-era river, a later river swollen by monsoon floods, and a name transferred from the Helmand basin.
