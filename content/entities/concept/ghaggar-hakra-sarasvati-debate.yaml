debate: >-
  While nearly all scholars agree that the Ghaggar-Hakra corresponds to the Sarasvati of middle/late Vedic and
  Epic geography (between the Yamuna and Sutlej), two core questions remain contested: (1) Geologically, whether
  any perennial Himalayan glacial water reached the channel during the 3rd millennium BCE or whether Himalayan
  avulsion was complete by ~8,000 years ago leaving a monsoon-fed system during the Harappan period (Giosan et al.
  2012; Clift et al. 2012; Singh et al. 2017); and (2) Chronologically, whether the Rigvedic hymns praising a
  mighty Sarasvati reflect 3rd-millennium BCE Harappan contemporaneity (B. B. Lal, Michel Danino) or 2nd-millennium
  BCE Indo-Aryan compositions transferring the name Haraxvaiti/Sarasvati to the monsoon-fed Ghaggar (Asko Parpola,
  Michael Witzel, Romila Thapar).
