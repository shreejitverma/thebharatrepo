  - { kind: related-to, target: text.yajurveda }
  - { kind: related-to, target: text.atharvaveda }
debate: >-
  Earlier twentieth-century diffusionist models attributed Indian iron working to Near Eastern or
  Achaemenid contact around 800 to 600 BCE. Radiocarbon dates from Atranjikhera and Hallur pushed
  the consensus threshold back to c. 1200 to 1000 BCE, and Rakesh Tewari's 2003 Antiquity report
  from the eastern Vindhyas and middle Ganga plain proposed indigenous iron smelting as early as
  c. 1800 to 1500 BCE.
tags: [iron-age, metallurgy, archaeometallurgy, tewari, malhar, atranjikhera, shyama-ayas]
