names:
  en: "Unified Payments Interface (UPI)"
summary: "The National Payments Corporation of India piloted the Unified Payments Interface in April 2016. In August, participating banks made UPI-enabled apps publicly available, allowing users to make instant transfers between banks."
summaries:
  kids: "UPI lets people send money from one bank account to another using an app. Banks began trying it in 2016 and made it available to the public later that year."
  teen: "UPI is an interoperable payment system developed by the National Payments Corporation of India. Its April 2016 pilot preceded a public rollout through participating banks in August."
