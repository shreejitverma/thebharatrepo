id: concept.rigvedic-sarasvati
type: concept
kind: civilisation
names:
  en: Sarasvati in the Rigveda
  iast: Sarasvatī
  native: सरस्वती
summary: >-
  The Rigveda celebrates Sarasvati as a mighty river and as a goddess. One hymn describes her
  flowing from the mountains to the sea. The river list in Rigveda 10.75 supports an identification
  with the Ghaggar-Hakra, while the geography of earlier hymns and their relation to the history
  of the river remain debated.
summaries:
  kids: >-
    In the Rigveda, the Sarasvati is praised as a grand river flowing from the mountains and as a
    goddess. Scholars compare the hymns with what scientists find in old riverbeds between the
    Yamuna and Sutlej.
  teen: >-
    The Nadistuti hymn (Rigveda 10.75.5) lists the Sarasvati between the Yamuna and the Sutlej,
    supporting a link with the Ghaggar-Hakra. Sediment studies indicate that the main Sutlej and
    Yamuna had shifted away before the Harappan cities developed. Researchers disagree about
    whether smaller Sutlej branches later supplied the Ghaggar.
region: Kurukshetra and Ghaggar-Hakra basin (Haryana, Punjab, northern Rajasthan, and Cholistan)
location: { name: "Kurukshetra (Ghaggar-Sarasvati basin)", lat: 29.97, lon: 76.88 }
datings:
  - method: geological
    range: { earliest: "2600 BCE", latest: "1900 BCE", best: "2000 BCE", precision: century, circa: true }
    grade: B
    label: Harappan-era flow in the Ghaggar-Hakra (Giosan et al. 2012)
    sources:
      - src.giosan-2012-fluvial-landscapes-harappan
      - src.clift-2012-zircon-dating-sarasvati
      - src.singh-2017-himalayan-river-morphodynamics
      - src.khan-2024-himalayan-rivers
      - src.chatterjee-2019-perennial-ghaggar
    note: >-
      Giosan and colleagues infer monsoon-fed flow and weakening floods. Sediment provenance and
      luminescence studies place the diversion of the main Yamuna and Sutlej well before Mature
      Harappan urbanisation. Chatterjee and colleagues infer later supply from Sutlej distributaries
      in parts of the Ghaggar until about 4,500 years ago.
  - method: textual-internal
    range: { earliest: "1500 BCE", latest: "900 BCE", best: "1200 BCE", precision: century, circa: true }
    grade: C
    label: Rigvedic to Brahmana textual hydrology (Witzel, Jamison and Brereton)
    sources:
      - src.jamison-brereton-2014-rigveda
      - src.witzel-1997-early-sanskritization-kuru
    note: >-
      In the Rigveda (c. 1500 to 1000 BCE in mainstream chronology) the Sarasvati is described as a
      swollen river, whereas by the Panchavimsha and Jaiminiya Brahmanas (c. 900 to 700 BCE) it is
       explicitly described as disappearing into the desert at Vinashana.
  - method: textual-internal
    range: { earliest: "3300 BCE", latest: "1900 BCE", precision: century, circa: true }
    grade: C
    label: Harappan-era identification of the Rigvedic Sarasvati (Danino, Lal)
    sources:
      - src.danino-2010-lost-river-sarasvati
      - src.lal-2002-saraswati-flows-on
    note: >-
      Michel Danino and B. B. Lal link descriptions of a powerful river in the Rigveda to the
      Harappan-era Ghaggar-Hakra. The range represents the period proposed for that correlation.
claims:
  - text: >-
      The Nadistuti Sukta ("Praise of the Rivers," Rigveda 10.75.5) enumerates the rivers of northern
      India strictly from east to west: Ganga, Yamuna, Sarasvati, Shutudri (Sutlej), Parushni
      (Ravi), Asikni (Chenab), Marudvridha, Vitasta (Jhelum), Arjikiya, and Sushoma, placing the
      Sarasvati directly between the Yamuna and the Sutlej.
    grade: A
    sources:
      - src.jamison-brereton-2014-rigveda
      - src.danino-2010-lost-river-sarasvati
      - src.lal-2002-saraswati-flows-on
  - text: >-
      In Rigveda 2.41.16, Sarasvati is invoked as ambitame, naditame, devitame ("best of mothers,
      best of rivers, best of goddesses"), and in Rigveda 3.23.4 the Bharata princes Devashravas
      and Devavata kindle the sacrificial fire along the Sarasvati, Drishadvati, and Apaya.
    grade: A
    sources:
      - src.jamison-brereton-2014-rigveda
      - src.witzel-1997-early-sanskritization-kuru
  - text: >-
      Later Vedic prose texts, including the Panchavimsha Brahmana (25.10) and Baudhayana Dharma
      Sutra, describe the Sarasvati as vanishing in the desert sands at a place called Vinashana
      ("Disappearance"), from which the forty-day Sarasvata sattra pilgrimage proceeded upstream to
      Plaksha Prasravana.
    grade: A
    sources:
      - src.witzel-1997-early-sanskritization-kuru
      - src.danino-2010-lost-river-sarasvati
      - src.singh-2008-ancient-early-medieval-india
