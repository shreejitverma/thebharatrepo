debate: >-
  The Nadistuti hymn (Rigveda 10.75.5) unambiguously locates the late Rigvedic Sarasvati between
  the Yamuna and the Sutlej in the Ghaggar-Hakra basin. Scholars differ on whether early Rigvedic
  hymns reflect a pre-1900 BCE perennial glacial-fed river (Lal, Danino), a monsoon-fed river still
  active during the Late Bronze Age before drying at Vinashana (Giosan, Witzel), or carry older
  memories of the Avestan Haraxvaiti (Helmand) transferred eastward.
tags: [sarasvati, rigveda, nadistuti, ghaggar-hakra, kurukshetra, hydrology]
