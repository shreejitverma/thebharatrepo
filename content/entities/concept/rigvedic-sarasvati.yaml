debate: >-
  The location named in Rigveda 10.75.5 supports identifying the Sarasvati of that hymn with the
  Ghaggar-Hakra. Interpretations of the earlier hymns include a Harappan-era river, a later river
  swollen by monsoon floods, and a river name carried eastward from the Helmand basin. The sediment
  studies constrain the history of river flow. The age and geography of the hymns are questions
  scholars address with textual and linguistic evidence.
