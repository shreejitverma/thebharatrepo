id: concept.rakhigarhi-i6113-genome
type: concept
kind: science
names:
  en: Rakhigarhi Individual I6113 Ancient Genome
summary: >-
  In 2019, Shinde and colleagues reported the first ancient nuclear genome from a Harappan burial, an adult
  woman (I6113) from Rakhigarhi, Haryana, dated to c. 2800-2300 BCE. Her DNA indicates South Asian hunter-gatherer
  and ancient Iranian-related ancestry, with no detectable Anatolian farmer or Steppe pastoralist ancestry.
  One genome gives a limited view of Harappan populations. Genetic models suggest people with similar ancestry
  later mixed with other groups in South Asia.
summaries:
  kids: >-
    Scientists studied DNA from one woman buried at Rakhigarhi in Haryana more than 4,000 years ago. Her DNA
    resembled that of some ancient people buried in what are now Iran and Turkmenistan. Scientists think
    people with similar ancestry later mixed with other groups in South Asia.
  teen: >-
    In 2019, researchers reported that I6113's DNA fell within a range of ancestry profiles seen in 11 ancient
    individuals buried in Iran and Turkmenistan. They detected no Steppe pastoralist ancestry in I6113. Their
    models suggest that her Iranian-related lineage branched off before farming began in the Zagros.
region: Rakhigarhi (Mound RGR-7), Hisar District, Haryana, India
location:
  name: Rakhigarhi (Cemetery RGR-7)
  lat: 29.2886
  lon: 76.1144
datings:
  - method: genetic
    range:
      earliest: "2800 BCE"
      latest: "2300 BCE"
      precision: century
      circa: true
    grade: A
    label: Mature Harappan Context of Burial I6113 at Rakhigarhi RGR-7
    sources:
      - src.shinde-2019-ancient-harappan-genome
      - src.narasimhan-2019-formation-human-populations
    note: >-
      Dated by Mature Harappan archaeological context (typical Harappan ceramic grave goods in cemetery RGR-7) and
      genetic co-clustering with directly radiocarbon-dated Indus Periphery individuals at Gonur and Shahr-i-Sokhta.
claims:
  - text: >-
      After screening 61 skeletal samples from the Mature Harappan cemetery at Rakhigarhi, Shinde et al. (2019)
      recovered sufficient endogenous nuclear DNA from petrous bone powder of one female burial (sample I6113, burial
      BR02) through more than 100 DNA library preparations.
    grade: A
    sources:
      - src.shinde-2019-ancient-harappan-genome
  - text: >-
      I6113 falls on the ancestry gradient observed in 11 "Indus Periphery" individuals from Shahr-i-Sokhta and
      Gonur. Population models suggest that groups with related ancestry contributed substantially to present-day
      South Asian populations. The available samples give a limited view of genetic diversity within the Harappan
      Civilisation.
    grade: B
    sources:
      - src.shinde-2019-ancient-harappan-genome
      - src.narasimhan-2019-formation-human-populations
  - text: >-
      Phylogenetic modelling by Shinde et al. (2019) showed that the Iranian-related ancestry in I6113 lacked
      Anatolian farmer admixture present in Iranian farmers after c. 6000 BCE and diverged from prehistoric Zagros
      herder/hunter-gatherer lineages more than 10,000 years ago (prior to c. 8000 BCE), while carrying no detectable
      Bronze Age Steppe pastoralist (Sintashta/Andronovo-related) ancestry.
    grade: A
    sources:
      - src.shinde-2019-ancient-harappan-genome
