id: concept.rakhigarhi-i6113-genome
type: concept
kind: science
names:
  en: Rakhigarhi Individual I6113 Ancient Genome
summary: >-
  In 2019, Shinde and colleagues reported the first ancient nuclear genome from a Harappan site,
  from a woman buried at Rakhigarhi, Haryana. Her genome was consistent with a mixture of South
  Asian hunter-gatherer-related ancestry and ancestry from an ancient Iranian-related lineage,
  with no detectable Steppe pastoralist or Anatolian farmer-related ancestry. One genome gives
  limited evidence about the diversity of Harappan populations.
summaries:
  kids: >-
    Scientists studied DNA from one woman buried at Rakhigarhi in Haryana more than 4,000 years ago.
    Her DNA gives clues about her ancestors. Researchers would need DNA from many more people to
    learn how much Harappan communities differed from one another.
  teen: >-
    I6113's genome fit the same ancestry pattern as 11 individuals buried at sites in Iran and
    Turkmenistan. The study detected no Steppe pastoralist ancestry in her genome. The authors
    inferred that the Iranian-related lineage split from sampled Iranian lineages before farming.
    How common this ancestry profile was across Harappan communities remains unresolved.
region: Rakhigarhi (Mound RGR-7), Hisar District, Haryana, India
location:
  name: Rakhigarhi (Cemetery RGR-7)
  lat: 29.2886
  lon: 76.1144
datings:
  - method: archaeological-stratigraphic
    range:
      earliest: "2800 BCE"
      latest: "2300 BCE"
      precision: century
      circa: true
    grade: C
    label: Mature Harappan Context of Burial I6113 at Rakhigarhi RGR-7
    sources:
      - src.shinde-2019-ancient-harappan-genome
    note: >-
      Harappan grave goods and charcoal radiocarbon dates from the main habitation area provide
      the contextual estimate. The authors could not directly radiocarbon-date the skeleton.
  - method: documentary
    range:
      earliest: "2019"
      latest: "2019"
      precision: year
      circa: false
    grade: A
    label: Publication of the genome analysis in Cell
    sources:
      - src.shinde-2019-ancient-harappan-genome
claims:
  - text: >-
      Shinde et al. screened 61 samples from the Rakhigarhi cemetery and recovered enough nuclear
      DNA for analysis from one female individual (I6113, skeletal code RGR7.3, BR-01, HS-02).
      They reported the genome in Cell in 2019.
    grade: A
    sources:
      - src.shinde-2019-ancient-harappan-genome
  - text: >-
      I6113 fit the ancestry cline defined by 11 individuals from Shahr-i-Sokhta and Gonur.
      Narasimhan et al.'s wider study identified ancestry related to that cline as a major
      contributor to present-day South Asians. The single genome from Rakhigarhi cannot establish
      how representative her profile was of Harappan populations.
    grade: B
    sources:
      - src.shinde-2019-ancient-harappan-genome
      - src.narasimhan-2019-formation-human-populations
  - text: >-
      Shinde et al. detected no Anatolian farmer-related or Bronze Age Steppe pastoralist ancestry
      in I6113.
    grade: A
    sources:
      - src.shinde-2019-ancient-harappan-genome
  - text: >-
      Shinde et al.'s models suggest that the Iranian-related ancestry came from a lineage that
      diverged before the emergence of farming in the Iranian plateau, including the Zagros.
    grade: C
    sources:
      - src.shinde-2019-ancient-harappan-genome
