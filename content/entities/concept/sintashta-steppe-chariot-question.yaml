debate: >-
  Mainstream Indo-European archaeologists (David Anthony, Elena Kuzmina) and geneticists (Narasimhan
  et al. 2019) identify Sintashta-Andronovo as the material source of Proto-Indo-Iranian
  spoked-wheel horse chariots (ratha). The 2018 discovery of copper-decorated solid-wheel vehicles
  at Sinauli in western Uttar Pradesh (c. 2000 to 1800 BCE) is interpreted by some Indian
  archaeologists as indigenous Vedic-era war chariots and by others as solid-wheeled Copper Hoard /
  OCP carts distinct from the spoked-wheel horse-drawn Rigvedic ratha.
