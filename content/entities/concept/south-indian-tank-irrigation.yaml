id: concept.south-indian-tank-irrigation
type: concept
kind: science
names:
  en: South Indian Tank Irrigation
summary: South Indian irrigation tanks store rainwater or diverted river water behind embankments and release
  it to fields. Tanks may form chains in which overflow from one reservoir enters the next. Historical
  networks depended on construction, maintenance and negotiated access to water.
summaries:
  kids: Farmers could store water behind a bank and let it out when crops needed it. Extra water could flow into
    another tank farther downhill.
  teen: An irrigation tank is a reservoir with a sluice for controlled release and a spillway for surplus water.
    Archaeology around Vijayanagara documents varied networks of reservoirs and canals.
region: Southern India
