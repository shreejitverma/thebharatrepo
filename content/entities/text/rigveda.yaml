debate: >-
  Mainstream philologists and historical linguists date the composition of the Rigveda to c.
  1500 to 1000 BCE based on Indo-Iranian linguistic comparisons, chariot technology, and the
  Mitanni synchronism. Indigenous and Out-of-India researchers argue for a third-millennium BCE
  date tied to a perennial Sarasvati river, while orthodox tradition treats the hymns as timeless
  revelation compiled at the onset of Kali Yuga.
tags: [veda, samhita, rigveda, vedic-sanskrit, sapta-sindhu]
