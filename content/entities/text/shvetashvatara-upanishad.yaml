names:
  en: Shvetashvatara Upanishad
  iast: Śvetāśvatara Upaniṣad
  native: श्वेताश्वतरोपनिषद्
summary: The Shvetashvatara Upanishad asks about the cause of the world and identifies Rudra with
  supreme divine power. It contains instructions for meditation and yoga. Its exact date is
  disputed.
summaries:
  kids: The poem asks where the world comes from and describes a quiet place where someone can sit and
    practise meditation.
  teen: This verse Upanishad combines a search for the world’s cause, praise of Rudra and instructions
    for contemplative practice. The closing verses connect understanding with devotion.
datings:
  - method: linguistic
