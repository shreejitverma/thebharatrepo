        locator: Introduction, Chronology
      - id: src.cohen-2024-classical-upanisads
        locator: Dating and Authorship
    note: Olivelle places the text after the Katha and Isha in his tentative relative sequence; the
      language and parallels support a broad window.
claims:
  - text: The second chapter gives directions for posture, breath and the setting of contemplative
      practice.
    grade: A
    sources:
      - id: src.olivelle-1998-early-upanisads
        locator: Svetasvatara Upanisad 2
  - text: The epilogue presents Shvetashvatara as the sage who proclaimed this teaching.
    grade: D
    sources:
