names:
  en: Lilavati
  iast: Līlāvatī
  native: लीलावती
summary: >-
  Lilavati is Bhaskara II's Sanskrit work on arithmetic and mensuration, composed as part of the
  Siddhanta Shiromani around 1150. It presents mathematical rules and problems in verse; the familiar
  story that it was written specifically for his daughter is not established by the text itself.
summaries:
  kids: >-
    Lilavati is a Sanskrit book of math problems by Bhaskara II. It uses verses to explain arithmetic,
    measurement, and ways to solve problems.
  teen: >-
    Bhaskara II's Lilavati teaches arithmetic and mensuration through concise rules and poetic problems.
    A later popular story about its title and the author's daughter should be treated cautiously.
