names:
  en: Katha Upanishad
  iast: Kaṭha Upaniṣad
  native: कठोपनिषद्
summary: The Katha Upanishad tells of Nachiketas, who asks Death what happens beyond death. Its
  verse dialogue explores the self, disciplined attention and liberation. Its dating is contested.
summaries:
  kids: A boy named Nachiketas visits Yama, the lord of death, and asks a question that even the gods
    have found hard to answer.
  teen: Yama offers Nachiketas wealth and a long life. The boy persists in asking about death,
    prompting a teaching that compares the body to a chariot and the senses to horses.
