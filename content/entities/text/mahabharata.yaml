id: text.mahabharata
type: text
kind: text
names:
  en: Mahabharata
  iast: Mahābhārata
  native: महाभारत
summary: >-
  The Mahabharata, traditionally attributed to Krishna Dvaipayana Vyasa, is an eighteen-book (parvan) Sanskrit epic of roughly 75,000 verses in the Pune critical edition (about 100,000 in the vulgate) centred on the conflict between the Pandavas and Kauravas and embedding dharmic treatises including the Bhagavad Gita and Shantiparvan. Scholars date the compilation of the surviving Sanskrit text between roughly 400 BCE and 400 CE, drawing on older Kuru-Panchala heroic bardic traditions, while Hindu tradition places its composition at the close of the Dvapara Yuga.
summaries:
  kids: >-
    The Mahabharata is a vast Sanskrit poem about the Pandava and Kaurava cousins. It also contains the teachings of the Bhagavad Gita.
  teen: >-
    Divided into eighteen books (parvans) and critically edited by the Bhandarkar Oriental Research Institute in Pune, the Mahabharata evolved between c. 400 BCE and 400 CE into an encyclopaedic synthesis of epic narrative, statecraft and dharma philosophy.
region: Kuru-Panchala (Upper Ganga-Yamuna Doab and Haryana) and Pan-Indian
datings:
  - method: textual-internal
    range: { earliest: "400 BCE", latest: 400, precision: century, circa: true }
    grade: C
    label: Mainstream compositional range (J. A. B. van Buitenen, John Brockington and Alf Hiltebeitel)
    sources:
      - src.brockington-1998-sanskrit-epics
      - src.hiltebeitel-2011-dharma
    note: The Pune critical edition reflects compositional growth from c. 400 BCE (or a shorter period of literary design between c. 150 BCE and Year 0 proposed by Alf Hiltebeitel) until c. 350-400 CE, preceding the fifth-century CE Gupta copper-plate reference to the "Mahabharata of 100,000 verses."
  - method: traditional-puranic
    range: { earliest: "3102 BCE", latest: "3102 BCE", precision: year, circa: false }
    grade: D
    label: Traditional placement at the Dvapara-Kali Yuga transition
    sources:
      - src.bhatnagar-2017-date-mahabharata-war
      - src.hiltebeitel-2011-dharma
      - src.plofker-2009-mathematics-in-india
    note: Traditional attribution places Vyasa at the close of the Dvapara Yuga. The timeline uses the traditional Kali epoch of 3102 BCE as a marker for that transition.
claims:
  - text: Between 1919 and 1966, scholars at the Bhandarkar Oriental Research Institute in Pune led by V. S. Sukthankar collated hundreds of manuscripts across northern and southern scripts to establish the nineteen-volume Critical Edition of the Mahabharata.
    grade: A
    sources:
      - src.brockington-1998-sanskrit-epics
      - src.hiltebeitel-2011-dharma
  - text: The Khoh copper-plate inscription of Maharaja Sarvanatha in central India (dated 533-534 CE) explicitly refers to the Mahabharata as a collection of one hundred thousand verses (shatasahasri-samhita) composed by Vyasa, proving that the eighteen-book epic had reached its full scale by the Gupta period.
    grade: A
    sources:
      - src.fleet-1888-inscriptions-early-gupta-kings
      - src.brockington-1998-sanskrit-epics
