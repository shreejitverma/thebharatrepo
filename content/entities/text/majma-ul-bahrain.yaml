  native: مجمع البحرین
summary: The Majma-ul-Bahrain is a Persian treatise by the Mughal prince Dara Shikoh. Its title
  means the Mingling of the Two Oceans, and its sections compare concepts from Sufi and Indian
  religious vocabularies.
summaries:
  kids: Dara Shikoh wrote a Persian book about ideas that Hindu and Muslim teachers used. He called it
    the Mingling of the Two Oceans.
  teen: Dara Shikoh compares Sufi and Indian accounts of subjects such as the soul and liberation. The
    text belongs to the intellectual setting of the Mughal court and to Dara’s own search for common
    terms.
