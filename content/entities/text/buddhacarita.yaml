  native: बुद्धचरित
summary: Ashvaghosha’s Buddhacarita is a Sanskrit courtly poem on the Buddha’s life and awakening.
  Only part of the original Sanskrit survives, while Chinese and Tibetan translations preserve the
  later narrative.
summaries:
  kids: A poet tells how Prince Siddhartha leaves his palace, searches for answers and becomes the
    Buddha.
  teen: Ashvaghosha uses the techniques of Sanskrit court poetry to narrate Siddhartha’s renunciation
    and awakening. Translations into Chinese and Tibetan help recover parts lost in Sanskrit.
