    note: Traditional Sanskrit dramaturgical accounts regard Nandikeshvara as an early authority predating or contemporary
      with Bharata's Natyashastra tradition.
claims:
  - text: "The treatise systematises fourfold abhinaya and catalogues 28 single-hand (asamyuta) and some two dozen double-hand (samyuta) gestures along with movements of the head, eyes and neck."
    grade: B
    sources:
      - src.coomaraswamy-1970-mirror-of-gesture
  - text: Ananda Coomaraswamy and Gopala Kristnayya Duggirala's 1917 English translation (The Mirror of Gesture) helped make
      the text a standard textbook in twentieth-century classical dance revival.
    grade: B
    sources:
      - src.coomaraswamy-1970-mirror-of-gesture
      - src.allen-1997-rewriting-script-south-indian-dance
debate: While traditional dancers and early twentieth-century commentators viewed Nandikeshvara as an ancient sage from
  the early centuries BCE or CE, philologists point out that the surviving Abhinaya Darpana omits dramaturgical
  machinery of the Natyashastra, compresses its gesture lists, and appears to be a later early-medieval or
  second-millennium digest.
