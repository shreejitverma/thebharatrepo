names:
  en: Lotus Sutra
  iast: Saddharmapuṇḍarīkasūtra
  native: सद्धर्मपुण्डरीकसूत्र
summary: The Lotus Sutra is a Mahayana Buddhist scripture on the one vehicle to buddhahood and the
  Buddha’s long lifespan. The text accumulated in stages. Chinese translations record its
  circulation by the third century CE.
summaries:
  kids: In one story, a father uses promises to lead his children out of a burning house. The sutra
    uses stories like this to show how teachers adapt to their listeners.
  teen: The Lotus Sutra uses parables to discuss skilful means and presents apparently separate
    teachings as leading toward buddhahood. Its Chinese translations shaped its reception in East
    Asia.
