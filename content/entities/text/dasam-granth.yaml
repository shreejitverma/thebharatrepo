region: Punjab
debate: Some readers attribute all the compositions to Guru Gobind Singh. Rattan Singh Jaggi and
  others have argued for more than one author. Birk’s court compilation proposal and the posthumous
  account concern how earlier compositions were assembled. The evidence for authorship varies by
  composition.
