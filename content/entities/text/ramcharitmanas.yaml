summary: The Ramcharitmanas is Tulsidas’s Awadhi retelling of the Ramayana.
  Tradition dates its composition from 1574; the work’s text and performance
  history continued to develop through manuscript transmission.
summaries:
  kids: The Ramcharitmanas tells the story of Rama in Awadhi, a language spoken in
    northern India. It is read, sung and performed.
  teen: Tulsidas composed the Ramcharitmanas in Awadhi, adapting the Rama story
    for a broad regional audience. Its manuscript and performance histories are
    central to its reception.
