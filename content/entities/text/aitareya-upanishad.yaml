id: text.aitareya-upanishad
type: text
kind: text
names:
  en: Aitareya Upanishad
  iast: Aitareya Upaniṣad
  native: ऐतरेयोपनिषद्
summary: The Aitareya Upanishad is a short prose text within the Aitareya Aranyaka of the Rigveda.
  It links an account of creation and embodiment to an inquiry into consciousness.
  Scholars differ on its date.
summaries:
  kids: This Upanishad imagines how the world and living bodies came to be. It then asks what lets us
    see, hear and understand.
  teen: In the opening account, the self fashions worlds and enters a human body. The final section
    asks what the self is and identifies brahman with consciousness.
