      - id: src.cohen-2024-classical-upanisads
        locator: Dating and Authorship
    note: The Aitareya Upanishad belongs to the prose group Olivelle places after the Brihadaranyaka and
      Chandogya, probably before the emergence of Buddhism.
  - method: textual-internal
    range: { earliest: "800 BCE", latest: "601 BCE", precision: century, circa: true }
