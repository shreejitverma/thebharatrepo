        locator: "P. Hardy, pp. 111-117"
    note: "MacLean uses the text’s reference to 613 AH and places the work in the context of Qabacha’s
      court. Hardy gives 1216 to 1217."
    primaryReason: "A competing dating of the composition of the surviving Persian text, which MacLean treats as a translation, not an event in its history."
