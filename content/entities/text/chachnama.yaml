      precision: "century"
      circa: true
    grade: "C"
    label: "Derryl N. MacLean’s ninth-century compilation hypothesis"
    sources:
      - "src.maclean-1990-chachnama"
    note: "This is the proposed date of the lost Arabic compilation, whose existence Asif disputes."
  - method: "textual-internal"
    range:
      earliest: 1216
      latest: 1228
      precision: "decade"
      circa: true
    grade: "C"
    label: "Persian translation after 1216 in MacLean’s account"
