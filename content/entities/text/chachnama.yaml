names:
  en: "Chachnama"
  native: "چچ نامہ"
summary: "The Chachnama is a Persian account of Chach’s rule and the Umayyad conquest, written by
  Ali Kufi in the early thirteenth century. Scholars differ on its date and relationship to a
  proposed Arabic source."
summaries:
  kids: "Ali Kufi wrote a book in Persian about rulers and wars that happened centuries earlier. He
    says he worked from an Arabic book, which scholars can no longer examine."
  teen: "Ali Kufi presented his work as a translation. Manan Ahmed Asif reads it in the political
    setting of thirteenth-century Uch and stresses its arguments about ethical rule and
    accommodation."
region: "Uch and Sindh, Pakistan"
datings:
  - method: "textual-internal"
    range:
