claims:
  - text: "The narrative follows Chach's rise and the later conquest under Muhammad ibn Qasim."
    grade: "A"
    sources:
      - "src.kufi-1985-chachnamah"
  - text: "Asif argues that the text should be read as a thirteenth-century work of political thought in
      its own right."
    grade: "B"
    sources:
      - "src.asif-2016-book-of-conquest"
relations: []
debate: "MacLean reads the Chachnama as Ali Kufi’s Persian rendering of a ninth-century Arabic
  compilation. Asif dates the book to 1226 and reads it as a work of political thought shaped by
  thirteenth-century Uch. Peter Hardy also studied its political arguments, while dating the Persian
  text to 1216 or 1217."
