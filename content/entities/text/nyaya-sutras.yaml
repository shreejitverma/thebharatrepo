    note: Their translation places the foundational text around the second and third centuries.
  - method: textual-internal
    range:
      earliest: 350
      latest: 450
      precision: century
      circa: true
    grade: C
    label: "Karin Preisendanz: late fourth-century compilation"
    sources:
