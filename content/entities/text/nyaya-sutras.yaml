    note: Preisendanz places the compilation towards the end of the fourth century in her study of the
      commentarial tradition.
claims:
  - text: The opening book counts perception, inference, comparison and testimony as four means of
      knowledge.
    grade: A
    sources:
      - id: src.dasti-2017-nyaya-sutra
        locator: Nyaya Sutra 1.1.3
  - text: The Sanskrit text is traditionally ascribed to Akshapada Gautama.
