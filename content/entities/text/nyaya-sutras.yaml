names:
  en: Nyaya Sutras
  iast: Nyāyasūtra
  native: न्यायसूत्र
summary: The Nyaya Sutras investigate how people gain knowledge and conduct rational debate. The
  Sanskrit work is traditionally attributed to Akshapada Gautama. The date of the received
  compilation is debated.
summaries:
  kids: How can you tell whether an argument is sound? This book names ways to find things out and
    mistakes people make when they argue.
  teen: The Nyaya Sutras discuss reliable ways of knowing, the parts of an inference and errors in
    debate. Short rules were passed down with commentaries that clarify their wording.
