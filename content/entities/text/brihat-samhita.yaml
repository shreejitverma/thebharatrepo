summary: Varahamihira’s Brihat Samhita brings together astral omens, weather lore, perfumery and other
  specialized knowledge. Its discussion of perfume mixtures also illustrates the use of combinatorics in a
  practical craft.
summaries:
  kids: This book gathers many kinds of knowledge, from signs in the sky to ways of mixing perfumes.
  teen: The Brihat Samhita shows how technical knowledge could sit alongside divination in a Sanskrit
    compendium. A perfume chapter uses a numbered arrangement to illustrate possible blends.
