names:
  en: Tattvartha Sutra
  iast: Tattvārthasūtra
  native: तत्त्वार्थसूत्र
summary: The Tattvartha Sutra systematises Jain teachings on knowledge, living beings, karma and
  liberation. Shvetambara and Digambara traditions both value it and transmit distinct textual
  versions. The date of its compilation is disputed.
summaries:
  kids: This short Jain book explains what lives, what actions do, and how Jain teachings describe the
    path to freedom.
  teen: The Sanskrit aphorisms organise Jain teachings into categories and link right view, knowledge
    and conduct with liberation. Commentators from different Jain traditions interpret the work.
