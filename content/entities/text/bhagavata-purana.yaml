names:
  en: Bhagavata Purana
  iast: Bhāgavata Purāṇa
  native: भागवतपुराण
summary: The Bhagavata Purana is a Sanskrit scripture of devotion to Vishnu, with its tenth book
  devoted to Krishna. Scholars debate when the received work took shape and how early its
  constituent narratives circulated.
summaries:
  kids: A king listens to a sage tell stories about Vishnu. One whole book follows Krishna, from his
    childhood in a village to his life as an adult.
  teen: The Bhagavata combines devotion, cosmology and stories of Vishnu’s incarnations. Krishna’s
    childhood in Vraja and his relationships with the cowherds became influential in performance and
    worship.
