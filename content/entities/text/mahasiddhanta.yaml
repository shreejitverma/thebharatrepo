names:
  en: Mahasiddhanta of Aryabhata II
  iast: Mahāsiddhānta
  native: महासिद्धान्त
summary: Aryabhata II’s Mahasiddhanta uses syllables to encode numerical constants for astronomy. Textual
  references point to a medieval work, while an analysis of its numerical constants suggests a much later
  configuration.
summaries:
  kids: This astronomy book turns large numbers into strings of sounds, making them fit into Sanskrit verse.
  teen: The author uses a form of alphabetic number notation to encode astronomical constants. A twelfth-century
    reference and a later numerical fit give different clues to the history of the text.
