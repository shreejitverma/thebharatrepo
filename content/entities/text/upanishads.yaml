id: text.upanishads
type: text
kind: text
names:
  en: Principal Upanishads
  iast: Upaniṣad
  native: उपनिषद्
summary: >-
  The Principal Upanishads (Mukhya Upanishads) form the concluding philosophical layer of the Vedic
  corpus, known as Vedanta ("the end of the Veda"). They investigate the nature of ultimate reality
  (Brahman), the self (Atman), karma, rebirth (samsara), and liberation (moksha).
summaries:
  kids: >-
    The Upanishads are the philosophical books at the end of the Vedas, where teachers and students
    ask deep questions about the soul, the universe, and how to live wisely.
  teen: >-
    Known as Vedanta ("the culmination of the Vedas"), the Principal Upanishads shift Vedic inquiry
    from external sacrifice to philosophical dialogues on Brahman (ultimate reality), Atman (the
    inner self), karma, and liberation from rebirth.
region: Kuru-Panchala, Kosala, and Videha (northern India)
datings:
  - method: linguistic
    range: { earliest: "700 BCE", latest: "200 BCE", best: "500 BCE", precision: century, circa: true }
    grade: B
    label: Chronological strata of the early Upanishads (Olivelle)
    sources:
      - src.olivelle-1998-early-upanisads
      - src.flood-2003-blackwell-companion-hinduism
      - src.singh-2008-ancient-early-medieval-india
    note: >-
      Patrick Olivelle and mainstream Indologists date the earliest prose Upanishads
      (Brihadaranyaka and Chandogya) to c. 7th to 6th century BCE (pre-Buddhist), middle prose ones
      (Taittiriya, Aitareya, Kaushitaki, Kena) to c. 6th to 5th century BCE, and early verse
      Upanishads (Katha, Isha, Shvetashvatara, Mundaka) to the 5th to 2nd centuries BCE.
  - method: traditional-puranic
    range: { earliest: "3102 BCE", latest: "2500 BCE", precision: century, circa: true }
    grade: D
    label: Traditional Vedanta sampradaya reckoning
    sources:
      - src.olivelle-1998-early-upanisads
      - src.flood-2003-blackwell-companion-hinduism
    note: >-
      Traditional Vedanta schools regard the Principal Upanishads as timeless Shruti revealed at
      the close of the Vedic Samhitas, Brahmanas, and Aranyakas.
claims:
  - text: >-
      The Brihadaranyaka and Chandogya Upanishads represent the oldest prose stratum of the
      Upanishadic corpus, composed before the rise of Buddhism in the middle Ganga plain.
    grade: B
    sources:
      - src.olivelle-1998-early-upanisads
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      The Principal Upanishads articulate the first explicit Vedic formulations of the cycle of
      rebirth (samsara) governed by moral action (karman) and liberation through knowledge of the
      unity of Atman and Brahman.
    grade: A
    sources:
      - src.olivelle-1998-early-upanisads
      - src.flood-2003-blackwell-companion-hinduism
