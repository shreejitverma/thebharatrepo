summary: Nagarjuna’s Mulamadhyamakakarika is a foundational work of Madhyamaka Buddhist philosophy.
  Its verses examine how things come to be and argue that what arises dependently lacks an intrinsic
  nature.
summaries:
  kids: Nagarjuna asks whether anything exists entirely on its own. His short verses use careful
    arguments about causes and changes.
  teen: Nagarjuna tests ideas such as causation, motion and identity. He relates dependent arising to
    emptiness, the absence of an independent nature.
