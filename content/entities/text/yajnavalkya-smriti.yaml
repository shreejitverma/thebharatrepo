names:
  en: Yajnavalkya Smriti
  iast: Yājñavalkyasmṛti
  native: याज्ञवल्क्यस्मृति
summary: The Yajnavalkya Smriti is a Sanskrit treatise on dharma. Its three books address conduct,
  judicial procedure and penance. Later jurists, including the author of the Mitakshara, interpreted
  it in influential commentaries.
summaries:
  kids: This old book describes duties, what should happen when people bring a quarrel to court, and
    how people might make amends.
  teen: The text treats dispute resolution as a distinct subject, including evidence and court
    procedure. Over centuries, commentaries developed its rules on inheritance and other matters.
