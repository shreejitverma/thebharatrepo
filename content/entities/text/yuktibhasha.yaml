summary: The Yuktibhasha is Jyeshthadeva’s Malayalam exposition of mathematical astronomy, usually dated
  around 1530. It gives arguments for calculation rules, including infinite series used to approximate circle
  lengths and trigonometric quantities.
summaries:
  kids: This Malayalam book explains how adding more and more terms helps work out the circumference of a circle.
  teen: The work gives reasons for procedures inherited by the Kerala school. Its mathematics and astronomy
    sections cover topics from fractions and infinite series to planetary models.
