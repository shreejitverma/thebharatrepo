names:
  en: Agni Purana
  iast: Agnipurāṇa
  native: अग्निपुराण
summary: The Agni Purana presents teaching from the fire god Agni to Vasistha and contains material
  on ritual, iconography, poetics and other disciplines. Its textual layers are difficult to date.
summaries:
  kids: Agni, the god of fire, teaches a sage. The collection includes instructions for worship and
    for making sacred images, along with lessons about poetry.
  teen: This Purana gathers many kinds of Sanskrit knowledge, including statecraft, literary theory
    and temple rites. References in earlier works can help date individual passages.
