names:
  en: Harivamsha
  iast: Harivaṃśa
  native: हरिवंश
summary: The Harivamsha is a Sanskrit supplement to the Mahabharata. It gives accounts of creation
  and lineages, including the ancestry and early life of Krishna. The date of its principal layers
  is uncertain.
summaries:
  kids: The Mahabharata tells many stories about Krishna as an adult. The Harivamsha adds stories
    about his ancestors and his childhood among cowherds.
  teen: The Harivamsha extends the epic into Krishna’s family history and childhood. Comparing its
    manuscripts reveals how later transmitters expanded the text.
