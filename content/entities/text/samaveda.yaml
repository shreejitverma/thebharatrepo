id: text.samaveda
type: text
kind: text
names:
  en: Samaveda
  iast: Sāmaveda
  native: सामवेद
summary: >-
  The Samaveda is the Veda of melodies and chants (saman), compiled for the Udgatri priests who
  sang liturgical verses during the Soma sacrifice. The vast majority of its stanza text is drawn
  from the Rigveda, set to musical notation and prolongations.
summaries:
  kids: >-
    The Samaveda is the Veda of sacred songs and melodies. Priests called Udgatris sang its verses
    during rituals, turning hymns from the Rigveda into musical chants.
  teen: >-
    Compiled for the Udgatri officiating priests of the Soma ritual, the Samaveda takes verses
    mainly from the eighth and ninth mandalas of the Rigveda and adapts them into liturgical
    melodies (saman), forming an early foundation of Indian musical tradition.
region: Kuru-Panchala (Haryana and western Uttar Pradesh)
datings:
  - method: linguistic
    range: { earliest: "1200 BCE", latest: "900 BCE", best: "1000 BCE", precision: century, circa: true }
    grade: C
    label: Post-Rigvedic Kuru-period compilation
    sources:
      - src.witzel-1997-early-sanskritization-kuru
      - src.gonda-1975-vedic-literature
      - src.singh-2008-ancient-early-medieval-india
    note: >-
      Linguistically and textually presupposes the completed Rigveda Samhita and belongs to the
      early Kuru reorganization of the Shrauta liturgy.
  - method: traditional-puranic
    range: { earliest: "3102 BCE", latest: "3000 BCE", precision: century, circa: true }
    grade: D
    label: Traditional Puranic reckoning
    sources:
      - src.flood-2003-blackwell-companion-hinduism
    note: >-
      Traditional accounts hold that Vyasa divided the single Veda into four and entrusted the
      Samaveda to his disciple Jaimini at the beginning of Kali Yuga.
claims:
  - text: >-
      All but 75 of the roughly 1,875 verses in the Kauthuma recension of the Samaveda are taken
      directly from the Rigveda, especially Mandalas 8 and 9.
    grade: A
    sources:
      - src.gonda-1975-vedic-literature
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      The Samaveda survives in three principal recensions (shakhas): Kauthuma, Ranayaniya, and
      Jaiminiya, and preserves songbooks (ganas) that encode melodic chanting patterns.
    grade: A
    sources:
      - src.gonda-1975-vedic-literature
      - src.flood-2003-blackwell-companion-hinduism
