names:
  en: Patiganita of Sridhara
  iast: Pāṭīgaṇita
  native: पाटीगणित
summary: Sridhara’s Patiganita is an early medieval Sanskrit treatise on arithmetic and measurement, preserved
  incompletely with a commentary. It connects rules for calculation to practical problems.
summaries:
  kids: This book explains how to use arithmetic to work out everyday questions involving amounts and measurements.
  teen: The surviving Patiganita shows how rules and worked problems were taught together. Sridhara’s Trishatika
    names the Patiganita as the basis of its shorter account.
