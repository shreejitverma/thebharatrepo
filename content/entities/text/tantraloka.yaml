names:
  en: Tantraloka
  iast: Tantrāloka
  native: तन्त्रालोक
summary: >-
  The Tantraloka is Abhinavagupta's Sanskrit exposition of Trika Shaivism, composed in Kashmir
  around the turn of the eleventh century.
  It interprets earlier tantric scriptures through a nondual philosophy and explains practices
  such as initiation and worship.
summaries:
  kids: >-
    A Kashmiri teacher named Abhinavagupta explains older teachings about Shiva.
    His book brings together ideas about the world and descriptions of worship.
  teen: >-
    Abhinavagupta draws on several earlier Shaiva scriptures to explain how Trika teachings
    connect ritual, philosophy and liberation.
    Jayaratha's commentary helps readers trace some of those sources.
region: Kashmir
