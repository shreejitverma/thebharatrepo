id: text.nirukta
type: text
kind: science
names:
  en: Nirukta of Yaska
  iast: Nirukta
  native: निरुक्त
summary: >-
  The Nirukta of Yaska is the foundational Sanskrit treatise on semantic etymology and the oldest
  surviving work of the Nirukta Vedanga. It provides a commentary on the Nighantu, an older
  glossary of difficult and archaic Vedic words classified into synonyms, homonyms, and divine
  epithets.
summaries:
  kids: >-
    The Nirukta, written by the scholar Yaska, is an ancient dictionary commentary that explains
    how difficult words in the Vedas came from action roots.
  teen: >-
    Representing the Nirukta Vedanga, Yaska's treatise analyzes an ancient Vedic word-list called
    the Nighantu and argues that most nouns are derived from verbal roots (dhatu), establishing
    early principles of semantics and etymology.
region: Northwestern or northern Indian subcontinent
datings:
  - method: linguistic
    range: { earliest: -699, latest: -399, best: -499, precision: century, circa: true }
    grade: C
    label: Late Vedic linguistic dating (Sarup, Cardona)
    sources:
      - src.sarup-1920-nighantu-nirukta
      - src.cardona-1988-panini-work-traditions
      - src.flood-2003-blackwell-companion-hinduism
    note: >-
      Dated by Lakshman Sarup and George Cardona to around the 6th to 5th century BCE, generally
      placed slightly before Panini's Ashtadhyayi on the basis of linguistic and technical usage.
  - method: traditional-puranic
    range: { earliest: -3101, latest: -1499, precision: century, circa: true }
    grade: D
    label: Traditional sampradaya reckoning
    sources:
      - src.sarup-1920-nighantu-nirukta
    note: >-
      Traditional Vedanga transmission places Yaska among the ancient pre-classical authorities of
      Vedic exegesis.
claims:
  - text: >-
      The Nirukta consists of 12 main chapters (with two supplementary chapters) commenting on the
      five chapters of the Nighantu: the Naighantuka-kanda (synonyms), Naigama-kanda (homonyms),
      and Daivata-kanda (names of deities).
    grade: A
    sources:
      - src.sarup-1920-nighantu-nirukta
  - text: >-
      In Book 1, Yaska distinguishes four grammatical classes of words - nama (noun), akhyata
      (verb), upasarga (preverb), and nipata (particle) - and defends the thesis of Shakatayana
      that nouns are derived from verbal roots.
    grade: A
    sources:
      - src.sarup-1920-nighantu-nirukta
      - src.cardona-1988-panini-work-traditions
  - text: >-
      Yaska records the critique of Kautsa, who argued that Vedic mantras lacked coherent meaning,
      and refutes him by demonstrating that Vedic hymns convey intelligible semantic content.
    grade: A
    sources:
      - src.sarup-1920-nighantu-nirukta
