summary: Somadeva’s Kathasaritsagara is a Kashmiri Sanskrit verse collection of nested stories. The
  adventures of prince Naravahanadatta provide a framework for tales told within tales.
summaries:
  kids: A prince’s adventures are the starting point for hundreds of other stories. Sometimes a
    character stops to tell a tale that has another tale inside it.
  teen: Somadeva recasts material attributed to the Brihatkatha into a long Sanskrit poem. Its nested
    narratives bring together adventures, riddles, folklore and courtly life.
