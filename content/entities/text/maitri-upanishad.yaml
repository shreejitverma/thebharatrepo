    note: The wide interval situates the transmitted materials among the later classical Upanishads.
      Individual passages and compilations may belong to different periods.
claims:
  - text: One passage presents a six-part discipline including breath control, withdrawal of the senses,
      meditation, concentration, reflection and absorption.
    grade: A
