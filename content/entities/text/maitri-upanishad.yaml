names:
  en: Maitri Upanishad
  iast: Maitrī Upaniṣad
  native: मैत्र्युपनिषद्
summary: The Maitri, also called the Maitrayaniya Upanishad, belongs to a school of the Black
  Yajurveda. Its surviving text includes a dialogue about the self, reflections on time and a
  six-part account of yoga. Its layers are difficult to date.
summaries:
  kids: A king named Brihadratha leaves his throne to ask a sage about the self. Other parts of the
    book consider time and meditation.
  teen: The Maitri brings together philosophical dialogues and sections on time, the sun and yoga. Its
    uneven composition and varying manuscript forms complicate the question of when it took shape.
