names:
  en: Taittiriya Upanishad
  iast: Taittirīya Upaniṣad
  native: तैत्तिरीयोपनिषद्
summary: The Taittiriya Upanishad belongs to the Black Yajurveda. Its three sections move from
  recitation and duties to inquiries into brahman through food, breath, mind, understanding and
  bliss. Scholars differ on the dating of its prose layers.
summaries:
  kids: A teacher gives students advice for life after their studies. Later, a young man named Bhrigu
    asks his father what everything comes from.
  teen: The text places a teacher’s instructions on conduct beside a study of brahman. Bhrigu revisits
    his answers about ultimate reality as he moves from food and breath towards bliss.
datings:
