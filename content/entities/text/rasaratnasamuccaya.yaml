  native: रसरत्नसमुच्चय
summary: The Rasaratnasamuccaya is a Sanskrit work on alchemy and the medical use of mineral substances. It
  discusses metals, laboratory apparatus and the hazards associated with mercury. Its date is contested.
summaries:
  kids: This old book describes how people studied and processed metals and minerals. It also records harmful
    effects associated with mercury.
  teen: The Rasaratnasamuccaya brings together techniques for processing minerals and historical medical uses.
    Scholars disagree on when its surviving form was compiled.
