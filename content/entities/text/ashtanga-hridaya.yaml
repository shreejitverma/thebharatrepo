names:
  en: Ashtanga Hridaya
  iast: Aṣṭāṅgahṛdaya
  native: अष्टाङ्गहृदय
summary: The Ashtanga Hridaya is a Sanskrit verse compendium of Ayurveda attributed to Vagbhata. Its compact
  treatment of medical knowledge draws on earlier works, and the date and authorship of the compilation remain
  debated.
summaries:
  kids: This old book puts many parts of Ayurvedic medicine into verses that students could learn and remember.
  teen: The Ashtanga Hridaya condenses earlier medical material into verse. Comparing it with the Ashtanga
    Samgraha and other works helps historians study how it was compiled.
