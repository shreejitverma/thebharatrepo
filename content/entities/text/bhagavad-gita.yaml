id: text.bhagavad-gita
type: text
kind: dharma
names:
  en: Bhagavad Gita
  iast: Bhagavadgītā
  native: भगवद्गीता
summary: >-
  The Bhagavad Gita ("Song of the Lord") is a 700-verse Sanskrit philosophical dialogue in eighteen chapters embedded in Book 6 (Bhishmaparvan, chapters 23-40) of the Mahabharata, set on the battlefield of Kurukshetra between the Pandava prince Arjuna and his charioteer and guide Krishna. It synthesizes Vedic ritual duty, Upanishadic metaphysics, Samkhya-Yoga psychology and Bhagavata theism around the disciplines of desireless action (nishkama karma-yoga), knowledge (jnana-yoga) and devotion (bhakti-yoga).
summaries:
  kids: >-
    The Bhagavad Gita is a famous 700-verse conversation in the Mahabharata where Lord Krishna teaches the warrior Arjuna how to do his duty selflessly with wisdom and devotion.
  teen: >-
    Forming eighteen chapters of the Mahabharata's Bhishmaparvan, the Bhagavad Gita integrates karma-yoga, jnana-yoga and bhakti-yoga into one of the most influential scriptures of Sanatana Dharma and Vedanta philosophy.
region: Pan-Indian (narrative setting at Kurukshetra, Haryana)
datings:
  - method: textual-internal
    range: { earliest: "200 BCE", latest: 100, precision: century, circa: true }
    grade: C
    label: Mainstream philological dating within the Mahabharata's composition (Brockington and Malinar)
    sources:
      - src.malinar-2007-bhagavadgita-doctrines-contexts
      - src.brockington-1998-sanskrit-epics
    note: Dated by John Brockington, J. A. B. van Buitenen and Angelika Malinar between the second century BCE and first century CE on the basis of its epic Sanskrit meter, engagement with Upanishadic, early Samkhya-Yoga and Buddhist concepts, and early Bhagavata monotheism.
  - method: traditional-puranic
    range: { earliest: "3138 BCE", latest: "3102 BCE", precision: decade, circa: true }
    grade: D
    label: Traditional placement at the Kurukshetra War before the Kali Yuga
    sources:
      - src.bhatnagar-2017-date-mahabharata-war
      - src.malinar-2007-bhagavadgita-doctrines-contexts
    note: In Hindu tradition, the Gita was spoken directly by Krishna to Arjuna on the opening day of the Kurukshetra War at the transition from Dvapara to Kali Yuga.
claims:
  - text: The Bhagavad Gita resolves the tension between worldly social obligation (svadharma) and ascetic renunciation (sannyasa) through the doctrine of nishkama karma - performing one's duty while relinquishing attachment to the fruits of action (karmaphala-tyaga).
    grade: A
    sources:
      - src.malinar-2007-bhagavadgita-doctrines-contexts
      - src.hiltebeitel-2011-dharma
  - text: Together with the principal Upanishads and the Brahma Sutras, the Bhagavad Gita forms the triple canon (Prasthanatrayi) upon which classical Vedanta commentators such as Shankara, Ramanuja and Madhva built their philosophical systems.
    grade: A
    sources:
      - src.malinar-2007-bhagavadgita-doctrines-contexts
