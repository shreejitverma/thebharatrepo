names:
  en: Mandukya Upanishad
  iast: Māṇḍūkya Upaniṣad
  native: माण्डूक्योपनिषद्
summary: The Mandukya Upanishad links the syllable Om with the self and sets out four quarters of
  the self. Its date near the turn of the Common Era is uncertain.
summaries:
  kids: This short text starts with the sound Om and asks how being awake, dreaming and sleeping are
    connected to the self.
  teen: The text compares the self’s quarters with waking, dreaming and deep sleep and describes a
    fourth beyond those familiar states. It also interprets the sounds of Om.
