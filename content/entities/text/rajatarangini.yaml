names:
  en: Rajatarangini of Kalhana
  iast: Rājataraṅgiṇī
  native: राजतरङ्गिणी
summary: Kalhana began the Rajatarangini, a Sanskrit verse chronicle of Kashmir’s rulers, around
  1148 CE. Its eight books range from legendary dynasties to the time of King Jayasimha, Kalhana’s
  contemporary.
summaries:
  kids: Kalhana wrote about the kings of Kashmir in a long poem. He explains that he checked older
    books and records before writing his account.
  teen: Kalhana calls his eight books waves in a river of kings. The opening names sources he
    consulted, while the later narrative reaches rulers and conflicts of his own time.
