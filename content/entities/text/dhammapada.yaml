names:
  en: Dhammapada
  iast: Dhammapada
  native: धम्मपद
summary: The Pali Dhammapada gathers Buddhist teaching verses on subjects such as attention, anger
  and conduct. Related collections survive in other Indic languages, and the date of the Pali
  arrangement is uncertain.
summaries:
  kids: This collection of short Buddhist poems asks how to pay attention, handle anger and act
    kindly. The poems can be read one at a time.
  teen: The Dhammapada groups verses by theme. Comparison with Gandhari, Sanskrit and other
    collections shows that communities passed down many shared sayings in different orders.
datings:
