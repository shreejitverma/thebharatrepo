summary: >-
  The Jnaneshwari, also called Bhavarthadipika, is Jnaneshwar's Marathi exposition of the Bhagavad
  Gita. Its colophon associates its completion at Nevasa with 1290 and places the work among early
  major works of Marathi literature.
