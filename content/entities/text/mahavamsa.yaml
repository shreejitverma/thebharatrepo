names:
  en: Mahavamsa
  iast: Mahāvaṃsa
  native: महावंस
summary: The Mahavamsa is a Pali verse chronicle of Sri Lanka that recounts royal lineages and the
  establishment of Buddhism on the island. Its early portion ends with King Mahasena and later
  writers continued the chronicle.
summaries:
  kids: This long poem tells stories about Sri Lanka’s kings and about how Buddhist teachings reached
    the island.
  teen: The chronicle tells Sri Lanka’s past from the viewpoint of the Mahavihara monastic tradition.
    Its accounts of Ashoka’s family, relics and royal patrons combine historical memory with
    religious narrative.
