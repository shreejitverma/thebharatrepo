names:
  en: Isha Upanishad
  iast: Īśā Upaniṣad
  native: ईशोपनिषद्
summary: The Isha is a short verse Upanishad transmitted at the end of the White Yajurveda’s
  Vajasaneyi Samhita. Its poems consider action, knowledge and seeing the self in all beings. Its
  date is disputed.
summaries:
  kids: This short Sanskrit poem asks readers to see a shared self in all living beings.
  teen: The Isha places reflections on acting in the world alongside a vision of the self in all
    beings. Its preservation inside a Vedic collection helps explain its distinctive place among the
    Upanishads.
