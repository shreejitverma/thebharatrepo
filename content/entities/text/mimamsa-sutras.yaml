names:
  en: Mimamsa Sutras
  iast: Mīmāṃsāsūtra
  native: मीमांसासूत्र
summary: The Mimamsa Sutras, attributed to Jaimini, set out principles for reading Vedic injunctions
  and determining ritual obligations. Their date is uncertain, and later commentators developed the
  arguments in different directions.
summaries:
  kids: If two instructions seem to disagree, how do you decide what to do? This Sanskrit work asks
    that question about instructions for Vedic rites.
  teen: Jaimini’s sutras treat Vedic injunctions as a source for knowing dharma. They develop rules
    for deciding when a passage gives an instruction and when it explains one.
datings:
  - method: textual-internal
    range:
