      latest: "101 BCE"
      precision: century
      circa: true
    grade: C
    label: "Francis X. Clooney: fourth to second century BCE"
    sources:
      - src.clooney-1990-thinking-ritually
    note: Clooney uses this interval as a working estimate and compares the structure and concerns of
      the sutras with earlier Vedic ritual literature.
claims:
