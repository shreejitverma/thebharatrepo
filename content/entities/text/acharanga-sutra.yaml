names:
  en: Acharanga Sutra
  iast: Ācārāṅgasūtra
  native: आचाराङ्गसूत्र
summary: The Acharanga Sutra is the first Anga of the Shvetambara Jain canon. Its early Prakrit
  material treats nonviolence and ascetic conduct, including an account of Mahavira’s practice. Its
  two books preserve material of different ages.
summaries:
  kids: This Jain text asks monks and nuns to take great care around living things. It also tells how
    Mahavira lived as a wandering ascetic.
  teen: The opening book presents nonviolence as a discipline that shapes daily movement, possessions
    and speech. A later book gives more detailed rules for mendicants.
