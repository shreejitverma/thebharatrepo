    note: Sarngadeva served as royal accountant (shrikaranadhipa) to Yadava ruler Singhana II (r. c. 1210-1247 CE) and
      dedicated the treatise to his court.
claims:
  - text: Known as Saptadhyayi ('Seven Chapters'), the Sangita Ratnakara treats pitch and scales (svara), raga,
      miscellaneous forms (prakirnaka), song composition (prabandha), rhythm (tala), instruments (vadya) and dance
      (nartana).
    grade: A
    sources:
      - src.shringy-1978-sangitaratnakara-vol1
      - src.shringy-1989-sangitaratnakara-vol2
  - text: Important medieval commentaries by Simhabhupala (Sudhakara) and Kallinatha (Kalanidhi, Vijayanagara period)
      preserved and interpreted Sarngadeva's work for later centuries.
    grade: A
    sources:
      - src.tenijenhuis-1974-indian-music
      - src.powers-1984-sangitaratnakara-review
