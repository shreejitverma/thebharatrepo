names:
  en: Sangita Ratnakara
  iast: Saṅgītaratnākara
  native: संगीतरत्नाकर
summary: "The Sangita Ratnakara ('Ocean of Music and Dance') is a seven-chapter Sanskrit treatise composed in the early thirteenth century CE by Sarngadeva at the Yadava (Seuna) court of Devagiri under King Singhana II. Systematising svara, raga, prabandha, tala, instruments and dance, it is treated as a foundational authority by both the Hindustani and Carnatic traditions."
summaries:
  kids: The Sangita Ratnakara ('Ocean of Music') is a famous thirteenth-century Sanskrit book by Sarngadeva that describes
    Indian music, instruments and dance.
  teen: Written by Sarngadeva at Devagiri in the early 1200s CE, the seven-chapter Sangita Ratnakara synthesises earlier
    Sanskrit theory on melody, rhythm, instruments and dance before North and South Indian traditions diverged.
region: Deccan (Devagiri / Daulatabad, Maharashtra) and Pan-Indian
location:
  name: Daulatabad (Devagiri), Maharashtra
  lat: 19.943
  lon: 75.213
