names:
  en: Pancatantra
  iast: Pañcatantra
  native: पञ्चतन्त्र
summary: The Pancatantra is a Sanskrit collection of interlocking stories that teach practical
  judgment through fables and courtly dilemmas. Many versions survive, and the date of their common
  antecedent is disputed.
summaries:
  kids: A teacher uses stories about talking animals to show three princes how to make friends, spot
    tricks and think before they act.
  teen: The Pancatantra places tales inside other tales to examine friendship, strategy and the
    exercise of power. Authors and translators reshaped it as it travelled across languages.
