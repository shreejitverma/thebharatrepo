        locator: Introduction, Chronology
    note: Olivelle groups the Prashna with the Mandukya as late prose and argues that neither can be
      much older than the start of the Common Era.
  - method: linguistic
    range: { earliest: "500 BCE", latest: "1 BCE", precision: century, circa: true }
    grade: C
    label: "Signe Cohen: earlier relative placement"
    sources:
      - id: src.cohen-2024-classical-upanisads
        locator: Dating and Authorship
    note: Cohen’s linguistic and metrical sequence puts the received Prashna after the Isha and
      before the Mundaka and Katha. The broad interval situates that relative sequence.
claims:
  - text: Pippalada asks the seekers to spend a year in disciplined study before putting their questions
      to him.
    grade: A
    sources:
