id: text.prashna-upanishad
type: text
kind: text
names:
  en: Prashna Upanishad
  iast: Praśna Upaniṣad
  native: प्रश्नोपनिषद्
summary: The Prashna Upanishad is arranged as six questions to the teacher Pippalada. The questions
  concern the origin of beings, vital breath, sleep, the syllable Om and the person with sixteen
  parts. Its date is uncertain.
summaries:
  kids: Six students bring questions to a teacher. One asks why we dream and another asks what happens
    when we meditate on Om.
  teen: The six dialogues connect questions about the origin of creatures with questions about how
    breath, waking, dreaming and deep sleep work. They also discuss meditation on Om.
