claims:
  - text: The opening verses connect the inquiry with three kinds of suffering and list perception,
      inference and trustworthy testimony as means of knowledge.
    grade: A
    sources:
      - id: src.larson-1987-encyclopedia-samkhya
        locator: Samkhyakarika 1-4
  - text: Paramartha’s sixth-century Chinese translation provides a latest possible limit for the
      existence of the Sanskrit work.
    grade: B
