names:
  en: Samkhya Karika
  iast: Sāṃkhyakārikā
  native: सांख्यकारिका
summary: Ishvarakrishna’s Samkhya Karika presents a systematic account of Samkhya in Sanskrit verse.
  It distinguishes consciousness from the processes of nature. The date of composition is debated.
summaries:
  kids: This poem asks why we suffer and how understanding the difference between awareness and the
    changing world could help.
  teen: The Karika distinguishes purusha, the conscious witness, from prakriti, the source of material
    and mental change. Its compact verses became a basis for later commentaries.
