names:
  en: Shaiva Agamas
  iast: Śaiva Āgama
  native: शैव आगम
summary: The Shaiva Agamas are Sanskrit scriptural collections on initiation, religious practice,
  worship and liberation. Shaiva Siddhanta recognises a canon of 28 principal Agamas. The surviving
  works took shape over several centuries.
summaries:
  kids: These writings explain how people honour Shiva, how teachers guide students, and how sacred
    spaces are used.
  teen: Shaiva Agamas describe rites and religious authority for initiates and temple communities.
    Manuscripts and quotations allow historians to follow the growth of several different
    collections.
