names:
  en: Vaisheshika Sutras
  iast: Vaiśeṣikasūtra
  native: वैशेषिकसूत्र
summary: The Vaisheshika Sutras classify substances, qualities and motions and develop an account of
  atoms. The work is traditionally attributed to Kanada. Its transmission in different versions
  leaves its dating uncertain.
summaries:
  kids: This book sorts what we experience into groups, such as things, their qualities and their
    movements. It asks what larger objects might be made of.
  teen: Vaisheshika asks which kinds of thing exist and how to distinguish them. Comparing manuscripts
    and commentaries helps scholars see how the classifications were transmitted.
