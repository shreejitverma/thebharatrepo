id: text.abhidharmakosha
type: text
kind: text
names:
  en: Abhidharmakosha
  iast: Abhidharmakośa
  native: अभिधर्मकोश
summary: Vasubandhu’s Abhidharmakosha organizes Buddhist analysis of experience, karma and
  liberation in Sanskrit verse. Its prose commentary both presents and contests positions of the
  Sarvastivada school. Its date is debated.
summaries:
  kids: Vasubandhu gathers Buddhist explanations of the mind and world into short verses. His longer
    explanations ask where those ideas agree or disagree.
  teen: The Treasury of Abhidharma surveys Buddhist categories and arguments. In the commentary
    Vasubandhu presents positions associated with the Vaibhashikas and often evaluates them
    critically.
