summary: The Nisvasatattvasamhita is an early Sanskrit Shaiva tantra. It survives in a Nepalese
  palm-leaf manuscript and contains several layers on initiation, ritual, cosmology and yoga.
summaries:
  kids: A very old manuscript from Nepal preserves a book about worship of Shiva and the duties of
    people who enter that tradition.
  teen: The text offers evidence for the early Shaiva tradition known as the Mantramarga. Editors
    distinguish its oldest book from later material and from the date of the surviving manuscript.
