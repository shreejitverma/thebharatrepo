names:
  en: Madhava Nidana
  iast: Mādhavanidāna
  native: माधवनिदान
summary: The Madhava Nidana, also called Rogavinishchaya, is a Sanskrit compendium on recognizing and
  classifying diseases. Its organization around diagnosis made it a distinct work within Ayurvedic literature.
summaries:
  kids: This old medical book sorts illnesses into groups and describes the signs physicians looked for.
  teen: The Madhava Nidana brings together earlier descriptions of diseases, their causes and recognizable
    signs. The Madhukosha commentary became an important part of its transmission.
