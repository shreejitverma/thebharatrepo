names:
  en: Shabara Bhashya
  iast: Śābarabhāṣya
  native: शाबरभाष्य
summary: The Shabara Bhashya is a Sanskrit commentary on Jaimini’s Mimamsa Sutras. It investigates
  how words, sentences and injunctions convey obligations in Vedic ritual. The date of its author is
  uncertain.
summaries:
  kids: Shabara works through short rules about Vedic rites and explains why the wording of an
    instruction matters.
  teen: Shabara’s commentary preserves earlier interpretations and sets out ways to read the terse
    sutras. Later Mimamsa writers turned to it when debating the force of Vedic language.
