    note: Scholars date the songs between the 8th and 12th centuries CE based on historical linguistics and Tibetan lineages of the Mahasiddhas; Munidatta's Sanskrit commentary is later.
claims:
  - text: Haraprasad Shastri recovered the manuscript of the Charyacharyavinishchaya in the Nepal Darbar Library in 1907 and published it in 1916 alongside Munidatta's Sanskrit commentary.
    grade: A
    sources:
      - src.kvaerne-1986-anthology-buddhist-tantric-songs
      - src.sen-1992-history-of-bengali-literature
  - text: Comparative philologists note that the songs display transitional morphological features shared by proto-Bengali, Assamese, Maithili and Odia rather than a single modern standard language.
    grade: B
    sources:
      - src.kvaerne-1986-anthology-buddhist-tantric-songs
      - src.sen-1992-history-of-bengali-literature
debate: >-
  While early Bengali philologists classified the Charyapada purely as Old Bengali, later linguistic
  scholarship and regional historians from Assam, Odisha and Mithila highlight shared eastern
  Magadhi-Apabhramsha features that predate the strict separation of Bengali, Assamese, Odia and
  Maithili.
