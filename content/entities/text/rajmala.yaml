claims:
  - text: The Rajmala is structured into four books (laharas) and ranks among the earliest surviving Bengali dynastic chronicles compiled under a Tibeto-Burman royal house.
    grade: B
    sources:
      - src.sen-1992-history-of-bengali-literature
      - src.long-1978-rajmala
  - text: Historians cross-check the Rajmala's accounts of Dhanya Manikya, Vijaya Manikya and Amar Manikya against dated Manikya silver coins, copper plates and Mughal chronicles, treating pre-fifteenth-century genealogies cautiously.
    grade: B
    sources:
      - src.sinha-1896-rajmala-tripurar-itihas
      - src.sinha-1987-tribal-polities-northeast
debate: >-
  While court tradition assigns the composition of the first lahara strictly to the mid-fifteenth
  century under Dharma Manikya I, linguistic and textual historians note that surviving manuscripts
  reflect eighteenth- and nineteenth-century redactions alongside earlier layers.
