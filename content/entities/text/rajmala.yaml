names:
  en: Rajmala
  iast: Rājamālā
  native: রাজমালা
summary: >-
  The Rajmala ("Garland of Kings") is the multi-layered Bengali verse chronicle of the Manikya rulers
  of Tripura, compiled at the royal court in four major sections (laharas) beginning in the fifteenth
  century under Dharma Manikya I and continued through the eighteenth and nineteenth centuries. Combining
  epic Puranic genealogies with dated wars, temple endowments and diplomacy, it is a primary literary
  source for Tripura's history.
summaries:
  kids: >-
    Written in Bengali verse at the kings' court, the Rajmala is the traditional history of Tripura's
    Manikya rulers, telling stories of ancient ancestors, battles and temple-building.
  teen: >-
    Compiled in four poetic sections starting under Dharma Manikya in the 15th century and updated
    into the 19th century, the Rajmala records the political, religious and military history of the
    Tripura Manikya dynasty.
