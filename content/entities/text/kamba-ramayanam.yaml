names:
  en: Kamba Ramayanam
  iast: Irāmāvatāram
  native: கம்பராமாயணம்
summary: >-
  The Kamba Ramayanam, also called Irāmāvatāram, is a Tamil retelling of the Rama story attributed to
  the poet Kampan. It reworks inherited Ramayana narratives through Tamil literary, devotional, and
  political contexts; its conventional date is the twelfth century.
summaries:
  kids: >-
    The Kamba Ramayanam is a Tamil poem telling the story of Rama. Its poet, Kampan, shaped the story
    for Tamil audiences and traditions.
  teen: >-
    Kampan's Irāmāvatāram adapts the Ramayana narrative in Tamil rather than simply translating a
    Sanskrit source. Scholars have discussed its date and the traditions that influenced it.
