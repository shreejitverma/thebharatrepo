summary: The Narayaniya is a section of the Mahabharata’s Shanti Parvan that presents Narayana as
  supreme. It includes Narada’s journey to Shvetadvipa and preserves an early literary witness to
  Pancaratra. Its composition date is approximate.
summaries:
  kids: The sage Narada travels to an island where people worship Narayana. The story is part of the
    Mahabharata.
  teen: The Narayaniya connects epic narrative with worship of Narayana and gives evidence for
    Pancaratra before the better-known tantric Samhitas took shape.
