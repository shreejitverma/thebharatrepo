names:
  en: Markandeya Purana
  iast: Mārkaṇḍeya Purāṇa
  native: मार्कण्डेयपुराण
summary: The Markandeya Purana opens with questions about the Mahabharata and includes accounts of
  cosmic cycles, kings and sages. The Devi Mahatmya is embedded within it. The dates of the
  collection’s layers are uncertain.
summaries:
  kids: The sage Jaimini asks four wise birds to help him understand puzzles from the Mahabharata.
    Their answers lead into more stories, including tales of the Goddess.
  teen: The Purana moves between narrative frames and combines reflections on conduct, cosmic cycles
    and stories. Its chapters on the Goddess also circulated as a separate scripture.
