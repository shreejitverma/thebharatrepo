summary: >-
  Khajuraho in Madhya Pradesh preserves Hindu and Jain temples built under the Chandela dynasty,
  mostly between about 950 and 1050 CE. The temples are high points of the nagara style, with
  sculpture covering their walls, including a small share of celebrated erotic scenes. UNESCO listed
  the group in 1986.
summaries:
  kids: >-
    Khajuraho has stone temples covered in carvings of gods, dancers, animals and everyday people. They
    were built about a thousand years ago by the Chandela kings.
  teen: >-
    The Khajuraho temples rise like mountain peaks, with towers stacked one above another. An
    inscription in the Lakshmana temple dates it to 954 CE, and the Kandariya Mahadeva temple is the
    largest of the group.
