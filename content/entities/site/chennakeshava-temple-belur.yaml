names:
  en: Chennakeshava Temple, Belur
  iast: Cennakeśava Mandira, Belūr
  native: ಚೆನ್ನಕೇಶವ ದೇವಸ್ಥಾನ, ಬೇಲೂರು
summary: >-
  The Chennakeshava Temple at Belur in Karnataka is a Hoysala temple dedicated to Vishnu and consecrated
  in 1117 CE under Vishnuvardhana. It stands on a raised platform and preserves carved bracket figures,
  turned stone pillars and pierced stone screens.
summaries:
  kids: >-
    At Belur in Karnataka, Hoysala builders carved dancers and musicians on brackets and rows of
    elephants along the walls. Smooth, round stone pillars stand inside the temple hall.
  teen: >-
    A dated inscription records the consecration of Belur's Chennakeshava Temple in 1117 CE. Its
    sculptured bracket figures and pierced screens show the work of Hoysala artists across several
    building phases.
region: Malnad Foothills (Hassan district, Karnataka)
location: { name: "Belur, Karnataka", lat: 13.163, lon: 75.861 }
