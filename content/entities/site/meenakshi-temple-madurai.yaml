names:
  en: Meenakshi Amman Temple, Madurai
  iast: Mīnākṣī Sundareśvarar Kōyil, Maturai
  native: மதுரை மீனாட்சி சுந்தரேசுவரர் கோயில்
summary: >-
  The Meenakshi Sundareshvara Temple in Madurai, Tamil Nadu, is dedicated to the goddess Meenakshi and
  Shiva as Sundareshvara. Its gateways and pillared halls reflect several building phases, including
  work under the Pandyas and a major expansion under the Madurai Nayakas in the sixteenth and
  seventeenth centuries CE.
summaries:
  kids: >-
    At the centre of Madurai, brightly painted towers rise over a temple to Meenakshi and Shiva. Inside
    are stone-pillared halls and a large temple tank.
  teen: >-
    The Meenakshi Sundareshvara Temple grew around two sanctuaries. It retains work from the Pandya
    period, while many of its halls and enclosures reflect the building campaigns of the Madurai
    Nayakas.
region: Vaigai Basin (Madurai district, Tamil Nadu)
location: { name: "Madurai, Tamil Nadu", lat: 9.920, lon: 78.119 }
