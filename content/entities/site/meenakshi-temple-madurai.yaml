claims:
  - text: >-
      The precinct contains the Meenakshi and Sundareshvara sanctuaries, the Golden Lotus Tank and the
      Thousand-Pillared Hall. Tirumala Nayaka's Pudu Mandapa stands outside the temple's eastern
      gateway.
    grade: B
    sources:
      - src.marr-2003-madurai
      - src.michell-1993-temple-towns-tamil-nadu
  - text: >-
      The temple has hereditary Shaiva priests, and its Chithirai festival links temple worship with
      public celebrations across Madurai.
    grade: B
