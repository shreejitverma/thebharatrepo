id: site.brihadisvara-temple-thanjavur
type: site
kind: site
names:
  en: Brihadisvara Temple, Thanjavur
  iast: Peruvuṭaiyār Kōyil
  native: பெருவுடையார் கோயில்
summary: >-
  The Rajarajeshvara or Brihadisvara temple at Thanjavur was built by the Chola king Rajaraja I and
  completed in 1010 CE. Its towering granite pyramidal vimana rises over the sanctum, and its walls carry long inscriptions on the temple's endowments and staff.
  It is part of UNESCO's Great Living Chola Temples site.
summaries:
  kids: >-
    This huge granite temple to Shiva in Thanjavur is more than a thousand years old. Its tall tower
    is topped by a giant stone, and people still worship there every day.
  teen: >-
    Rajaraja's temple was one of the largest in India when it was built. Its inscriptions list the dancers,
    musicians, priests and villages that supported it, giving historians a detailed picture of how a
    Chola temple worked.
region: Thanjavur, Tamil Nadu
location: { name: Thanjavur, lat: 10.78, lon: 79.13 }
datings:
