  iast: Śāntiniketana
  native: শান্তিনিকেতন
summary: >-
  Santiniketan in Birbhum, West Bengal, grew from a retreat established by Debendranath Tagore in 1863
  into Rabindranath Tagore's school and Visva-Bharati. Its buildings and grounds reflect Tagore's
  educational ideas and include Kala Bhavana, a centre for the visual arts. UNESCO inscribed the site in
  2023.
summaries:
  kids: >-
    At Santiniketan in West Bengal, the poet Rabindranath Tagore started a school where some lessons
    took place outdoors. Students also learned painting, music and crafts.
  teen: >-
    Santiniketan grew from Debendranath Tagore's retreat into Rabindranath Tagore's school and
    Visva-Bharati. Art teaching at Kala Bhavana and work by artists such as Nandalal Bose and Ramkinkar
    Baij helped shape the campus.
