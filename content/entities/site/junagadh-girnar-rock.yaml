id: "site.junagadh-girnar-rock"
type: "site"
kind: "site"
names:
  en: "Junagadh and the Girnar inscription rock"
summary: "A boulder at the foot of Girnar carries inscriptions from three periods of rule. Ashoka's
  edicts share the rock with records of Rudradaman and Skandagupta that describe repairs to the
  Sudarshana reservoir."
summaries:
  kids: "Three rulers had messages carved onto the same rock near Junagadh. Two of the messages tell
    how people repaired a reservoir after floods."
  teen: "Ashoka's Prakrit edicts and the Sanskrit records of Rudradaman and Skandagupta illustrate
    changes in royal writing. The later inscriptions also record successive repairs to the same
    reservoir."
region: "Junagadh, Gujarat"
datings:
  - method: "epigraphic"
    range:
      earliest: "270 BCE"
      latest: "457 CE"
      precision: "century"
      circa: true
    grade: "A"
    label: "Inscribed from Ashoka's edicts to Skandagupta's record"
    sources:
      - "src.hultzsch-1925-inscriptions-of-asoka"
      - "src.kielhorn-1906-junagadh-inscription"
      - "src.fleet-1888-inscriptions-early-gupta-kings"
    note: "The rock carries inscriptions of three periods of rule: Ashoka's Major Rock Edicts, Rudradaman's record of era year 72 and Skandagupta's record of the reservoir's restoration."
claims:
  - text: "The rock carries a version of Ashoka's Major Rock Edicts, engraved in his reign (about 270 to 230 BCE)."
    grade: "A"
    sources:
      - "src.hultzsch-1925-inscriptions-of-asoka"
  - text: "Rudradaman's inscription is dated to year 72 of the Shaka era, about 150 to 151 CE."
    grade: "A"
    sources:
      - "src.kielhorn-1906-junagadh-inscription"
  - text: "Rudradaman's inscription records a breach after heavy rain and the repair directed by his
      governor Suvishakha."
    grade: "A"
    sources:
      - "src.kielhorn-1906-junagadh-inscription"
  - text: "A later inscription of Skandagupta's reign, of about 455 to 457 CE, records another breach and
      restoration of the reservoir."
    grade: "A"
    sources:
      - "src.fleet-1888-inscriptions-early-gupta-kings"
relations:
  - kind: "related-to"
    target: "artifact.ashoka-major-rock-edict-xiii"
  - kind: "related-to"
    target: "artifact.junagadh-rock-inscription-rudradaman"
tags:
  - "gujarat"
  - "inscription"
  - "water-management"
review:
