      - src.kumar-2001-thousand-petalled-lotus
    note: >-
      The inscription names Dharanaka and Depaka during the reign of Rana Kumbha.
  - method: art-historical
    range: { earliest: "1425 CE", latest: "1500 CE", precision: century, circa: true }
