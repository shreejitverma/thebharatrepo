id: site.ranakpur-jain-temple
type: site
kind: site
names:
  en: Ranakpur Jain Temple
  iast: Rāṇakpura Caturmukha Vihāra
  native: रणकपुर जैन मंदिर
summary: >-
  The Chaturmukha Jain Temple at Ranakpur in Rajasthan is a fifteenth-century marble temple dedicated to
  Adinatha. An inscription dated 1439 to 1440 CE names its patron and architect. Pillared halls surround
  a central sanctuary approached from four sides.
summaries:
  kids: >-
    At Ranakpur in Rajasthan, carved marble pillars fill the halls of a Jain temple. Four entrances lead
    toward the central shrine to Adinatha.
  teen: >-
    A pillar inscription at Ranakpur names the Jain patron Dharanaka and the architect Depaka. The
    temple's four-sided plan centres on the sanctuary of Adinatha, surrounded by carved marble halls.
region: Aravalli Valley (Pali district, Rajasthan)
location: { name: "Ranakpur, Rajasthan", lat: 25.116, lon: 73.473 }
datings:
