names:
  en: Group of Monuments at Pattadakal
  native: ಪಟ್ಟದಕಲ್ಲು
summary: >-
  Pattadakal, on the Malaprabha river in Karnataka, has nine Hindu temples and a Jain sanctuary built
  mainly in the 7th and 8th centuries CE, where northern (nagara) and southern (dravida) temple forms
  stand side by side. The Virupaksha temple was built by Queen Lokamahadevi to mark Vikramaditya II's
  victory over the Pallavas. UNESCO listed the site in 1987.
summaries:
  kids: >-
    Pattadakal is a group of old temples by a river in Karnataka. Some have tall curved towers like
    temples in the north, and some have stepped towers like temples in the south.
  teen: >-
    Pattadakal was where Chalukya kings were crowned, and its temples are a showroom of two
    architectural traditions. The Virupaksha temple even copied ideas from the Pallava temples of
    Kanchi after the Chalukyas raided that city.
