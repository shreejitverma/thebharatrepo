id: site.charminar
type: site
kind: site
names:
  en: Charminar
  native: చార్మినార్
summary: >-
  The Charminar stands at a crossroads in Hyderabad's historic centre. Muhammad Quli Qutb Shah
  commissioned it around 1591 CE as part of his new capital. Four pointed arches support an upper level
  with a mosque and four corner minarets.
summaries:
  kids: >-
    At the centre of old Hyderabad stands the Charminar. It has four big arches at street level, a
    mosque above and a tall minaret at each corner.
  teen: >-
    Muhammad Quli Qutb Shah commissioned the Charminar around 1591 CE as part of the new capital of
    Hyderabad. Its four pointed arches face the streets of the historic crossroads.
region: Deccan Plateau (Hyderabad district, Telangana)
location: { name: "Hyderabad, Telangana", lat: 17.362, lon: 78.475 }
datings:
  - method: documentary
    range: { earliest: "1591 CE", latest: "1592 CE", precision: year, circa: true }
