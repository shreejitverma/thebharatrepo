    note: >-
      The monument is assigned to Muhammad Quli Qutb Shah's establishment of Hyderabad around Hijri
      1000.
claims:
  - text: >-
      The square monument has four pointed arches, an upper-storey mosque and a minaret rising at each
      corner.
    grade: B
    sources:
      - src.michell-zebrowski-1999-architecture-art-deccan-sultanates
      - src.sardar-2015-hyderabad-golconda
  - text: >-
      The Charminar was an urban focus of the new Qutb Shahi capital. A square to its north was framed
      by the four Charkaman gateways.
    grade: B
    sources:
      - src.sardar-2015-hyderabad-golconda
