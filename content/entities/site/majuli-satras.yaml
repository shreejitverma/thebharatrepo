names:
  en: Majuli Satras
  native: মাজুলীৰ সত্ৰসমূহ
summary: >-
  The satras of Majuli, a major river island in the Brahmaputra in Assam, are Neo-Vaishnavite
  monastic and cultural institutions rooted in the Ekasarana Dharma movement of Srimanta Sankardeva
  and Madhavdeva. From the sixteenth and seventeenth centuries onward, royal Ahom patronage helped
  major establishments such as Auniati, Dakhinpat, Garamur, Kamalabari and Samaguri become enduring
  centres of Sattriya dance, Borgeet music, mask-making and sanchipat manuscript preservation.
summaries:
  kids: >-
    On Majuli island in Assam's Brahmaputra River, monastic centres called satras preserve centuries
    of Assamese music, Sattriya dance, Bhaona plays, hand-painted masks and palm-bark manuscripts.
  teen: >-
    Established by followers of Sankardeva and patronised by 17th-century Ahom kings, Majuli's
    satras (including Auniati, Dakhinpat, Garamur and Kamalabari) sustain a living complex of
    monastic residences, prayer halls (namghars) and classical performing arts.
region: Majuli district, Upper Assam
location: { name: "Majuli Island, Assam", lat: 26.954, lon: 94.167 }
