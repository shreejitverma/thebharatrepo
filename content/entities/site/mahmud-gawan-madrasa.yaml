claims:
  - text: Constructed around a central courtyard with four monumental iwans, three tiers of arched galleries, corner cylindrical minarets, and glazed kashi tilework, the Bidar Madrasa introduced Timurid Khurasanian college architecture directly into the Deccan.
    grade: B
    sources:
      - src.michell-zebrowski-1999-architecture-art-deccan-sultanates
      - src.philon-2010-silent-splendour
  - text: Following Aurangzeb's capture of Bidar, an accidental explosion of gunpowder stored inside the building in 1696 CE destroyed much of the eastern facade and one corner minaret.
    grade: B
