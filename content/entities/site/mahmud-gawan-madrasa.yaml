names:
  en: Mahmud Gawan Madrasa, Bidar
  iast: Madrasa-yi Maḥmūd Gāwān
  native: ಮಹಮೂದ್ ಗವಾನ್ ಮದರಸಾ
summary: >-
  The Madrasa of Mahmud Gawan in Bidar, northern Karnataka, was built in 1472 CE by the Bahmani chief minister Mahmud Gawan as a residential college of Islamic and rational sciences (kalam, jurisprudence, philosophy, astronomy, and mathematics). Designed on a four-iwan courtyard plan derived from Timurid Khurasan - with glazed polychrome tile mosaics, three storeys of student and teacher chambers, a mosque, and a large library - it suffered gunpowder explosion damage in 1696 CE but remains a landmark of Deccan architecture.
summaries:
  kids: >-
    Built in 1472 CE in Bidar, Karnataka, Mahmud Gawan's Madrasa was a three-storey college decorated with bright blue, yellow, and green glazed tiles and filled with a famous library.
  teen: >-
    Completed in 1472 CE by Bahmani vizier Mahmud Gawan, this Timurid-style four-iwan residential college at Bidar housed lecture halls, a mosque, a grand library, and student quarters covered in Persian-style glazed tilework.
