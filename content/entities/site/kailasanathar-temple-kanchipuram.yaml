claims:
  - text: >-
      Inscriptions attribute the main shrine to Rajasimha and the shrine just inside the eastern gateway
      to his son Mahendravarman III.
    grade: A
    sources:
      - src.kaimal-2021-opening-kailasanatha
  - text: >-
      The Virupaksha Temple at Pattadakal is often compared with the Kailasanathar Temple for its plan
      and architectural forms.
    grade: B
