names:
  en: Kailasanathar Temple, Kanchipuram
  iast: Kailāsanāthar Mandira, Kāñcīpuram
  native: கைலாசநாதர் கோவில், காஞ்சிபுரம்
summary: >-
  The Kailasanathar Temple at Kanchipuram, Tamil Nadu, is an early eighth-century CE Pallava temple to
  Shiva. Inscriptions name Rajasimha and his son Mahendravarman III as patrons of separate shrines.
  Smaller shrines line the sandstone complex's enclosure.
summaries:
  kids: >-
    At Kanchipuram in Tamil Nadu, Pallava builders made a sandstone temple for Shiva. Rows of small
    shrines surround the central shrine and its tall, stepped tower.
  teen: >-
    The Kailasanathar Temple at Kanchipuram was built under the Pallavas in the early eighth century CE.
    Inscriptions name Rajasimha and his son Mahendravarman III as patrons of two different shrines.
region: Tondaimandalam (Kanchipuram district, Tamil Nadu)
