names:
  en: Badrinath Temple
  iast: Badarīnātha Mandira
  native: बदरीनाथ मंदिर
summary: >-
  The Badrinath Temple on the Alaknanda River in Uttarakhand is a Vishnu shrine in both the pan-Indian
  Char Dham and the Himalayan Chota Char Dham circuits. The building has undergone repeated repairs.
  Pilgrimage tradition credits Adi Shankara with re-establishing the worship of Badrinarayana here.
summaries:
  kids: >-
    Nestled beside the Alaknanda River high in the Himalayas, the colourful Badrinath Temple is
    dedicated to Vishnu and draws pilgrims every summer when the mountain snows melt.
  teen: >-
    Badrinath lies on both the pan-Indian Char Dham and Uttarakhand's Chota Char Dham pilgrimage routes.
    The surviving building incorporates later repairs, and the account of Adi Shankara restoring the
    image belongs to pilgrimage tradition.
region: Garhwal Himalaya (Chamoli district, Uttarakhand)
