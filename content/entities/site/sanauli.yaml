wikidata: Q7415547
debate: >-
  Three linked questions are debated at Sanauli: (1) whether the 2018 vehicles with solid copper-inlaid disc wheels
  and pole-yoke drafts should be termed horse-drawn "chariots" (S. K. Manjul) or ox/bull-drawn two-wheeled carts/wagons
  lacking true spoked wheels (Asko Parpola 2020, Michael Witzel); (2) how the OCP/Copper Hoard horizon relates to
  Late Harappan traditions; and (3) whether the warrior elite represent indigenous Harappan continuity or early
  Indo-Iranian migrants (Parpola 2020).
