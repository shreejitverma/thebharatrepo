id: site.burzahom
type: site
kind: prehistory
names:
  en: Burzahom Neolithic Site
  iast: Burzahōm
  native: بُرزہوم
  nativeLang: ks
summary: >-
  The type-site of the Northern (Kashmir) Neolithic on a karewa terrace overlooking Dal Lake near Srinagar,
  Jammu and Kashmir, characterized by subterranean dwelling pits, mat-impressed pottery, a prolific bone and
  harvester tool industry, stone engravings of a hunting scene and joint human-animal burials.
summaries:
  kids: >-
    At Burzahom in Kashmir, people dug homes into the ground. Archaeologists found bone needles and harpoons
    and uncovered graves where people and animals were buried together.
  teen: >-
    Situated on a karewa terrace near Srinagar, Burzahom preserves a sequence from Neolithic underground pit
    dwellings and burials to later phases with standing stones and mud-brick buildings.
region: Kashmir Valley, Srinagar district, Jammu and Kashmir
location:
  name: Burzahom
  lat: 34.17
  lon: 74.88
datings:
  - method: archaeological-radiocarbon
    range:
      earliest: "3000 BCE"
      latest: "700 BCE"
      best: "2300 BCE"
      precision: century
      circa: true
    grade: B
    label: Approximate Neolithic to Megalithic chronology
    sources:
      - { id: src.fonia-2022-excavations-burzahom, locator: "section 3.3" }
      - src.misra-2001-prehistoric-colonization-india
      - src.coningham-2015-archaeology-south-asia
    note: >-
      The excavation report gives a broad estimate of c. 3000 to 1700 BCE for the Neolithic phases.
      Its radiocarbon table includes a Megalithic charcoal sample calibrated to about 800 BCE, with
      an uncertainty of about a century.
claims:
  - text: >-
      Period I at Burzahom included dwelling pits cut into the karewa terrace. Some preserved traces of
      mud plaster, steps or hearths.
    grade: A
    sources:
      - { id: src.fonia-2022-excavations-burzahom, locator: "section 3.2" }
  - text: >-
      Period II burials at Burzahom included human remains with traces of red ochre, a skull with evidence
      of trepanation and burials containing animal remains.
    grade: A
    sources:
      - src.fonia-2022-excavations-burzahom
  - text: >-
      Neolithic levels at Burzahom yielded stone and bone tools identified as harvesters and an engraved
      slab depicting a stag hunt.
    grade: A
    sources:
      - src.fonia-2022-excavations-burzahom
relations:
  - kind: contemporary-of
    target: site.gufkral
tags:
  - neolithic
  - kashmir
  - pit-dwellings
  - megalithic
