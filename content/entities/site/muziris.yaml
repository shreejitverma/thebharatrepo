names:
  en: Muziris
  iast: Muciṟi
  native: മുസിരിസ്
summary: >-
  Muziris (Muciri) was the premier port of the Chera kingdom on the Malabar Coast in the early centuries BCE and CE, famed in Sangam poems (Akananuru, Purananuru), the Periplus Maris Erythraei, Pliny the Elder, the Tabula Peutingeriana, and the 2nd-century CE Muziris Papyrus. Ships carried black pepper, malabathrum, ivory, textiles, and gemstones from Muziris to Red Sea ports in Roman Egypt in exchange for gold and silver bullion and Mediterranean wine. Its precise location near the Periyar mouth was long sought until excavations began at Pattanam.
summaries:
  kids: >-
    Muziris was an ancient harbour on the Kerala coast where Roman ships arrived every monsoon to trade gold coins and wine jars for black pepper and ivory.
  teen: >-
    Celebrated in Tamil Sangam poetry and documented in the 2nd-century CE Muziris Papyrus, Muziris was the hub of Chera maritime trade with the Roman world; archaeologists debate its physical footprint around Pattanam and Kodungallur.
