debate: >-
  Since 2004, K. P. Shajan, P. J. Cherian, and Roberta Tomber have identified the excavated port settlement at Pattanam, near North Paravur, as part of ancient Muziris. Some archaeologists and historians caution that Muziris may have encompassed a multi-nodal estuarine complex extending toward Kodungallur or that Pattanam's exact ancient toponym remains unconfirmed by an inscription naming Muciri.
