  iast: "Valabhī"
summary: "Valabhi was a Maitraka capital and an important centre of Buddhist learning. The Chinese
  pilgrim Yijing mentions it alongside Nalanda, and Maitraka copper plates document royal gifts to
  monasteries in the region."
summaries:
  kids: "Valabhi was a place where people studied Buddhist teachings. A traveller from China mentioned
    it alongside another well-known place of learning, Nalanda."
  teen: "Chinese pilgrims and copper-plate grants give complementary evidence for Buddhist
    institutions at Valabhi. The expression university is often used for its scholarly role, while
    the records describe monasteries and their patronage."
