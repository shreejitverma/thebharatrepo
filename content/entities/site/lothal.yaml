names:
  en: Lothal
  iast: Lothal
  native: લોથલ
summary: >-
  A compact Mature and Late Harappan manufacturing and trading town near the Gulf of Khambhat in Gujarat
  (c. 2400-1600 BCE), famous for its carnelian bead factory, Persian Gulf seal, warehouse with 65 clay sealings,
  and a 214-by-36-metre brick-lined basin whose function as a tidal maritime dockyard or a freshwater irrigation
  and drinking tank is a major scholarly debate.
summaries:
  kids: >-
    Lothal was a busy Harappan craft and trade town in Gujarat with a bead workshop, a storehouse full of stamped
    clay tags, and a giant brick-lined water basin.
  teen: >-
    Excavated by S. R. Rao between 1955 and 1962, Lothal was a specialized Harappan commercial center near the
    Gulf of Khambhat; archaeologists actively debate whether its huge brick basin functioned as a tidal dockyard
    for ships or as a freshwater reservoir.
region: Bhal region, Ahmedabad District, Gujarat, India
location:
  name: Lothal
  lat: 22.5214
  lon: 72.2494
