claims:
  - text: >-
      Along the eastern edge of Lothal lies a trapezoidal baked-brick basin measuring roughly 214 by 36 metres with
      an inlet channel and a spillway; excavator S. R. Rao identified it as a tidal dockyard, an interpretation
      supported by marine foraminifera and multi-sensor palaeochannel reconstructions linking the site to an
      ancient Sabarmati estuary.
    grade: B
    sources:
      - src.rao-1979-lothal-harappan-port
      - src.khadkikar-2004-palaeogeography-lothal
      - src.gupta-2024-sabarmati-lothal
  - text: >-
      Lawrence Leshnik (1968) and Gregory Possehl argued against the dockyard hypothesis, contending that the basin's
      inlet geometry, vertical brick walls without steps, and location suited an irrigation and potable-water storage
      tank rather than a harbour for sea-going vessels.
    grade: B
    sources:
      - src.leshnik-1968-harappan-port-lothal
      - src.possehl-2002-indus-civilization
  - text: >-
      Lothal yielded a circular Persian Gulf ("Dilmun") button seal, a multi-block mud-brick warehouse containing
      65 baked-clay cargo sealings with cord and reed impressions, and an industrial bead factory with a kiln and
      hundreds of carnelian beads in all stages of manufacture.
    grade: A
    sources:
      - src.rao-1979-lothal-harappan-port
      - src.kenoyer-1998-ancient-cities-indus
      - src.possehl-2002-indus-civilization
