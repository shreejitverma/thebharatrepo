debate: >-
  The function of the eastern brick-lined basin at Lothal is debated between the tidal maritime dockyard hypothesis
  (S. R. Rao, supported by estuarine foraminifera and palaeochannel studies of the Sabarmati by Khadkikar et al. 2004
  and Gupta et al. 2024) and the freshwater storage and irrigation tank hypothesis (Lawrence Leshnik 1968 and Gregory Possehl).
