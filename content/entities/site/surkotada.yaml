wikidata: Q7646429
debate: >-
  Equid bones excavated at Surkotada were identified by A. K. Sharma and Sándor Bökönyi (in Joshi 1990) as true
  domesticated horse (Equus caballus), while Richard H. Meadow and Ajita Patel contested that osteological markers
  overlap with the native Indian wild ass (Equus hemionus khur) still inhabiting Kutch.
