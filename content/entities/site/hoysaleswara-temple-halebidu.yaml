names:
  en: Hoysaleswara Temple, Halebidu
  iast: Hoyasaleśvara Mandira, Haḷēbīḍu
  native: ಹೊಯ್ಸಳೇಶ್ವರ ದೇವಸ್ಥಾನ, ಹಳೇಬೀಡು
summary: >-
  The Hoysaleswara Temple at Halebidu in Karnataka is a twelfth-century CE Shiva temple with two
  sanctuaries. Its stone walls carry bands of carving, including animals and scenes from the Ramayana,
  Mahabharata and Bhagavata Purana. It forms part of UNESCO's Sacred Ensembles of the Hoysalas.
summaries:
  kids: >-
    In the old Hoysala capital of Halebidu, the twin-shrine Hoysaleswara Temple is wrapped in band after
    band of soapstone carvings showing elephants, horses, dancers, and stories from the Ramayana and
    Mahabharata.
  teen: >-
    Construction of the Hoysaleswara Temple began in the early twelfth century CE in the Hoysala
    capital, Dwarasamudra. Its two Shiva sanctuaries share a platform, and bands of sculpture wrap
    around the exterior.
