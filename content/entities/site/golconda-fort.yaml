names:
  en: Golconda Fort
  iast: Golakoṇḍā Durga
  native: గోల్కొండ కోట
summary: >-
  Golconda Fort is a granite hilltop citadel in Hyderabad, Telangana. The Qutb Shahi rulers enlarged
  earlier fortifications and governed from Golconda before founding Hyderabad in 1591 CE. The citadel
  remained in use until and after its capture by Mughal forces in 1687 CE.
summaries:
  kids: >-
    Golconda Fort in Hyderabad climbs the sides of a rocky hill. Stone walls, gateways and the remains
    of palaces show how people defended the fort and lived inside it.
  teen: >-
    Golconda Fort grew from an earlier hill stronghold into the Qutb Shahi capital. The rulers enlarged
    its fortifications and palace buildings, and a Mughal siege ended in its capture in 1687 CE.
region: Deccan Plateau (Hyderabad district, Telangana)
location: { name: "Golconda, Hyderabad, Telangana", lat: 17.383, lon: 78.404 }
datings:
