    note: >-
      The Qutb Shahi rulers expanded an existing stronghold in the sixteenth and seventeenth centuries.
      Mughal forces captured the citadel in 1687 CE.
claims:
  - text: >-
      Golconda was the Qutb Shahi seat before the establishment of Hyderabad and was linked to the
      Deccan's diamond trade.
    grade: B
    sources:
