    note: >-
      Mughal court histories record the foundation in 1639 CE and Shah Jahan's ceremonial entry into the
      fort in 1648 CE.
claims:
  - text: >-
      The Nahr-i-Bihisht, or Stream of Paradise, carried water through the riverfront palace pavilions,
      including the Rang Mahal and Diwan-i-Khas.
