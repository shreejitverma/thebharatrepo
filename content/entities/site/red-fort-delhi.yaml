names:
  en: Red Fort, Delhi
  iast: Lāla Qilā, Dillī
  native: लाल क़िला, दिल्ली
summary: >-
  Shah Jahan built the Red Fort in Delhi as the palace-fortress of his capital, Shahjahanabad, from 1639
  to 1648 CE. The sandstone walls enclose audience halls and marble pavilions, some linked by a water
  channel. UNESCO inscribed the Red Fort Complex in 2007.
summaries:
  kids: >-
    Delhi's Red Fort was built for Emperor Shah Jahan. Behind its red sandstone walls are audience
    halls, marble buildings and the remains of a channel that once carried water through the palace.
  teen: >-
    Shah Jahan's fortified palace in Delhi was inaugurated in 1648 CE. Its riverfront pavilions were
    linked by a water channel, and later Mughal and British work altered the complex.
region: Delhi (Central Delhi)
location: { name: "Old Delhi, Delhi", lat: 28.656, lon: 77.240 }
