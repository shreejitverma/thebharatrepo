id: site.paiyampalli
type: site
kind: prehistory
names:
  en: Paiyampalli Neolithic and Megalithic Site
summary: >-
  A stratified terrace settlement at the foot of the Talathapamalai hills in Tirupattur (formerly North Arcot)
  district, Tamil Nadu, excavated by S. R. Rao, documenting the southward expansion of the Southern Neolithic
  (Period I, with dwelling pits, grey ware and horsegram) and its overlap with the Iron Age Megalithic (Period II).
summaries:
  kids: >-
    At Paiyampalli in Tamil Nadu, ancient farmers lived on hill terraces in round huts and dwelling pits, grew
    pulses and millets, and later learned to smelt iron and build stone megalithic tombs.
  teen: >-
    Excavated by S. R. Rao in the 1960s, Paiyampalli provides a key stratigraphic and radiocarbon benchmark for
    the Neolithic and early Iron Age Megalithic transition in northern Tamil Nadu during the 2nd and 1st millennia BCE.
region: Palar-Ponnaiyar watershed, Tirupattur district, Tamil Nadu
location:
  name: Paiyampalli
  lat: 12.51
  lon: 78.6
datings:
  - method: archaeological-radiocarbon
    range:
      earliest: -1800
      latest: -300
      best: -1500
      precision: century
      circa: true
    grade: A
    label: Radiocarbon dates for Period I Neolithic and Period II Megalithic levels
    sources:
      - src.fuller-2006-agricultural-origins-south-asia
      - src.fuller-2007-dating-neolithic-south-india
      - src.coningham-2015-archaeology-south-asia
    note: >-
      Calibrated charcoal radiocarbon dates place Period I (Neolithic) at c. 1800-1300 BCE and Period II
      (Megalithic with Black-and-Red Ware and iron slag) from the late 2nd to mid-1st millennium BCE.
claims:
  - text: >-
      Period I at Paiyampalli featured circular and oval dwelling pits cut into natural soil, post-hole superstructures,
      burnished grey and pale grey pottery, ground stone axes and charred horsegram (Macrotyloma uniflorum) and green gram.
    grade: A
    sources:
      - src.fuller-2006-agricultural-origins-south-asia
      - src.coningham-2015-archaeology-south-asia
  - text: >-
      Period II at Paiyampalli shows stratigraphic overlap between late Neolithic grey wares and wheel-made
      Megalithic Black-and-Red Ware accompanied by abundant iron slag, sickles and spears.
    grade: A
    sources:
      - src.coningham-2015-archaeology-south-asia
