id: site.kailasa-temple-ellora
type: site
kind: site
names:
  en: Kailasa Temple, Ellora
  iast: Kailāsa
  native: कैलास मंदिर
summary: >-
  The Kailasa temple (Cave 16) at Ellora is a complete Shiva temple carved downwards out of the basalt
  hillside, with its shrine, halls, courtyard and free-standing columns all cut from the living rock.
  It is attributed to the Rashtrakuta king Krishna I in the second half of the 8th century CE and is
  part of the Ellora Caves UNESCO World Heritage Site.
summaries:
  kids: >-
    The Kailasa temple was not built from blocks. Workers cut away rock from the top of a hill, little
    by little, until a whole temple stood inside the hole they made.
  teen: >-
    Instead of stacking stones, carvers at Ellora removed rock around a block of hillside and shaped the
    block into a two-storey temple with sculpture everywhere. It is named after Mount Kailasa, Shiva's
    home in the Himalayas.
region: Aurangabad district, Maharashtra
