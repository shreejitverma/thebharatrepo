id: "site.kangra-fort"
type: "site"
kind: "art"
names:
  en: "Kangra Fort"
summary: "Kangra Fort was a stronghold of the Katoch rulers. Jahangir's forces took it in 1620, and
  the 1905 Kangra earthquake severely damaged the complex."
summaries:
  kids: "Kangra Fort stands high above river valleys. Different rulers held it over the centuries, and
    a powerful earthquake damaged it in 1905."
  teen: "The fort's successive occupations reflect competition between hill rulers and larger powers.
    Jahangir records its capture in 1620, and later Sikh and British administrations also held it."
region: "Kangra, Himachal Pradesh"
datings:
  - method: "documentary"
    range:
      earliest: 1009
      latest: 1905
      precision: "century"
      circa: true
    grade: "C"
    label: "Documented use of the fort, from Mahmud of Ghazni's capture to the 1905 earthquake"
    sources:
      - "src.kangra-district-history"
      - "src.kangra-district-kangra-fort"
    note: "The district history records that Mahmud of Ghazni seized the fort in 1009, so it is older
      than that, and the fort was heavily damaged in the earthquake of 4 April 1905. The range is the
      fort's documented use, not its construction, which is undated, so it is graded C."
claims:
  - text: "Jahangir's memoir records the capture of Kangra Fort by Mughal forces in 1620."
    grade: "A"
    sources:
      - "src.jahangir-1909-tuzuk"
  - text: "The British took over the fort after the First Anglo-Sikh War, in 1846."
    grade: "B"
    sources:
      - "src.incredible-india-kangra-fort"
  - text: "The district history records that Mahmud of Ghazni seized the fort of Kangra in 1009."
    grade: "B"
    sources:
      - "src.kangra-district-history"
  - text: "The Kangra earthquake of 4 April 1905 caused massive structural damage to the fort."
    grade: "B"
    sources:
      - "src.kangra-district-kangra-fort"
      - "src.incredible-india-kangra-fort"
relations:
