summary: >-
  The Keshava Temple at Somanathapura in Karnataka was consecrated in 1268 CE under Hoysala king
  Narasimha III. Three carved towers rise over three Vishnu shrines set around a shared hall. The temple
  forms part of UNESCO's Sacred Ensembles of the Hoysalas.
summaries:
  kids: >-
    Built in 1268 CE, the Keshava Temple at Somanathapura in Karnataka has three carved stone towers
    over its three shrines.
  teen: >-
    Somanathapura's Keshava Temple has three sanctuaries on a shared platform. An inscription records
    its foundation by the Hoysala commander Somanatha, and inscriptions on sculptures preserve the names
    of artists.
region: Kaveri Valley (Mysuru district, Karnataka)
