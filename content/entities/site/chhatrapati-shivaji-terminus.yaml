names:
  en: Chhatrapati Shivaji Maharaj Terminus
  native: छत्रपती शिवाजी महाराज टर्मिनस
summary: >-
  Chhatrapati Shivaji Maharaj Terminus, originally Victoria Terminus, was built in Mumbai between 1878
  and 1888 CE to designs by Frederick William Stevens. The railway station and headquarters combine
  Victorian Gothic Revival architecture with local stone carving. UNESCO inscribed the building in 2004.
summaries:
  kids: >-
    Mumbai's Chhatrapati Shivaji Maharaj Terminus is a railway station with pointed stone arches, a
    large dome and carved animals. It was originally called Victoria Terminus.
  teen: >-
    Designed by Frederick William Stevens and completed in 1888 CE as the Great Indian Peninsula Railway
    headquarters, Victoria Terminus fused Victorian Gothic Revival engineering with Indian carved
    stonework and earned UNESCO World Heritage status in 2004.
