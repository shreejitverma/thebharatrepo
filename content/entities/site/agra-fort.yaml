kind: site
names:
  en: Agra Fort
  native: आगरा का क़िला
summary: >-
  Agra Fort is a red sandstone citadel beside the Yamuna in Agra. Akbar began rebuilding an earlier fort
  in 1565 CE, and Shah Jahan later added white marble court buildings. UNESCO inscribed Agra Fort in
  1983.
summaries:
  kids: >-
    Beside the Yamuna River in Agra, Emperor Akbar rebuilt an older fort in red sandstone. His grandson
    Shah Jahan later added white marble buildings inside the walls.
  teen: >-
    Akbar began rebuilding Agra Fort in 1565 CE. Its sandstone walls and palace buildings stand
    alongside marble audience halls, residences and mosques added under Shah Jahan.
region: Braj / Upper Ganga Plain (Agra district, Uttar Pradesh)
