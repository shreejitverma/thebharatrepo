names:
  en: Hampi
  native: ಹಂಪಿ
summary: >-
  Hampi contains the archaeological remains of Vijayanagara, a major South Indian capital from the
  fourteenth to sixteenth centuries. The landscape includes temples, royal and civic structures,
  fortifications, and waterworks; UNESCO inscribed the group of monuments in 1986.
summaries:
  kids: >-
    Hampi is a historic city in Karnataka. Its temples, walls, and other ruins show what the capital of
    the Vijayanagara Empire looked like.
  teen: >-
    The Hampi landscape preserves religious, royal, civic, and water-management structures associated
    with Vijayanagara. Archaeology and inscriptions help historians reconstruct the city's growth.
