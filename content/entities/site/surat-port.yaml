names:
  en: "Surat port"
summary: "Surat grew into a major port of Mughal India. Its merchants and shippers connected western
  India to the Red Sea and Persian Gulf, and Surat served pilgrims travelling to Mecca."
summaries:
  kids: "Ships sailed from Surat with goods and passengers. Some carried pilgrims on the sea journey
    towards Mecca."
  teen: "Mughal rule widened Surat's inland commercial links, while Indian Ocean networks connected it
    to West Asia. European trading companies entered a port economy already served by established
    merchants."
region: "Surat, Gujarat"
