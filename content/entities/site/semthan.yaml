id: "site.semthan"
type: "site"
kind: "site"
names:
  en: "Semthan"
summary: "Excavations at Semthan, near Bijbehara on a raised terrace above the Jhelum, uncovered
  successive early historic and medieval occupations. Terracottas and coins from the site and nearby
  finds illuminate Kashmir's links with the Indo-Greek world."
summaries:
  kids: "Archaeologists dug into an old mound above the Jhelum and found things left by people who
    lived there at different times. Some clay figures show connections with the Greek-speaking
    world."
  teen: "Semthan's sequence includes Northern Black Polished Ware levels, a phase identified as
    Indo-Greek, and later Kushan and post-Kushan material. Coins found nearby and objects from
    excavated layers provide different kinds of evidence."
region: "Kashmir Valley"
