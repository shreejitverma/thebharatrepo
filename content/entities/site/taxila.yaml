  iast: "Takṣaśilā"
  native: "तक्षशिला"
summary: "The Taxila World Heritage property comprises successive urban sites and Buddhist
  monuments. Literary and archaeological evidence identifies Taxila as a centre of learning, while
  scholars debate how broadly to apply the term university."
summaries:
  kids: "Taxila's ruins include old city walls, streets, and Buddhist buildings. Stories also describe
    people travelling to Taxila to learn from renowned teachers."
  teen: "Taxila's different settlement mounds record centuries of urban change. Buddhist texts
    describe students studying with individual teachers, while the wider site preserves monasteries
    and shrines from different periods."
