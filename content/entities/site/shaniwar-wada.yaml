names:
  en: "Shaniwar Wada"
  native: "शनिवार वाडा"
summary: "Shaniwar Wada was the fortified residence and seat of the Peshwas in Pune, built under
  Baji Rao I in the eighteenth century. A fire in 1828 destroyed much of the palace superstructure."
summaries:
  kids: "The Peshwas governed from a palace inside heavy walls. A fire destroyed much of the palace,
    but visitors can still see the gates and walls."
  teen: "Shaniwar Wada belonged to the growth of Pune as a centre of Maratha power. The surviving
    enclosure and foundations record only part of the former palace complex."
region: "Pune, Maharashtra"
