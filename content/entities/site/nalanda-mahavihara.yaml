  iast: Nālandā Mahāvihāra
  native: नालन्दा महाविहार
summary: >-
  Nalanda Mahavihara in Bihar developed into a major Buddhist centre of learning under the Guptas in the fifth century CE. Xuanzang attributed its founding to Shakraditya, often identified with Kumaragupta I. Later rulers supported the complex, and it remained in use into the thirteenth century.
summaries:
  kids: >-
    Nalanda grew into a great centre of learning in Bihar during the Gupta Empire. Students and scholars from across Asia lived and studied there.
  teen: >-
    Nalanda became a major centre of Buddhist learning under the Guptas. The traveller Xuanzang credited a king named Shakraditya with founding it. Historians often identify him with Kumaragupta I. The monastery was still in use in the thirteenth century.
