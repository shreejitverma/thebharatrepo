claims:
  - text: Excavated moidams at Charaideo reveal multi-tiered hemispherical earthen mounds sealing vaulted masonry chambers (garbhagriha) reached by arched gateways and enclosed by octagonal brick dwarf walls.
    grade: A
    sources:
      - src.unesco-2024-moidams-charaideo
  - text: The property was inscribed on the UNESCO World Heritage List in July 2024 as India's 43rd World Heritage Site.
