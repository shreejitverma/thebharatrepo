names:
  en: Charaideo Moidams
  native: চৰাইদেউ মৈদাম
summary: >-
  The Moidams at Charaideo in eastern Assam are the royal necropolis of the Tai-Ahom dynasty, used
  from the thirteenth to the nineteenth centuries CE across the Patkai foothills. Over ninety earthen
  tumuli cover vaulted brick, stone and timber burial chambers housing Ahom monarchs and elites, and
  UNESCO inscribed the property as a World Heritage Site in July 2024.
summaries:
  kids: >-
    At Charaideo in Assam stand the Moidams, giant grassy burial mounds built over brick-and-stone
    chambers for the kings and queens of the Ahom dynasty. In 2024 they became a UNESCO World
    Heritage Site.
  teen: >-
    Serving as the sacred funerary landscape of the Ahom kings for 600 years, the Charaideo Moidams
    preserve vaulted burial chambers beneath earthen tumuli and earned UNESCO World Heritage listing
    in 2024 as Northeast India's first cultural World Heritage property.
region: Charaideo district, Upper Assam
