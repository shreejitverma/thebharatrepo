summary: >-
  Gol Gumbaz at Vijayapura (Bijapur) in Karnataka is the seventeenth-century mausoleum of the Adil Shahi
  ruler Muhammad Adil Shah. Intersecting arches carry a large dome over a square chamber, and a gallery
  around the dome is known for its echoes.
summaries:
  kids: >-
    Inside the Gol Gumbaz tomb in Karnataka, a huge dome rises over an open hall. Along the high
    gallery, even quiet sounds can travel across the chamber.
  teen: >-
    Muhammad Adil Shah's mausoleum in Bijapur uses intersecting masonry arches to support a dome over a
    large square hall. The projecting gallery inside the dome is known as the Whispering Gallery.
