names:
  en: Dilwara Temples
  iast: Delavāḍā Jaina Mandira
  native: दिलवाड़ा जैन मंदिर
summary: >-
  The Dilwara Temples at Mount Abu, Rajasthan, comprise five Svetambara Jain temples. The marble halls
  and carved ceilings of the Vimala Vasahi and Luna Vasahi temples belong to several phases of work
  beginning in the eleventh and thirteenth centuries CE.
summaries:
  kids: >-
    At Mount Abu in Rajasthan, the Dilwara Jain temples have white marble halls. Their pillars, arches
    and round ceilings are covered in intricate carvings.
  teen: >-
    The five Dilwara temples include Vimala Vasahi, founded in 1031 CE, and Luna Vasahi, built in the
    thirteenth century. Their columns and carved marble ceilings reflect several phases of Jain
    patronage.
region: Aravalli Range (Mount Abu, Sirohi district, Rajasthan)
location: { name: "Mount Abu, Rajasthan", lat: 24.609, lon: 72.723 }
