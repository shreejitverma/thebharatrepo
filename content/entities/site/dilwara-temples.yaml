claims:
  - text: >-
      Jain inscriptional and literary accounts record Vimala Shah's foundation of the Adinatha temple in
      1031 CE.
    grade: B
    sources:
      - src.kumar-2001-thousand-petalled-lotus
      - src.hegewald-2009-jaina-temple-architecture
  - text: >-
      The Luna Vasahi temple is dedicated to Neminatha and has a carved ceiling pendant and subsidiary
      shrines around its courtyard.
    grade: B
    sources:
      - src.hegewald-2009-jaina-temple-architecture
      - src.kumar-2001-thousand-petalled-lotus
  - text: The Luna Vasahi temple, associated with Tejapala and Vastupala, was dedicated in 1230 CE.
    grade: A
    sources:
