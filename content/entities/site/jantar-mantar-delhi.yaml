names:
  en: Jantar Mantar, Delhi
  native: जंतर मंतर
summary: Jai Singh II’s Jantar Mantar at Delhi was the first observatory in his network. Its instruments
  include the Samrat Yantra, a large equinoctial sundial.
summaries:
  kids: A huge sloping wall at Delhi’s Jantar Mantar casts a shadow. The shadow helps tell the time.
  teen: Delhi’s instruments show how fixed masonry structures could measure the sky. The Samrat Yantra is
    aligned with the celestial pole, with scales that register its shadow.
