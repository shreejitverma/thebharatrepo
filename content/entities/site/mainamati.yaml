names:
  en: Mainamati
  iast: Maināmatī
  native: ময়নামতি
summary: >-
  Mainamati-Lalmai near Cumilla in southeastern Bangladesh is an 18-kilometre ridge housing more than
  fifty ancient Buddhist and Brahmanical sites of ancient Samatata from the seventh to twelfth
  centuries CE. Excavations at Shalban Vihara, Ananda Vihara, Rupban Mura and Kotila Mura revealed
  cruciform shrines, Deva and Chandra copper-plate grants, coins and bronze icons.
summaries:
  kids: >-
    Along the low hills of Mainamati in Bangladesh, archaeologists uncovered dozens of ancient brick
    Buddhist monasteries, led by Shalban Vihara with 115 monk rooms around a central temple.
  teen: >-
    Centred on ancient Devaparvata in Samatata, the Mainamati complex preserves Shalban Vihara (built
    by the 8th-century Deva king Bhavadeva) and rich epigraphic, numismatic and sculptural remains
    through the Chandra period.
region: Cumilla (Comilla) district, Bangladesh (ancient Samatata)
