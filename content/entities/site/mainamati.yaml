claims:
  - text: Excavations at Shalban Vihara uncovered a 115-cell quadrangular monastery around a central cruciform shrine and clay seals identifying it as Bhavadeva Mahavihara of the eighth-century Deva king Bhavadeva.
    grade: A
    sources:
      - src.imam-2000-excavations-at-mainamati
      - src.husain-1997-mainamati-devaparvata
  - text: Mainamati yielded inscribed copper plates, gold and silver coins of the Pattikera and Harikela series, bronze images and carved terracotta plaques documenting southeastern Bengal's Buddhist polity.
    grade: A
    sources:
      - src.imam-2000-excavations-at-mainamati
