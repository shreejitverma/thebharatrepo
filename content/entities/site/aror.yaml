debate: "Ahmad Hasan Dani used textual geography and the resemblance between place names to place
  Roruka near Rohri. Earlier suggestions discussed by Dani include T. W. Rhys Davids’s link to
  Surat. These are proposed identifications of a place. Reconstructing a ruling dynasty requires
  separate evidence."
