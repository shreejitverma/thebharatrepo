names:
  en: "Aror"
summary: "Aror, also called Alor, is near modern Rohri. Medieval accounts describe it as a political
  centre in Sindh before and during the Umayyad conquest. Its proposed identification with Roruka of
  Buddhist literature is debated."
summaries:
  kids: "Old accounts describe rulers at Aror, near today's Rohri. An older story mentions a place
    with a similar name, and historians have tried to work out whether it was the same place."
  teen: "Aror appears in conquest narratives as an inland political centre. The resemblance to Roruka
    is one clue for an older identification, which depends on interpreting ancient geographical and
    literary references."
region: "Upper Sindh, Pakistan"
