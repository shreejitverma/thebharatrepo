summary: "Rao Jodha founded Mehrangarh on a hill above Jodhpur in 1459. Its walls, gates and palaces
  reflect centuries of building by the Rathore rulers of Marwar."
summaries:
  kids: "A ruler named Rao Jodha built a fort on a high rock. Later rulers added rooms, courtyards and
    gates as the city of Jodhpur grew below."
  teen: "Mehrangarh's fabric records several building phases, including major work under Maldeo. The
    fort's plans and decoration changed with successive Marwar courts."
