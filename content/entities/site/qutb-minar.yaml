id: site.qutb-minar
type: site
kind: site
names:
  en: Qutb Minar and its Monuments
  iast: Quṭb Mīnār
  native: قطب مینار
summary: >-
  The Qutb complex in Delhi includes the Qutb Minar, the Quwwat-ul-Islam mosque, the tomb of Iltutmish,
  and later structures. Construction of the minar began under Qutb al-Din Aibak and continued under
  Iltutmish; UNESCO inscribed the complex as a World Heritage Site in 1993.
summaries:
  kids: >-
    The Qutb complex in Delhi has a tall stone minaret and several other historic buildings. Different
    rulers added to it over time.
  teen: >-
    The Qutb Minar is part of a larger architectural complex built and expanded under early Delhi
    Sultanate rulers. Its buildings preserve evidence of changing political power and craftsmanship.
