id: site.srirangam-ranganathaswamy-temple
type: site
kind: site
names:
  en: Sri Ranganathaswamy Temple, Srirangam
  iast: Śrī Raṅganāthasvāmi Kōyil, Śrīraṅgam
  native: ஸ்ரீரங்கம் ரங்கநாதசுவாமி கோயில்
summary: >-
  The Ranganathaswamy Temple at Srirangam near Tiruchirappalli, Tamil Nadu, is a major Sri Vaishnava
  pilgrimage centre dedicated to reclining Vishnu. Seven nested enclosures surround the main shrine.
  Inscriptions and architecture record patronage under the Chola, Pandya, Hoysala, Vijayanagara and
  Nayaka rulers.
summaries:
  kids: >-
    On an island between two rivers in Tamil Nadu, walls and tall gateways surround a temple to Vishnu.
    Seven enclosures lead inward toward the main shrine.
  teen: >-
    Srirangam is both a temple and a town. Its enclosures surround the shrine of reclining Vishnu, and
    inscriptions record gifts made under several dynasties. Hymns of the Alvars celebrate the shrine.
region: Kaveri River Island (Tiruchirappalli district, Tamil Nadu)
location: { name: "Srirangam, Tiruchirappalli, Tamil Nadu", lat: 10.862, lon: 78.690 }
datings:
