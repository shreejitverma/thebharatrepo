names:
  en: Shravanabelagola
  iast: Śravaṇabeḷagoḷa
  native: ಶ್ರವಣಬೆಳಗೊಳ
summary: >-
  Shravanabelagola, in Hassan district, Karnataka, is one of South India's foremost Digambara Jain pilgrimage and epigraphic centres, set between two granite hills: Chandragiri (Chikkabetta) and Vindhyagiri (Indragiri). Over 500 inscriptions in Kannada, Sanskrit, Marathi, and Tamil record centuries of Jain ascetic sallekhana vows from the 7th century CE onward and Chavundaraya's consecration of the Gommateshwara colossus in c. 981 CE, while Jain tradition remembers Bhadrabahu and Chandragupta Maurya migrating here in the 3rd century BCE.
summaries:
  kids: >-
    Shravanabelagola is a sacred Jain hill town in Karnataka famous for hundreds of carved stone inscriptions and the giant statue of Bahubali standing atop Vindhyagiri hill.
  teen: >-
    Between Chandragiri and Vindhyagiri hills, Shravanabelagola preserves more than 500 inscriptions documenting Jain ascetic vows (sallekhana) since the 7th century CE, alongside traditions of Bhadrabahu and Chandragupta Maurya.
region: Hassan District, Karnataka
