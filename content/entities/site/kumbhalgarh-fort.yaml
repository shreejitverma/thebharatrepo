names:
  en: "Kumbhalgarh Fort"
summary: "Kumbhalgarh is a fortified hill complex in the Aravallis associated with Rana Kumbha of
  Mewar. It preserves both defensive works and religious buildings."
summaries:
  kids: "Kumbhalgarh's walls follow the hills. Inside the fort were temples and other buildings used
    by the rulers and people of Mewar."
  teen: "The fort's hilltop design links long perimeter walls to its terrain. A Sanskrit inscription
    from its Kumbhasvamin temple provides an independent anchor for fifteenth-century royal
    patronage."
region: "Rajsamand district, Rajasthan"
