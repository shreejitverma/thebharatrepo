id: "site.amber-fort"
type: "site"
kind: "art"
names:
  en: "Amber Fort"
summary: "Amber Fort was a fortified palace of the Kachhwaha rulers. Its courtyards and audience
  spaces illustrate the exchange of architectural ideas between Rajput courts and the Mughal
  empire."
summaries:
  kids: "Amber's rulers built a palace inside the fort walls. Its gates, courtyards and halls show how
    rulers lived and met visitors."
  teen: "The standing palace was developed under successive Kachhwaha rulers. Its relationship to the
    surrounding hills and defensive works is part of the reason for its inclusion in the Hill Forts
    of Rajasthan World Heritage property."
region: "Amer, Jaipur district, Rajasthan"
