summary: >-
  The Mukteshwar Temple in Bhubaneswar, Odisha, is a Shiva shrine usually dated to the tenth century CE.
  It pairs a curved sanctuary tower with a tiered porch roof. A freestanding carved stone arch marks the
  entrance to the enclosure.
summaries:
  kids: >-
    At the Mukteshwar Temple in Bhubaneswar, a carved stone arch leads into the courtyard of a
    thousand-year-old shrine to Shiva.
  teen: >-
    The Mukteshwar Temple pairs a curved sanctuary tower with a porch beneath a stepped roof. Its carved
    gateway and sculpture help historians place it within tenth-century Odisha temple architecture.
