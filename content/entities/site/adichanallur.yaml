claims:
  - text: Alexander Rea's 1899-1905 excavations recovered large pyriform burial urns, iron daggers and tridents, high-tin bronze bowls with animal finials, gold mouthpieces or diadems, and paddy husks.
    grade: A
    sources:
      - src.rea-1915-adichanallur-perumbair
      - src.coningham-2015-archaeology-south-asia
  - text: The site demonstrates advanced early South Indian iron working and high-tin bronze metallurgy within a settled agricultural community cultivating rice and millets in the Tamiraparani valley.
    grade: B
