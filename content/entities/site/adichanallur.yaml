names:
  en: Adichanallur Urn-Burial Site
  iast: Āticcanallūr
  native: ஆதிச்சநல்லூர்
summary: >-
  Adichanallur (Adichchanallur), on the right bank of the Tamiraparani River in Thoothukudi district, Tamil Nadu, is one of the largest Iron Age megalithic urn-burial necropolises in South India. Excavated by Fedor Jagor (1876), Alexander Rea (1899-1905), and the Archaeological Survey of India (2004-2005), it has yielded hundreds of large terracotta burial urns containing human skeletons, Black-and-Red Ware, iron weapons, bronze vessels, and gold diadems, with calibrated AMS dates centering around 900 to 600 BCE.
summaries:
  kids: >-
    Adichanallur is an ancient cemetery along the Tamiraparani river in Tamil Nadu where thousands of years ago people buried their dead inside huge clay jars along with bronze lids, iron tools, and gold bands.
  teen: >-
    Excavated since the late 19th century and re-examined by the ASI in 2004-2005, Adichanallur preserves an extensive Iron Age urn-burial complex with Black-and-Red Ware, fine bronzes, gold diadems, and radiocarbon dates reaching the early 1st millennium BCE.
region: Tamiraparani River basin, Thoothukudi District, Tamil Nadu
