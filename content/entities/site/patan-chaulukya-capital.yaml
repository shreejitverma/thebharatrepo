names:
  en: "Patan and the Chaulukya court"
  iast: "Aṇahilapāṭaka"
summary: "Patan, historically Anahilapataka or Anahilavada, was the capital of the Chaulukyas of
  Gujarat. Jain scholars and communities flourished there, and the court patronage of Hemachandra is
  especially well remembered."
summaries:
  kids: "Patan was the capital of rulers called the Chaulukyas. Scholars such as Hemachandra worked
    there, and the city is also known for a richly carved stepwell."
  teen: "The city linked royal patronage, Jain scholarship and merchant communities. Its surviving
    stepwell and literary records provide different kinds of evidence for the Chaulukya period."
region: "Patan, Gujarat"
