id: site.shortugai
type: site
kind: site
names:
  en: Shortugai
  iast: Shūrtūgāy
  native: شورتوگای
summary: >-
  A Mature Harappan trading and craft colony situated north of the Hindu Kush near the confluence of the Kokcha
  and Amu Darya (Oxus) rivers in Badakhshan, northeastern Afghanistan (c. 2300-1800 BCE), excavated by Henri-Paul
  Francfort (1976-1979), established to procure Badakhshan lapis lazuli, tin, and Central Asian resources.
summaries:
  kids: >-
    Far across the Hindu Kush mountains in northern Afghanistan, Harappan traders built the outpost of Shortugai
    near the mines that supplied deep-blue lapis lazuli stone.
  teen: >-
    Excavated by Henri-Paul Francfort in the late 1970s near the Amu Darya in northern Afghanistan, Shortugai is
    the northernmost known Harappan settlement, showing pure Mature Harappan seals, pottery, and carnelian beads
    hundreds of kilometres from the Indus plain.
region: Takhar / Badakhshan border, Amu Darya (Oxus) valley, northern Afghanistan
location:
  name: Shortugai
  lat: 37.3250
  lon: 69.5250
datings:
  - method: archaeological-radiocarbon
    range:
      earliest: "2300 BCE"
      latest: "1800 BCE"
      precision: century
      circa: true
    grade: B
    label: Mature Harappan colony and later levels
    sources:
      - src.possehl-2002-indus-civilization
      - src.kenoyer-1998-ancient-cities-indus
      - src.wright-2010-ancient-indus
    note: >-
      Henri-Paul Francfort's excavations found a Mature Harappan colony overlain by later levels with Central
      Asian (Bactrian) affinities.
      The period-by-period radiocarbon dates could not be checked against the cited syntheses for this entry, so
      the range keeps the broader span of about 2300 to 1800 BCE rather than a narrower one for the colony alone.
claims:
  - text: >-
      Despite lying more than 1,000 km north of the core Indus alluvial plain across the Hindu Kush passes,
      Shortugai Period I displays an entirely Mature Harappan material assemblage: mud-bricks in the 1:2:4 ratio,
      a square steatite seal bearing a rhinoceros and Indus script, black-on-red painted pottery with pipal-leaf
      and peacock motifs, etched carnelian beads, and marine shell bangles imported from the Arabian Sea.
    grade: A
    sources:
      - src.kenoyer-1998-ancient-cities-indus
      - src.possehl-2002-indus-civilization
      - src.wright-2010-ancient-indus
  - text: >-
      Workshops at Shortugai contained unworked nodules, debitage, and stone drill bits for processing lapis lazuli
      from the nearby Sar-i-Sang mines of Badakhshan, alongside an artificial irrigation canal drawing water from
      the Kokcha River.
    grade: A
    sources:
      - src.possehl-2002-indus-civilization
      - src.wright-2010-ancient-indus
      - src.singh-2008-ancient-early-medieval-india
