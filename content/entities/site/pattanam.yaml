names:
  en: Pattanam Archaeological Site
  iast: Paṭṭaṇam
  native: പട്ടണം
summary: >-
  Pattanam, near North Paravur in Ernakulam district, Kerala, is an Early Historic urban port site excavated by the Kerala Council for Historical Research (KCHR) beginning in 2007 under P. J. Cherian. Excavations revealed a burnt-brick wharf, a wooden dugout canoe, Mediterranean Roman amphorae, terra sigillata, West Asian turquoise-glazed pottery, and Indian Rouletted Ware, making Pattanam the strongest archaeological candidate for the ancient Chera emporium of Muziris.
summaries:
  kids: >-
    At Pattanam in Kerala, archaeologists dug up an old brick boat dock, a wooden canoe, Roman wine jars, and glass beads, giving physical proof of ancient sea trade along the Malabar Coast.
  teen: >-
    Excavated from 2007 onward, Pattanam yielded Roman amphorae, Sasanian glazed wares, a brick wharf, and a preserved wooden canoe dating from the early centuries BCE through the 4th century CE, widely linked to ancient Muziris.
