names:
  en: Ramappa Temple
  iast: Rāmappa Dēvālayaṃ
  native: రామప్ప దేవాలయం
summary: >-
  The Rudreshvara temple at Palampet in Telangana, popularly called the Ramappa temple, was built in
  1213 CE by Recharla Rudra, a general of the Kakatiya king Ganapatideva. It is known for its carved
  basalt brackets and pillars and for a vimana built of light bricks. UNESCO listed it in 2021 as the
  Kakatiya Rudreshwara (Ramappa) Temple.
summaries:
  kids: >-
    The Ramappa temple in Telangana is about 800 years old. Its roof tower is made of special bricks so
    light that, people say, they can float on water.
  teen: >-
    Built under the Kakatiya kings of Warangal, the Ramappa temple combines granite, basalt carving and
    lightweight bricks. Its graceful bracket figures of dancers are among the finest Kakatiya sculptures.
region: Mulugu district, Telangana
