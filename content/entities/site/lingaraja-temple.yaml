names:
  en: Lingaraja Temple
  iast: Liṅgarāja Mandira
  native: ଲିଙ୍ଗରାଜ ମନ୍ଦିର
summary: >-
  The Lingaraja temple at Bhubaneswar is one of the largest of the city's many medieval Shiva temples and a
  mature example of the Kalinga style of Odisha, with a tall curved rekha tower over the sanctum and a
  sequence of halls in front. It is usually dated to the 11th century CE and is still in active worship.
summaries:
  kids: >-
    The Lingaraja temple in Bhubaneswar is a huge temple to Shiva with a tall, curved tower. People have
    been worshipping there for about a thousand years.
  teen: >-
    Bhubaneswar is called a temple city, and the Lingaraja is one of its biggest temples. Its line of connected halls,
    including a dance hall and an offering hall, shows how Odisha temples grew as rituals became more
    elaborate.
