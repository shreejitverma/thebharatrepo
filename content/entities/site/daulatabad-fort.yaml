id: "site.daulatabad-fort"
type: "site"
kind: "art"
names:
  en: "Daulatabad Fort"
summary: "Devagiri, later called Daulatabad, was a Yadava capital and a fortified centre used by the
  Delhi Sultanate and later Deccan states. Its walls and scarped hill preserve defences built across
  several periods."
summaries:
  kids: "The fort at Daulatabad stands on a steep hill. Yadava rulers used the site as their capital,
    and later rulers built and repaired defences there."
  teen: "The stronghold served different regimes and preserves several building phases. Muhammad bin
    Tughluq used the renamed Daulatabad as a centre of government for the Deccan."
region: "Daulatabad, Maharashtra"
