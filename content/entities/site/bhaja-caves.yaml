names:
  en: Bhaja Caves
  iast: Bhājā Guhāḥ
  native: भाजा लेणी
summary: >-
  The Bhaja Caves near Lonavala in Maharashtra are a group of early Buddhist rock-cut monuments.
  Excavated mainly in the second and first centuries BCE, they include a vaulted worship hall with
  surviving timber ribs and a group of rock-cut stupas.
summaries:
  kids: >-
    At Bhaja in Maharashtra, workers carved a large Buddhist worship hall into a hillside. Wooden ribs
    still line its stone ceiling, and a group of carved stone stupas stands nearby.
  teen: >-
    Bhaja's Buddhist caves preserve a rock-cut worship hall fitted with timber ribs, monastic cells and
    carved stupas. Two panels in Cave 19 are often interpreted as Surya in a chariot and Indra on an
    elephant.
region: Sahyadri / Western Ghats (Pune district, Maharashtra)
