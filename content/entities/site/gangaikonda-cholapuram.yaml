id: site.gangaikonda-cholapuram
type: site
kind: site
names:
  en: Brihadisvara Temple, Gangaikondacholapuram
  iast: Gaṅgaikoṇḍacōḻapuram Bṛhadīśvara
  native: கங்கைகொண்ட சோழபுரம் பெருவுடையார் கோயில்
summary: >-
  The Brihadisvara Temple at Gangaikondacholapuram in Tamil Nadu was built under Rajendra Chola I in the
  first half of the eleventh century CE. The temple in his new capital has a tall pyramidal tower with a
  concave profile. It forms part of UNESCO's Great Living Chola Temples.
summaries:
  kids: >-
    Built nearly a thousand years ago by King Rajendra Chola I in his new capital city, this grand
    granite Shiva temple has a curved stone tower and carved reliefs of Shiva blessing his devotees.
  teen: >-
    Rajendra Chola I built the temple at his new capital, Gangaikondacholapuram. The Esalam copper
    plates attest the temple by 1036 CE, and its concave tower profile differs from the tower at
    Thanjavur.
region: Lower Kaveri Delta (Ariyalur district, Tamil Nadu)
