id: site.dholavira
type: site
kind: site
names:
  en: Dholavira
  iast: Dholāvīrā
  native: धोलावीरा
summary: >-
  A monumental Harappan city on Khadir Bet island in the Rann of Kutch, Gujarat, occupied across seven cultural
  stages (c. 3000-1500 BCE), celebrated for its dressed-stone architecture, tripartite urban plan (Citadel, Middle
  Town, Lower Town), ten-sign gypsum signboard, and sophisticated rock-cut water harvesting reservoirs; inscribed
  as a UNESCO World Heritage Site in 2021.
summaries:
  kids: >-
    Built on an island in the dry Rann of Kutch, Dholavira captured seasonal rainwater in giant stone-lined
    reservoirs and had a huge ten-letter signboard above its castle gate.
  teen: >-
    Excavated by R. S. Bisht for the Archaeological Survey of India and designated a UNESCO World Heritage Site
    in 2021, Dholavira features three walled urban divisions and an extensive network of dams, stormwater channels,
    and rock-cut reservoirs that sustained a major city in an arid environment.
region: Khadir Bet, Kutch District, Gujarat, India
location:
  name: Dholavira
  lat: 23.8869
  lon: 70.2122
datings:
  - method: archaeological-stratigraphic
    range:
      earliest: -2999
      latest: -1499
      precision: century
      circa: true
    grade: A
    label: Seven-Stage Occupational Sequence (Stages I to VII)
    sources:
      - src.bisht-2015-excavations-at-dholavira
      - src.unesco-2021-dholavira
      - src.possehl-2002-indus-civilization
    note: >-
      R. S. Bisht documented seven cultural stages spanning Early to Mature transition (Stages I-III, c. 3000-2500 BCE),
      classic Mature Harappan urbanism (Stages IV-V, c. 2500-2000 BCE), Late Harappan contraction (Stage VI,
      c. 1950-1800 BCE), and post-urban reoccupation (Stage VII, c. 1550-1450 BCE).
  - method: documentary
    range:
      earliest: 2021
      latest: 2021
      precision: year
      circa: false
    grade: A
    label: UNESCO World Heritage Inscription
    sources:
      - src.unesco-2021-dholavira
    note: >-
      Inscribed on the UNESCO World Heritage List in July 2021 under criteria (iii) and (iv) as "Dholavira: a
      Harappan City".
claims:
  - text: >-
      To survive in an arid zone receiving less than 300 mm of annual rainfall without a perennial river, Dholavira's
      engineers dammed the seasonal Manhar and Mansar streams and excavated at least 16 interconnected stone-lined
      and rock-cut reservoirs surrounding the city walls, dedicating roughly 10 hectares (nearly a fifth of the
      walled area) to water storage.
    grade: A
    sources:
      - src.bisht-2015-excavations-at-dholavira
      - src.unesco-2021-dholavira
      - src.agrawal-2018-dholavira-gpr
  - text: >-
      Unlike Harappa and Mohenjo-daro, Dholavira was laid out in three principal divisions-a bipartite Citadel
      (Castle and Bailey), a Middle Town, and a Lower Town-separated by an open ceremonial ground or stadium and
      built extensively with dressed sandstone blocks alongside mud-bricks.
    grade: A
    sources:
      - src.bisht-2015-excavations-at-dholavira
      - src.possehl-2002-indus-civilization
      - src.singh-2008-ancient-early-medieval-india
  - text: >-
      In 2021, UNESCO inscribed Dholavira on the World Heritage List as the first Harappan site in India to receive
      World Heritage status.
    grade: A
    sources:
      - src.unesco-2021-dholavira
