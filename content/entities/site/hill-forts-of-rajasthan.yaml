id: site.hill-forts-of-rajasthan
type: site
kind: site
names:
  en: Hill Forts of Rajasthan
  native: राजस्थान के पहाड़ी दुर्ग
summary: >-
  UNESCO's Hill Forts of Rajasthan comprise Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber and
  Jaisalmer. Built and enlarged over centuries, the forts use rocky ridges, rivers and desert terrain
  for defence and enclose buildings and waterworks developed under Rajput rule.
summaries:
  kids: >-
    Six forts across Rajasthan are grouped together on UNESCO's World Heritage List. Builders used the
    rocky hills, rivers and desert around them to help defend their walls.
  teen: >-
    The six Hill Forts of Rajasthan became a single UNESCO property in 2013. Their setting and design
    vary widely, from the river defences at Gagron to the desert fort at Jaisalmer.
region: Rajasthan (Chittorgarh, Rajsamand, Sawai Madhopur, Jhalawar, Jaipur, and Jaisalmer)
location: { name: "Chittorgarh Fort, Rajasthan", lat: 24.883, lon: 74.646 }
