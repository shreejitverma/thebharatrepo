names:
  en: Ajanta Caves
  iast: Ajaṇṭā Guhāḥ
  native: अजन्ता गुहाः
summary: >-
  The Ajanta Caves are a crescent-shaped complex of around thirty rock-cut Buddhist chaitya prayer halls and vihara monasteries carved into a basalt gorge above the Waghora River in Maharashtra. Excavated in two major phases - an early Satavahana-era group (Caves 9, 10, 12, 13 and 15A, second to first century BCE) and a fifth-century CE Mahayana phase patronised by the Vakataka court under Emperor Harishena - Ajanta preserves the most extensive surviving corpus of classical Indian wall paintings alongside monumental rock-cut sculpture.
summaries:
  kids: >-
    Carved into a horseshoe-shaped rock cliff in Maharashtra, the thirty Ajanta Caves contain ancient Buddhist prayer halls, monasteries and famous wall paintings of the Buddha's past lives (Jataka tales).
  teen: >-
    Excavated in an early Satavahana phase (c. 100 BCE) and a brilliant fifth-century CE Vakataka phase, the Ajanta Caves preserve world-renowned murals of Jataka stories and Bodhisattvas; art historians debate Walter Spink's short chronology (c. 462-480 CE under Emperor Harishena) versus longer fifth- to sixth-century CE timelines.
region: Northern Deccan (Chhatrapati Sambhajinagar / Aurangabad District, Maharashtra)
