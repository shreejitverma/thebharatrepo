datings:
  - method: art-historical
    range: { earliest: "150 BCE", latest: 480, precision: decade, circa: true }
    grade: B
    label: Two-phase chronology with Walter M. Spink's short Vakataka chronology (c. 100 BCE and c. 462-480 CE)
    sources:
      - src.spink-2005-ajanta-end-of-golden-age
    note: Everyone agrees that Caves 9, 10, 12, 13 and 15A date to c. 100 BCE-100 CE; for the second phase, Walter Spink argues from epigraphic, architectural and stratigraphic clues that the entire Mahayana excavation program took place in a compressed nineteen-year burst (c. 462-480 CE) during the reign of the Vakataka emperor Harishena, collapsing abruptly after Harishena's death.
  - method: art-historical
    range: { earliest: "150 BCE", latest: 550, precision: century, circa: true }
    grade: C
    label: Extended second-phase chronology (fifth to mid-sixth century CE)
    sources:
      - src.spink-2005-ajanta-end-of-golden-age
      - src.kulke-2004-history-of-india
    note: Several art historians and epigraphists question whether all Vakataka caves and mural programs could be completed within eighteen years and propose a longer development spanning the fifth and early sixth centuries CE.
claims:
  - text: Donative inscriptions in Caves 16, 17 and 26 link the fifth-century CE Mahayana excavations at Ajanta to Varahadeva (chief minister of the Vakataka king Harishena of the Vatsagulma branch), a local tributary ruler of Ashmaka, and the monk Buddhabhadra.
    grade: A
    sources:
      - src.spink-2005-ajanta-end-of-golden-age
      - src.salomon-1998-indian-epigraphy
  - text: Painted on dry mud-and-lime plaster (tempera/secco technique) inside Caves 1, 2, 16 and 17, the Ajanta murals depict Jataka narratives and Bodhisattva figures such as Padmapani and Vajrapani with naturalistic shading (vartana), expressive gesture and vivid courtly detail.
    grade: A
    sources:
      - src.spink-2005-ajanta-end-of-golden-age
debate: >-
  While the early phase at Ajanta (Caves 9, 10, 12, 13, 15A) is securely dated to the second/first century BCE, the duration of the second (Mahayana) phase is a major art-historical debate. Walter M. Spink argued through an exhaustive cave-by-cave structural and chisel-mark analysis that the second phase spanned less than two decades (c. 462-480 CE) under the Vakataka emperor Harishena. Other art historians and epigraphists question whether so many caves and painting cycles could be executed in eighteen years and argue for a broader development spanning the mid-fifth to the early or mid-sixth century CE.
