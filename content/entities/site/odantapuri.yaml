id: site.odantapuri
type: site
kind: site
names:
  en: Odantapuri
  iast: Odantapurī (Uddaṇḍapura)
  native: ओदन्तपुरी
summary: >-
  Odantapuri (also called Uddandapura or Odantapura), located in and around modern Bihar Sharif in
  Nalanda district, Bihar, was one of the great Buddhist monastic universities (mahaviharas) of the
  Pala era. Tibetan chronicles attribute its foundation to Gopala I in the eighth century CE and
  record its layout as the architectural model for Tibet's Samye Monastery before Turkic raids
  devastated it around 1200 CE.
summaries:
  kids: "Odantapuri in Bihar was one of the famous Pala-period Buddhist universities, and Tibetan tradition says its design was the model for Tibet's first great monastery at Samye."
  teen: >-
    Identified with Bihar Sharif in Bihar, the Odantapuri mahavihara flourished under Pala patronage
    from the 8th century until Turkic raids around 1193-1202 CE, when Persian chroniclers noted its
    fortified monastic walls.
region: Nalanda district (Bihar Sharif), Bihar
location: { name: "Bihar Sharif, Bihar", lat: 25.202, lon: 85.524 }
datings:
  - method: scholarly-consensus
    range: { earliest: 750, latest: 1202, precision: decade, circa: true }
    grade: B
    label: Pala foundation to late twelfth-century raids
    sources:
      - src.dutt-1988-buddhist-monks-monasteries
