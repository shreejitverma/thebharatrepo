    note: Tibetan histories connect its founding to Gopala (c. 750 CE); epigraphic finds name Uddandapura, and Minhaj-i-Siraj's Tabaqat-i-Nasiri records Bakhtiyar Khalji's raid on the fortified vihara of Bihar c. 1193-1202 CE.
claims:
  - text: A brass votive image inscription and other antiquities from Bihar Sharif confirm the site's medieval name as Uddandapura / Odantapuri.
    grade: A
    sources:
      - src.dutt-1988-buddhist-monks-monasteries
      - src.scharfe-2002-education-in-ancient-india
  - text: Tibetan historical traditions state that Shantarakshita and Padmasambhava modelled Samye, Tibet's first monastery (c. 775 CE), on Odantapuri's design.
    grade: C
    sources:
      - src.dutt-1988-buddhist-monks-monasteries
      - src.davidson-2002-indian-esoteric-buddhism
  - text: Minhaj-i-Siraj's Tabaqat-i-Nasiri describes Bakhtiyar Khalji capturing the fortified college (hisar-i-Bihar) around 1200 CE, widely identified by historians with Odantapuri at Bihar Sharif.
    grade: B
    sources:
      - src.raverty-1881-tabakat-i-nasiri
      - src.eaton-2000-temple-desecration
