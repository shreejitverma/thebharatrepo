names:
  en: "Jain caves at Ellora"
summary: "The Jain monuments at Ellora include rock-cut shrines and halls with images of Jinas,
  attendant figures and devotional scenes. Their sculpture and layout link them to other phases of
  activity at the site."
summaries:
  kids: "At Ellora people carved halls, pillars and holy figures out of the rock. Some of the caves
    were made for Jain worship."
  teen: "The northern Jain group includes Indra Sabha and Jagannatha Sabha. Lisa Owen analyses
    architecture, images and inscriptions together to reconstruct devotional practices."
