claims:
  - text: The city is surrounded by a square earthen rampart measuring roughly 1.12 km on each side, pierced by two formal gateways on each face and surrounded by a moat.
    grade: A
    sources:
      - src.lal-1949-ancient-india-no5
      - src.smith-2015-sisupalgarh-terracotta
  - text: Excavations recovered Northern Black Polished Ware, Rouletted Ware, punch-marked and Puri-Kushan coins, and thousands of moulded terracotta ornaments.
    grade: A
    sources:
      - src.lal-1949-ancient-india-no5
      - src.smith-2015-sisupalgarh-terracotta
  - text: Historians have proposed identifying Sisupalgarh with Ashokan Tosali or Kharavela's Kalinganagari, though no excavated site inscription directly names the city.
    grade: C
    sources:
      - src.lal-1949-ancient-india-no5
      - src.singh-2008-ancient-early-medieval-india
