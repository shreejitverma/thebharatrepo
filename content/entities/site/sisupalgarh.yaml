names:
  en: Sisupalgarh
  iast: Śiśupālagarh
  native: ଶିଶୁପାଳଗଡ଼
summary: >-
  Sisupalgarh, on the outskirts of Bhubaneswar in Odisha, is one of the largest and best-preserved
  early historic fortified cities in eastern India, enclosed by a near-square rampart about 1.1 km
  on each side with monumental gateways. Excavations by B. B. Lal and later Monica L. Smith and
  R. K. Mohanty document urban occupation from around the mid-first millennium BCE to the fourth
  century CE, frequently linked with ancient Tosali or Kalinganagari.
summaries:
  kids: >-
    Near Bhubaneswar in Odisha lies Sisupalgarh, a giant square-walled ancient city with stone
    gateways built over 2,000 years ago, where people lived in planned streets and wore terracotta
    ear ornaments.
  teen: >-
    Surveyed and excavated in 1948 and again from 2005, Sisupalgarh reveals a planned early historic
    square fortification with eight formal gateways, monolithic pillar clusters and dense urban housing
    in coastal Odisha.
