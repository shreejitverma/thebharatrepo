names:
  en: Konark Sun Temple
  native: କୋଣାର୍କ ସୂର୍ଯ୍ୟ ମନ୍ଦିର
summary: >-
  The Sun temple at Konark on the Odisha coast was built in the 13th century CE, attributed to the
  Eastern Ganga king Narasimhadeva I. It was conceived as the chariot of the sun god Surya, with
  twenty-four carved stone wheels and teams of horses. The tall sanctuary tower has collapsed; the
  assembly hall (jagamohana) survives. UNESCO listed it in 1984.
summaries:
  kids: >-
    The Konark temple is shaped like the giant chariot of Surya, the sun god, with huge stone wheels
    and stone horses pulling it.
  teen: >-
    Konark's carved wheels are covered with fine sculpture, spoke by spoke. The main
    tower fell long ago, but the surviving hall still shows how ambitious Odisha's temple builders were.
