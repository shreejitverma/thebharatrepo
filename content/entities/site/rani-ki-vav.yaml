      - src.burgess-cousens-1903-northern-gujarat
  - text: >-
      The sculptural program includes Vishnu reclining on the serpent Shesha and images of his avatars.
    grade: B
    sources:
      - src.mankodi-1991-queens-stepwell-patan
      - src.rani-ki-vav-unesco
  - text: >-
      UNESCO inscribed the stepwell on the World Heritage List in 2014.
    grade: A
