id: site.rani-ki-vav
type: site
kind: site
names:
  en: Rani ki Vav
  iast: Rāṇī kī Vāv
  native: રાણકી વાવ
summary: >-
  Rani ki Vav, the Queen's Stepwell at Patan in Gujarat, dates to the eleventh century CE and is
  attributed to Queen Udayamati. Its seven levels descend past carved walls and pillared pavilions to a
  well. UNESCO inscribed it in 2014.
summaries:
  kids: >-
    At Patan in Gujarat, steps lead down through seven levels to a well. Hundreds of carvings decorate
    the walls and pillars along the way.
  teen: >-
    Rani ki Vav combines a water supply structure with pillared galleries and stone sculpture.
    Architectural study places it in the eleventh century CE, and a later account credits Queen
    Udayamati.
region: North Gujarat (Patan district, Gujarat)
location: { name: "Patan, Gujarat", lat: 23.859, lon: 72.102 }
