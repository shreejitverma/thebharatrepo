summary: The traditional Rigvedic index attributes two hymns to Ghosha Kakshivati. The hymns address
  the Ashvins, divine twins, and the chronology concerns their textual setting. Ghosha’s lifetime is
  unknown.
summaries:
  kids: Two Rigvedic hymns asking help from the twin gods called the Ashvins were passed down under
    Ghosha’s name.
  teen: The traditional index assigns Rigveda 10.39 and 10.40 to Ghosha Kakshivati. This records how
    the tradition attributed the hymns. Her biography remains uncertain.
