summary: Aybak was a Ghurid commander who became effectively autonomous at Lahore after the Ghurid
  succession crisis of 1206. His career marks the beginning of the Delhi Sultanate, whose Delhi
  court was consolidated by Iltutmish.
summaries:
  kids: Aybak was a commander who became a ruler in his own right. Iltutmish, one of his successors,
    made Delhi his seat.
  teen: Aybak's authority was effectively independent after 1206. Peter Jackson uses coins and the
    Ghurid relationship to qualify which formal title Aybak held.
