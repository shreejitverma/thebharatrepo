names:
  en: Guru Har Rai
  native: ਗੁਰੂ ਹਰਿ ਰਾਇ
summary: Guru Har Rai, the seventh Sikh Guru, succeeded his grandfather Guru Hargobind. He led the
  community from the Punjab foothills and was succeeded by his younger son Har Krishan.
summaries:
  kids: Guru Har Rai became Guru after his grandfather. His young son Har Krishan later took his place.
  teen: Guru Har Rai continued the line of Sikh leadership based at Kiratpur. The choice of his
    younger son Har Krishan as Guru left his elder son Ram Rai outside that line of succession.
region: Kiratpur, Punjab
