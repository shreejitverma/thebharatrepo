names:
  en: "Utpaladeva"
  iast: "Utpaladeva"
  native: "उत्पलदेव"
summary: "Utpaladeva developed the Recognition school of Kashmiri Shaiva philosophy. In his Verses
  on the Recognition of the Lord he argues that liberation involves recognising one's own
  consciousness as Shiva."
summaries:
  kids: "Utpaladeva wrote verses that ask readers to pay attention to what it is like to be aware. In
    his teaching, knowing that awareness properly is a way to recognise Shiva."
  teen: "Utpaladeva turned the Shaiva doctrine of recognition into a sustained philosophical argument.
    He also commented on his teacher Somananda's Shivadrishti."
region: "Kashmir Valley"
