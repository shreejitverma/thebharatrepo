names:
  en: Chashtana
  iast: Caṣṭana
summary: Chashtana established the long-lived Kardamaka line among the Western Satraps. Coins bear
  his name, and the Junagadh inscription of Rudradaman places him two generations before its issuer.
summaries:
  kids: Chashtana was a ruler remembered on coins. A stone inscription made for his grandson also
    names him.
  teen: The genealogy at Junagadh and coins bearing his name identify Chashtana as the ancestor of the
    later Western Satrap line to which Rudradaman belonged.
