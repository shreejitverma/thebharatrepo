summary: "Zain-ul-Abidin ruled the Kashmir Sultanate for much of the fifteenth century. His court
  supported Sanskrit historical writing, including Jonaraja's continuation of Kalhana's chronicle."
summaries:
  kids: "Zain-ul-Abidin was a sultan of Kashmir. He asked the scholar Jonaraja to carry on a book that
    told the stories of Kashmir's rulers."
  teen: "Jonaraja continued the Sanskrit Rajatarangini under Zain-ul-Abidin. The chronicle provides a
    court perspective on a sultanate in which Sanskrit and Persian literary cultures both had a
    place."
