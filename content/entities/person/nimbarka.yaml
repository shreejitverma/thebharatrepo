names:
  en: Nimbarka
  iast: Nimbārka
  native: निम्बार्क
summary: Nimbarka is the Vedanta teacher associated with the Vedanta-Parijata-Saurabha, a commentary
  on the Brahma Sutra. His school teaches difference and non-difference and reveres Radha and
  Krishna. His chronology is contested.
summaries:
  kids: Nimbarka explained an old book about the deepest reality. The tradition that grew around his
    teaching honors Radha and Krishna together.
  teen: Nimbarka’s commentary presents souls and the world as dependent on Brahman while retaining
    their distinct characteristics. Comparing Vedanta commentaries has led scholars to widely
    different dates.
