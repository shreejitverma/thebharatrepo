summary: Tailapa II founded the later Chalukya ruling line in the western Deccan after defeating the
  last effective Rashtrakuta king. Inscriptions made during his reign attest the emergence of his
  power.
summaries:
  kids: Tailapa took power after the Rashtrakutas. The royal family he began became known for its
    capital at Kalyani.
  teen: Tailapa's rise in the late tenth century marks the transition from Rashtrakuta to later
    Chalukya rule. The dynasty subsequently shifted its seat to Kalyani.
