summary: Guru Tegh Bahadur was the ninth Sikh Guru. His hymns are included in the Guru Granth Sahib,
  and the Mughal authorities executed him in Delhi in 1675.
summaries:
  kids: Guru Tegh Bahadur wrote hymns that Sikhs still sing. His son became the next Sikh Guru.
  teen: The ninth Guru traveled beyond the Punjab and contributed hymns to Sikh scripture. His
    execution under Aurangzeb in 1675 became a central event in Sikh memory.
