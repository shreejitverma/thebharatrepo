summary: Jawaharlal Nehru presided over the Congress session at Lahore that committed the party
  to complete independence in 1929. He moved the Objectives Resolution in the Constituent
  Assembly in 1946 and became prime minister at independence.
summaries:
  kids: Nehru helped lead the campaign for independence. In 1947 he became the first prime
    minister of independent India.
  teen: Nehru chaired the Congress session that adopted complete independence as its goal and
    presented the Objectives Resolution for India's constitution. He served as prime minister
    from independence until his death in 1964.
