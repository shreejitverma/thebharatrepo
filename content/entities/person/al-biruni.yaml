names:
  en: Al-Biruni
  iast: Abū al-Rayḥān al-Bīrūnī
  native: أبو الريحان البيروني
summary: >-
  Abu Rayhan al-Biruni (973 to after 1048 CE) was a Khwarazmian scholar of astronomy, mathematics and
  history who lived at the Ghaznavid court. Having learned Sanskrit, he wrote the Kitab al-Hind (about
  1030 CE), a systematic account of Indian religion, philosophy, astronomy and customs based on Sanskrit
  sources and informants.
summaries:
  kids: >-
    Al-Biruni was a scholar from Central Asia who learned Sanskrit to understand India. He wrote a huge
    book explaining Indian science and religion to readers of Arabic.
  teen: >-
    Al-Biruni came to India with Mahmud of Ghazni's court but behaved like a researcher. He read
    Sanskrit books, compared Indian and Greek science, and wrote down Indian ideas as carefully as he
    could, while also criticising them.
region: Khwarazm, Ghazni and the Punjab
