names:
  en: Nagabhata I
  iast: Nāgabhaṭa
summary: Nagabhata I is the earliest major ruler named in the genealogy of the imperial Pratiharas.
  A later inscription at Gwalior credits him with resisting a hostile foreign force.
summaries:
  kids: A later stone inscription names Nagabhata as an early ruler of his family. It praises him for
    defeating enemies.
  teen: Bhoja's Gwalior inscription looks back to Nagabhata I. Historians compare its praise with
    other evidence for eighth-century campaigns in western India.
