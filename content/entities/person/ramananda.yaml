summary: >-
  Ramananda is remembered as a Vaishnava teacher associated with devotional communities in North India.
  Accounts connecting him to Kabir and other poet-saints became important in later Ramanandi traditions,
  but the chronology and historical form of his community remain disputed.
summaries:
  kids: >-
    Ramananda is remembered as a teacher of devotion to Rama. Later stories connect him to Kabir, but
    historians are careful because these stories were written down later.
  teen: >-
    Ramananda became an important figure in North Indian Vaishnava memory. Scholarship distinguishes
    later Ramanandi traditions from the uncertain evidence for his own life and disciples.
