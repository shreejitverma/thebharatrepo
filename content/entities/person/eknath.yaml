summary: Eknath was a Marathi devotional author associated with Paithan. His Eknathi Bhagavata
  interprets the eleventh book of the Bhagavata Purana in Marathi, and his exact life dates remain
  uncertain.
summaries:
  kids: Eknath explained an important Sanskrit story and teaching in Marathi so people could hear it
    in a language they knew.
  teen: Eknath’s Marathi commentary makes the eleventh book of the Bhagavata Purana available in a
    vernacular literary form. Historians often give 1533 and 1599 as his life dates, with some
    uncertainty.
