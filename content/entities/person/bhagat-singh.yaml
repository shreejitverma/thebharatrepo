names:
  en: Bhagat Singh
  native: ਭਗਤ ਸਿੰਘ
summary: Bhagat Singh was a socialist revolutionary against British rule. He took part in the
  1929 Central Legislative Assembly bombing and was executed in Lahore in 1931 after conviction
  in the Lahore Conspiracy Case.
summaries:
  kids: Bhagat Singh joined a group that fought British rule and argued for a fairer society. The
    colonial government executed him and two of his companions in 1931.
  teen: Bhagat Singh and Batukeshwar Dutt used the 1929 Assembly bombing as a political protest.
    Bhagat Singh's prison hunger strike drew public attention, and a separate trial ended with
    his execution alongside Rajguru and Sukhdev.
