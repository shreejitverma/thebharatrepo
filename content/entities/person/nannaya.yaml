claims:
  - text: Nannaya translated and adapted the first two-and-a-half books (Adi, Sabha, and half of Aranya Parva) of the Sanskrit Mahabharata into Telugu champu verse and prose, a work later completed by Tikkana (13th c.) and Errapragada (14th c.).
    grade: A
    sources:
      - src.narayanarao-2002-classical-telugu-poetry
      - src.pollock-2003-literary-cultures-in-history
  - text: Although Telugu verse appeared earlier in inscriptions such as Addanki and Kandukur, Nannaya's Andhra Mahabharatamu is the earliest surviving full-scale Telugu literary work, blending Sanskrit marga aesthetics with local metre.
    grade: B
