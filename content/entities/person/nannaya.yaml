summary: >-
  Nannaya Bhattaraka (fl. c. 1020 to 1060 CE), revered as the Adikavi ("first poet") of Telugu literature, was the court scholar and royal purohit of the Eastern Chalukya king Rajaraja Narendra at Rajamahendravaram (Rajahmundry). Commissioned by his king, Nannaya composed the opening Adi Parva, Sabha Parva, and part of the Aranya Parva of the Andhra Mahabharatamu in refined Sanskritized champu verse-and-prose style, establishing the foundational literary register of classical Telugu alongside the Telugu grammar tradition.
summaries:
  kids: >-
    Nannaya was the eleventh-century poet celebrated as the "first poet" of Telugu, who began retelling the Mahabharata in beautiful Telugu poetry for King Rajaraja Narendra.
  teen: >-
    Working at the Eastern Chalukya court of Rajaraja Narendra in the mid-11th century CE, Nannaya Bhattaraka created the foundational marga style of Telugu poetry in his Andhra Mahabharatamu, later completed by Tikkana and Errapragada.
