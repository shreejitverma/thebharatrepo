names:
  en: Nagarjuna
  iast: Nāgārjuna
  native: नागार्जुन
summary: Nagarjuna was an Indian Buddhist philosopher whose Fundamental Verses on the Middle Way
  became a foundational work of Madhyamaka. His arguments about emptiness examine whether things
  could exist by their own nature.
summaries:
  kids: Nagarjuna asked whether anything could exist all by itself. His verses show how much depends
    on causes, conditions and how we describe things.
  teen: Nagarjuna uses arguments about causes, motion and the self to question the idea of an
    independent nature. His Fundamental Verses became a starting point for Madhyamaka commentators.
