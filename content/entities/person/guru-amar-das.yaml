  en: Guru Amar Das
  native: ਗੁਰੂ ਅਮਰ ਦਾਸ
summary: Guru Amar Das was the third Sikh Guru and made Goindwal a center of the community. Hymns he
  composed, including Anand, were transmitted in the Sikh canon.
summaries:
  kids: Guru Amar Das taught at Goindwal, where Sikhs came together. His hymn Anand is still sung.
  teen: The third Guru developed Goindwal as a Sikh center. Scholarship on early Sikh manuscripts
    connects his period with the collection of hymns that preceded the Adi Granth.
