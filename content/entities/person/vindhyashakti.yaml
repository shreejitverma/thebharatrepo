summary: Vindhyashakti appears as an ancestor of the Vakataka ruling house in later dynastic
  records. His place in the genealogy is clearer than the year in which he began to rule.
summaries:
  kids: An Ajanta inscription remembers Vindhyashakti as an early member of the Vakataka royal family.
    It was carved long after he lived.
  teen: Vindhyashakti is known through a later Vakataka genealogy. Historians place him around the
    third century CE by working back from better-attested successors.
