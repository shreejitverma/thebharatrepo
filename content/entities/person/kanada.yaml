names:
  en: Kanada
  iast: Kaṇāda
  native: कणाद
summary: Kanada, also known as Uluka, is traditionally credited with the Vaisheshika Sutra, a
  Sanskrit text that classifies what exists. Scholars differ on the dating of the text associated
  with him.
summaries:
  kids: A book linked to Kanada groups things and their features. For example, a clay pot is a thing,
    and the color of that pot is one of its features.
  teen: The Vaisheshika Sutra distinguishes categories such as substance, quality and action. Its
    dates are reconstructed from textual evidence, and the author traditionally called Kanada
    remains difficult to place.
