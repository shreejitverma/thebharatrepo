claims:
  - text: Though his surviving corpus is smaller than Tyagaraja's or Dikshitar's (around 40 to 70 authenticated pieces),
      Syama Sastri's three swarajatis in Bhairavi, Yadukulakambhoji and Todi became pillars of Carnatic repertoire.
    grade: B
