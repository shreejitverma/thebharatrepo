summary: Syama Sastri (1762-1827 CE; born Venkata Subrahmanya) was the eldest composer of the Carnatic Trinity, serving
  as a hereditary priest of the Bangaru Kamakshi shrine in Thanjavur. Renowned for rhythmic intricacy, expanded viloma
  chapu and misra chapu talas, and three masterwork swarajatis, he composed deeply devotional kritis in Telugu, Sanskrit
  and Tamil under the signature 'Syamakrishna'.
summaries:
  kids: Syama Sastri (1762-1827) was the eldest of the three great Carnatic composers, famous for songs with clever
    rhythms praising Goddess Kamakshi.
  teen: Signing his works 'Syamakrishna', Thanjavur priest-composer Syama Sastri excelled at subtle chapu rhythmic cycles
    and elevated the swarajati into a major Carnatic concert form.
