summary: Aryabhata II was the author of the Mahasiddhanta, a work on mathematical astronomy conventionally
  placed between the mid-tenth and eleventh centuries. The surviving text’s numerical parameters have prompted a
  later dating hypothesis.
summaries:
  kids: A second astronomer named Aryabhata wrote his own astronomy book. Later writers help historians tell the
    two scholars apart.
  teen: Bhaskara II attributes a distinctive astronomical division to an Aryabhata. Its appearance in the
    Mahasiddhanta helps distinguish the later author from the author of the Aryabhatiya.
