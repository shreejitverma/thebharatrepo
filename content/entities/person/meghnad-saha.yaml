summary: Meghnad Saha was a physicist who used thermal ionisation to explain patterns in solar and stellar
  spectra. His 1920 paper on the solar chromosphere helped link the appearance of spectral lines to the
  physical conditions of a gas.
summaries:
  kids: Saha used the patterns in sunlight to work out what heat does to atoms in the Sun’s atmosphere.
  teen: Saha linked stellar spectra to the balance between atoms and ions at different temperatures and
    pressures. This made spectra useful for interpreting physical conditions in stars.
