summary: Narayana Pandita was a fourteenth-century Sanskrit mathematician. His two known treatises are the
  Ganita Kaumudi on arithmetic and the Bijaganitavatamsa on algebra.
summaries:
  kids: Narayana wrote about numbers, how to arrange them, and how to make squares whose rows and columns add up
    to the same total.
  teen: The Ganita Kaumudi dates Narayana’s activity to 1356. Alongside standard arithmetic, he worked on
    arranging objects, solving equations in integers and constructing magic squares.
