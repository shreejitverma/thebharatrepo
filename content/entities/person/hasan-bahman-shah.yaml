names:
  en: Alauddin Hasan Bahman Shah
summary: Alauddin Hasan Bahman Shah founded the Bahmani Sultanate in the Deccan. He established a
  court at Gulbarga following the revolt against Muhammad bin Tughluq's government.
summaries:
  kids: Hasan became the first Bahmani sultan. He made Gulbarga the seat of his new kingdom in the
    Deccan.
  teen: Hasan's accession grew from a revolt of military elites against Delhi's government. Gulbarga
    served as the dynasty's first capital.
