summary: >-
  Jnaneshwar was a Marathi poet, philosopher, and Varkari devotional figure of thirteenth-century
  Maharashtra. He is associated with the Jnaneshwari, a Marathi exposition of the Bhagavad Gita,
  completed at Nevasa in 1290 according to its closing verses.
summaries:
  kids: >-
    Jnaneshwar was a poet and teacher in Maharashtra. He explained the Bhagavad Gita in Marathi in a
    book called the Jnaneshwari.
  teen: >-
    Jnaneshwar's Marathi commentary on the Bhagavad Gita helped establish a major vernacular literary
    and devotional tradition. Its colophon associates its completion with Nevasa in 1290.
