summary: Asanga was an early systematizer of Indian Yogacara Buddhism. His Mahayanasamgraha connects
  an account of how experience arises with a path of Buddhist training.
summaries:
  kids: Asanga wrote about how habits shape what people experience and how Buddhist practice can
    change those habits.
  teen: The Mahayanasamgraha explains how past actions can shape later experience through the notion
    of a storehouse consciousness. Asanga uses this account as part of a wider description of the
    Buddhist path.
