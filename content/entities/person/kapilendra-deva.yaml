names:
  en: Kapilendra Deva
  iast: Kapilendra Deva
  native: କପିଳେନ୍ଦ୍ର ଦେବ
summary: Kapilendra Deva established the Suryavamshi Gajapati line in Odisha and led its expansion
  along the east coast. The precise calendar placement of his reign varies with the interpretation
  of inscriptions.
summaries:
  kids: Kapilendra began a new royal line in Odisha. His rulers left records carved at temples along
    the east coast.
  teen: Kapilendra inherited institutions associated with Eastern Ganga rule, but established a new
    lineage. Scholars reconstruct his reign from inscriptions that use regnal counting conventions.
region: Odisha and the eastern seaboard
datings:
