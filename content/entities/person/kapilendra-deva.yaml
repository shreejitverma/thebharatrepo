      precision: decade
      circa: true
    grade: C
    label: Conventional date of the reign
    sources:
      - src.mishra-2016-eastern-ganga-gajapati
      - src.sewell-1932-historical-inscriptions-southern-india
    note: The interval follows the commonly used mid-1430s accession and mid-1460s succession, with
      allowance for conversion.
  - method: epigraphic
    range:
      earliest: "1429"
      latest: "1468"
      precision: decade
      circa: true
    grade: C
