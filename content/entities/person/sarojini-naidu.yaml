summary: Sarojini Naidu wrote poetry in English and organised for Indian independence and
  women's political rights. She presided over the Congress session at Kanpur in 1925 and led
  protesters during the 1930 salt campaign.
summaries:
  kids: Sarojini Naidu wrote poems and spoke up for India's freedom and for women's rights. She
    also helped lead protests against British salt laws.
  teen: Naidu combined a literary career with work for women's rights and Congress organising. She
    presided over the 1925 Kanpur session and led salt protesters at Dharasana after Gandhi's
    arrest.
