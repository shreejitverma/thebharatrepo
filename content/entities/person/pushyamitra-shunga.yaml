names:
  en: Pushyamitra Shunga
  iast: Puṣyamitra Śuṅga
summary: Pushyamitra founded the Shunga ruling house after the fall of the Mauryas. A subsequent
  inscription from Ayodhya credits him with twice performing the ashvamedha, a royal horse
  sacrifice.
summaries:
  kids: Pushyamitra was a commander who became a king after the Mauryas. An old stone inscription says
    he held two important royal ceremonies.
  teen: Literary accounts place Pushyamitra at the Maurya-Shunga transition. The Ayodhya inscription
    independently preserves his title of commander and records two ashvamedhas.
