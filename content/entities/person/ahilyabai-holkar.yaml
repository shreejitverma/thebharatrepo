  native: अहिल्याबाई होळकर
summary: Ahilyabai Holkar ruled from Maheshwar in the late eighteenth century and sponsored temples
  and pilgrimage infrastructure. An inscription at Ellora records her patronage of the
  Shivalayatirtha tank.
summaries:
  kids: Ahilyabai ruled from Maheshwar. She paid for buildings people used when they visited sacred
    places, including a large stone water tank at Ellora.
  teen: Ahilyabai sponsored temples and facilities for pilgrims beyond her immediate territory. At
    Ellora, a dated inscription provides direct evidence for her patronage of the Shivalayatirtha
    tank.
