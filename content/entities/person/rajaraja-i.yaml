names:
  en: Rajaraja I
  iast: Rājarāja Cōḻa
  native: இராஜராஜ சோழன்
summary: >-
  Rajaraja I ruled the Chola kingdom from 985 to 1014 CE. He extended Chola power over much of south
  India and northern Sri Lanka, organised the state's revenue records, and built the Rajarajeshvara
  (Brihadisvara) temple at Thanjavur, completed in 1010 CE.
summaries:
  kids: >-
    Rajaraja was a great Chola king. He built the giant Brihadisvara temple in Thanjavur, and had
    every gift to the temple carved on its walls.
  teen: >-
    Rajaraja turned the Chola kingdom into an empire, conquering the Pandyas, Cheras and northern Sri
    Lanka. His temple at Thanjavur was a political statement as much as a religious one, with
    inscriptions listing hundreds of staff and villages that supported it.
region: Tamil Nadu
location: { name: Thanjavur, lat: 10.78, lon: 79.13 }
