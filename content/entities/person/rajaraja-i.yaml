    note: Fixed by regnal-year dates in his inscriptions combined with astronomical details.
claims:
  - text: The Thanjavur temple was completed in Rajaraja's 25th regnal year, 1010 CE.
    grade: A
    sources: [src.sastri-1955-the-colas-medieval, src.unesco-1987-great-living-chola-temples-medieval]
  - text: His campaigns brought northern Sri Lanka under Chola rule, with Polonnaruva as the Chola centre there.
