  iast: Vāgbhaṭa
  native: वाग्भट
summary: Vagbhata is the name associated with two influential Sanskrit compendia of Ayurveda, the Ashtanga
  Samgraha and the Ashtanga Hridaya. Their dates and whether they had the same author remain uncertain.
summaries:
  kids: Two old books on medicine are linked to the name Vagbhata. Historians compare the books for clues about
    who wrote them.
  teen: Vagbhata’s name is attached to two works that organize earlier Ayurvedic learning. Scholars date the
    works through textual relationships and continue to debate the authorship.
