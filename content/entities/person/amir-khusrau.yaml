names:
  en: Amir Khusrau
  iast: Amīr Khusraw Dihlavī
  native: अमीर ख़ुसरो / امیر خسرو
summary: Amir Khusrau (1253-1325 CE) was a prolific Delhi-based Persian and Hindavi poet, Sufi disciple of Nizamuddin
  Auliya, chronicler and musical theorist who served successive Delhi Sultans including Alauddin Khalji. In Persian
  works such as I'jaz-i Khusravi and Nuh Sipihr he wrote early accounts of Indian music and cultural synthesis; later
  oral traditions also credit him with qawwali, tarana, sitar and khayal.
summaries:
  kids: Amir Khusrau was a famous poet, scholar and musician in thirteenth- and fourteenth-century Delhi who wrote in
    Persian and Hindavi and celebrated Indian music.
  teen: A court poet and Sufi mystic of the Delhi Sultanate (1253-1325 CE), Amir Khusrau praised Indian melody in his
    Persian writings; later legend also attributes qawwali, khayal, sitar and tabla to him.
