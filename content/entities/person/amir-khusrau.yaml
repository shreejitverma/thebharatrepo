claims:
  - text: In his Persian treatises Nuh Sipihr and I'jaz-i Khusravi, Khusrau discussed Indian musical excellence, court
      ensembles and Indo-Persian melodic interaction.
    grade: A
    sources:
      - src.katz-2001-amir-khusrau-grove
      - src.schofield-2021-emotions-indian-music
  - text: Musicologists treat later attributions crediting Khusrau with inventing the sitar, tabla and khayal as
      retrospective hagiographical traditions rather than verified fourteenth-century fact.
    grade: B
    sources:
      - src.katz-2001-amir-khusrau-grove
      - src.wade-1984-khyal
debate: Popular and gharana narratives credit Amir Khusrau with inventing the sitar, tabla, qawwali, tarana and khayal.
  Modern musicologists such as Jonathan Katz and Bonnie Wade note that contemporary fourteenth-century sources attest to
  his deep musical skill and writings on Indian music, whereas the specific attribution of modern instruments and genres
  dates from centuries later.
