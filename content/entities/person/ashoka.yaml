names:
  en: Ashoka
  iast: Aśoka
  native: अशोक
summary: >-
  Ashoka, who called himself Devanampiya Piyadasi ("Beloved of the Gods, of gracious mien"), was the third Maurya emperor. He came to the throne a few years before his consecration in about 268 BCE and reigned until about 232 BCE. After his conquest of Kalinga in his eighth regnal year he turned to Buddhism and proclaimed a moral code he called dhamma in inscriptions on rocks and polished stone pillars, written mostly in Prakrit and also in Greek and Aramaic.
summaries:
  kids: >-
    Emperor Ashoka ruled the Maurya Empire. After the terrible Kalinga war, he carved messages on rocks and pillars across India asking people to be kind, honest and respectful of all religions.
  teen: >-
    Ashoka, who was consecrated in about 268 BCE a few years after coming to the throne and reigned until about 232 BCE, is the earliest known Indian ruler whose own inscriptions survive. They record his remorse over Kalinga, his support for Buddhism and his policy of dhamma.
region: Most of the Indian subcontinent (capital at Pataliputra)
