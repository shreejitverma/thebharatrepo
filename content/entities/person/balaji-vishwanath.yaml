summary: Balaji Vishwanath was the first Peshwa from the Bhat family. His appointment under Shahu
  began a long succession of Peshwas from that family.
summaries:
  kids: Shahu chose Balaji Vishwanath as his chief minister. Balaji's family then held that office for
    generations.
  teen: Balaji Vishwanath strengthened Shahu's government and negotiated for Maratha claims at the
    Mughal court. His son Baji Rao succeeded him.
