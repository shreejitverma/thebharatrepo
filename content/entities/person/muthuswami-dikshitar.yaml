summary: Muthuswami Dikshitar (1775/1776-1835 CE) was a Sanskrit composer and vainika of the Carnatic Trinity, famous
  for slow-paced, architectonic kritis bearing his signature 'Guruguha'. Educated in Banaras as well as Tiruvarur, he
  wove sacred temple geography, raga names (raga mudra) and Venkatamakhin's asampurna melakarta system into cycles such
  as the Navavarana and Panchabhuta Kritis.
summaries:
  kids: Muthuswami Dikshitar (1775-1835) was one of the three great composers of Carnatic music, known for stately
    Sanskrit songs describing temples, deities and ragas.
  teen: Signing his Sanskrit kritis 'Guruguha', Muthuswami Dikshitar preserved the Venkatamakhin raga system, composed
    sacred temple cycles and even adapted European band tunes into Carnatic Nottusvara Sahityas.
