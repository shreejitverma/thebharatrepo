summary: "Satyajit Ray (1921-1992 CE) was a Bengali filmmaker, graphic designer, composer and writer widely regarded as one of the foremost auteurs of world cinema. Trained briefly at Santiniketan under Nandalal Bose and Binode Behari Mukherjee before working in advertising, he debuted with Pather Panchali (1955) and directed nearly thirty feature films including Charulata and The Music Room, receiving an Honorary Academy Award in 1992."
summaries:
  kids: Satyajit Ray (1921-1992) was a famous Indian film director from Kolkata who made the Apu Trilogy and won an
    Honorary Oscar for his lifelong contribution to cinema.
  teen: Starting in graphic design after studying art at Santiniketan, Satyajit Ray inaugurated modern Indian art cinema
    with Pather Panchali (1955), directing, writing and often scoring classics like Charulata.
