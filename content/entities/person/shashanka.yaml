summary: "Shashanka is often described as the first major independent ruler of a unified Gauda kingdom in Bengal during the late sixth and early seventh centuries CE, ruling from Karnasuvarna (Murshidabad) across Bengal, parts of Bihar and northern Odisha. Contemporary inscriptions in Midnapore and Ganjam attest his authority, while hostile Buddhist and Pushyabhuti accounts portray him as an adversary of Harsha and Bhaskaravarman."
summaries:
  kids: "Around 600 CE, King Shashanka became one of the first powerful independent rulers of Bengal, uniting lands from his capital Karnasuvarna and clashing with Emperor Harsha of north India."
  teen: >-
    Shashanka carved out a large eastern Indian kingdom from Karnasuvarna in the early 7th century CE.
    His gold coins and Midnapore and Ganjam copper plates counterbalance hostile portraits in
    Harshacharita and Xuanzang's travelogue.
region: Gauda (Bengal, parts of Bihar and Odisha)
