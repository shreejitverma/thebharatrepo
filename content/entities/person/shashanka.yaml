claims:
  - text: The Ganjam copper-plate inscription dated Gupta year 300 (619-620 CE) names Maharajadhiraja Shashanka as suzerain of coastal Odisha's Shailodbhava ruler Madhavaraja II.
    grade: A
    sources:
      - src.majumdar-1943-history-of-bengal-vol1
      - src.singh-2008-ancient-early-medieval-india
  - text: Banabhatta's Harshacharita and Xuanzang's travelogue accuse Shashanka of killing Rajyavardhana of Kanauj and persecuting Buddhism at Bodh Gaya, claims whose scale historians evaluate cautiously given partisan hostility.
    grade: B
    sources:
      - src.beal-1906-si-yu-ki
      - src.majumdar-1943-history-of-bengal-vol1
      - src.devahuti-1970-harsha-political-study
debate: >-
  Buddhist sources led by Xuanzang and the Manjushrimulakalpa accuse Shashanka of destroying Buddhist
  monuments and cutting down the Bodhi tree at Bodh Gaya. Historians such as R. C. Majumdar note that
  contemporary inscriptions and Xuanzang's own account of flourishing monasteries at Karnasuvarna
  complicate the picture, suggesting a mix of wartime political rivalry and later sectarian memory.
