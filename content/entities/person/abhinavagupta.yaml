names:
  en: Abhinavagupta
  iast: Abhinavagupta
  native: अभिनवगुप्त
summary: >-
  Abhinavagupta of Kashmir was a philosopher, tantric theologian and literary theorist of the late
  10th and early 11th centuries CE. He gave the most systematic form to non-dual Kashmir Shaivism in the
  Tantraloka, and his commentaries on the Natyashastra and on Anandavardhana's Dhvanyaloka made rasa
  theory central to Indian aesthetics.
summaries:
  kids: >-
    Abhinavagupta was a great thinker from Kashmir. He explained how stories, plays and music make us
    feel deep emotions, and he wrote about Shiva as the one consciousness in everything.
  teen: >-
    Abhinavagupta argued that when we watch a drama we experience rasa, a universal, impersonal form of
    emotion. In religion he taught that everything is the free self-expression of Shiva as
    consciousness. Two of his works carry dates, 991 and 1015 CE.
region: Kashmir
