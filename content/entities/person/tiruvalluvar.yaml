names:
  en: Tiruvalluvar
  iast: Tiruvaḷḷuvar
  native: திருவள்ளுவர்
summary: >-
  Tiruvalluvar is the classical Tamil poet-philosopher celebrated as the author of the Tirukkural, one of the Eighteen Lesser Classics (Patinenkirkkanakku). Virtually no contemporary biographical record survives outside later legends compiled in the Tiruvalluvamalai and medieval hagiographies. Most modern scholars place his lifetime in the post-Sangam era (c. 450 to 550 CE) based on the language and intertextual links of the Tirukkural, while Tamil tradition and the official Tiruvalluvar Era set his birth in 31 BCE.
summaries:
  kids: >-
    Tiruvalluvar was the wise Tamil poet who wrote the Tirukkural, 1,330 short verses on honesty, kindness, and good ruling. Almost nothing certain is known about his life, and scholars debate when he lived.
  teen: >-
    Honoured as the author of the Tirukkural, Tiruvalluvar is known mainly through his work and later legends linking him to Mylapore or Madurai. Scholars usually date him around 450 to 550 CE, while Tamil tradition places him in 31 BCE.
region: Tamilakam (traditionally associated with Mylapore, Chennai, or Madurai)
