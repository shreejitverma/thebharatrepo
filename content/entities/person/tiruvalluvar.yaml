claims:
  - text: Contemporary inscriptions and early Sangam anthologies preserve no verifiable biography of Tiruvalluvar; medieval traditions collected in the Tiruvalluvamalai and later hagiographies portray him variously as a Mylapore weaver or paraiyar sage.
    grade: B
    sources:
      - src.blackburn-2000-legend-of-valluvar
      - src.zvelebil-1973-smile-of-murugan
  - text: Because the Tirukkural avoids narrow sectarian markers, Jain, Shaiva, Vaishnava, and modern secular traditions each claimed Tiruvalluvar as their own.
    grade: B
    sources:
      - src.blackburn-2000-legend-of-valluvar
      - src.zvelebil-1992-companion-studies
debate: >-
  Because no dated historical record names Tiruvalluvar during his lifetime, his chronology follows that of the Tirukkural itself. Kamil Zvelebil and most modern philologists place him around 450 to 550 CE on linguistic and intertextual grounds, whereas earlier Tamil scholars and the official Tamil Nadu calendar (adopted following Maraimalai Adigal's 1935 proposal) reckon an era starting in 31 BCE.
