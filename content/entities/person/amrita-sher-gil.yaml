summary: Amrita Sher-Gil (1913-1941 CE) was a foundational modernist painter of Hungarian-Indian heritage whose work
  bridged Parisian Post-Impressionist oil painting with Ajanta murals and Rajput and Pahari miniatures. Trained at the
  Ecole des Beaux-Arts in Paris before returning to India in 1934, she painted iconic works such as Three Girls,
  Brahmacharis and Bride's Toilet before her premature death at age twenty-eight.
summaries:
  kids: Amrita Sher-Gil (1913-1941) was a brilliant painter trained in Paris who came back to India and painted powerful,
    colourful portraits of Indian women and village life.
  teen: Bridging European Post-Impressionism with Ajanta, Pahari and Mughal colour, Amrita Sher-Gil rejected both
    Victorian realism and the pale Bengal School wash to pioneer Indian modern painting.
