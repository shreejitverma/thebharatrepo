claims:
  - text: Trained in Paris under Lucien Simon and elected an Associate of the Grand Salon at twenty for Young Girls (1932),
      Sher-Gil returned permanently to India in late 1934 seeking to paint rural Indian life.
    grade: A
    sources:
      - src.kapur-2003-shergil-grove
      - src.dalmia-2006-amrita-sher-gil
  - text: Following travels to Ajanta, Ellora, Cochin and Mattancherry in 1936-1937, she forged a flat, richly saturated
      oil-painting idiom seen in Bride's Toilet, Brahmacharis and South Indian Villagers Going to Market.
    grade: A
