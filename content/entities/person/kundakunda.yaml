names:
  en: Kundakunda
  iast: Kundakunda
  native: कुन्दकुन्द
summary: Kundakunda is the name attached to influential Digambara Jain works such as the Samayasara.
  The date and unity of the attributed Prakrit corpus are contested.
summaries:
  kids: Jain books passed down under Kundakunda’s name ask how the soul can become free. Scholars
    study the books to learn when their different parts were written.
  teen: The Samayasara distinguishes the soul’s intrinsic nature from its entanglement in karma.
    Digambara tradition honors Kundakunda, and scholars disagree about how many authors contributed
    to the surviving corpus.
