summary: "Kakarla Tyagaraja (1767-1847 CE) was a pre-eminent Telugu composer of Carnatic music and among the most widely performed composers of the Carnatic Trinity. Living at Thiruvaiyaru in the Kaveri delta, he refined the kriti song form through hundreds of surviving devotional compositions to Rama, notably the five Pancharatna Kritis, and introduced rich sangati melodic variations."
summaries:
  kids: Tyagaraja (1767-1847) was a great South Indian composer from Tamil Nadu who wrote hundreds of Telugu devotional
    songs called kritis in praise of Rama.
  teen: Born in Tiruvarur and active at Thiruvaiyaru, Tyagaraja perfected the Carnatic kriti form with flowing melodic
    variations (sangatis), composing over seven hundred surviving songs including the Pancharatna Kritis.
