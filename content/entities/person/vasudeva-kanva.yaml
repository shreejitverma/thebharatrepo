names:
  en: Vasudeva Kanva
  iast: Vāsudeva Kāṇva
summary: Vasudeva Kanva is named as the first Kanva ruler in Puranic genealogies. The accession
  story describes him as a minister who displaced Devabhuti, the last Shunga king.
summaries:
  kids: Old royal lists name Vasudeva as the first Kanva king. A court story says he had served the
    last Shunga ruler.
  teen: The Puranic genealogy and Bana's later account preserve the transition from Devabhuti to
    Vasudeva. They establish the received story more clearly than an exact date.
region: Post-Shunga northern India
