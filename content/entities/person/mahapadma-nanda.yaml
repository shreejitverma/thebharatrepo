      precision: decade
      circa: true
    grade: C
    label: Fourth-century historical placement
    sources:
      - src.singh-2008-ancient-early-medieval-india
      - src.kulke-2004-history-of-india
    note: The rise of the dynasty is generally placed in the fourth century. The traditions give
      incompatible regnal totals.
  - method: traditional-puranic
    range:
      earliest: 425 BCE
      latest: 330 BCE
      precision: century
      circa: true
    grade: D
    label: Long Puranic regnal reckoning
    sources:
      - src.pargiter-1913-dynasties-kali-age
    note: Some Puranic witnesses allot Mahapadma eighty-eight years. The broad window represents the
      long reckoning counted back from the Mauryan transition.
  - method: traditional-puranic
    range:
      earliest: 365 BCE
      latest: 330 BCE
      precision: decade
      circa: true
    grade: D
    label: Short Puranic regnal reckoning
