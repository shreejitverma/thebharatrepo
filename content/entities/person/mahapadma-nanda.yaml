id: person.mahapadma-nanda
type: person
kind: person
names:
  en: Mahapadma Nanda
  iast: Mahāpadma Nanda
summary: The Puranas name Mahapadma as the founder of the Nanda line of Magadha. Early Indian
  traditions disagree about the length and details of the Nanda succession.
summaries:
  kids: Old royal lists remember Mahapadma as the man who began the Nanda line of kings in Magadha.
  teen: Mahapadma is the Puranic founder of the Nandas. Greek accounts independently point to a
    powerful eastern kingdom late in the dynasty, while the founder's dates depend on Indian king
    lists.
region: Magadha and the Gangetic plain
location:
  name: Patna (Pataliputra)
  lat: 25.61
  lon: 85.14
datings:
