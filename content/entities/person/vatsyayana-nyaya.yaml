summary: Vatsyayana wrote the Nyayabhashya, an early surviving commentary on the Nyaya Sutra. Its
  detailed arguments concern how people learn, reason and debate.
summaries:
  kids: Vatsyayana explained an older book about reasoning. He gave readers more detail about how
    arguments work.
