names:
  en: Brahmagupta
  iast: Brahmagupta
  native: ब्रह्मगुप्त
summary: >-
  Brahmagupta was an astronomer and mathematician from Bhillamala (Bhinmal) in western India. He
  states that he composed the Brahmasphutasiddhanta in Shaka 550 (628 CE) at the age of thirty, and he
  wrote the handbook Khandakhadyaka in 665 CE. His rules for computing with zero and negative
  quantities are among the earliest known.
summaries:
  kids: >-
    Brahmagupta was a mathematician who lived about 1,400 years ago in Rajasthan. He wrote rules for how
    to add, subtract and multiply with zero and with negative numbers.
  teen: >-
    Brahmagupta treated zero as a number in its own right and gave rules for working with "debts"
    (negative numbers) and "fortunes" (positive numbers). His astronomy book was later translated into
    Arabic in Baghdad.
region: Bhillamala, western Rajasthan
