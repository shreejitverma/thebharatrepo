summary: >-
  Chaolung Sukaphaa, also spelled Sukapha, was a Tai prince who, according to the Ahom buranji chronicles,
  crossed the Patkai range into the upper Brahmaputra valley in 1228 and founded the Ahom kingdom. The
  chronicles place his permanent seat at Charaideo around 1253, and scholars describe his early polity as
  built through alliances and intermarriage with Moran and Barahi communities.
summaries:
  kids: >-
    Sukaphaa led a group of Tai people across the Patkai mountains into Assam. He made friends with local
    communities and began the Ahom kingdom, with its early capital at Charaideo.
  teen: >-
    The Ahom chronicles place Sukaphaa's arrival in 1228. He blended Tai statecraft with alliances among
    local Moran and Barahi groups, and the royal site at Charaideo gives archaeological context to the
    dynasty he founded.
