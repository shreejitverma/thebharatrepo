names:
  en: Vasubandhu
  iast: Vasubandhu
  native: वसुबन्धु
summary: Vasubandhu is the name associated with the Abhidharmakosha and with influential Yogacara
  works such as the Twenty Verses. Scholars debate whether one author composed both groups of works.
summaries:
  kids: Books passed down under Vasubandhu’s name explain Buddhist ideas about experience and the
    mind. Scholars ask whether all the books came from the same writer.
  teen: Vasubandhu’s corpus spans Buddhist systematics and Yogacara. Jonathan Gold reads it as a
    developing philosophical project, while Erich Frauwallner argued that the tradition had combined
    two authors.
