id: person.adi-shankara
type: person
kind: dharma
names:
  en: Adi Shankara
  iast: Ādi Śaṅkara
  native: आदि शङ्कर
summary: >-
  Shankara (Shankaracharya) is the most influential teacher of Advaita Vedanta, known through his
  commentaries on the Brahmasutras, the principal Upanishads and the Bhagavad Gita. His date is
  contested: most scholars place him in the 8th century CE, conventionally 788 to 820 CE, while the
  Kanchi and Dwaraka matha traditions place him in 509 to 477 BCE.
summaries:
  kids: >-
    Shankara was a teacher from Kerala who taught that the deepest self in every person is the same as
    Brahman, the one reality behind everything. Historians and traditions disagree about when he lived.
  teen: >-
    Shankara's commentaries explain Advaita, non-dualism: the self (atman) is identical with Brahman,
    and the world of many things is not ultimately real. Most historians date him to about 800 CE;
    some monastic traditions date him over a thousand years earlier.
region: Born at Kalady, Kerala, according to tradition; active across India
location: { name: Kalady, lat: 10.17, lon: 76.44 }
datings:
  - method: textual-internal
    range: { earliest: "788 CE", latest: "820 CE", precision: decade, circa: true }
    grade: C
    label: Conventional 788 to 820 CE chronology
    sources: [src.isayeva-1993-shankara-indian-philosophy, src.flood-1996-introduction-to-hinduism]
    note: >-
      The conventional chronology rests on later records.
  - method: textual-internal
    range: { earliest: "700 CE", latest: "750 CE", precision: decade, circa: true }
    grade: C
    label: Hajime Nakamura's earlier eighth-century placement
    sources: [src.nakamura-1983-early-vedanta]
    note: Nakamura argues for an earlier placement based on the chronology of the thinkers and texts associated with Shankara.
  - method: traditional-sampradaya
    range: { earliest: "509 BCE", latest: "477 BCE", precision: year, circa: false }
    grade: D
    label: Kanchi and Dwaraka matha tradition
    sources: [src.isayeva-1993-shankara-indian-philosophy]
    note: The succession lists of these mathas count back to a founder born in 509 BCE who lived thirty-two years.
claims:
  - text: >-
      His commentary on the Brahmasutras, together with commentaries on the principal Upanishads and the
      Bhagavad Gita, is the foundational statement of Advaita Vedanta.
    grade: B
    sources: [src.isayeva-1993-shankara-indian-philosophy, src.flood-1996-introduction-to-hinduism]
  - text: >-
      Tradition credits him with founding monastic seats (mathas) at Shringeri, Dwaraka, Puri and
      Jyotirmath; the historical details of these foundations are debated.
    grade: C
    sources: [src.flood-1996-introduction-to-hinduism]
debate: >-
  Historians date Shankara from internal evidence, mainly the authors he responds to and the earliest
  writers who quote him, which points to the 8th century CE; the conventional 788 to 820 CE comes from
  a later tradition that many scholars accept as approximate. The Kanchi Kamakoti and Dwaraka matha
  lineages hold that he lived from 509 to 477 BCE, counting back through their lists of successors.
