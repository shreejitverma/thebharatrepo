id: person.gautama-buddha
type: person
kind: dharma
names:
  en: Gautama Buddha
  iast: Siddhārtha Gautama
  native: सिद्धार्थ गौतम
summary: >-
  Siddhartha Gautama, the Buddha ("the Awakened One"), was a teacher of the Shakya clan, born at Lumbini, whose teaching of the Four Noble Truths and the Eightfold Path is the foundation of Buddhism. His historicity is generally accepted, but his dates are contested: the corrected long chronology places his death around 486 to 483 BCE, the short chronology around 400 BCE.
summaries:
  kids: >-
    Siddhartha Gautama was born at Lumbini in the Shakya clan. He became known as the Buddha and taught the Middle Way, kindness and how to end suffering.
  teen: >-
    The Buddha taught in the middle Gangetic plain. Historians still debate when he died: around 483 BCE (the corrected long chronology) or around 400 BCE (the short chronology).
region: Middle Gangetic plain and Nepal Terai (Lumbini, Bodh Gaya, Sarnath, Kushinagar)
location: { name: "Lumbini", lat: 27.469, lon: 83.276 }
datings:
  - method: textual-internal
    range: { earliest: "566 BCE", latest: "483 BCE", precision: decade, circa: true }
    grade: C
    label: Corrected long chronology (lifespan)
    sources:
      - src.cousins-1996-dating-historical-buddha
      - src.kulke-2004-history-of-india
    note: The Sri Lankan chronicles place Ashoka's consecration 218 years after the Parinirvana; counted from a consecration of about 268 BCE this gives a death around 486 to 483 BCE and, with an 80-year life, a birth around 566 to 563 BCE. Long favoured by Wilhelm Geiger and many historians of India.
  - method: textual-internal
    range: { earliest: "500 BCE", latest: "380 BCE", best: "400 BCE", precision: decade, circa: true }
    grade: C
    label: Short chronology (possible lifespan; Heinz Bechert, Richard Gombrich and others)
    sources:
      - src.cousins-1996-dating-historical-buddha
      - src.bronkhorst-2007-greater-magadha
    note: Northern Buddhist traditions put Ashoka about a century after the Parinirvana, and the Vinaya lists of teachers are too short for a 218-year gap; Cousins reviews these arguments and favours a death around 400 BCE. A death approximately between 420 and 380 BCE and a traditional lifespan of 80 years give this possible lifespan window.
  - method: traditional-sampradaya
    range: { earliest: "624 BCE", latest: "543 BCE", precision: year, circa: false }
    grade: D
    label: Theravada Buddhist Era
    sources:
      - src.cousins-1996-dating-historical-buddha
    note: The Buddhist Era used in Sri Lanka and Southeast Asia places the Parinirvana in 544 or 543 BCE, with the corresponding birth dates counted 80 years earlier.
claims:
  - text: Ashoka's pillar inscription at Lumbini (Rummindei), set up in his twentieth regnal year, states that "here the Buddha, the sage of the Shakyas, was born".
    grade: A
    sources:
      - src.hultzsch-1925-inscriptions-of-asoka
      - src.paranavitana-1962-rummindei-pillar
  - text: Since the symposium on the Buddha's date edited by Heinz Bechert, many Indologists favour a death around 400 BCE, though the corrected long chronology (about 486 to 483 BCE) retains support.
    grade: C
    sources:
      - src.cousins-1996-dating-historical-buddha
debate: >-
  The Buddha's dates depend on how many years separated his death from Ashoka's consecration, which Hellenistic synchronisms place around 268 BCE. The Sri Lankan chronicles give 218 years, pointing to about 486 to 483 BCE; northern Buddhist traditions give about 100 years, pointing to about 370 BCE. Many scholars now prefer a date near 400 BCE, while others keep the corrected long chronology. The traditional Theravada date of 544 or 543 BCE is an older reckoning of the same chronicle tradition.
