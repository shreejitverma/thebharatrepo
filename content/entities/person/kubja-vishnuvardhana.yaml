names:
  en: Kubja Vishnuvardhana
  iast: Kubja Viṣṇuvardhana
summary: Kubja Vishnuvardhana, brother of Pulakeshin II, established the Eastern Chalukya line.
  Inscriptions date his own grants in regnal years, and scholars differ on how to align those years
  with the CE calendar.
summaries:
  kids: Vishnuvardhana went from the Deccan to rule on the east coast. His family kept ruling there
    for many generations.
  teen: Some of Vishnuvardhana's charters use regnal years and refer to eclipses. Fleet's calculation
    and the more familiar dating give different starting years.
region: Coastal Andhra
