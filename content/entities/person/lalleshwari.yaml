kind: dharma
names:
  en: Lalleshwari
  iast: Lalleśvarī
  native: लल्लेश्वरी
summary: >-
  Lalleshwari (Lal Ded, Lalla) was a 14th-century Kashmiri yogini whose short verse sayings (vakh) are
  among the earliest works of Kashmiri literature. Her verses draw on Shaiva yoga and are cherished by
  both Hindu and Muslim Kashmiris, who also know her as Lalla Arifa.
summaries:
  kids: >-
    Lal Ded was a wise woman of Kashmir who wandered and sang short poems about finding God inside
    yourself. People of different religions in Kashmir still love her songs.
  teen: >-
    Lalla's vakhs are four-line poems in early Kashmiri. They talk about yoga, breath and inner
    awareness of Shiva, and mock empty rituals; they were passed down orally for centuries before
    being written down.
region: Kashmir
