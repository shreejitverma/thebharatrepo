names:
  en: Panini
  iast: Pāṇini
  native: पाणिनि
summary: >-
  Panini was an ancient Sanskrit grammarian from Shalatura in Gandhara who composed the
  Ashtadhyayi, the comprehensive generative grammar that standardized Classical Sanskrit. His
  formal system of phonological classes, morphological derivation, and metalinguistic notation is
  recognized as one of the earliest formal systems in the history of linguistics.
summaries:
  kids: >-
    Panini was a brilliant linguist from ancient Gandhara who wrote the Ashtadhyayi, organizing
    the entire grammar of the Sanskrit language into almost 4,000 short rules.
  teen: >-
    Born in Shalatura in Gandhara, Panini synthesized earlier grammatical traditions into the
    Ashtadhyayi. His formal rule system, using abstract markers and recursion, defined Classical
    Sanskrit and influenced modern structural and formal linguistics.
region: Shalatura, Gandhara (near the confluence of the Indus and Kabul rivers)
location: { name: "Shalatura (Chota Lahor, Gandhara)", lat: 34.04, lon: 72.37 }
datings:
  - method: linguistic
    range: { earliest: "600 BCE", latest: "350 BCE", best: "400 BCE", precision: century, circa: true }
    grade: C
    label: Mainstream scholarly dating (Cardona, Katre)
    sources:
      - src.cardona-1988-panini-work-traditions
      - src.katre-1987-astadhyayi-panini
