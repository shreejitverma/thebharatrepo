    note: >-
      Scholars place Panini in the 5th or 4th century BCE (most often c. 500 to 350 BCE) in
      Achaemenid or immediately pre-Alexandrian Gandhara.
claims:
  - text: >-
      Later grammatical and historical sources identify Panini as a native of Shalatura in
      Gandhara and name his mother as Dakshi (giving the matronymic Dakshiputra).
    grade: B
    sources:
      - src.cardona-1988-panini-work-traditions
      - src.katre-1987-astadhyayi-panini
  - text: >-
      In the Ashtadhyayi, Panini explicitly cites ten earlier Sanskrit grammarians by name,
      including Apishali, Kashyapa, Gargya, Galava, Chakravarmana, Bharadvaja, Shakatayana,
      Shakalya, Senaka, and Sphoṭayana.
    grade: A
    sources:
      - src.cardona-1988-panini-work-traditions
      - src.katre-1987-astadhyayi-panini
