summary: >-
  Anizham Thirunal Marthanda Varma (1706-1758) ruled Venad from 1729 and built it into the kingdom of
  Travancore. He broke the power of local chiefs, annexed neighbouring principalities, defeated the Dutch
  East India Company at Colachel in 1741 and in 1750 dedicated his kingdom to the deity Padmanabha at
  Thiruvananthapuram.
summaries:
  kids: >-
    Marthanda Varma brought several small kingdoms together to make Travancore. He defeated the Dutch at
    Colachel and dedicated his kingdom to Padmanabha, the deity honoured by his family.
  teen: >-
    Taking the Venad throne in 1729, Marthanda Varma broke the power of local nobles, defeated the Dutch at
    Colachel in 1741 and built a standing army with the help of the captured officer Eustachius De Lannoy.
    In 1750 he dedicated the state to Padmanabha.
