names:
  en: Thunchaththu Ezhuthachan
  iast: Tuñcattu Eḻuttacchan
  native: തുഞ്ചത്ത് എഴുത്തച്ഛൻ
summary: >-
  Thunchaththu Ramanujan Ezhuthachan (active in the 16th century CE) was the Kerala bhakti poet and scholar widely regarded as the father of modern Malayalam literature. Moving away from the heavily Sanskritized Manipravalam court style, he composed the Adhyatma Ramayanam Kilippattu and Sri Mahabharatam Kilippattu in the accessible "parrot-song" (kilippattu) metre using the 51-letter Malayalam script, helping standardize literary Malayalam and popularizing Rama and Krishna bhakti across Kerala.
summaries:
  kids: >-
    Thunchaththu Ezhuthachan was a sixteenth-century poet from Kerala known as the father of modern Malayalam, who retold the Ramayana and Mahabharata as musical "parrot songs" everyone could enjoy.
  teen: >-
    Composing his Adhyatma Ramayanam and Mahabharatam in the accessible kilippattu ("parrot-song") verse form during the 16th century CE, Ezhuthachan helped unify Malayalam language and script beyond elite Sanskritized Manipravalam circles.
