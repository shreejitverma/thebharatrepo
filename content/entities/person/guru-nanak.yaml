names:
  en: Guru Nanak
  iast: Gurū Nānak
  native: ਗੁਰੂ ਨਾਨਕ
summary: >-
  Guru Nanak (1469-1539) was the founding teacher of the Sikh tradition. His hymns, preserved in the
  Guru Granth Sahib, address devotion, ethical conduct, and the relation between religious practice and
  social life.
summaries:
  kids: >-
    Guru Nanak was born in 1469 and taught devotion to one God, honest work, and sharing with others.
    His hymns are included in the Sikh scripture, the Guru Granth Sahib.
  teen: >-
    Guru Nanak's teaching and poetry formed the beginning of the Sikh tradition. Historical study uses
    his hymns alongside later biographies, which differ in how they describe his life.
region: Punjab
