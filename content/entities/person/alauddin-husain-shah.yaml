  en: Alauddin Husain Shah
  native: আলাউদ্দিন হোসেন শাহ
summary: "Alauddin Husain Shah (r. 1494-1519 CE) founded the Husain Shahi dynasty of the Bengal Sultanate after overthrowing the Habshi regime and restoring stability across Bengal. Attested by numerous Arabic inscriptions and silver coins, his reign is often regarded as the cultural height of the Sultanate, with royal patronage extending to Bengali poets, administrative appointments across communities, and the era of Chaitanya Mahaprabhu."
summaries:
  kids: >-
    Sultan Alauddin Husain Shah ruled Bengal from 1494 to 1519 CE, bringing peace after years of
    unrest, building bridges and mosques, and supporting writers in the Bengali language.
  teen: >-
    Founder of the Husain Shahi dynasty (1494-1519 CE), Alauddin Husain Shah expanded Bengal's borders
    toward Kamata and Odisha, integrated Bengali Hindus such as Rupa and Sanatana Goswami into senior
    administration, and presided over a golden age of Middle Bengali literature.
region: Bengal, Kamata and Bihar frontier
