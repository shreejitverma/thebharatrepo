names:
  en: Shishunaga
  iast: Śiśunāga
summary: Shishunaga is the remembered founder of a Magadhan ruling house. Buddhist and Puranic
  accounts disagree about his place in the succession, leaving his dates uncertain.
summaries:
  kids: An old Buddhist account says Shishunaga became king after the people of Magadha removed their
    ruler. The story comes from a later book.
  teen: Buddhist chronicles place Shishunaga after the Haryankas. The Puranic lists preserve a
    different order, so an exact accession year would go beyond the evidence.
region: Magadha, Bihar
