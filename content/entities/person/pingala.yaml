names:
  en: Pingala
  iast: Piṅgala
  native: पिङ्गल
summary: Pingala is the author to whom the Sanskrit Chhandahsutra is attributed. The treatise’s rules for
  arranging heavy and light syllables are an early example of combinatorial reasoning. His period is estimated
  from the work.
summaries:
  kids: Pingala’s rules helped readers work out all the ways heavy and light syllables can make a line of verse.
  teen: Pingala’s prosody links poetry to combinatorics. A fixed number of syllables, each heavy or light, leads
    to a systematic list of possible patterns.
