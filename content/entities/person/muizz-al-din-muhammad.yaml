names:
  en: Muizz al-Din Muhammad of Ghur
summary: Muizz al-Din Muhammad ruled the eastern Ghurid domains from Ghazni and led campaigns into
  northern India. His death in 1206 initiated a succession crisis from which autonomous regional
  states emerged.
summaries:
  kids: Muhammad of Ghur led campaigns into northern India. After he died, some of his commanders
    became independent rulers.
  teen: Muizz al-Din governed the eastern part of an empire shared with his brother Ghiyath al-Din.
    After 1206 the commanders' hold over individual provinces became the basis of successor states.
