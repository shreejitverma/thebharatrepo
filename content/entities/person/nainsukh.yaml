claims:
  - text: Inscribed paintings and family priest registers (bahis) studied by B. N. Goswamy confirm Nainsukh as son of Pandit
      Seu and principal painter to Raja Balwant Singh of Jasrota from around 1740 to 1763.
    grade: A
    sources:
      - src.goswamy-2003-nainsukh-grove
      - src.goswamy-2011-nainsukh-of-guler
  - text: His surviving drawings and paintings (such as Raja Balwant Singh Looking at a Painting and Balwant Singh in
      Prayer) depart from heroic stereotype to depict unguarded private moments with subtle grey-white palettes.
    grade: A
    sources:
      - src.goswamy-2003-nainsukh-grove
      - src.goswamy-2011-nainsukh-of-guler
