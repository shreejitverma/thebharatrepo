names:
  en: Nainsukh
  iast: Nainasukha
  native: नैनसुख
summary: "Nainsukh of Guler (c. 1710-1778 CE) was a leading master of Pahari miniature painting. Younger son of Pandit Seu and brother of Manaku, he worked primarily for Raja Balwant Singh of Jasrota (c. 1740-1763) before serving in Basohli, introducing penetrating psychological portraiture, architectural perspective and intimate observation of everyday courtly life into hill painting."
summaries:
  kids: Nainsukh (c. 1710-1778) was a master painter from Guler in the Himalayan hills who painted wonderfully lifelike
    scenes of his patron Raja Balwant Singh.
  teen: Working mainly for Raja Balwant Singh of Jasrota, Nainsukh transformed Pahari painting with expressive ink
    sketches, fine portraiture and quiet observation of daily royal life.
region: Punjab Hills (Guler, Jasrota and Basohli)
location:
  name: Guler (Haripur), Himachal Pradesh
  lat: 32.006
  lon: 76.161
