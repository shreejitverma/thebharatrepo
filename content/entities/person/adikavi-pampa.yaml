summary: >-
  Pampa (born c. 902 CE), honoured as the Adikavi ("first poet") of Kannada literature, composed the foundational classical works of Old Kannada (Halegannada) around 941-942 CE at the court of the Vemulavada Chalukya king Arikesari II, a Rashtrakuta feudatory. His two surviving champu masterpieces - the Jain Adipurana (life of the first Tirthankara Rishabhanatha) and the secular Vikramarjuna Vijaya or Pampa Bharata (retelling the Mahabharata with Arjuna mapped onto Arikesari II) - set the literary canon for subsequent Kannada poetry.
summaries:
  kids: >-
    Pampa was a tenth-century Kannada poet honoured as "Adikavi" (first great poet). He wrote two classic poems: one about the first Jain Tirthankara and another retelling the Mahabharata around Arjuna.
  teen: >-
    Working under Arikesari II of Vemulavada in 941-942 CE, Adikavi Pampa forged classical Kannada champu poetry in his Adipurana and Vikramarjuna Vijaya, linking royal heroism with epic Mahabharata narrative.
region: Vemulavada (Telangana) and Banavasi / Dharwad cultural sphere (Karnataka)
