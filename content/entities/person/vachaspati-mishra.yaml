summary: Vachaspati Mishra wrote commentaries across several Sanskrit philosophical schools,
  including the Bhamati on Shankara’s Brahma Sutra commentary. An unspecified calendar era in a
  dated work leaves two plausible centuries for his activity.
summaries:
  kids: Vachaspati explained difficult books from several schools of thought. A number he wrote gives
    scholars two possible years for one of his works.
  teen: The Nyayasuchinibandha gives the year 898 without naming a calendar era. Reading it as Vikrama
    or Shaka changes the proposed date by 135 years.
