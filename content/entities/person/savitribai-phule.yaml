  en: Savitribai Phule
  native: सावित्रीबाई फुले
summary: Savitribai Phule was a Marathi poet, teacher and reformer. She helped establish a girls’
  school at Bhide Wada in Pune in 1848 and published the poetry collection Kavya Phule in 1854.
summaries:
  kids: Savitribai Phule helped open a school for girls in Pune at a time when many girls had few
    chances to study. She also wrote poems in Marathi.
  teen: Savitribai’s teaching and poetry were part of a nineteenth-century effort to widen access to
    education across gender and caste. She helped found a girls’ school in Pune and published Kavya
    Phule in 1854.
