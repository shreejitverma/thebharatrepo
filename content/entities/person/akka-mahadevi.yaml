summary: Akka Mahadevi is a Kannada vachana poet associated with the twelfth-century Virashaiva
  tradition. Her verse addresses Shiva as Chennamallikarjuna and uses the language of love and
  separation.
summaries:
  kids: Akka Mahadevi wrote short poems in Kannada. In them she speaks to Shiva with the affection and
    longing of someone talking to a beloved.
  teen: Akka Mahadevi’s vachanas use the voice of a bride or lover to express a bond with Shiva. The
    poems are a firmer basis for describing her teaching than the details found in later stories
    about her life.
