summary: Satyendra Nath Bose was a physicist whose 1924 paper derived Planck’s radiation law by counting light
  quanta. Einstein translated the paper into German and extended Bose’s approach to an ideal gas of particles.
summaries:
  kids: Bose found a new way of counting tiny packets of light. Einstein used the idea to study particles in a gas.
  teen: Bose’s derivation used the ways that light quanta could occupy states. The counting procedure became a
    foundation of quantum statistics.
