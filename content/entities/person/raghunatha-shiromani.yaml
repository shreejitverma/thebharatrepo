summary: Raghunatha Shiromani was a Navya-Nyaya philosopher associated with Navadvipa. He wrote the
  Didhiti on Gangesha’s Tattvachintamani and reconsidered inherited categories of what exists.
summaries:
  kids: Raghunatha wrote about an older book by Gangesha. He also asked which kinds of things
    philosophers need to explain the world.
  teen: Raghunatha’s Didhiti engages closely with Gangesha. In a separate work on categories,
    Raghunatha asks whether existing classifications can account for such things as number, absence
    and relationships.
