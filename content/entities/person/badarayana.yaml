names:
  en: Badarayana
  iast: Bādarāyaṇa
  native: बादरायण
summary: Badarayana is the traditional author of the Brahma Sutra, a concise work that became a
  basis for Vedanta commentary. The date and formation of the text are debated, and Badarayana’s own
  lifetime is uncertain.
summaries:
  kids: A book linked to Badarayana brings together ideas about the deepest reality in the Upanishads.
    Later teachers wrote longer books to explain its short lines.
  teen: The Brahma Sutra organizes teachings on Brahman and became a shared reference for divergent
    Vedanta schools. Scholars reconstruct the history of the sutras from their contents and later
    reception.
