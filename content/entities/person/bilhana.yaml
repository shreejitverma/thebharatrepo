    note: The final canto of the Vikramankadevacharita details Bilhana's journey from Khonamusha in Kashmir through Mathura, Kannauj, Somnath, and Anhilwara to Vikramaditya VI's court after 1076 CE.
claims:
  - text: Bilhana's Vikramankadevacharita narrates the genealogy of the Kalyani Chalukyas and the rise of Vikramaditya VI up to his early campaigns and conflicts with his brother Someshvara II and the Cholas.
    grade: A
    sources:
      - src.buhler-1875-vikramankadevacharita
      - src.yazdani-1960-early-history-deccan-part1
  - text: In Canto 18 of the Vikramankadevacharita, Bilhana records an unusually detailed personal itinerary tracing his travels across Indian royal courts from Kashmir to the Deccan.
    grade: A
