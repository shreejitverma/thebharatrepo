id: person.bilhana
type: person
kind: person
names:
  en: Bilhana
  iast: Bilhaṇa
  native: बिल्हण
summary: >-
  Bilhana was an 11th-century Kashmiri Sanskrit poet and playwright who travelled across northern and western India before becoming vidyapati (chief court poet) under the Western Chalukya emperor Vikramaditya VI at Kalyani. His eighteen-canto mahakavya Vikramankadevacharita celebrates Vikramaditya VI's career and provides key historical testimony on 11th-century Deccan politics alongside his autobiographical verse, while he is also famed for the lyric poem Caurapancasika and the play Karnasundari.
summaries:
  kids: >-
    Bilhana was a travelling Sanskrit poet from Kashmir who became chief poet at King Vikramaditya VI's court in Karnataka and wrote a poetic biography of the king.
  teen: >-
    Born in Kashmir and honoured as chief poet at Kalyani by Vikramaditya VI, Bilhana composed the Vikramankadevacharita - a rare historical Sanskrit mahakavya on a reigning Deccan king - as well as the lyric Caurapancasika.
region: Kashmir and Kalyani (Deccan)
location: { name: "Basavakalyan, Karnataka", lat: 17.87, lon: 76.95 }
datings:
  - method: textual-internal
    range: { earliest: "1050 CE", latest: "1100 CE", best: "1085 CE", precision: decade, circa: true }
