names:
  en: Jyotirao Phule
  native: ज्योतिराव फुले
summary: Jyotirao Phule was an anti-caste writer and organizer who worked with Savitribai Phule to
  expand education in western India. He wrote Gulamgiri and founded the Satyashodhak Samaj in 1873.
summaries:
  kids: Jyotirao Phule helped open schools and wrote about unfair rules that kept people apart by caste.
  teen: Phule’s Gulamgiri compares caste oppression to slavery. Through schools and the Satyashodhak
    Samaj he linked his criticism of hierarchy to collective reform.
