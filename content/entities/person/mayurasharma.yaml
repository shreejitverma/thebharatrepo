names:
  en: Mayurasharma
  iast: Mayūraśarman
  native: ಮಯೂರಶರ್ಮ
aliases:
  - person.mayurasharman
summary: >-
  Mayurasharma is the founder of the Kadamba dynasty of Banavasi in the dynasty's own records. The
  Talagunda pillar inscription of his descendant Kakusthavarman relates that this Brahmin of Talagunda went
  to the ghatika at Kanchipuram for Vedic study, quarrelled with Pallava officials, took up arms and forced
  the Pallavas to recognise his rule. He is usually placed in the mid-fourth century.
summaries:
  kids: >-
    A stone pillar remembers Mayurasharma as a Brahmin student who became a warrior after a quarrel at
    Kanchipuram and began the Kadamba kingdom at Banavasi.
  teen: >-
    The Talagunda inscription gives the dynasty's own account of Mayurasharma's rise from student to king.
    It was carved about a century after him, so his exact dates are uncertain, and his successors changed
    the family name ending from -sharman to -varman.
region: Talagunda and Banavasi, Karnataka
