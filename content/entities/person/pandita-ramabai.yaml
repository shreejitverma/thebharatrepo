  native: पंडिता रमाबाई
summary: Pandita Ramabai was a Sanskrit scholar, writer and education reformer. She campaigned for
  women’s education, established the Sharada Sadan and wrote The High-Caste Hindu Woman.
summaries:
  kids: Ramabai wrote about the difficulties girls and women faced. She started a school and home
    where young women and widows could study.
  teen: Ramabai connected women’s education with the circumstances of child widows. Her
    English-language writing took this argument to an international audience, and the Sharada Sadan
    put her educational ideas into practice.
