  iast: Vikramāditya VI
  native: ಆರನೆಯ ವಿಕ್ರಮಾದಿತ್ಯ
summary: "Vikramaditya VI (Tribhuvanamalla, r. 1076 to 1126 CE) is often regarded as the most powerful ruler of the Western Chalukya dynasty of Kalyani. Ascending the throne after displacing his elder brother Someshvara II, he inaugurated the Chalukya Vikrama era in 1076 CE, maintained dominance across Karnataka, Maharashtra, and parts of Andhra against Chola and Hoysala pressure, and presided over a renowned intellectual court featuring the Kashmiri poet Bilhana and the jurist Vijnaneshvara."
summaries:
  kids: "Vikramaditya VI was one of the most powerful kings of the Kalyani Chalukyas. He ruled for fifty years, started his own calendar era in 1076 CE, and welcomed poets and law scholars to his court."
  teen: >-
    Ruling from Kalyani for half a century (1076 to 1126 CE), Vikramaditya VI launched the Chalukya Vikrama era and patronised Vijnaneshvara's Mitakshara law digest and Bilhana's Sanskrit biography Vikramankadevacharita.
region: Deccan (capital Kalyani / Basavakalyan, Karnataka)
location: { name: "Basavakalyan, Karnataka", lat: 17.87, lon: 76.95 }
datings:
