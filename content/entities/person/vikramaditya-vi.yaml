    note: Hundreds of Kannada and Sanskrit stone and copper-plate records date his fifty-year reign using the Chalukya Vikrama era reckoned from his coronation in 1076 CE.
claims:
  - text: "At his accession in 1076 CE, Vikramaditya VI introduced the Chalukya Vikrama era, which appears in official Chalukya records alongside the older Shaka era."
    grade: A
    sources:
      - src.salomon-1998-indian-epigraphy
      - src.yazdani-1960-early-history-deccan-part1
  - text: The jurist Vijnaneshvara composed the Mitakshara, an authoritative Sanskrit commentary on the Yajnavalkya Smriti, at Kalyani during Vikramaditya VI's reign, praising both city and king.
    grade: A
    sources:
      - src.yazdani-1960-early-history-deccan-part1
      - src.sastri-1976-history-of-south-india
  - text: He held off Chola expansion under Kulottunga I and checked early Hoysala assertions under Vishnuvardhana while patronising Shaiva, Vaishnava, and Jain temples including the Mahadeva temple at Itagi.
    grade: B
    sources:
