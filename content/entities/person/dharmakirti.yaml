names:
  en: Dharmakirti
  iast: Dharmakīrti
  native: धर्मकीर्ति
summary: Dharmakirti developed Buddhist theories of perception, inference and reliable knowledge in
  works including the Pramanavarttika. His dating remains contested between a sixth-century and a
  seventh-century placement.
summaries:
  kids: Dharmakirti asked what makes a belief reliable. He built on Dignaga’s work about seeing things
    and reasoning from clues.
  teen: Dharmakirti uses Dignaga’s theory of knowledge as a point of departure, developing detailed
    arguments about perception and inference. Scholars reconstruct his dates partly from how
    neighboring traditions responded to his ideas.
