summary: Swami Vivekananda, born Narendranath Datta, was a disciple of Ramakrishna and a public
  teacher of Vedanta. At the 1893 World’s Parliament of Religions in Chicago he spoke about
  religious acceptance.
summaries:
  kids: Vivekananda was a monk who traveled from India to Chicago. There he spoke to people from many
    faiths about respecting different religious paths.
  teen: Vivekananda’s addresses at Chicago introduced his presentation of Hindu ideas to an
    international audience. In his opening response he emphasized tolerance and acceptance.
