summary: Narayana Guru was a Kerala religious teacher and reformer whose teachings on human unity
  challenged caste exclusion. He helped establish the SNDP Yogam in 1903. His exact birth year is
  uncertain.
summaries:
  kids: Narayana Guru taught that people share a common humanity. He helped create a group that worked
    to improve opportunities for people kept out by caste rules.
  teen: Narayana Guru drew on Advaita while addressing the social exclusion faced by Ezhavas in
    Kerala. In 1903 he worked with reformers including Dr. Palpu and the poet Kumaran Asan to
    establish the SNDP Yogam.
