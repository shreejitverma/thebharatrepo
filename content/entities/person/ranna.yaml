summary: >-
  Ranna (born 949 CE, active c. 980 to 1010 CE) was one of the "three gems" (Ratnatraya) of classical Old Kannada literature alongside Pampa and Ponna. Born in Mudhol in Bagalkot district and trained by the Jain teacher Ajitasenacharya, he gained patronage under the Western Ganga minister Chavundaraya and the Kalyani Chalukya emperors Tailapa II and Satyashraya, composing the Ajitapurana (993 CE) and the dramatic Mahabharata epic Sahasabhima Vijaya (Gadayuddha).
summaries:
  kids: >-
    Ranna was a tenth-century Kannada poet famous for his vivid poem Gadayuddha about the mace duel between Bhima and Duryodhana, earning the title "Emperor of Poets" from the Kalyani Chalukya king.
  teen: >-
    Named Kavichakravarti ("Emperor of Poets") by Tailapa II of Kalyani, Ranna wrote the Jain Ajitapurana (993 CE) and the dramatic Sahasabhima Vijaya (Gadayuddha), pairing his patron Satyashraya with the Mahabharata hero Bhima.
region: Mudhol (Bagalkot district) and Kalyani realm, northern Karnataka
