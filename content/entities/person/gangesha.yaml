summary: Gangesha Upadhyaya wrote the Tattvachintamani, a foundational work of Navya-Nyaya. His
  precise dates are uncertain, with scholarly placements spanning the medieval period.
summaries:
  kids: Gangesha wrote a book about how to tell whether a belief is well founded. Later thinkers used
    his book to study arguments.
  teen: The Tattvachintamani examines the means of knowledge in four divisions. Its analyses of
    inference and other means of knowledge shaped the vocabulary of Navya-Nyaya.
