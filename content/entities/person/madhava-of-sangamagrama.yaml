  iast: Mādhava of Saṅgamagrāma
  native: സംഗമഗ്രാമ മാധവൻ
summary: >-
  Madhava of Sangamagrama was a Kerala mathematician and astronomer active around the late fourteenth
  and early fifteenth centuries. Later Kerala authors credit him with infinite series for pi and
  trigonometric functions; most of the specific results survive through their quotations and
  attributions rather than in extant works by Madhava himself.
summaries:
  kids: >-
    Madhava was a mathematician from Kerala. Later scholars said he found important infinite series,
    and they preserved those ideas in their own books.
  teen: >-
    Madhava is regarded as a central figure in Kerala mathematics. Because much of his writing is lost,
    his series are known chiefly from later authors who attribute them to him.
