summary: Bal Gangadhar Tilak used journalism and public organising to campaign for Indian
  self-government. Colonial courts prosecuted him for sedition, and after imprisonment in
  Mandalay he helped launch the Home Rule movement.
summaries:
  kids: Tilak wrote for newspapers and urged Indians to seek the right to govern themselves. The
    colonial government sent him to prison for his writings.
  teen: Tilak used the newspapers Kesari and the Mahratta to build a political audience. After
    serving a sentence in Mandalay, he returned to organise a Home Rule League in 1916.
