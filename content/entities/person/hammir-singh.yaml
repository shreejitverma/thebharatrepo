names:
  en: Hammir Singh of Mewar
summary: Hammir Singh established Sisodia authority at Chittor in the fourteenth century. His reign
  marks an important stage in the longer history of the Mewar polity and the Guhila line.
summaries:
  kids: Hammir was an early Sisodia ruler of Mewar. The hill fort of Chittor became a centre of his
    family again.
  teen: Mewar existed before Hammir. His claim to Chittor re-established the power of a Guhila branch
    that became identified with the Sisodias.
