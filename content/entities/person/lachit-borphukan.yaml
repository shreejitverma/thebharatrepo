names:
  en: Lachit Borphukan
  native: লাচিত বৰফুকন
summary: >-
  Lachit Borphukan (d. 1672 CE) was the celebrated Ahom military commander (Borphukan) appointed by
  Swargadeo Chakradhvaj Singha in 1667 CE to expel Mughal garrisons from lower Assam. Mastering
  guerrilla containment, earthen rampart engineering and Brahmaputra naval tactics, he retook Guwahati
  in 1667 and led the Ahom fleet to victory at Saraighat in 1671 CE before dying about a year later.
summaries:
  kids: >-
    Lachit Borphukan was a brave Ahom general who recaptured Guwahati in 1667 and, though gravely ill,
    led Ahom war-boats to defeat the Mughal fleet at the Battle of Saraighat in 1671.
  teen: >-
    Appointed Borphukan of lower Assam in 1667, Lachit rebuilt Guwahati's river-and-hill defences and
    commanded the Ahom victory over Raja Ram Singh's Mughal forces at Saraighat in 1671 before his
    death in 1672.
region: Assam (lower and upper Brahmaputra Valley)
