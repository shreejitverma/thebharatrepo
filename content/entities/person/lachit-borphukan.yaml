claims:
  - text: Son of the Ahom statesman Momai Tamuli Borbarua, Lachit was appointed Borphukan in 1667 and recaptured Guwahati and Pandu from Mughal command before fortifying the surrounding hills.
    grade: A
    sources:
      - src.bhuyan-1947-lachit-barphukan
      - src.baruah-1985-comprehensive-history-assam
  - text: Leaving his sickbed during the 1671 Battle of Saraighat, Lachit commanded the Ahom flotilla in person to break the Mughal naval advance and secured the Brahmaputra frontier.
    grade: B
