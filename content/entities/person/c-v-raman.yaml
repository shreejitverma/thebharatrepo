summary: Chandrasekhara Venkata Raman was an experimental physicist. His work with K. S. Krishnan on light
  scattering in 1928 helped establish the effect that bears his name. He received the 1930 Nobel Prize in
  Physics.
summaries:
  kids: Raman studied what happens to light when it passes through different materials. His experiments helped
    show that some scattered light changes colour.
  teen: Raman and Krishnan investigated weak changes in the spectrum of scattered light. Raman later established
    a research institute in Bangalore to continue experimental work.
