summary: >-
  Kabir was a North Indian poet whose songs and sayings circulated across communities and later became
  central to several devotional traditions. His verses challenge ritual and social authority in varied
  ways, while the details of his life and the attribution of individual poems remain debated.
summaries:
  kids: >-
    Kabir was a poet whose short songs asked people to look for truth and devotion beyond outward
    labels. Stories about his life differ, and scholars study the poems carefully.
  teen: >-
    Kabir's poetry survives through different collections and oral traditions. Historians distinguish
    the evidence in the poems from later stories about his life and teacher.
