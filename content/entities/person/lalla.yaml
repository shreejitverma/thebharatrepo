names:
  en: Lalla
  iast: Lalla
  native: लल्ल
summary: Lalla was a Sanskrit astronomer usually placed in the eighth century. His Shishyadhivriddhida Tantra
  develops astronomy in the Aryabhata school. An alternative chronology based on its numerical parameters has
  been proposed.
summaries:
  kids: Lalla wrote a guide for students of astronomy. Astronomers use clues inside the guide to work out when
    he may have lived.
  teen: Lalla’s treatise gives procedures for astronomy, including eclipse geometry. One date comes from
    correction rules, while a later estimate comes from fitting the text’s numerical parameters.
