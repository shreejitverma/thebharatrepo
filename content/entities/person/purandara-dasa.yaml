summary: Purandara Dasa (traditional dates 1484-1564 CE) was a Kannada Vaishnava Haridasa poet-saint and composer
  associated with the Vijayanagara Empire. Revered as Karnataka Sangita Pitamaha (grandfather of Carnatic music), he is
  credited by tradition with standardising beginner vocal exercises (sarali varisai, alankaras, gitas) in
  Mayamalavagowla raga and composing hundreds of surviving devotional padas.
summaries:
  kids: Purandara Dasa was a poet and musician from Karnataka during the Vijayanagara period who created the basic lessons
    still used to teach Carnatic music today.
  teen: Honoured as the 'grandfather of Carnatic music', the Haridasa saint-composer Purandara Dasa shaped South Indian
    musical pedagogy and composed influential Kannada devotional songs in the Vijayanagara era.
