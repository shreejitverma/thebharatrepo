names:
  en: Ravidas
  iast: Ravidāsa
  native: रविदास
summary: Ravidas, also known as Raidas, is a north Indian devotional poet whose songs are preserved
  in several manuscript traditions, including Sikh scripture. His chronology is contested.
summaries:
  kids: Ravidas sang about devotion and imagined a city where people could live without sorrow.
  teen: Songs transmitted under Ravidas’s name survive in Sikh and other collections. One imagines
    Begampura, a city without sorrow, where the speaker can move about without fear.
