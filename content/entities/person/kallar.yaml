names:
  en: Kallar
summary: Kallar is the founder of the Late Shahi line in Al-Biruni's account. His accession is
  debated, and identifying his name with any particular issue of Shahi coins remains difficult.
summaries:
  kids: Al-Biruni tells how Kallar came to rule in the northwest. Scholars are still working out when
    he took power.
  teen: Historians use Al-Biruni's list along with records of ninth-century Kabul. Competing
    chronologies date Kallar's accession several decades apart.
