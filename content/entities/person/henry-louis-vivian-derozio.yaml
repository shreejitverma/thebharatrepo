summary: >-
  Henry Louis Vivian Derozio (1809-1831) was an Anglo-Indian poet, journalist and assistant
  headmaster at Hindu College, Calcutta from 1826 to 1831. Inspiring his students through the
  Academic Association to question religious orthodoxy, caste restrictions and unexamined tradition,
  he sparked the radical Young Bengal movement before conservative trustees forced his resignation in
  April 1831 shortly before his death from cholera at age twenty-two.
summaries:
  kids: >-
    Born in Calcutta in 1809, Henry Louis Vivian Derozio was a young poet and teacher at Hindu College
    who encouraged his students to think freely, debate big ideas and question unfair customs.
  teen: >-
    Teaching at Hindu College between 1826 and 1831, Derozio mentored the Young Bengal circle in
    rationalist debate and Indian patriotic poetry (such as "To India - My Native Land") before dying
    of cholera in 1831 at twenty-two.
