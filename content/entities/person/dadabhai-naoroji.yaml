names:
  en: Dadabhai Naoroji
  native: દાદાભાઈ નવરોજી
summary: Dadabhai Naoroji argued that British rule impoverished India through a continuing
  transfer of resources to Britain. He advanced this drain theory through economic writing and
  public office, and in 1906 he called for swaraj as Congress president.
summaries:
  kids: Naoroji studied how money earned in India was sent to Britain. He argued that this made it
    harder for people in India to prosper.
  teen: Naoroji pointed to government payments abroad and remittances by British officials as
    channels of economic drain. He brought that argument into British and Indian political
    debate and linked it to the demand for self-government.
