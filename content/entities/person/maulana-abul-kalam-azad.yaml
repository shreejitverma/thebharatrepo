summary: Abul Kalam Azad published the Urdu weekly Al-Hilal and led the Indian National Congress
  during much of the Second World War. He opposed Partition and became independent India's
  education minister in 1947.
summaries:
  kids: Azad wrote a newspaper and helped lead the campaign for freedom. After independence, he
    became India's education minister.
