names:
  en: Guru Arjan
  native: ਗੁਰੂ ਅਰਜਨ
summary: Guru Arjan was the fifth Sikh Guru. He oversaw compilation of the Adi Granth in 1604 and
  was executed at Lahore under Jahangir in 1606.
summaries:
  kids: Guru Arjan brought together sacred hymns in a book called the Adi Granth. It became central to
    Sikh worship.
  teen: Guru Arjan compiled the Adi Granth from compositions by Sikh Gurus and other devotional poets.
    His death under Jahangir is documented, while historians debate the circumstances and motives.
