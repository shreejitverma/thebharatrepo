names:
  en: "Hemachandra"
  iast: "Hemacandra"
  native: "हेमचन्द्र"
summary: "Hemachandra was a Shvetambara Jain monk, grammarian and writer associated with the
  Chaulukya court of Gujarat. His works include a grammar treating Sanskrit and Prakrit, a poem that
  uses dynastic history to illustrate grammatical forms, and the Yogashastra, a Jain guide to conduct
  and meditation."
summaries:
  kids: "Hemachandra was a Jain monk who wrote about how languages work and how to live and meditate.
    In one poem, he used stories of Gujarat's rulers to show the rules of grammar."
  teen: "Hemachandra worked in the courts of Jayasimha Siddharaja and Kumarapala. His Dvyashraya poem
    combined a royal narrative with examples of grammar, and his Yogashastra sets out Jain conduct and
    meditation."
region: "Patan, Gujarat"
