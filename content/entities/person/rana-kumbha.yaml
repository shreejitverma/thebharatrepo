names:
  en: "Rana Kumbha"
summary: "Rana Kumbha ruled Mewar in the fifteenth century. His architectural patronage is visible
  at Chittor and Kumbhalgarh, where inscriptions record how his court represented its rule."
summaries:
  kids: "Rana Kumbha ruled Mewar and had temples and forts built. An inscription at Kumbhalgarh tells
    us about his court and the temple it built."
  teen: "Kumbha's major building projects included Kumbhalgarh and the victory tower at Chittor. A
    Sanskrit inscription from Kumbhalgarh survives in several fragments and situates the patron
    within a royal lineage."
region: "Mewar, Rajasthan"
