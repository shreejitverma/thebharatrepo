names:
  en: Atisha Dipankara Shrijnana
  iast: Atiśa Dīpaṅkara Śrījñāna
  native: অতীশ দীপঙ্কর শ্রীজ্ঞান
summary: >-
  Atisha Dipankara Shrijnana (982-1054 CE) was an eastern Indian Buddhist monk-scholar born in the
  Vikramapura region of Bengal who studied under Dharmakirti in Suvarnadvipa (Sumatra) and later
  served as a senior master at Vikramashila, Odantapuri and Somapura. Invited to western Tibet in
  1042 CE, he authored the Bodhipathapradipa and helped establish the Kadampa tradition.
summaries:
  kids: >-
    Born in Bengal over a thousand years ago, the Buddhist scholar Atisha studied in India and
    Sumatra before travelling across the Himalayas to teach in Tibet, where he helped shape Tibetan
    Buddhism.
  teen: >-
    A leading teacher at Vikramashila and Somapura after studying in Sumatra, Atisha went to Tibet
    in 1042 CE, where his treatise Lamp for the Path to Awakening laid foundations for Tibetan monastic
    reform.
