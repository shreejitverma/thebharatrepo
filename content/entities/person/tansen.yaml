claims:
  - text: Abu'l Fazl's Ain-i Akbari lists Miyan Tansen of Gwalior first among Akbar's thirty-six imperial musicians,
      praising his unmatched command of North Indian vocal art.
    grade: A
    sources:
      - src.abulfazl-1873-ain-i-akbari
      - src.wade-1998-imaging-sound
  - text: Francoise Delvoye's philological studies trace hundreds of Brajbhasha dhrupad compositions (padas) bearing
      Tansen's signature (chhap) alongside the theoretical treatises Sangitasara and Ragamala attributed to him.
    grade: B
