summary: Miyan Tansen (born Ramtanu, died c. 1586-1589 CE) was the foremost court musician and dhrupad composer of
  Mughal emperor Akbar's reign. Born near Gwalior and trained earlier at regional courts including Rewa, he joined
  Akbar's court in 1562, earned fame in Abu'l Fazl's Ain-i Akbari, and is revered in Hindustani tradition as a creator
  of ragas such as Miyan ki Todi and Darbari Kanada.
summaries:
  kids: Miyan Tansen was the most famous singer and composer at Emperor Akbar's court, remembered for his mastery of
    dhrupad singing and many classic ragas.
  teen: Originally serving at Gwalior and Rewa before joining Akbar's court in 1562, Miyan Tansen became a towering figure
    in Hindustani dhrupad, remembered through preserved Brajbhasha song lyrics and Mughal histories.
region: Gwalior, Rewa and Agra (Mughal Empire)
