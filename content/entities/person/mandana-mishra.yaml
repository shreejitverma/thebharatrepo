summary: Mandana Mishra wrote about both Vedic injunctions and nondual Vedanta. His Brahmasiddhi
  defends nondualism, and his chronology relative to Shankara is debated.
summaries:
  kids: Mandana wrote about what old religious texts ask people to do and about how they describe the
    deepest reality.
  teen: Mandana’s Brahmasiddhi defends nondualism, while the Vidhiviveka examines injunctions. The
    sequence of early Vedanta texts bears on whether he wrote before or after Shankara’s major
    commentary.
