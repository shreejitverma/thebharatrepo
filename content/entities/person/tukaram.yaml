summary: Tukaram was a Marathi poet of the Varkari tradition. His abhangs address Vitthal and give
  voice to personal struggle, everyday experience and religious devotion.
summaries:
  kids: Tukaram sang to Vitthal in Marathi. His poems talk about troubles people know well and the
    comfort he found in devotion.
  teen: Tukaram’s abhangs became part of the Varkari repertoire of songs and pilgrimage. The poems
    address Vitthal and give a voice to experience outside the learned Sanskrit traditions.
