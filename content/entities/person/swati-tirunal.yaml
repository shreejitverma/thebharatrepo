summary: Swati Tirunal Rama Varma (1813-1846 CE) was the Maharaja of Travancore and a major patron and polyglot composer
  of South Indian classical music. Collaborating with Vadivelu of the Thanjavur Quartet and North Indian court
  musicians, he left hundreds of compositions spanning Carnatic kritis, varnams and padams alongside Hindustani
  dhrupads, khayals and thumris under the signature 'Padmanabha'.
summaries:
  kids: Swati Tirunal (1813-1846) was a king of Travancore in Kerala who loved music and composed hundreds of songs in
    both South Indian Carnatic and North Indian Hindustani styles.
  teen: Ruling Travancore while assembling musicians from Thanjavur and North India, Maharaja Swati Tirunal composed in
    Sanskrit, Malayalam, Telugu and Hindi and helped introduce the violin and Mohiniyattam to court culture.
