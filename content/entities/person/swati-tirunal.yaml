  - text: Musicologists debate the authorship and late-nineteenth-century editing of parts of the corpus attributed to him,
      while confirming his prolific multilingual court output (Navaratri Kritis, ragamalikas, tillanas and Hindi
      compositions).
    grade: C
    sources:
      - src.iyer-1971-swati-tirunal-compositions
      - src.subramanian-2006-tanjore-court-madras-music-academy
debate: Later twentieth-century musicological debates questioned whether all compositions published under Swati
  Tirunal's 'Padmanabha' signature were personally composed by the king or partly shaped and tuned by court musicians
  such as the Thanjavur Quartet and editors like Harikesanallur Muthiah Bhagavatar; scholars such as S.
  Venkitasubramonia Iyer defend the core corpus from Travancore palace manuscripts.
