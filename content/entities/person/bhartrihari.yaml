names:
  en: Bhartrihari
  iast: Bhartṛhari
  native: भर्तृहरि
summary: Bhartrihari was a Sanskrit grammarian and philosopher of language whose Vakyapadiya
  examines how speech, meaning and thought are related. The identification of the grammarian with
  the poet of the Three Centuries is uncertain.
summaries:
  kids: Bhartrihari asked how the sounds in a sentence become a thought you can understand.
  teen: In the Vakyapadiya, Bhartrihari looks at how we grasp an utterance as a whole even though its
    sounds arrive one after another. He also explores how language shapes perception.
