names:
  en: Guru Angad
  native: ਗੁਰੂ ਅੰਗਦ
summary: Guru Angad succeeded Guru Nanak as the second Sikh Guru. His verse forms part of Sikh
  scripture, and his leadership is associated with the promotion of the Gurmukhi script.
summaries:
  kids: Guru Angad carried on Guru Nanak’s teaching. Verses he composed are still read and sung by Sikhs.
  teen: The second Guru continued Nanak’s teaching and contributed short verses to the corpus later
    gathered into the Adi Granth. He is closely associated with the transmission of Gurmukhi.
