names:
  en: Basava
  iast: Basavaṇṇa
  native: ಬಸವಣ್ಣ
summary: >-
  Basava (Basavanna) was a 12th-century Kannada poet and minister at the Kalachuri court of Bijjala II
  at Kalyana. His vachanas, short free-verse sayings addressed to Shiva as Kudalasangama, rejected
  temple ritual and caste hierarchy and are central to the Virashaiva (Lingayat) tradition.
summaries:
  kids: >-
    Basava was a poet and royal minister in Karnataka. He wrote short poems saying that the body itself
    can be a temple, and that all devotees of Shiva are equal.
  teen: >-
    Basava's vachanas are in plain spoken Kannada rather than Sanskrit. He gathered a community of
    devotees from many castes, and his poem "the rich will make temples for Shiva" contrasts built
    temples with the living body.
region: Northern Karnataka (Kalyana, now Basavakalyan)
