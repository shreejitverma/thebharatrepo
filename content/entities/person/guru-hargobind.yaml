names:
  en: Guru Hargobind
  native: ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ
summary: Guru Hargobind was the sixth Sikh Guru. His leadership took on a more explicit temporal and
  military role, and Sikh tradition associates him with founding the Akal Takht at Amritsar.
summaries:
  kids: Guru Hargobind led the Sikhs after his father, Guru Arjan. Sikhs remember him for bringing
    spiritual and public leadership together.
  teen: After succeeding Guru Arjan, Hargobind maintained an armed following. The Akal Takht at
    Amritsar became associated with the temporal authority of Sikh leadership.
region: Amritsar and Kiratpur, Punjab
