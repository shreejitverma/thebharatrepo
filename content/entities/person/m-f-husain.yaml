summary: Maqbool Fida Husain (1915-2011 CE) was one of India's most prominent twentieth-century modernist painters and a
  founding member of the Bombay Progressive Artists' Group (1947). Starting out painting cinema billboards in Bombay, he
  synthesized Cubist-inflected bold outlines and vibrant colour with Indian sculpture, village life, galloping horses
  and epic narratives from the Mahabharata and Ramayana.
summaries:
  kids: M. F. Husain (1915-2011) was a famous Indian modern artist who began by painting movie posters and went on to
    paint bold, colourful canvases of galloping horses, Mother Teresa and Indian epics.
  teen: Co-founder of the 1947 Progressive Artists' Group in Bombay, M. F. Husain fused bold modernist line and colour
    with classical Indian sculpture and epic themes, later facing fierce political controversy in India.
