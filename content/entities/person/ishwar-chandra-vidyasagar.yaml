summary: Ishwar Chandra Vidyasagar was a Bengali educator and Sanskrit scholar who campaigned for
  Hindu widow remarriage. His 1855 tracts made a case from scripture as well as from the
  circumstances of widows.
summaries:
  kids: Vidyasagar wrote about why widows should be allowed to marry again. He looked closely at old
    texts to explain his case.
  teen: Vidyasagar answered opposition to Hindu widow remarriage by rereading Sanskrit authorities and
    describing the hardship faced by widows. His two Bengali works appeared in 1855, a year before
    the remarriage act.
