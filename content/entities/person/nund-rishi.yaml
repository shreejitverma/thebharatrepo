summary: "Nund Rishi, also known as Sheikh Nur al-Din, was a Kashmiri Sufi poet associated with the
  founding of the Rishi order. Verses attributed to him bring Quranic themes into conversation with
  Kashmiri images and expressions."
summaries:
  kids: "Nund Rishi spoke about faith in Kashmiri, the language people around him used. His short
    poems draw on images familiar to people in the valley."
