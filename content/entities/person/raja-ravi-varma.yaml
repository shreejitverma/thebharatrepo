summary: Raja Ravi Varma (1848-1906 CE) of Kilimanoor in Travancore was a pioneering modern Indian painter who fused
  European academic oil painting and perspective with themes from the Mahabharata, Ramayana, Kalidasa and Indian
  regional portraiture. In 1894 he established the Ravi Varma Fine Art Lithographic Press near Bombay, mass-circulating
  affordable chromolithographs that reshaped popular Indian visual culture.
summaries:
  kids: Raja Ravi Varma (1848-1906) was a painter from Kerala who used European oil-painting styles to paint Indian epics
    and everyday life, and started a printing press so ordinary families could own his pictures.
  teen: Combining Victorian academic realism with Indian mythological and court portraiture, Raja Ravi Varma won prizes in
    Vienna and Chicago and transformed popular visual imagery through his 1894 chromolithographic press.
