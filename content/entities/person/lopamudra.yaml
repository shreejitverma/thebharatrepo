summary: Lopamudra is a named figure in a Rigvedic dialogue hymn involving the seer Agastya. The
  hymn presents a wife speaking of age and desire. Its language supplies a textual horizon, while
  her lifetime is unknown.
summaries:
  kids: In a poem in the Rigveda, Lopamudra speaks to Agastya about growing older and wanting to share
    his affection.
  teen: Rigveda 1.179 presents a dialogue about aging and desire. Lopamudra is named in the hymn, and
    the assignment of individual voices draws on the text and its interpretive tradition.
