claims:
  - text: The 634 CE Aihole inscription of the Chalukya king Pulakeshin II (composed by Ravikirti) explicitly names Kalidasa and Bharavi as the supreme masters of Sanskrit poetic fame, and proposed echoes of his poetry in the 473 CE Mandasor inscription suggest an earlier upper bound.
    grade: C
    sources:
      - src.fleet-1888-inscriptions-early-gupta-kings
      - src.salomon-1998-indian-epigraphy
  - text: Kalidasa's drama Abhijnanashakuntala adapts an episode from the Adiparvan of the Mahabharata through the device of the royal signet ring of recognition, ejemplifying the shringara (erotic-romantic) and vira (heroic) rasas codified in the Natyashastra.
    grade: A
    sources:
      - src.pollock-2016-rasa-reader
      - src.brockington-1998-sanskrit-epics
debate: >-
  Because Kalidasa states in the prologue of Malavikagnimitra that he is a contemporary successor to older playwrights like Bhasa, Saumilla and Kaviputra without giving a calendar date, scholars reconstruct his era from external termini and internal allusions. The possible echoes of Kalidasa in the 473 CE Mandasor inscription and the 634 CE Aihole inscription provide possible fifth-century and secure seventh-century upper bounds, respectively. The Gupta court is a common scholarly identification, while the Nine Gems tradition links Kalidasa to a Vikramaditya of Ujjain and the era beginning in 57 BCE.
