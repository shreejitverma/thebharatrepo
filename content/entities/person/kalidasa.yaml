names:
  en: Kalidasa
  iast: Kālidāsa
  native: कालिदास
summary: >-
  Kalidasa is the pre-eminent poet and dramatist of classical Sanskrit literature, celebrated for his three surviving plays (Abhijnanashakuntala, Vikramorvashiya and Malavikagnimitra), two mahakavyas (Raghuvamsha and Kumarasambhava), and the lyric poem Meghaduta. His exact dates are contested because his works contain no autobiographical colophon: mainstream scholarship places him in the fourth to fifth century CE at the court of the Gupta emperors Chandragupta II Vikramaditya and Kumaragupta I, while an alternative tradition links him to a first-century BCE Vikramaditya of Ujjain.
summaries:
  kids: >-
    Kalidasa was ancient India's most famous Sanskrit poet and playwright, who wrote the play Shakuntala and the poem Meghaduta ("The Cloud Messenger").
  teen: >-
    Author of the dramas Abhijnanashakuntala and Vikramorvashiya and the epic poem Raghuvamsha, Kalidasa set the standard for classical Sanskrit kavya; most historians place him in the Gupta period under Chandragupta II Vikramaditya (c. 375-450 CE), though his exact date remains debated.
region: Ujjain (Malwa) and Northern India
