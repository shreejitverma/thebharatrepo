claims:
  - text: The 634 CE Aihole inscription of the Chalukya king Pulakeshin II (composed by Ravikirti) explicitly names Kalidasa and Bharavi as the supreme masters of Sanskrit poetic fame, and Vatsabhatti's 473 CE Mandasor silk-weavers' inscription imitates verses from Kalidasa's Meghaduta and Ritusamhara, providing a firm fifth- to seventh-century CE terminus ante quem.
    grade: A
    sources:
      - src.fleet-1888-inscriptions-early-gupta-kings
      - src.salomon-1998-indian-epigraphy
  - text: Kalidasa's drama Abhijnanashakuntala adapts an episode from the Adiparvan of the Mahabharata through the device of the royal signet ring of recognition, ejemplifying the shringara (erotic-romantic) and vira (heroic) rasas codified in the Natyashastra.
    grade: A
    sources:
      - src.pollock-2016-rasa-reader
      - src.brockington-1998-sanskrit-epics
debate: >-
  Because Kalidasa states in the prologue of Malavikagnimitra that he is a contemporary successor to older playwrights like Bhasa, Saumilla and Kaviputra without giving a calendar date, scholars reconstruct his era from external termini and internal allusions. The 473 CE Mandasor inscription (which echoes Meghaduta) and the 634 CE Aihole inscription fix his latest possible date to the fifth century CE; most historians identify his patron Vikramaditya with the Gupta emperor Chandragupta II Vikramaditya (c. 375-415 CE), while a minority of scholars favour a first-century BCE date tied to the 57 BCE Vikrama Samvat tradition of Ujjain.
