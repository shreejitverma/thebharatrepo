summary: Guru Ram Das, the fourth Sikh Guru, established Ramdaspur, the settlement that developed
  into Amritsar. His compositions are included in Sikh scripture.
summaries:
  kids: Guru Ram Das started the town that grew into Amritsar. He also wrote hymns that Sikhs still sing.
