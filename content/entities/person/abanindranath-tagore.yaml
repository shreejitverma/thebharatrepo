summary: Abanindranath Tagore (1871-1951 CE) was a pioneering Bengali painter, writer and founder of the Bengal School
  of Art and the Indian Society of Oriental Art (1907). Rejecting British colonial academic realism, he developed a
  delicate watercolour wash technique inspired by Mughal miniatures, Ajanta murals and Japanese ink painting (learned
  from Okakura Kakuzo's pupils Yokoyama Taikan and Hishida Shunso).
summaries:
  kids: Abanindranath Tagore (1871-1951) was an artist and writer from Kolkata who created soft, dreamy watercolours
    inspired by Indian miniatures, Ajanta murals and Japanese ink art.
  teen: Nephew of Rabindranath Tagore and Vice-Principal of Calcutta's Government School of Art alongside E. B. Havell,
    Abanindranath Tagore pioneered the Swadeshi-era Bengal School wash style.
