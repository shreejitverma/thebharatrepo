names:
  en: Demetrius I
summary: Demetrius I was a Greco-Bactrian ruler and a son of Euthydemus I. His role and timing in
  the expansion south of the Hindu Kush remain debated, and his coins famously show him wearing an
  elephant scalp.
summaries:
  kids: Demetrius was a king north of the Hindu Kush mountains. On some of his coins he wears an
    elephant's scalp as a headdress.
  teen: Greek accounts link Demetrius with Euthydemus. His coin portrait and the distribution of Greek
    power south of the Hindu Kush inform reconstructions of his role in Indo-Greek expansion.
region: Bactria and the Hindu Kush frontier
