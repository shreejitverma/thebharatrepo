names:
  en: Madhvacharya
  iast: Madhvācārya
  native: ಮಧ್ವಾಚಾರ್ಯ
summary: >-
  Madhvacharya (also Anandatirtha) of the Udupi region founded the Dvaita or Tattvavada school of
  Vedanta, which teaches the real and permanent difference between God (Vishnu), selves and matter. Most
  scholars date him to 1238 to 1317 CE; a tradition within the Madhva community gives 1199 to 1278 CE.
summaries:
  kids: >-
    Madhvacharya was a teacher from coastal Karnataka. He taught that God and people are truly
    different, and that people should love and serve God.
  teen: >-
    Madhva's Dvaita Vedanta disagrees with both Shankara and Ramanuja: God, souls and matter are
    eternally distinct. He set up the worship of Krishna at Udupi, which is still run by monasteries
    linked to him.
region: Tulu Nadu, coastal Karnataka
