names:
  en: Nannuka
summary: Nannuka is the earliest human ruler named in the Chandela genealogy at Khajuraho. The
  retrospective record supports an early ninth-century placement, although his exact reign is
  uncertain.
summaries:
  kids: A stone record at Khajuraho remembers Nannuka as an early Chandela ruler. It was carved
    generations after him.
  teen: Nannuka's name comes from later Chandela genealogies. A dated inscription can establish when a
    genealogy was carved while leaving the dates of its earliest names uncertain.
