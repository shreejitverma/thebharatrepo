names:
  en: Sultan Quli Qutb al-Mulk
summary: Sultan Quli Qutb al-Mulk established the Qutb Shahi ruling house at Golconda. His power
  grew while he held provincial office under the Bahmanis, and the date of a formal break is
  uncertain.
summaries:
  kids: Sultan Quli was a governor at Golconda who made it the centre of his own ruling family.
  teen: Sultan Quli's authority emerged out of a Bahmani governorship. Historians can trace his
    effective autonomy more readily than a formal declaration of independence.
