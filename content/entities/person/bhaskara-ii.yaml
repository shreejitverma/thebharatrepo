summary: >-
  Bhaskara II was a Sanskrit mathematician and astronomer active in the twelfth century. He completed
  the Siddhanta Shiromani in 1150, including the arithmetic work Lilavati and the algebraic treatise
  Bijaganita.
summaries:
  kids: >-
    Bhaskara II was an Indian mathematician who wrote about arithmetic, algebra, and astronomy. His
    book Lilavati taught mathematical problems through verses.
  teen: >-
    Bhaskara II's Siddhanta Shiromani, completed in 1150, brought together major works on mathematics
    and astronomy. Later scholars studied and commented on it for centuries.
