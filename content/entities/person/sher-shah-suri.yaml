  en: Sher Shah Suri
summary: Sher Shah Suri, earlier known as Farid Khan, established Sur rule after defeating Humayun.
  His reign is associated with silver coinage and the maintenance of routes and staging posts.
summaries:
  kids: Sher Shah became ruler after defeating Humayun. He is remembered for coins and roads, and his
    tomb stands at Sasaram.
  teen: Sher Shah extended a power base in Bihar and Bengal into North India. Records of his reign
    help explain the administrative relationship between Sur rule and the later Mughals.
