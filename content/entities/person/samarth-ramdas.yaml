summary: Samarth Ramdas was a seventeenth-century Marathi teacher and poet. The Dasbodh presents
  spiritual instruction alongside advice about conduct, study and practical judgment.
summaries:
  kids: Ramdas wrote a book in Marathi in which a teacher explains how to live, study and make sound
    decisions.
  teen: The Dasbodh uses a teacher’s instruction to a disciple to discuss religious practice and
    everyday conduct. It even treats careful reading and writing as habits that a student should
    learn.
