  native: जैमिनि
summary: Jaimini is traditionally credited with the Mimamsa Sutra, which examines how Vedic
  statements guide ritual action. The text supplies a broad chronological horizon for an author
  whose lifetime is uncertain.
summaries:
  kids: A book passed down under Jaimini’s name asks how to work out what the Vedas tell people to do
    during a ritual.
  teen: The Mimamsa Sutra opens by asking about dharma and examines how to interpret Vedic
    injunctions. The school developed techniques for resolving apparent conflicts among ritual
    instructions.
