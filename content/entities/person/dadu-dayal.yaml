summary: Dadu Dayal was a north Indian Sant teacher whose followers formed the Dadupanth. His songs
  express devotion to the divine beyond form, and early biographies preserve differing accounts of
  his life.
summaries:
  kids: People sang Dadu’s verses about finding the divine. His followers kept singing and teaching
    them after his death.
  teen: Dadu’s followers formed a community that transmitted his verse. The Dadu Janma Lila provides
    early evidence about his life, and its manuscript versions also show how that life story
    changed.
