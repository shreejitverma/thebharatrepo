summary: Chokhamela was a Marathi Varkari poet associated with devotion to Vitthal at Pandharpur.
  The songs attributed to him speak about caste exclusion and a devotee’s relationship with the
  deity.
summaries:
  kids: Chokhamela’s poems say how it felt to be kept out of a temple because of his caste. He sings
    to Vitthal about how deeply he wants to be close to him.
  teen: The abhangs attributed to Chokhamela give voice to a Mahar devotee’s experience of exclusion.
    Their devotion to Vitthal and their frustration with social boundaries appear side by side.
