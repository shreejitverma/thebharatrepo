summary: >-
  Haidar Ali rose from cavalry command in Wodeyar service to become the effective ruler of Mysore in 1761,
  while keeping the Wodeyar king on the throne. He extended Mysore's borders into Bednur, Malabar and the
  Carnatic, reorganised its army, allied with the French, and led Mysore in the First and Second
  Anglo-Mysore Wars, dying in camp near Chittoor in December 1782.
summaries:
  kids: >-
    Haidar Ali rose from army service to govern Mysore. He fought the East India Company, and his son
    Tipu Sultan took over after his death.
  teen: >-
    Haidar built authority through military command, expansion and alliances. He governed in the name of
    the Wodeyar ruler while conducting Mysore's wars and diplomacy, and brought Company forces to terms
    near Madras in 1769.
region: Mysore and southern India
