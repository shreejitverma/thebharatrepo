id: person.ramanuja
type: person
kind: dharma
names:
  en: Ramanuja
  iast: Rāmānuja
  native: रामानुज
summary: >-
  Ramanuja was the principal teacher of Vishishtadvaita Vedanta and of the Shrivaishnava community
  centred on the Srirangam temple. His Shribhashya on the Brahmasutras holds that the world and selves
  are real and form the body of a personal God, Vishnu-Narayana. Tradition gives his dates as 1017 to
  1137 CE.
summaries:
  kids: >-
    Ramanuja was a teacher who said that God is like a soul and the whole world is like God's body. He
    taught at the great temple of Srirangam in Tamil Nadu.
  teen: >-
    Against Shankara's view that the world of many things is not ultimately real, Ramanuja argued that
    souls and matter are real but depend on God, as a body depends on its self. He joined Sanskrit
    Vedanta with the Tamil devotion of the Alvars.
region: Tamil Nadu (born at Sriperumbudur by tradition; active at Srirangam)
location: { name: Srirangam, lat: 10.86, lon: 78.69 }
