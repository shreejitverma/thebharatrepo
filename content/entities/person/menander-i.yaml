names:
  en: Menander I
  iast: Milinda
  native: मिलिन्द
summary: >-
  Menander I Soter (reigned c. 165/155-130 BCE), known in Pali and Sanskrit sources as Milinda, was the most powerful Indo-Greek monarch, ruling from Sagala (modern Sialkot) over a territory stretching from the Kabul valley across the Punjab and raiding into the Gangetic plain. He is celebrated in Buddhist literature as the royal interlocutor of the sage Nagasena in the Milindapanha ("Questions of King Milinda").
summaries:
  kids: >-
    King Menander I, called Milinda in India, was an Indo-Greek ruler remembered for his philosophical discussions with the Buddhist monk Nagasena.
  teen: >-
    Reigning c. 155 to 130 BCE from Sagala in the Punjab, Menander I left the largest and most widespread coinage of any Indo-Greek king and became famous in Buddhist tradition through the Milindapanha.
region: Gandhara and Punjab (capital at Sagala / Sialkot)
