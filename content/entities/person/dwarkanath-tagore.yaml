names:
  en: Dwarkanath Tagore
  native: দ্বারকানাথ ঠাকুর
summary: >-
  Dwarkanath Tagore (1794-1846) was an early nineteenth-century Bengali entrepreneur, civic reformer
  and close associate of Raja Ram Mohan Roy in Calcutta. Co-founder of Carr, Tagore and Company
  (1834) and a major promoter of the Union Bank, coal mining, indigo and steam navigation, he funded
  the Brahmo Sabha, press freedom campaigns and Hindu College before dying in London in 1846.
summaries:
  kids: >-
    Dwarkanath Tagore (1794-1846), grandfather of poet Rabindranath Tagore, was a pioneering Bengali
    businessman and reformer who helped fund schools, newspapers and the Brahmo Sabha in Calcutta.
  teen: >-
    A leading figure of the early Bengal Renaissance before 1857, Dwarkanath Tagore partnered with
    Raja Ram Mohan Roy on social and press reforms while building Carr, Tagore and Company into a
    major Indo-British commercial house.
