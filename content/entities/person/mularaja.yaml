summary: Mularaja established the Chaulukya line in Gujarat in the tenth century. The dynasty's
  capital at Anahilapataka remained central to its successors.
summaries:
  kids: Mularaja began a royal line in Gujarat. Its kings ruled from the city now called Patan.
