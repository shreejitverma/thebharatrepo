summary: Durlabhavardhana begins the Karkota succession in Kalhana's Rajatarangini. Chronological
  reconstructions differ on his accession and on where the account of Xuanzang's visit fits.
summaries:
  kids: An old Kashmiri chronicle names Durlabhavardhana as the first Karkota king. Scholars compare
    that account with other records to estimate when he lived.
  teen: Kalhana supplies the succession, and Xuanzang supplies an external horizon for seventh-century
    Kashmir. Scholars fit those sources together in different ways.
region: Kashmir Valley
