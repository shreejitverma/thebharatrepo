names:
  en: Dignaga
  iast: Dignāga
  native: दिग्नाग
summary: Dignaga was an Indian Buddhist philosopher who set out an account of reliable knowledge
  based on perception and inference. His Compendium on Valid Cognition shaped later debates on
  reasoning and language.
summaries:
  kids: Dignaga studied how we know things. You might see smoke for yourself and then work out that
    there is a fire. He treated seeing and working things out as two different ways to learn.
  teen: Dignaga’s Pramanasamuccaya recognizes perception and inference as means of valid cognition.
    His work on what makes a reason support a conclusion influenced debate across philosophical
    schools.
