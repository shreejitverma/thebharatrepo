names:
  en: Tipu Sultan
  native: ಟಿಪ್ಪು ಸುಲ್ತಾನ್
summary: >-
  Tipu Sultan, son of Haidar Ali, ruled Mysore from 1782 until his death defending Srirangapatna in May
  1799. He fought the East India Company and its allies, ceded about half his territory in 1792, promoted
  state trading, sericulture and rocket-armed troops, and sent embassies to France and the Ottoman Empire.
  His reign included grants to Hindu institutions such as the Sringeri matha and harsh campaigns in Malabar
  and Kodagu.
summaries:
  kids: >-
    Tipu Sultan took over Mysore after his father died. He fought the East India Company and was killed
    defending his capital, Srirangapatna, in 1799.
  teen: >-
    Tipu inherited a war against the Company. He pursued state-led trade and military reforms, but the
    peace of 1792 cost him much of his kingdom, and the fall of Srirangapatna in 1799 ended his rule.
