    note: His attack on the Travancore lines in 1789 to 1790 preceded the Third Anglo-Mysore War.
debate: Historians weigh Tipu's resistance to the Company and his administrative and military innovations
  against the coercion documented in his campaigns in Malabar and Kodagu. Mohibbul Hasan and the essays
  edited by Irfan Habib emphasise resistance and modernisation, while Kate Brittlebank examines how he drew
  on both Islamic and local Hindu idioms of kingship to legitimise his rule.
