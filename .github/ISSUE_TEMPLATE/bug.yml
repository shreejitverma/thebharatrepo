name: Report a bug
description: Report an issue with the website or contributor tooling.
title: "[Bug] "
body:
  - type: input
    id: location
    attributes:
      label: Page URL or command
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error output relevant to the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your browser and device for site bugs, or your Node.js version and OS for command bugs.
